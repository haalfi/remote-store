# Variant config for rendering recipe.yaml OUTSIDE conda-forge.
#
# conda-forge supplies `python_min` from its own global pinning, so the recipe
# must not define it: hardcoding the value in `context:` would override the
# global and keep us on 3.10 after conda-forge raises the ecosystem minimum.
# That leaves our own `Conda Recipe` workflow, which renders the recipe
# standalone with no conda-forge pinning in scope, with an undefined variable.
#
# This file closes that gap without changing the artifact we submit.
#
# The value must equal the floor of `requires-python` in pyproject.toml, and
# `MIN_PYTHON` in .github/workflows/ci.yml must equal it too.
# `scripts/check_conda_recipe_pins.py` compares all three, so this is an
# enforced rule rather than a comment asking to be believed — a distinction
# BK-368 exists because the recipe's own "keep this exhaustive" comment lacked.
python_min:
  - "3.10"
