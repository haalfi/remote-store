# conda-forge recipe for remote-store
# v1 format (CEP-13 / rattler-build)
#
# Submission: copy this file to conda-forge/staged-recipes as
#   recipes/remote-store/recipe.yaml
# then open a PR against https://github.com/conda-forge/staged-recipes

context:
  version: "0.29.1"
  python_min: "3.10"

package:
  name: remote-store
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/remote-store/remote_store-${{ version }}.tar.gz
  sha256: 877aac9ba5a820fe5c7c42044a4d0a00039ed2da2d67b0fcdc48fd49c5adac30

build:
  noarch: python
  script: python -m pip install . --no-deps --no-build-isolation -vv
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
  run_constraints:
    # Optional backend dependencies -- not installed automatically, but
    # version-constrained if the user installs them alongside remote-store.
    - s3fs >=2024.2.0
    - paramiko >=3.0
    - tenacity >=4.0
    # The floor is the `arrow` extra's (>=12.0.0); `s3-pyarrow` needs >=14.0.0,
    # but conda allows only one pin per package -- not one per extra.  Use the
    # lower floor so arrow-only users aren't blocked; s3-pyarrow users must
    # install pyarrow >=14 themselves.  The <25 ceiling is common to both.
    - pyarrow >=12.0.0,<25
    - azure-storage-file-datalake >=12.16.0
    - azure-identity >=1.0.0
    - httpx >=0.24.0,<1.0
    - msal >=1.20.0
    - msal-extensions >=1.3
    - platformdirs >=3.0.0
    - sqlalchemy >=2.0
    # The HTTP backend needs no dependency (stdlib `urllib`); `requests` and
    # `httpx` are optional pooled transports, so both get a floor.
    - requests >=2.25.0
    - urllib3 >=1.26.0

tests:
  - python:
      imports:
        - remote_store
        - remote_store.ext
        - remote_store.ext.batch
        - remote_store.ext.glob
        - remote_store.ext.transfer
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  homepage: https://remotestore.dev
  summary: "Write file storage code once. Run it against local files, S3, SFTP, Azure, or OneDrive."
  description: |
    remote-store provides a consistent Python API for file storage across
    backends (Local, Memory, S3, Azure, OneDrive, SFTP, HTTP, SQL). Write file
    storage code once, run it against any backend. Core has no dependencies;
    optional extras add cloud backend support.
  license: MIT
  license_file: LICENSE
  documentation: https://docs.remotestore.dev/
  repository: https://github.com/haalfi/remote-store

extra:
  recipe-maintainers:
    - haalfi
