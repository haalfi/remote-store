# Repo-root markdown files served into the docs tree.
#
# The gen-files hook reads each ``source`` file, resolves its relative links
# against the docs-tree source map (sdd scan + include-wrappers + this map
# itself), and emits the rewritten content at ``dest``. Repo files that have
# no docs-tree counterpart are rewritten to GitHub blob URLs automatically.
# No hand-maintained string-replacement tables needed.

contributing.md:
  source: CONTRIBUTING.md

design/process.md:
  source: sdd/000-process.md
