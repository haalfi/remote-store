version: 2

build:
  os: ubuntu-24.04
  tools:
    # Must match .python-version (RTD has no python-version-file equivalent).
    # Enforced by scripts/check_readthedocs_python.py in `hatch run lint`.
    python: "3.13"
  jobs:
    # ID-226: publish a machine-readable public-API skeleton (signatures +
    # docstrings, backends included) at ``/llms-api.txt``, next to the
    # ``mkdocs-llmstxt`` ``llms.txt`` / ``llms-full.txt``, for coding agents that
    # consume remote-store. Generated by ``lx`` (Go, MIT) from ``src/`` at build
    # time. The logic lives in a committed script (with a bash shebang) rather
    # than inline here: RTD runs post_build under ``/bin/sh`` (dash), and a
    # folded YAML scalar mis-folds multi-line shell (BUG-226). The script pins lx
    # to v1.2.2, is non-fatal by contract (always exits 0), and moves output into
    # the served dir only on success. See scripts/docs/gen_llms_api.sh.
    post_build:
      - bash scripts/docs/gen_llms_api.sh

mkdocs:
  configuration: mkdocs.yml

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
