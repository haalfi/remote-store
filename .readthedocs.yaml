version: 2

build:
  os: ubuntu-24.04
  tools:
    # Must match .python-version (RTD has no python-version-file equivalent).
    # Enforced by scripts/check_readthedocs_python.py in `hatch run lint`.
    python: "3.13"
  jobs:
    # ID-226: publish a machine-readable public-API skeleton (signatures +
    # docstrings, backends included) at ``/llms-api.txt``, next to the
    # ``mkdocs-llmstxt`` ``llms.txt`` / ``llms-full.txt``, for coding agents that
    # consume remote-store. Generated by ``lx`` (Go, MIT) from ``src/`` at build
    # time — RTD is pip-only, so lx is fetched as a pinned prebuilt binary rather
    # than added to the toolchain. Both the install script and the binary are
    # pinned to v1.2.2 (the decorated-dataclass skeleton fix; ``lx`` <= 1.2.1
    # silently dropped public data-model classes) so the whole fetch is
    # reproducible with no moving dependency.
    # ``-u -Y`` = public-only skeleton; ``-e __pycache__`` drops stray bytecode.
    # Non-fatal: a fetch/run hiccup must never red the canonical docs build. lx
    # writes to a temp file that is moved into the served dir only on success, so
    # a failed run serves *nothing* (a loud 404 on the discovery links) rather
    # than an empty/partial ``llms-api.txt``.
    post_build:
      - >-
        mkdir -p /tmp/lxbin
        && curl -fsSL https://raw.githubusercontent.com/rasros/lx/v1.2.2/install.sh
           | VERSION=v1.2.2 LX_INSTALL_DIR=/tmp/lxbin bash
        && /tmp/lxbin/lx -e '__pycache__' -u -Y src/remote_store/ > /tmp/llms-api.txt
        && mv /tmp/llms-api.txt "${READTHEDOCS_OUTPUT}/html/llms-api.txt"
        || echo "ID-226: lx skeleton generation skipped (fetch/run failed); see build log"

mkdocs:
  configuration: mkdocs.yml

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
