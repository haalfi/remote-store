id: BK-338
title: "Decide what a PR review roster should be"
trigger: >-
  Filed after PR #944, where the only user-facing bug came from the pass that
  ran the tool rather than reading the diff, and expert-persona reviewers each
  reported inside their own lens while the defect sat between lenses. A first
  attempt was reverted in PR #945 for bundling the roster question with a
  single-session model pin. BK-344 discharged the model half and handed this
  item signal 2's evidence: a roster varies reviewer identity, which is the
  axis with no measured yield.
source_items:
  - BK-338
audience:
  - contributor.process
discovery_followups: []
expected_ripples:
  - sdd/adrs/DIGEST.md
  - sdd/backlogid.json
  - .claude/agents/
surprising_ripples: []
review_rounds: 0
phases:
  - id: orient
    name: Orient
    steps:
      - file: sdd/BACKLOG.md
        section: "BK-338 (item)"
        read_type: gate
        extract: >-
          Three questions tangled in one item, and PR #945 was reverted for
          conflating two of them. Separating them is the precondition for
          deciding any: which reviewers a change selects, what a reviewer is
          typed by, and whether the author or an expert applies a fix. The
          model half is annotated as discharged by BK-344, so only the first
          two and the fixer question remain.
        outcome: ok
      - file: sdd/adrs/0035-vary-method-not-model.md
        section: "Decision"
        read_type: gate
        extract: >-
          Already answers this item's question for /ship and says so in its own
          Consequences ("its roster question is untouched and still open").
          Reviewers there are picked by lens and method, personas appear only as
          one way to staff a scoped member, and width follows the subject set.
          So the residual is not "design a roster" but "why does /orchestrate
          still select differently", which narrows the item to one skill.
        outcome: ok
      - file: sdd/adrs/0020-orchestrate-iterative-convergence.md
        section: "Decision"
        read_type: gate
        extract: >-
          Decides whether /orchestrate's roster is even amendable here. It is
          not drift against RFC-0009 (superseded), because this record assigns
          "the current expert roster" to the skill as operational contract in
          its own words. But it also carries "Carry forward ADR-0019's
          delegation structure ... per-domain boundaries", which is the clause a
          review-selection change actually touches — so the amendment target is
          this ADR's delegation clause, review half only.
        outcome: ok
      - file: .claude/agents/store-backend-expert.md
        section: "DOMAIN"
        read_type: gate
        extract: >-
          Read all five DOMAIN lines to derive coverage rather than assume it:
          src/remote_store/, src/remote_store/ext/, tests/, docs-src/ +
          examples/ + docs/, sdd/. Nothing owns scripts/, .claude/,
          pyproject.toml, CLAUDE.md, CHANGELOG.md, .github/ or infra/. That gap
          is the mechanism behind the item's original "the defect sat between
          lenses", and it is measurable rather than impressionistic.
        outcome: ok
  - id: measure
    name: Measure the roster against the traces
    steps:
      - file: sdd/traces/bug-243-missing-ok-absent-container.yml
        section: "review (rounds 1-8)"
        read_type: verify
        extract: >-
          Classified all 19 recorded review findings by whether a persona lens,
          scoped as the persona file scopes it, would plausibly have caught it.
          7 yes, 7 inside the persona's domain but reachable only by execution
          it is not briefed to do, 5 not reachable by any single lens. 8 of 19
          were reached by executing. The two between-lenses cases are the
          informative ones: GraphBackend is owned by the store-backend expert
          and went unnamed for six rounds because the diff never touched it, and
          the missing_ok docstring claim sits between documentation (owns
          docstrings) and store-backend (owns whether the claim is true).
        outcome: ok
      - file: sdd/traces/bk-344-vary-method-not-model.yml
        section: "verify (rounds 1-4)"
        read_type: verify
        extract: >-
          The same classification over 12 findings: 3 reachable by a persona
          lens, 9 not, and 6 reached by executing. Nine land in .claude/,
          pyproject.toml or CLAUDE.md — files no DOMAIN line contains. A process
          delivery is invisible to the roster by construction, which is the
          strongest single number in this item and is why the fix is a lens
          rather than a sixth persona: the surface needs looking at, not owning.
        outcome: ok
      - file: pyproject.toml
        section: "[tool.hatch.envs.default.scripts]"
        read_type: verify
        extract: >-
          Wrote tmp/classify_domains.py to classify the changed files of PRs
          #944, #945, #949, #952 and #954 against the DOMAIN lines, reading
          those lines rather than restating them. 20 of 135 files (15%) fall
          outside every domain; the two process deliveries are 45% and 31%
          against 6-12% for the three code deliveries. File-level coverage is
          the weaker measurement and is reported as corroboration, not as the
          decision's basis - the finding-level classification above is.
        outcome: ok
      - file: .claude/skills/ship/SKILL.md
        section: "Roles table"
        read_type: verify
        extract: >-
          Checked what /ship leaves for the fixer half of the item, per the
          handover's instruction not to assume it was already answered. It
          assigns "Author, fixer" to domain-expert subagents, which contradicts
          the decision taken here and is refuted by both traces: the sweeps that
          paid were cross-file (a fifth Bash site in a different skill, a claim
          in five homes spanning sdd/, CHANGELOG and a guide), and a
          domain-scoped fixer cannot perform them.
        outcome: ok
  - id: implement
    name: Implement
    steps:
      - file: sdd/templates/adr-template.md
        section: "Status, Decision"
        read_type: gate
        extract: >-
          Amends is clause-level and the amended clause must be named in prose
          below the table, and the whole Decision section is lifted verbatim into
          DIGEST.md. Set ADR-0036's split: four decisions with reversal
          conditions, the selection procedure and the lens text left in the two
          SKILL.md files. Decision came in at 352 words against a 350 budget,
          which the digest reports as advisory.
        outcome: ok
      - file: .claude/skills/orchestrate/SKILL.md
        section: "Reviewer selection (new), Steps 3 and 6, Rules"
        read_type: verify
        extract: >-
          Wrote the selection procedure, then caught my own copy being untrue
          where it sits before any reviewer did: the draft told /orchestrate to
          spawn its measuring reviewer "with the word `measuring`, which is what
          opens /rvw-pr's allowlisted command set". /orchestrate does not route
          reviewers through /rvw-pr at all - they are plain subagents against the
          working tree, with no permission to open and the opposite hazard, since
          they can write. Rewritten to say that, with the read-only prompt and
          clean-porcelain check /ship already requires. Exactly the defect class
          BK-344 shipped a rule for, committed while applying that rule.
        outcome: ok
      - file: .claude/skills/ship/SKILL.md
        section: "Roles, Round composition, Lens menu, Rules"
        read_type: verify
        extract: >-
          Two edits, not a rewrite, because ADR-0035 had already answered this
          item for this skill. Roles gains a separate Fixer row (main loop by
          default, delegate for depth) since the old row conflated author and
          fixer and put both on domain experts; the lens menu gains the tooling
          and process lens; round composition drops "Repo domain experts, or
          general-purpose" from the round-2 cell, which was the last place the
          skill implied domain was a selection unit.
        outcome: ok
  - id: verify
    name: Verify
    steps:
      - file: sdd/adrs/0035-vary-method-not-model.md
        section: "Consequences"
        read_type: verify
        extract: >-
          Sibling sweep of closing the item, which falsifies every live sentence
          saying it is open. Four sites, found by searching for the ID rather
          than for the wording I had just written: this Consequences bullet
          ("its roster question is untouched and still open"), BACKLOG.md's
          consistency-programme paragraph, BK-336's entry in BACKLOG-DONE (which
          also linked BK-338 to BACKLOG.md, now a dead pointer), and BK-344's
          own Co-shipped line. ADR-0035's Context is left alone deliberately - it
          records the state that motivated the decision and was true then.
        outcome: ok
      - file: CLAUDE.md
        section: "GitHub operations"
        read_type: verify
        extract: >-
          BK-344 had already fixed the amendment chain here after a review
          finding, so this is a live copy that a new amending ADR falsifies by
          omission rather than by contradiction - the list said read all three.
          Added ADR-0036 and a sentence for /orchestrate, which the section named
          nowhere despite this change altering how it reviews.
        outcome: ok
      - file: .claude/agents/store-backend-expert.md
        section: "CONSTRAINTS, closing /orchestrate paragraph"
        read_type: verify
        extract: >-
          Checked all five persona files for statements this change falsifies and
          found none, so none were edited. Their closing line says the invocation
          prompt "may add task- and mode-specific instructions", which stays true
          when a persona staffs a lens; their CONSTRAINTS bound where they may
          write, which review does not exercise. Recorded here rather than left
          silent, because a sweep that found nothing reads exactly like one that
          never ran.
        outcome: ok
