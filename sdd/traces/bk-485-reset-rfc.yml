id: BK-485
title: "The v1 Store API has no observable-semantics specs, so implementation runs ahead of decided behaviour (reset RFC, § 9 steps 1 and 2)"
trigger: >-
  PR #1176 merged research-spec-first-reset.md, the maintainer's decision record
  for a spec-first reset (D1 to D11), with § 9's first two steps still undone:
  cutting release/0.33.x and pausing RFC-0017's D3 migration (step 1), and the
  reset RFC that makes D1 to D11 binding (step 2).
source_items:
  - BK-485
audience:
  - contributor.process
  - library.maintainer
discovery_followups:
  - BUG-341
decisions:
  - sdd/decisions/69e4bf99-0899-474b-bb47-606425c66a1a.jsonl
expected_ripples:
  - sdd/backlogid.json
surprising_ripples:
  - docs-src/reference/migration.md
  - CHANGELOG.md
  - sdd/BACKLOG-DONE.md
  - sdd/CLAUDE-REFERENCE.md
  - sdd/process-budget.json
orient:
  - items: [BK-450, BK-455, BK-451, BK-452, BK-439, BK-438, BK-446, BK-345, ID-244, BK-434]
    verdict: constrains
    evidence: >-
      Each item's due date is an RFC-0017 D3 step that the pause removes:
      BK-450 "Due before D3 step 2, after BK-449" (its dossier § Due), BK-455
      "Due at RFC-0017 D3 step 2, with the first remote driver", BK-451
      "Due before RFC-0017 D3 step 2: S3Boto3Backend declares GLOB" (dossier),
      BK-452 "Flat driver due before RFC-0017 D3 step 2, the rest before step 8",
      BK-439 "Due before the first flat driver with GLOB moves onto the kernel",
      BK-438 "Before any flat driver (S3, Azure, SQLAlchemy) moves onto the
      kernel", BK-345 "per-driver container_absent cells from D3 step 2", ID-244
      "due before the registry registers drivers", BK-434 dossier "before
      RFC-0017 D3 step 8, or step 2". None is a 0.33 defect except BK-450's T1,
      which audit-023 measured in the kernel's _file_info and _memory_tree.py,
      code merged after the v0.33.0 tag (v0.33.0's MemoryBackend is a hand-written
      Backend). BK-451's defining clause and dialect, BK-438's decoding and
      BK-455's states are observable or lifetime questions that a reset flow, not
      a 0.33 spec, would decide.
  - items: [BK-390, BK-382, BK-242]
    verdict: constrains
    evidence: >-
      Bookkeeping that closes per D3 step: BK-390's dossier maps each spec
      amendment to "that driver's step, 2 to 8" and says "a row whose step is
      re-planned moves with it"; BK-382's placement "each flat class retires the
      gate at its step (S3 2, SQL 3, Azure 4), and the item closes with the last";
      BK-242's "the cost becomes the kernel's, measured at step 2". The pause
      leaves BK-382 and BK-242 binding 0.33 classes with no closing step.
  - items: [BUG-319, BUG-334, BUG-299, BUG-300, BUG-245, BUG-318, BUG-266, ID-140, ID-181, BUG-287, BUG-288, BUG-289]
    verdict: constrains
    evidence: >-
      0.33 defects or options whose recorded home is a D3 step: BUG-319 "map it
      here, or leave it to RFC-0017's kernel (D3 step 5)", BUG-334 "InvalidPath
      here, or at D3 step 5", BUG-299 "or leave it to RFC-0017 step 5's kernel key
      rule", BUG-300 "Fixed by BK-389's kernel refusal when SQLBlob migrates at
      RFC-0017 D3 step 3", BUG-245 "deferred to D3 step 3", BUG-318 dossier "at D3
      step 5; a fix here becomes that driver's classify", BUG-266 placement "lands
      with step 6", ID-140 "step 3", ID-181 "step 6", BUG-287 and BUG-289 "retires
      with that lane at step 2", BUG-288 "due no later than step 4". With D3
      paused, the step option is gone for an open period (D10), so each is a
      release/0.33.x candidate or stays a 0.33 defect: research open point 10.
  - items: [BK-456, BK-465, BK-466]
    verdict: constrains
    evidence: >-
      BK-456's remaining stage is "a prune per file against SPEC-DESIGN.md, after
      BK-465 and BK-466" of spec 003, one of specs 001 to 050, which D7 supersedes
      section by section rather than reworks; BK-465 (the template's Assumption
      IDs) and BK-466 (Rule 1's "design note" with no home) are SPEC-DESIGN.md
      defects whose home is the format RFC (§ 9 step 6), not this RFC.
  - items: [BK-484, BK-454]
    verdict: constrains
    evidence: >-
      Inputs to later steps, not to this RFC's text: BK-484's key spec is § 9
      step 4 ("Not done: the spec between 051 and 004"); BK-454's open decision,
      "the handle's shape, and whether bare async for stays lazy", is candidate
      R-2 of research § 7, the read() flow's (step 5). Open PR #1171 (BK-468,
      unmerged) holds RFC-0023 and spec 054, a key spec moving PATH-002 to
      PATH-007 out of spec 004 and stating that "RFC-0017 D3 step 2 and BK-456
      stage three both build on it"; it overlaps step 4 and takes RFC-0023, so
      this RFC takes RFC-0024.
  - items: [BK-409, BK-392]
    verdict: constrains
    evidence: >-
      Release-process items a release/0.33.x patch release inherits: BK-409
      (Python 3.15 in no spelling of the supported set) and BK-392 (nothing dates
      a dropped classifier). D9 lets master publish nothing, so whichever of them
      ships, ships from the branch; ci.yml and ci-full.yml trigger on master
      only (their `on:` blocks), so the branch runs no CI until that changes.
  - items: [BK-460, BK-461, BK-463, BK-467, BK-462]
    verdict: unrelated
    evidence: >-
      Formal-layer and bridge items under SPEC-DESIGN.md Rules 3, 4 and 8 (a
      diagram check, an ITF replayer, Rule 8 statements, Rule 4's table, Alloy and
      Lean in CI). They bear on how a reset spec is governed, which is the format
      RFC's (§ 9 step 6) and outside this RFC's process-only scope.
phases:
  - id: orient
    name: Orient
    steps:
      - file: sdd/research/research-spec-first-reset.md
        section: "(full)"
        read_type: gate
        extract: "D1 to D11, open points 5, 9, 10, § 9 steps 1 and 2; decisions are the maintainer's, not re-litigated"
      - file: sdd/BACKLOG.md
        section: "BK-485"
        read_type: gate
        extract: "Not done: every step of § 9; open decision: § 8's open points"
      - file: sdd/rfcs/rfc-0017-contract-kernel-over-thin-drivers.md
        section: "Status, D3, D8"
        read_type: gate
        extract: "D3 is process living in the RFC, not in ADR-0042; steps 2 to 8 and the retirements in 2 and 4 are what pauses"
      - file: sdd/adrs/0042-contract-kernel-over-thin-drivers.md
        section: "(full)"
        read_type: gate
        extract: "Amends ADR-0001, 0011, 0012, 0025; migration order is process and lives in RFC-0017 D3 and D8, so the pause amends no ADR"
      - file: sdd/rfcs/rfc-0022-how-specs-are-designed.md
        section: "Status, Summary, D1"
        read_type: reference
        extract: "Accepted 2026-10-19, graduated to ADR-0048 and SPEC-DESIGN.md, which are now the authority"
      - file: sdd/adrs/0048-how-specs-are-designed.md
        section: "(full)"
        read_type: gate
        extract: "Observable contract, cut by kind, declared profiles, bridged model governs; the reset keeps all of it and changes no format"
      - file: sdd/SPEC-DESIGN.md
        section: "(full)"
        read_type: gate
        extract: "Rules 1 to 8 bind every section a change writes; Rule 7 forbids project state in a spec, so a v1 spec's status must live outside it"
      - file: CONTRIBUTING.md
        section: "Versioning; Release, Phases 0 to 5"
        read_type: gate
        extract: "Every phase assumes master: Phase 0 checks master CI, Phase 2 branches release-vX.Y.Z off it, Phase 4 merges back to master; no maintenance-branch route exists"
        outcome: unclear
      - file: .github/workflows/ci.yml
        section: "on:"
        read_type: reference
        extract: "push and pull_request on master only, so a PR into release/0.33.x runs no CI"
      - file: .github/workflows/docs.yml
        section: "on:, deploy-dev, deploy-release"
        read_type: reference
        extract: "master pushes deploy the dev docs; a published release deploys its version as latest"
      - file: sdd/traces/_schema.yml
        section: "orient, phases"
        read_type: reference
        extract: "orient entries: items, verdict, evidence; review block only at the close"
      - file: .claude/skills/ship/SKILL.md
        section: "Orient"
        read_type: gate
        extract: "Find by spec IDs and touched files, cluster, read lead dossiers, judge with quoted evidence"
      - file: sdd/backlog/bk-450-driver-boundary-enforcement.md
        section: "(full)"
        read_type: reference
        extract: "Parts T1 to P6; due before D3 step 2"
      - file: sdd/backlog/bk-451-glob-tree-definition.md
        section: "(full)"
        read_type: reference
        extract: "Defining clause then dialect; due before D3 step 2"
      - file: sdd/backlog/bk-452-template-reference-set.md
        section: "(full)"
        read_type: reference
        extract: "Flat reference driver, Memory pins, CONTRIBUTING checklist"
      - file: sdd/backlog/bk-390-rfc-0017-spec-amendments.md
        section: "Amendment by step"
        read_type: reference
        extract: "Each amendment lands with its step; a re-planned step moves its row"
      - file: sdd/audits/audit-023-kernel-migration-readiness.md
        section: "T1"
        read_type: reference
        extract: >-
          Located T1 in kernel-era code (_memory_tree.py, kernel.py). I first told
          the maintainer it was kernel-only; a probe against a v0.33.0 export
          showed the released MemoryBackend has it too, which reopened the freeze
          rule and split it out as BUG-341.
  - id: design
    name: Design
    steps:
      - file: sdd/templates/rfc-template.md
        section: "(full)"
        read_type: reference
        extract: "Status, Summary, Motivation, Proposal, Alternatives, Impact, Open Questions, References"
      - file: docs-src/reference/migration.md
        section: "v0.33.0 to v0.34.0"
        read_type: reference
        extract: >-
          master already held a section for 0.34.0, which D9 rules out; renamed
          to v0.33.0 to v1.0.0 with its two CHANGELOG anchors and two
          BACKLOG-DONE mentions. The ripple-check's Breaking change row assumes
          the next release's pair is knowable, which a skipped minor breaks.
        outcome: misleading
      - file: scripts/check_process_budget.py
        section: "module docstring"
        read_type: reference
        extract: "CLAUDE.md and agent files are budgeted, so a principle-5 edit needs a recorded raise"
  - id: verify
    name: Verify
    steps:
      - file: sdd/CLAUDE-REFERENCE.md
        section: "Ripple-check / Authority direction amended"
        read_type: verify
        extract: >-
          The rg command found two live copies of Rule 3 (CLAUDE.md principle 5,
          store-backend-expert CONSTRAINTS); left unedited per the maintainer's
          no-raise choice and recorded in RFC-0024 § Impact
      - file: sdd/CLAUDE-REFERENCE.md
        section: "Ripple-check / Breaking change, Backlog item touched"
        read_type: verify
        extract: "No new break here; migration heading renamed; trace live with orient"
      - file: scripts/check_sdd_index.py
        section: "R3"
        read_type: verify
        extract: "An RFC's Status must open with its status word; the pause note went below it"
      - file: scripts/check_no_tracker_refs.py
        section: "published surfaces"
        read_type: verify
        extract: "CONTRIBUTING.md is published, so its D9 note names no RFC"
