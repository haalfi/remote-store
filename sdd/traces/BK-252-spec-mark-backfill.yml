# yaml-language-server: $schema=./_schema.yml
id: BK-252
title: "Bulk spec-mark backfill (type-(b) labels)"
trigger: >-
  The BK-251 gate (scripts/check_spec_marks.py) baselined 159 shipped spec
  IDs whose behavior is already tested under sibling/parent marks but which
  carry no spec-file-specific @pytest.mark.spec(...). The baseline is the
  worklist; each backfilled mark must self-prune its baseline entry. This
  trace covers the first PR, which ships two clusters: the backend-restatement
  cluster (AZ-*, S3-*, S3PA-*) and the core-API/paths cluster
  (STORE/NPR/BE/CAP/MEM), whose IDs ride cross-backend conformance,
  backend-specific, and azure-specific tests.
source_items:
  - BK-252
  - BK-251
  - BK-250
audience:
  - library.maintainer
surprising_ripples:
  - sdd/specs/029-async-store-backend-api.md  # ASYNC-074 spec text was stale (said "materialize"; code streams the AsyncIterator straight to upload_blob per BUG-165) — found while writing the type-(a) test, corrected here
review_rounds: 5
phases:
  - id: orient
    name: Orient
    steps:
      - file: sdd/BACKLOG.md
        section: "BK-252"
        read_type: gate
        extract: "Worklist = check_spec_marks.py _BASELINE; Azure cleanest start; verify each mark, do not rubber-stamp"
      - file: sdd/audits/audit-015-spec-traceability.md
        section: "Verified addendum / Findings (012, 008, 011 rows)"
        read_type: reference
        extract: "Per-ID riding-mark map (AZ-012 rides BE-004, AZ-013 BE-005, AZ-019 GLOB-020, etc.); type-(b) caveats"
      - file: scripts/check_spec_marks.py
        section: "_BASELINE drift entries (AZ-/S3-/S3PA-)"
        read_type: gate
        extract: "23 backend-restatement IDs baselined; pruning a landed ID's entry is mandatory (self-prune contract)"
  - id: classify
    name: Confirm placement convention
    steps:
      - file: tests/backends/conformance/test_atomic.py
        section: "test_write_atomic_content_failure_leaves_no_partial, test_copy"
        read_type: gate
        extract: "Precedent: cross-backend conformance tests stack backend-specific marks (AW-001+S3-010+S3PA-013; BE-019+SFTP-019+SQL-BLOB-032)"
      - file: tests/backends/azure/test_config.py
        section: "TestAzureHNSPaths, TestAzureGlob"
        read_type: reference
        extract: "Azure-specific mock-HNS tests already carry BE-005/BE-018/GLOB-020; honest home for HNS-conditional AZ-* (AZ-008/012/013/036)"
  - id: implement
    name: Backfill marks
    steps:
      - file: tests/backends/azure/test_config.py
        section: "AZ-008, AZ-012, AZ-013, AZ-016, AZ-017, AZ-019, AZ-036"
        read_type: reference
        extract: "Stamped AZ HNS-conditional + glob marks on the azure tests that directly assert each branch"
      - file: tests/backends/conformance/test_io.py
        section: "test_is_folder (AZ-009/S3-006/S3PA-008), test_delete_folder_recursive (AZ-015/S3-011)"
        read_type: reference
        extract: "Virtual-folder + recursive-delete marks ride BE-005/BE-013 (run for s3/s3pa/azure fixtures)"
      - file: tests/backends/conformance/test_atomic.py
        section: "test_move (AZ-?/S3-013/S3PA-015), test_copy (AZ-018/S3-014/S3PA-014)"
        read_type: reference
        extract: "Move/copy mechanism marks ride BE-018/BE-019"
      - file: tests/backends/conformance/test_metadata.py
        section: "test_get_folder_info (AZ-024)"
        read_type: reference
        extract: "get_folder_info aggregate rides BE-017"
  - id: classify_core
    name: Classify core-API/paths cluster (group 2)
    steps:
      - file: sdd/specs/013-memory-backend.md
        section: "MEM-001..042, MEM-DS-001..006"
        read_type: gate
        extract: "Split MEM worklist: 12 testable backfills vs type-(d) design/meta/perf (MEM-026/030/031/032/040/041/042, DS-001/003/004) -- allowlist candidates, not backfills"
      - file: sdd/specs/010-native-path-resolution.md
        section: "NPR-002..022"
        read_type: gate
        extract: "NPR-009/017/018/019 are design/forward-looking (future backends, no-new-capability, backward-compat); NPR-002/006/008/011/015/021/022 testable; NPR-007 held (no test asserts S3 prefix-strip)"
      - file: sdd/audits/audit-015-spec-traceability.md
        section: "STORE-007/009/010, BE-011/023/024/026/027, CAP-007 rows"
        read_type: reference
        extract: "STORE-009 (test_context_manager) + BE-027 (test_gen_graph) ARE tested (Explore agent wrongly said NO-TEST); STORE-007/010 + CAP-007 genuinely untested -> held"
  - id: implement_core
    name: Backfill core-API/paths marks (group 2)
    steps:
      - file: tests/backends/conformance/test_identity.py
        section: "MEM-002/003/004/018/019/020, NPR-021"
        read_type: reference
        extract: "MEM identity marks ride BE-002/003/020/022 + repr test; NPR-021 on native_path-empty test"
      - file: tests/test_store.py
        section: "TestStoreToKey, TestStoreNativePath (STORE-011/NPR-002/NPR-011/NPR-022)"
        read_type: reference
        extract: "Store.to_key + native_path marks ride NPR-010/STORE-015"
      - file: tests/test_glob.py
        section: "STORE-014, NPR-015, STORE-018"
        read_type: reference
        extract: "list_files(pattern) / list_folders names / Store.glob ride GLOB-001/STORE-017"
  - id: implement_text
    name: Backfill text/stream/iter/pyarrow marks (group 3)
    steps:
      - file: sdd/specs/028-read-text.md
        section: "RTXT-002/003, WTXT-002/003, ITER-002/003, PA-023/026, SEEK-007"
        read_type: gate
        extract: "9 held: design/meta rows (no-ABC-change, STORE-008-update), ITER-002 capability-gate raise (no test, like BE-011), PA-023/026 + SEEK-007 (no test asserts the clause)"
      - file: tests/ext/test_observe.py
        section: "test_hook_fires_for_operation (RTXT-004, ITER-006)"
        read_type: reference
        extract: "read_text/iter_children observe-hook ops ride the OBS-003 parametrized case"
      - file: tests/test_store.py
        section: "TestStoreReadText / TestStoreWriteText (SIO-007, WTXT-006)"
        read_type: reference
        extract: "read_text-via-read_bytes (SIO-007) and write_text/read_text round-trip (WTXT-006) ride RTXT-001/WTXT-001; SIO-004 on conformance read-not-found, SIO-005 on async cancellation, ITER-005 on test_iter_children, PA-005 on test_normalize_path"
  - id: implement_ext
    name: Backfill extensions marks (group 4)
    steps:
      - file: tests/ext/test_batch.py
        section: "test_error_continues, test_empty_paths (BATCH-010/013/017/024/025)"
        read_type: reference
        extract: "Concurrent-parametrized batch tests cover both sequential (010/013/017) and concurrent (024/025) error/empty clauses in one test each"
      - file: tests/ext/test_observe.py
        section: "test_hook_fires_for_operation (OBS-003a), test_store_event_write_result_populated_on_success (OBS-015)"
        read_type: reference
        extract: "hook-to-op mapping + write_result-in-StoreEvent; WR-006 on head-sidecar, DAG-001 on test_custom_serializer (isinstance(_, Serializer) + .extension -- the runtime_checkable Protocol shape, moved off test_roundtrip in review), GLOB-017/019 + SAW-009 on glob/atomic conformance"
      - file: sdd/specs/045-write-result.md
        section: "WR-014..017"
        read_type: gate
        outcome: misleading
        extract: "WR-014..017 are 'Moved to EW-001..004' cross-reference stubs (ADR-0008) -- phantom declarations the gate flags as drift but cannot be WR-marked; held for de-registration/allowlist, not backfill"
  - id: implement_http_async_sql
    name: Backfill HTTP/Async/SQL marks (group 5)
    steps:
      - file: tests/backends/http/test_config.py
        section: "ReadOnlyHttpBackend tests (HTTP-CON-002/PATH/READ/EXIST/META/UNSUP/ERR/HEALTH/LIFE/CRED/RETRY/TR-002/003)"
        read_type: reference
        extract: "23 HTTP-* ride the dedicated http tests beside BE-*/NPR-*/SIO-* siblings; HTTP-TR-001 held (HttpTransport protocol shape, no structural assertion). TR-002 (auto-detect precedence) on test_auto_detect_falls_back_to_urllib and TR-003 (explicit override) on test_urllib_is_default -- swapped off the wrong homes in review (TR-002 was on the explicit-urllib test, TR-003 on an unknown-name ValueError test)"
      - file: tests/backends/azure/aio/test_config.py
        section: "ASYNC-070/071/072/073/076/078/079 (Phase-2 AsyncAzure restatements)"
        read_type: reference
        extract: "ASYNC-070..079 ride the async-azure tests carrying ASYNC-001..024 marks (like AZ-* rode BE-*); ASYNC-045a on test_gen_graph, ASYNC-052f on async head; held: ASYNC-043 (delegation design), 074 (non-HNS materialization untested), 077 (shared-helpers code-org)"
      - file: tests/backends/sqlblob/test_config.py
        section: "test_close_owned_engine (SQL-QUERY-061), test_sqlite_wal_mode (SQL-QUERY-063)"
        read_type: reference
        extract: "SQL-QUERY-061/063 ride the SqlBlob shared-base close/WAL tests (inherited _SQLAlchemyBaseBackend); SQL-BLOB-011 on custom-table, SQL-QUERY-010 on read-not-found; held: SQL-BLOB-070/071 + SQL-QUERY-090/091 (Performance-section perf/design)"
  - id: verify
    name: Gate + prune
    steps:
      - file: scripts/check_spec_marks.py
        section: "_BASELINE (all cluster blocks)"
        read_type: verify
        extract: "Groups 1-5 (all clusters): pruned 102 landed IDs cumulative; kept 57 baselined (53 held-for-disposition across clusters + 4 AW-* never grouped) -- type-(d)/no-assertion: design/meta, capability-gate raises, perf tables, moved-EW stubs, protocol shapes"
      - file: tests/backends/conformance/test_io.py
        section: "(full)"
        read_type: verify
        extract: "Gate: 159 -> 57 violations, 784 mark-cited IDs, all remaining baselined (exit 0); pytest group-5 files 678 passed"
  - id: disposition
    name: Disposition of the 57 residual rows (close BK-252)
    steps:
      - file: scripts/check_spec_marks.py
        section: "_ALLOWLIST_DESIGN (BK-252 disposition block)"
        read_type: reference
        extract: "Allowlisted 35 rows: 31 type-(d) design/meta/perf (incl. CFG-007 reclassified) + 4 moved-to-EW WR-014..017 stubs. (AW-006 was first allowlisted, then moved to a real mark in #728 review -- its mkstemp+os.replace mechanism is directly testable.) Drained from _BASELINE."
      - file: tests/test_store.py
        section: "TestStoreEquality/ThreadSafety/CapabilityGates"
        read_type: reference
        extract: "New type-(a) tests (22): STORE-007/010, BE-011 (+ AW-002/AW-007 same raise), ITER-002; plus MEM-001/005, PA-026, AW-005, AW-006 (Local mkstemp+os.replace, added in review), S3-001/NPR-007, S3PA-001/007, PING-009, SAW-010, SEEK-007, AZ-010, ASYNC-074 across their files"
      - file: sdd/specs/029-async-store-backend-api.md
        section: "ASYNC-074"
        read_type: verify
        outcome: misleading
        extract: "Writing the ASYNC-074 test reproduced the actual behavior: write() streams the AsyncIterator straight to upload_blob (BUG-165), it does NOT materialize. Spec text was stale; corrected to 'Content Streaming' before marking."
      - file: scripts/check_spec_marks.py
        section: "_BASELINE (now empty)"
        read_type: verify
        extract: "Final: _BASELINE drained to frozenset(); gate reports 0 violations ('spec <-> mark traceability is complete'). 804 mark-cited IDs. BK-252 done."
