id: BUG-193
title: "Async HNS live test suite missing; sync HNS live tests lacking WriteResult assertions"
trigger: "TestAsyncAzureLiveHNS used the Azurite-backed fixture so write_atomic silently delegated to write (HNS never exercised); sole assertion was isinstance(result, WriteResult) violating TESTING.md Rule 2"
source_items:
  - BUG-193
audience:
  - infra.test
discovery_followups:
  - BUG-194
  - BUG-196
  - BUG-197
co_shipped_items:
  - BUG-194
  - BK-175
review_rounds: 3
phases:
  - id: orient
    name: Orient
    steps:
      - file: CLAUDE.md
        section: "Bug-fix protocol"
        read_type: gate
        extract: "BACKLOG → CHANGELOG → failing TEST → FIX → COMMIT together"
      - file: sdd/000-process.md
        section: "Rules / Rule 6"
        read_type: gate
        extract: "Bug fix pipeline"
      - file: sdd/BACKLOG.md
        section: "(item)"
        read_type: gate
        extract: "Confirm item tracked"
      - file: CHANGELOG.md
        section: "[Unreleased]"
        read_type: gate
        extract: "Add stub"

  - id: spec_review
    name: Spec review
    steps:
      - file: sdd/specs/045-write-result.md
        section: "WR-001a, WR-004, WR-012, WR-013"
        read_type: gate
        extract: "WriteResult field contracts: source/size, etag normalisation, metadata echo, metadata persistence"
      - file: sdd/specs/012-azure-backend.md
        section: "AZ-034"
        read_type: gate
        extract: "Azure etag normalisation on write/write_atomic"
      - file: sdd/specs/003-backend-adapter-contract.md
        section: "BE-008, BE-010, BE-021"
        read_type: gate
        extract: "Sync write/write_atomic postconditions; InvalidPath on directory path; canonical error mapping"
      - file: sdd/specs/029-async-store-backend-api.md
        section: "ASYNC-008, ASYNC-010"
        read_type: gate
        extract: "Async write/write_atomic contracts"

  - id: tests
    name: Tests
    steps:
      - file: sdd/TESTING.md
        section: "Test Subpackage Placement"
        read_type: gate
        extract: "New file: tests/aio/test_async_azure_live_hns.py"
      - file: sdd/TESTING.md
        section: "Rules"
        read_type: gate
        extract: "Rule 2: assert behavior not types; Rule 6: real ADLS Gen2 as oracle"
      - file: sdd/000-process.md
        section: "Test traceability"
        read_type: gate
        extract: "@pytest.mark.spec(WR-001a/WR-004/WR-012/WR-013/AZ-034/BE-008/BE-010/BE-021)"

  - id: fix
    name: Fix
    steps:
      - file: sdd/DESIGN.md
        section: "1–4"
        read_type: reference
        extract: "Formatting, types, docstrings for new test file and guide update"

  - id: docs
    name: Docs
    steps:
      - file: sdd/DOCUMENTATION.md
        section: "PR documentation review checklist"
        read_type: reference
        extract: "Confirm guide updated (azure-hns-setup.md) to describe new file accurately"

  - id: verify
    name: Verify
    steps:
      - file: sdd/CLAUDE-REFERENCE.md
        section: "Ripple-check table / A bug fix"
        read_type: verify
        extract: "BACKLOG item, CHANGELOG stub, failing test before fix"
      - file: sdd/CLAUDE-REFERENCE.md
        section: "Ripple-check table / A new test file"
        read_type: verify
        extract: "os_sensitive mark decision for live HNS test file"
