id: BK-397
title: "Interview-mode decisions leave no record in the repo, so their rejected options are unrecoverable"
trigger: "RFC-0018 step-0 follow-up: find what fires PostToolUseFailure for AskUserQuestion; the maintainer authorized a temporary local probe"
source_items:
  - BK-397
audience:
  - contributor.process
  - contributor.tooling
expected_ripples:
  - "sdd/rfcs/rfc-0018-decision-capture-at-dialog-time.md"
  - "sdd/BACKLOG.md"
phases:
  - id: orient
    name: Orient
    steps:
      - file: sdd/rfcs/rfc-0018-decision-capture-at-dialog-time.md
        section: "D3, D4.2, Open Question 2, Step 0 observations"
        read_type: gate
        extract: "Untested: the failed row, Post exclusivity; step 0 saw only a denial"
        outcome: ok
      - file: .claude/settings.json
        section: "hooks"
        read_type: reference
        extract: "Probe registered beside the notification hook in settings.local.json; nothing committed changes"
        outcome: ok
  - id: probe
    name: Probe
    steps:
      - file: sdd/rfcs/rfc-0018-decision-capture-at-dialog-time.md
        section: "Open Question 2"
        read_type: reference
        extract: "Ran dismissal, wait, duplicate texts, one option, subagent call, interrupt: 0 PostToolUseFailure in 14 payloads. The brief's case a (Esc/close) cannot be told from a denial in the app; the same cross gave Denied by user twice and a sentinel Post once, confounded by a browser message. My miss: I asked the user which control they used only after the divergence appeared"
        outcome: ok
  - id: docs
    name: Official docs
    steps:
      - file: sdd/rfcs/rfc-0018-decision-capture-at-dialog-time.md
        section: "Step 0 observations / What the official docs say"
        read_type: reference
        extract: "Raw reads by curl of code.claude.com/docs/en/hooks (PostToolUseFailure, PreToolUse AskUserQuestion) and code.claude.com/docs/en/claude-code-on-the-web (Environment expired), each quoted phrase searched in the file before it was written down. Delivered: validation rejections and permission denials never fire PostToolUseFailure, which explains cases a, c, d. My misses: curl wrote the first download into the repo root instead of tmp/ (removed before the commit), and I took two summaries of the docs as sources until the raw pages contradicted them. The claude-code-guide agent's report said AskUserQuestion appears in the docs only as a mods render site (the hooks page has a PreToolUse input table for it, with the answers field) and quoted a 'marked as cut off' passage on the cloud-sessions page that the page does not contain (searched 'cut off' in the downloaded file: no match). A WebFetch summary of the hooks page said the docs make PostToolUse and PostToolUseFailure mutually exclusive (searched 'mutually exclusive' in the raw page: no match). Neither summary is a repo artifact, so no step is tagged misleading against one; summaries of docs pages are not a source"
        outcome: ok
  - id: write
    name: Write up
    steps:
      - file: sdd/rfcs/rfc-0018-decision-capture-at-dialog-time.md
        section: "D3, Open Questions, Step 0 observations"
        read_type: gate
        extract: "Amended Motivation 2, D2 (push bound, an inference), D3 (sentinel row and bound, identical-text caveat removed), D4.2 and the Open Questions summary; failed row and exclusivity left untested"
        outcome: ok
      - file: sdd/BACKLOG.md
        section: "6. The repo does not mislead the next person / BK-397"
        read_type: verify
        extract: "Item said dismissal and timeout were the open triggers; now timeout and genuine errors unobserved, failed path undecided"
        outcome: ok
  - id: verify
    name: Verify
    steps:
      - file: sdd/CLAUDE-REFERENCE.md
        section: "Ripple-check table / Backlog item touched"
        read_type: verify
        extract: "Trace ships in the same PR; contributor.* audience needs no CHANGELOG entry for an RFC amendment"
        outcome: ok
