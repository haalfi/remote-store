id: BK-408
title: "RFC-0019's fast-lane phases exit on net time saved, not zero escapes"
trigger: >-
  RFC-0019 § Roadmap exits Phases 0, 2 and 3 on "0 deterministic,
  selector-reachable" misses or escapes, a merge-barrier bar, while D1-D2 make
  the merge-head full gate the barrier. BK-403's fast gate was adopted on net
  time saved instead; the CI lane (ID-266) needs the same bar before the RFC is
  redrafted.
source_items:
  - BK-408
audience:
  - contributor.process
  - infra.test
decisions:
  - sdd/decisions/67d5f4bd-4337-4e02-9780-f77cb10cb456.jsonl
orient:
  - items: [ID-266]
    verdict: constrains
    evidence: >-
      ID-266's index entry names "RFC-0019 Phases 1-3 and ADR-0043's
      amendment" as its remaining work and its dossier (§ "BK-403 and BK-404
      closed (2026-10-11)") says the local gate now leans on CI's full run per
      push, so a CI fast lane needs the merge-candidate full run before merge.
      Phase 3 (CI shadow) is ID-266's phase: BK-408 sets its exit bar and
      leaves the lane design, the selector choice and the redraft to ID-266.
  - items: [BUG-302, BUG-306]
    verdict: unrelated
    evidence: >-
      Both are CODE_PAT class-pattern gaps found in RFC-0019 review and Phase
      0's D4 audit (BACKLOG.md entries); they concern which CI jobs a diff
      triggers, not how a phase's exit is judged.
  - items: [ID-268]
    verdict: unrelated
    evidence: >-
      ID-268's dossier cites RFC-0019 D1 for folding the PR close into the
      merge-candidate label; the label mechanics are untouched by the
      Roadmap's exit criteria.
phases:
  - id: orient
    name: Orient
    steps:
      - file: sdd/rfcs/rfc-0019-two-speed-test-gate.md
        section: "Status; D1; D2; D7; D8; Roadmap; Open Questions"
        read_type: gate
        extract: >-
          Status (2026-10-11) says the local part is superseded by hatch run
          fast and the CI lane stays open. Roadmap rows 0, 2 and 3 exit on
          zero deterministic, selector-reachable misses/escapes; D7.4 defines
          the escape classes those exits count.
        outcome: ok
      - file: sdd/research/bk-403-phase-0/bucket-rules.md
        section: "Accepted misses; Next step"
        read_type: reference
        extract: >-
          Judged on net time saved: median wall-clock share over all PRs at
          most 50% (FULL = 100%), and escapes costed as one extra full run
          each must sum to less than the time saved.
        outcome: ok
      - file: sdd/research/bk-403-fast-gate/report.md
        section: "Question; Answer"
        read_type: reference
        extract: >-
          The adopted local gate's bar was set before the build: misses
          allowed because CI's full gate catches them one round later.
        outcome: ok
      - file: sdd/backlog/id-266-two-speed-ci-gate.md
        section: "Superseded in part; Phase 0; BK-403 and BK-404 closed"
        read_type: reference
        extract: >-
          CI lane stays open; whether it reuses scripts/fast_gate.py is open;
          the local gate now relies on CI's per-push full run.
        outcome: ok
  - id: implement
    name: Implement
    steps:
      - file: sdd/CLAUDE-REFERENCE.md
        section: "Ripple-check / Backlog item touched; CHANGELOG entry"
        read_type: gate
        extract: >-
          Live trace, BACKLOG-DONE entry linking any dossier (BK-408 has
          none). Audience contributor.process introduces no user-facing
          framework, so no CHANGELOG entry (_schema.yml audience rule).
        outcome: ok
      - file: sdd/rfcs/rfc-0019-two-speed-test-gate.md
        section: "D7.4; Roadmap"
        read_type: verify
        extract: >-
          Grep for "zero", "0 deterministic" and "escape" after the edit: no
          zero-escape exit left outside Phase 0's row, which is kept as run.
        outcome: ok
