id: BK-230
title: "Silence persistent CI annotations: nested Node 20 in setup-dafny + uv cache reservation race"
trigger: "After BK-206 closed (Node-20-deprecation audit) and BK-219 closed (CI Python split), two CI annotations kept firing on every run on master: (1) verify-formal still emitted the actions/setup-{dotnet,node}@v4 Node-20 warning because dafny-lang/setup-dafny-action@v1.9.1 is composite and pins those nested versions; (2) test-primary and e2e kept logging 'Failed to save: Unable to reserve cache with key setup-uv-2-...-3.13.13-pruned-...' because both ran Linux+Python-3.13 with caching enabled and raced to save the same content-hash key. (Initial draft misread the race set as including a 3.13 matrix shard; ci.yml line 63 actually subtracts the primary, so the matrix never enters the race today — corrected in PR #661 review round 1.)"
source_items:
  - BK-230
  - BK-206
audience:
  - infra.ci
discovery_followups: []
expected_ripples:
  - sdd/backlogid.json
  - sdd/BACKLOG-DONE.md
surprising_ripples: []
review_rounds: 1
phases:
  - id: orient
    name: Orient
    steps:
      - file: sdd/BACKLOG-DONE.md
        section: "BK-206 (audit: no bump required)"
        read_type: gate
        extract: "verify scope of original audit; confirm third-party actions were explicitly out-of-scope and re-add of FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 to mutation.yml was the precedent for the targeted job-level fix"
        outcome: misleading
      - file: sdd/traces/BK-206-node-runtime-audit.yml
        section: "phases / audit"
        read_type: reference
        extract: "BK-206 enumerated GitHub-org actions only; nested composite-action steps were never inspected"
        outcome: ok
      - file: .github/workflows/ci.yml
        section: "verify-formal job (line 310), setup-uv blocks without enable-cache:false"
        read_type: gate
        extract: "identify the single workflow consumer of setup-dafny-action and the cache-enabled setup-uv jobs; missed on first pass that test-matrix excludes the primary (line 63: ALL_PYTHONS - [PRIMARY]) so only test-primary and e2e actually share the Linux+3.13 key"
        outcome: misleading
  - id: verify_root_cause
    name: Verify root cause
    steps:
      - file: https://github.com/dafny-lang/setup-dafny-action/blob/main/action.yml
        section: "runs.steps"
        read_type: verify
        extract: "confirm composite action still pins actions/setup-dotnet@v4 (x2) and actions/setup-node@v4 (Node 20 internally); upstream main matches v1.9.1, so a pin bump cannot solve this"
        outcome: ok
      - file: https://github.com/astral-sh/setup-uv/blob/main/docs/configuration.md
        section: "cache-suffix"
        read_type: verify
        extract: "confirm cache-suffix is the documented knob to diverge the save key when two jobs share os/arch/python-version"
        outcome: ok
  - id: fix
    name: Apply fix
    steps:
      - file: .github/workflows/ci.yml
        section: "verify-formal job env block"
        read_type: gate
        extract: "add FORCE_JAVASCRIPT_ACTIONS_TO_NODE24=true at job level with a comment naming the nested dependency; mirrors the BK-168 pattern that BK-206 follow-up removed from mutation.yml"
        outcome: ok
      - file: .github/workflows/ci.yml
        section: "setup-uv steps in test-primary and e2e (live race); test matrix (forward-defensive)"
        read_type: gate
        extract: "add unique cache-suffix to test-primary and e2e to break the live Linux+3.13 race; add ci-test-matrix as forward-defensive entry so reintroducing 3.13 to the matrix later cannot silently revive the race; cross-platform left alone because its OS axis already differentiates the key"
        outcome: ok
  - id: doc_sweep
    name: Document and amend prior audit
    steps:
      - file: sdd/BACKLOG-DONE.md
        section: "BK-206 title and trailing addendum; new BK-230 entry under Unreleased"
        read_type: gate
        extract: "correct the original 'Node.js 20 to Node.js 22' title (deprecation target was always Node.js 24), append an Audit gap paragraph pointing to BK-230, and add the BK-230 entry itself"
        outcome: ok
      - file: CHANGELOG.md
        section: "0.25.0 CI hygiene rollup line"
        read_type: gate
        extract: "correct the v0.25.0 'Node.js 20 to 22' wording to 'Node.js 20 to 24' (typo fix on a shipped line — editorial). No [Unreleased] entry: BK-230 audience is infra.ci and the schema's literal rule (lines 115-119) excludes infra.ci from CHANGELOG; precedent set by BK-205, BK-207, BK-219, BUG-206."
        outcome: ok
  - id: verify
    name: Verify
    steps:
      - file: sdd/traces/_schema.yml
        section: "audience derived rule (lines 115-119)"
        read_type: verify
        extract: "confirm infra.ci-only items skip CHANGELOG; only the v0.25.0 line correction (editorial typo fix on a shipped line) stays in the diff"
        outcome: ok
      - file: sdd/CLAUDE-REFERENCE.md
        section: "Ripple-check table / Workflow change"
        read_type: verify
        extract: "BACKLOG-DONE entry; trace; backlogid.json regenerated; no [Unreleased] CHANGELOG entry per audience rule"
        outcome: ok
