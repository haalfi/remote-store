id: BK-230
title: "Silence persistent CI annotations: nested Node 20 in setup-dafny + uv cache reservation race"
trigger: "After BK-206 closed (Node-20-deprecation audit) and BK-219 closed (CI Python split), two CI annotations kept firing on every run on master: (1) verify-formal still emitted the actions/setup-{dotnet,node}@v4 Node-20 warning because dafny-lang/setup-dafny-action@v1.9.1 is composite and pins those nested versions; (2) e2e and test-primary kept logging 'Failed to save: Unable to reserve cache with key setup-uv-2-...-3.13.13-pruned-...' because they race the matrix test 3.13 shard on the same content-hash cache key."
source_items:
  - BK-230
  - BK-206
audience:
  - infra.ci
discovery_followups: []
expected_ripples:
  - sdd/backlogid.json
  - CHANGELOG.md
  - sdd/BACKLOG-DONE.md
surprising_ripples: []
phases:
  - id: orient
    name: Orient
    steps:
      - file: sdd/BACKLOG-DONE.md
        section: "BK-206 (audit: no bump required)"
        read_type: gate
        extract: "verify scope of original audit; confirm third-party actions were explicitly out-of-scope and re-add of FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 to mutation.yml was the precedent for the targeted job-level fix"
        outcome: misleading
      - file: sdd/traces/BK-206-node-runtime-audit.yml
        section: "phases / audit"
        read_type: reference
        extract: "BK-206 enumerated GitHub-org actions only; nested composite-action steps were never inspected"
        outcome: ok
      - file: .github/workflows/ci.yml
        section: "verify-formal job (line 310), three setup-uv blocks without enable-cache:false (lines 129, 161, 272)"
        read_type: gate
        extract: "identify the single workflow consumer of setup-dafny-action and the three cache-enabled setup-uv jobs racing on Python-3.13 Linux"
        outcome: ok
  - id: verify_root_cause
    name: Verify root cause
    steps:
      - file: https://github.com/dafny-lang/setup-dafny-action/blob/main/action.yml
        section: "runs.steps"
        read_type: verify
        extract: "confirm composite action still pins actions/setup-dotnet@v4 (x2) and actions/setup-node@v4 (Node 20 internally); upstream main matches v1.9.1, so a pin bump cannot solve this"
        outcome: ok
      - file: https://github.com/astral-sh/setup-uv/blob/main/docs/configuration.md
        section: "cache-suffix"
        read_type: verify
        extract: "confirm cache-suffix is the documented knob to diverge the save key when two jobs share os/arch/python-version"
        outcome: ok
  - id: fix
    name: Apply fix
    steps:
      - file: .github/workflows/ci.yml
        section: "verify-formal job env block"
        read_type: gate
        extract: "add FORCE_JAVASCRIPT_ACTIONS_TO_NODE24=true at job level with a comment naming the nested dependency; mirrors the BK-168 pattern that BK-206 follow-up removed from mutation.yml"
        outcome: ok
      - file: .github/workflows/ci.yml
        section: "setup-uv steps in test (matrix), test-primary, e2e"
        read_type: gate
        extract: "add unique cache-suffix per job so the save keys diverge; cross-platform job left alone because its OS axis already differentiates the key"
        outcome: ok
  - id: doc_sweep
    name: Document and amend prior audit
    steps:
      - file: sdd/BACKLOG-DONE.md
        section: "BK-206 title and trailing addendum"
        read_type: gate
        extract: "correct the original 'Node.js 20 to Node.js 22' title (deprecation target was always Node.js 24) and append an Audit gap paragraph pointing to BK-230"
        outcome: ok
      - file: CHANGELOG.md
        section: "[Unreleased] / Fixed; 0.25.0 CI hygiene rollup"
        read_type: gate
        extract: "add a Fixed entry under [Unreleased] for BK-230; correct the 0.25.0 'Node.js 20 to 22' wording to 'Node.js 20 to 24'"
        outcome: ok
  - id: verify
    name: Verify
    steps:
      - file: sdd/CLAUDE-REFERENCE.md
        section: "Ripple-check table / Workflow change"
        read_type: verify
        extract: "BACKLOG-DONE entry, CHANGELOG (audience starts user. or contributor.process is the gate — infra.ci would normally skip CHANGELOG, but this entry corrects an already-shipped CHANGELOG line and adds a paired entry to the same rollup, so the entry is editorial not derived); trace; backlogid.json regenerated"
        outcome: ok
