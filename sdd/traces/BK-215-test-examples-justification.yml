id: BK-215
title: "test_examples.py allow-list justification documented (BK-191 slice 7/7)"
trigger: "BK-191 audit (sdd/audits/audit-014) classified test_examples.py as disposition (c) keep-at-root with documented justification; the existing comment block above _BACKEND_AT_ROOT_GRANDFATHERED in scripts/check_test_placement.py treated all seven files as migration-pending and did not record the example-test 1:1 (ID-044) justification that makes test_examples.py the only permanently-grandfathered entry"
source_items:
  - BK-215
  - BK-191
audience:
  - contributor.process
  - infra.test
phases:
