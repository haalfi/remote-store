  - id: fix_round_4
    name: Round-4 fix pass (closing gate)
    steps:
      - file: src/remote_store/backends/_flat_ns.py
        section: "_addressable_segments (backslash fold, withdrawn)"
        read_type: verify
        extract: >-
          The round-3 fold, measured and withdrawn. The finding that produced it
          was true — the docstring claimed RemotePath's normalisation and did not
          fold — and the fix chosen for it was wrong, because by then the helper
          had a second consumer: GraphBackend's _key_segments, which also builds
          native_path. Probe over seven keys, 4 broke to_key(native_path(k)) == k.
          What the round-3 reasoning could not see is that the *other* finding it
          acted on in the same breath, "these two predicates should be one
          function", is what made widening the predicate expensive. Two fixes
          that are each right alone can be wrong together, and nothing in reading
          either one shows it.
        outcome: ok
      - file: src/remote_store/aio/backends/_graph/backend.py
        section: "write, _raise_if_closed, _reject_user_metadata"
        read_type: verify
        extract: >-
          The round-3 closed-ordering fix was one line too low. It moved the
          closed check into _require_writable_key — the guard the round was
          looking at — while the user-metadata gate sat above that call, so a
          closed backend handed metadata= still answered CapabilityNotSupported:
          2 of the 4 closed-write shapes, probed directly. The claim being made
          was about every pre-check and the fix was made at one of them. Now at
          the top of write; the cell is the cross product, because one closed-write
          cell pins whichever pre-check runs first and stays green when a later
          one is added above it. Fenced: reverting the hoist fails exactly the
          two metadata cells.
        outcome: ok
      - file: src/remote_store/aio/backends/_graph/backend.py
        section: "_parent_ref_path"
        read_type: verify
        extract: >-
          A third segment predicate in the same backend, splitting with `if s`
          only, and it decides the move/copy destination *address*. So the
          destination guard (which drops ".") accepted "./x.txt" and the address
          then named a folder literally called "." — %2E on the wire — while
          write("./x.txt") went to the drive root: 4 of 7 spellings disagreed,
          probed. Same shape as the withdrawn fold seen from the other side:
          there, one predicate was widened and broke addressing; here, addressing
          used a narrower one and broke the guard's promise. The invariant behind
          both is that "does this key name a node" and "which node" must be one
          function. Found by asking what else in this file splits a key.
        outcome: ok
      - file: sdd/traces/bug-259-sftp-root-write.yml
        section: "Fence phase; BACKLOG-DONE figures"
        read_type: verify
        extract: >-
          The trace's own Fence phase still held 47 of 8643 while BACKLOG-DONE
          held 93 of 8858 — two artifacts in this PR disagreeing about the same
          measurement, because later rounds corrected the record they were
          reading and not the record they were writing in. The steps recording
          the corrections were present and current; the step stating the figure
          was not. Re-run against this tree and rewritten to say which artifact
          held what and when, rather than to state a point, since a figure whose
          subject is the test suite is invalidated by every round that adds a
          cell. Round 5 then caught the rewrite itself claiming four earlier
          versions of a sentence that had only ever had one — the four belonged
          to the sibling artifact. A note about a stale figure is as derivable,
          and as easy to write from memory, as the figure.
        outcome: ok

  - id: fix_round_5
    name: Round-5 fix pass (closing gate, three appended passes)
    steps:
