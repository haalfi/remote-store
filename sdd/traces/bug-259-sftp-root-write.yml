id: BUG-259
title: "SFTPBackend writes leave an absent base_path occupied by a regular file"
trigger: >-
  A write to the store root of an SFTP store whose base_path did not exist ran
  to completion against the container path itself, leaving the store's own
  container a regular file; open_atomic returned cleanly having done it, and the
  two writers that did raise raised from the path layer above the backend, after
  the bytes.
source_items:
  - BUG-259
  - BUG-247
audience:
  - user.api
  - contributor.process

# The two lists together are exactly `git diff --name-only origin/master...HEAD`,
# re-derived against the final branch rather than against the tree as it stood
# when each part landed. `expected` is what a reader of the item plus the
# ripple-check Pre-work index would have named before any code was opened: the
# one backend the item scopes itself to, its per-backend test module, and the
# four bookkeeping files the Bug fix / Backlog item touched / CHANGELOG entry
# rows name verbatim (`backlogid.json` is generated by the backlog move, not
# hand-edited). Everything else is `surprising`, and the gap between the lists is
# what this record is for: an item scoped to one backend whose fix reached six.
#
# Two of the surprising entries are the generated graph artefacts, and they are
# filed there rather than as expected for an honest reason: the gate caught them
# (`gen_graph.py --check`) rather than the ripple-check anticipating them, and I
# regenerated only after it failed. A gate catching a ripple is a better outcome
# than a checklist row naming it, but it is not the same thing, and filing them
# as expected would report a foresight that was not exercised.
expected_ripples:
  - src/remote_store/backends/_sftp.py
  - tests/backends/sftp/test_absent_base_path.py
  - sdd/BACKLOG.md
  - sdd/BACKLOG-DONE.md
  - sdd/backlogid.json
  - CHANGELOG.md
  - sdd/traces/bug-259-sftp-root-write.yml
surprising_ripples:
  - src/remote_store/backends/_flat_ns.py
  - src/remote_store/backends/_local.py
  - src/remote_store/backends/_s3.py
  - src/remote_store/backends/_s3_base.py
  - src/remote_store/backends/_s3_boto3.py
  - src/remote_store/backends/_s3_pyarrow.py
  - src/remote_store/backends/_azure.py
  - src/remote_store/aio/backends/_azure.py
  - src/remote_store/aio/backends/_graph/backend.py
  - tests/backends/conformance/test_io.py
  - tests/backends/conformance/test_async_extended.py
  - tests/backends/conformance/test_close_posture.py
  - tests/backends/conformance/aio/test_close_posture.py
  - tests/backends/test_flat_ns.py
  - tests/backends/local/test_absent_root.py
  - scripts/check_docstring_parity.py
  - sdd/specs/003-backend-adapter-contract.md
  - tests/backends/graph/aio/test_backend.py
  - docs-src/guides/custom-backend-guide.md
  - examples/snippets/custom_backend_guide.py
  - tests/test_snippets.py
  - docs-src/_data/graph/graph.json
  - docs-src/explanation/graph_viz.html

discovery_followups:
  - ID-251

# Counted from `git log --oneline origin/master..HEAD`, applying the schema's
# test — "exists specifically because review feedback was incorporated":
#   a9c54f9  implements the fix                            — no
#   2ba4cff  round 1, all nine findings                    — yes
#   419883d  round 1 residue: the async Azure Raises blocks
#            the sweep's own pattern had missed, found by
#            re-deriving a figure for a review reply        — yes
#   ccfe97e  round 2, all seven findings                   — yes
#   fc2af3f  round 3, all sixteen panel findings           — yes
#   f5d0ff0  round 4, the backslash withdrawal and two
#            Graph predicate breaches                      — yes
#   (this)   round 5, the closing gate                     — yes
#
# The last entry is "(this)" rather than a SHA on purpose: a commit cannot name
# its own hash, and writing the tip's SHA here made the file stale the moment it
# was amended into that very commit. The sibling trace uses the same form.
#
# Promoting "(this)" to a SHA and adding a fresh one is TWO edits, and this list
# has now dropped a round twice by doing one of them. Round 4 omitted fc2af3f;
# round 5 added it, wrote a note saying that skipping the promotion is how the
# omission happens, and then omitted f5d0ff0 in the same edit — one round later,
# two reviewers found it. Re-run `git log --oneline origin/master..HEAD` and
# count the lines before touching this block; the comment naming the command is
# not a substitute for running it.
# Six qualify. The field counts commits rather than rounds; the loop has run
# five review rounds and produced six review-driven commits, because round 1's
# reply-writing surfaced a gap of its own.
#
# These SHAs are post-rebase, and have now been rewritten twice — first by the
# rebase onto BK-354, then by the one onto BK-356. A figure naming commits is
# invalidated by any history rewrite, not only by new work, and re-reading it
# would never show that: the stale SHAs still look like SHAs. Re-derived from
# the command above after each rebase. This is the argument for the "(this)"
# entry rather than a sixth hash — the tip's own SHA cannot be written into the
# commit that carries it, and the five below it move whenever the branch is
# replayed.
review_rounds: 6

phases:
  - id: orient
    name: Orient
    steps:
      - file: sdd/BACKLOG.md
        section: "(item) BUG-259"
        read_type: gate
        extract: >-
          The diagnosis held exactly and the prescription ("refuse the root key
          definitionally, before the transport is touched") was the fix taken.
          The item's measured table was a subset: it recorded three calls under
          one spelling, and the enumeration below found three writers x two
          spellings x two overwrite modes all corrupting.
        outcome: ok
      - file: sdd/traces/bug-247-local-absent-root.yml
        section: "fix_panel, implement"
        read_type: reference
        extract: >-
          The sibling's record, which is where this item came from. Two things
          it supplied that the backlog item did not: the exact guard shape
          Local took (_reject_root_as_write_target, deliberately not
          _reject_root_as_file), and the reason its move/copy destinations need
          no guard — both re-measured here for SFTP rather than assumed.
        outcome: ok
      - file: sdd/CLAUDE-REFERENCE.md
        section: "Ripple-check > Pre-work index"
        read_type: gate
        extract: >-
          Triggered rows: Bug fix, Spec section, Backlog item touched, CHANGELOG
          entry, Public method signature. Two of the ripples this work actually
          hit have no row — see the verify phase.
        outcome: ok

  - id: reproduce
    name: Reproduce
    steps:
      - file: tests/backends/sftp/_helpers.py
        section: "StubSFTPServer.ROOT, _realpath"
        read_type: reference
        extract: >-
          The server-side filesystem has to be readable from the test, because
          every root probe answers definitionally: is_file("") returns False
          from the BE-029 short-circuit without a syscall, so an assertion
          phrased against the backend passes on the exact corruption it is
          written to catch. StubSFTPServer.ROOT is the only handle on the real
          tree and no existing test used it.
        outcome: ok
      - file: src/remote_store/backends/_sftp.py
        section: "write, write_atomic, open_atomic, move, copy"
        read_type: verify
        extract: >-
          Enumerated the whole write surface rather than the item's three rows.
          All twelve write cells corrupt; the four move/copy destination cells
          do not, and fail on the source with NotFound before the destination is
          examined, which is what makes three call sites right and five wrong.
          The overwrite=True rows are the ones the item's table missed and they
          matter on their own: write and write_atomic skip their existence stat
          entirely in that mode.
        outcome: ok

  - id: design
    name: Design
    steps:
      - file: src/remote_store/backends/_flat_ns.py
        section: "_reject_root_as_file"
        read_type: reference
        extract: >-
          Its docstring said "Not a mutation guard: deleting or writing *the
          root itself* is a Store-layer concern" — false as of BUG-247, which
          had already put a write guard in LocalBackend, and falsified again
          here. A sentence about a neighbour's responsibility went stale when
          the neighbour changed and nothing pointed at it.
        outcome: misleading
      - file: src/remote_store/backends/_local.py
        section: "_reject_root_as_write_target"
        read_type: reference
        extract: >-
          Extracted to _flat_ns rather than copied. The two backends would have
          carried the same message string in two places, which is the
          second-description drift DRIFT-RULES forbids; the general rationale
          moved to the shared helper and each backend kept only the sentence
          about what defeats observation on it.
        outcome: ok

  - id: implement
    name: Implement
    steps:
      - file: tests/backends/conformance/test_io.py
        section: "_ROOT_FILE_OPS, TestBackendRootPath"
        read_type: reference
        extract: >-
          The roster held reads, delete and move/copy source — no write-shaped
          op, on any backend. Added as a separate roster rather than folded in:
          the seven are the type-mismatch row, each gated on its own capability
          and owing an error class, while these three are one rule under WRITE
          owing an error class *and* the absence of a side effect.
        outcome: ok
      - file: src/remote_store/backends/_s3.py
        section: "write, open_atomic"
        read_type: verify
        extract: >-
          The new conformance cell failed on S3 and S3-Boto3 on its first run,
          which is how five more breaching classes were found. Measured: s3fs
          read the bucket back as an existing object and raised AlreadyExists
          without overwrite, then leaked a raw parameter-validation error with
          it; s3-boto3 raised BackendUnavailable for "" while "." took a
          different route and raised from above the backend, so the two
          spellings disagreed. Neither could occupy its container — the SDK
          refuses the empty key — so the breach is of error class, not data.
        outcome: ok
      - file: src/remote_store/backends/_s3_base.py
        section: "_reject_root_as_file"
        read_type: reference
        extract: >-
          The ordering constraint the sibling encodes and the write guard has to
          copy: the closed-backend guard runs first, because BE-020 states its
          guarantee without exception and a cheap root pre-check naturally wants
          to run ahead of it. Read off the existing method rather than the spec.
        outcome: ok

  - id: gates
    name: Gates
    steps:
      - file: scripts/check_docstring_parity.py
        section: "AzureBackend/AsyncAzureBackend identical set"
        read_type: gate
        extract: >-
          Caught a new method carrying a docstring on both Azure classes and
          being unclassified. Registering it as `identical` meant the shared
          sentence had to be true of both, so AsyncAzureBackend was measured
          with the guard stubbed out rather than being assumed to match its
          sync twin. It did — same SDK message, both spellings, both overwrite
          modes. No ripple-check row points at this registry.
        outcome: ok
      - file: scripts/check_no_tracker_refs.py
        section: "(gate output)"
        read_type: gate
        extract: >-
          Eleven tracker coordinates (BE-020, BE-029, BUG-247, BUG-259) written
          into the new docstrings, which render into the public API reference.
          Rewritten as prose. Worth noting the existing sibling docstrings
          state the same ordering rule without naming BE-020 — the convention
          was visible in the code being copied and still not copied.
        outcome: ok
      - file: tests/backends/fixtures/test_registry.py
        section: "TestLayoutBoundary"
        read_type: gate
        extract: >-
          The new conformance docstring named SFTPBackend and LocalBackend to
          say where the per-backend pins live, and TestLayoutBoundary failed it.
          The rewrite — replacing the pointer with the structural reason (the
          corruption is visible only from the storage system's side, and needs
          an absent container no fixture arranges) — is more useful than the two
          paths were, so the gate earned its keep.
          But the gate is weaker than its rule. It scans for a hand-maintained
          seven-name tuple that omits LocalBackend, MemoryBackend,
          AsyncMemoryBackend, S3Boto3Backend, GraphBackend and AsyncAzureBackend
          — so of the two names it caught me on, only SFTPBackend was ever
          detectable, and this same PR later wrote AsyncAzureBackend into
          aio/test_close_posture.py without a murmur. Recorded because a trace
          that credits a gate with its rule's reach, rather than its scan's,
          tells the next reader the surface is covered when it is enumerated.
        outcome: ok

  - id: fence
    name: Fence
    steps:
      - file: src/remote_store/backends/_flat_ns.py
        section: "_reject_root_as_write_target"
        read_type: verify
        extract: >-
          Mutation-fenced against the final tree, not against the tree as it
          stood when each part landed — and re-run again at every round that
          moved the tree, because this figure's subject is the test suite the
          loop keeps changing. Final: neutering the shared guard fails 93 of
          8887 executed cells — 34 in the SFTP module, 26 in conformance, 22 in
          Local's, 11 in test_flat_ns; SFTP's own wrapper alone, 34. Both closing
          rounds re-ran both fences rather than carrying them, and both times the
          numerator held while the denominator moved with that round's own new
          cells (8867, 8876, 8887). A re-read would have shown nothing wrong on
          either occasion, which is the whole argument for re-running.

          This sentence itself held 47 of 8643 from the day it was written until
          round 4, while the same measurement in BACKLOG-DONE.md was re-derived
          three times over the same period. That file's committed history, from
          git diff across the branch commits rather than from memory: 47 of 8643,
          then 80 of 8776 at round 2, then 93 of 8858 at round 3, then 93 of 8867
          and 93 of 8876 at the two closing rounds. Two artifacts in one PR
          disagreeing about one number, because each round corrected the record
          it was reading and not the record it was writing in — and the trace's
          later steps, which record those corrections as events, made the file
          look current while its own figure was the stalest thing in it. Not one
          version was falsified by a defect in the guard; every one was falsified
          by the review loop adding cells around it, which is the failure mode
          BUG-247's record spent a paragraph on and this trace then reproduced.
        outcome: ok
      - file: src/remote_store/backends/_sftp.py
        section: "_reject_root_as_write_target (the SFTP wrapper)"
        read_type: verify
        extract: >-
          Neutering SFTP's own wrapper — all five call sites, not the three
          writers this step first said — fails 34 cells: 18 in
          test_write_to_the_root_does_not_create_the_container, 12 in
          test_write_to_the_root_leaves_no_file_at_base_path, and 4 in
          test_move_and_copy_destination_cannot_reach_the_corruption, whose
          presence is what shows the mutation covers the destination too. The
          figure was right and its stated mutation was not, which the sibling
          record described correctly all along — the two disagreed for two
          rounds. All in
          the per-backend module and NONE in conformance — with base_path present
          SFTP already refused the root, so the conformance cell does not fence
          this item's own fix. A cell that passes before and after a fix is not
          coverage of it, and the two would have been easy to conflate given
          the cell was added in the same change.
        outcome: ok
      - file: tests/backends/conformance/test_io.py
        section: "(new cells, collection)"
        read_type: verify
        extract: >-
          Coverage derived rather than assumed: the new cells collect 266 and
          execute 188 (re-run at the closing gate; 84 and 58 when this step was
          first written, before the destination and close-posture rosters). The
          78 skips are backends not declaring the capability under test,
          s3_pyarrow_moto (needs the MinIO fixture on current PyArrow), and the
          Azure sync, Azure async and Graph replay lanes, whose cassettes for
          these ids are unrecorded. Four backends therefore have a conformance
          cell that never runs; each was measured directly instead — S3PyArrow
          and Azure against an unreachable endpoint, where an InvalidPath naming
          the root proves the guard ran before the transport.
        outcome: ok

  - id: spec
    name: Spec
    steps:
      - file: sdd/specs/003-backend-adapter-contract.md
        section: "BE-029 § Out of scope"
        read_type: gate
        extract: >-
          The clause placed writes to the root outside itself, on the grounds
          that the root "is a malformed file path, rejected by path validation".
          Both halves true, and the conjunction wrong: validation downstream of
          the write still rejects it, after the bytes have gone. What the clause
          had to bind was the order, not the outcome. Amended rather than
          worked around — a conformance cell asserting a rule its own spec
          declines to make is the failure mode here.
        outcome: misleading
      - file: sdd/specs/003-backend-adapter-contract.md
        section: "BE-008 § Precondition evaluation order"
        read_type: verify
        extract: >-
          The ordered list started at path validity, from which the
          flat-namespace exemption immediately releases the S3 and Azure
          backends — the five that reached their SDK with the root key. The root
          refusal is added as step (0) and numbered rather than folded in,
          precisely because it is the one step that exemption must not release.
        outcome: ok
      - file: sdd/specs/003-backend-adapter-contract.md
        section: "BE-021 § Reach, coverage note"
        read_type: verify
        extract: >-
          Two figures in the file describe rosters this change alters. The
          seven-operation claim about _ROOT_FILE_OPS survives untouched, which
          is a consequence of the separate-roster decision rather than luck; the
          write roster is stated beside it with its own count and its own
          reason. The write-rule status is a partition of the same thirteen
          classes (two unbound, five compliant, six fixed), derived by
          partitioning rather than by tallying the fix.
        outcome: ok

  - id: fix_round_1
    name: Round-1 fix pass
    steps:
      - file: src/remote_store/backends/_s3_boto3.py
        section: "move, copy"
        read_type: verify
        extract: >-
          The round's one behavioural finding, and it arrived as a *documentation*
          complaint: the spec sentence "measured both ways on every backend that
          has a destination probe" generalised a two-backend result. Measuring
          the generalisation rather than just narrowing it found worse than a
          stale sentence — move(src, ".") on the direct-boto3 lane returned
          cleanly and deleted the source, and the s3fs lane answered
          AlreadyExists for a destination that does not exist. A data-loss path
          in code no fix pass had touched, reached because a reviewer objected to
          the scope of a claim rather than to the code.
        outcome: ok
      - file: src/remote_store/backends/_flat_ns.py
        section: "_reject_root_as_write_target"
        read_type: reference
        extract: >-
          The carve-out was dropped rather than re-argued: five call sites per
          backend, not three. Its whole warrant was a reachability argument that
          held on the namespace it was written for, and the cost of checking is
          one string comparison. On the hierarchical backends the guard now
          changes the message rather than the verdict, which is the price of not
          having a clause whose scope depends on which namespace you are on.
        outcome: ok
      - file: tests/backends/sftp/test_absent_base_path.py
        section: "test_move_and_copy_destination_cannot_reach_the_corruption"
        read_type: verify
        extract: >-
          The cell that encoded the withdrawn argument failed once the guard
          landed, which is the right way round: it asserted NotFound on the
          source, and the destination guard is a pre-check so it now fires
          first. Rewritten to pin the new ordering, which is what BE-008 step (0)
          asks for — a key-decidable permanent error before the round trip that
          would report the source missing.
        outcome: ok
      - file: tests/backends/conformance/test_close_posture.py
        section: "test_close_posture_outranks_root_rejection"
        read_type: verify
        extract: >-
          Four new docstrings asserted the closed guard outranks the root
          write check; the existing cell exercises read_bytes only, which never
          touches the write guard. True but unpinned, on both the sync and async
          lanes. The claim was copied from the read-guard siblings along with the
          code — a sentence and its evidence separated at the moment the sentence
          was duplicated.
        outcome: ok
      - file: tests/backends/conformance/test_io.py
        section: "_ROOT_WRITE_OPS"
        read_type: verify
        extract: >-
          write_atomic and open_atomic are gated on ATOMIC_WRITE, not WRITE, and
          the new roster required WRITE for all three. Latent — no registered
          fixture declares WRITE without ATOMIC_WRITE — which is exactly why it
          would have survived. _ROOT_FILE_OPS pairs each op with its capability
          and the new roster did not; the shape was there to copy.
        outcome: ok
      - file: tests/backends/test_flat_ns.py
        section: "TestRejectRootAsWriteTarget"
        read_type: reference
        extract: >-
          The shared helper shipped with no cell of its own, only backend cells
          exercising it through one key shape each. The over-matching half is
          what a backend suite cannot reach cheaply: every ordinary key runs
          through this guard, so a predicate one character too greedy fails
          everywhere at once and reads as anything but a root check.
      - file: src/remote_store/aio/backends/_graph/backend.py
        section: "_require_writable_key"
        read_type: verify
        extract: >-
          Found by the cell written to close the previous finding, on its first
          run, in a backend this change had classified as already compliant.
          GraphBackend is terminal on close and reaches that guard through the
          lazy _client property; _require_writable_key runs ahead of the first
          touch of it, so a closed backend answered "cannot write to the drive
          root" where BE-020 requires "backend is closed". Compliant with the
          root rule and not with the ordering rule the same clause carries —
          which the read-shaped cell could not see, because read_bytes reaches
          _client before any root verdict exists.

  - id: fix_round_2
    name: Round-2 fix pass (measuring round)
    steps:
      - file: src/remote_store/_path.py
        section: "is_root"
        read_type: verify
        extract: >-
          The round's most severe finding, and it is the fix's own hole rather
          than a pre-existing one made visible: is_root is exactly {"", "."},
          and "./" addresses the same node. Measured with the first fix in
          place, against a LocalBackend whose root was deleted — write("./") and
          write_atomic("./") left the root a regular file, open_atomic("./")
          returned cleanly. Round 1 had gone the other way on a similar
          question (drop the carve-out, guard everything) and this round found
          the same lesson one layer down: a guard keyed on an enumeration of
          spellings is a guard that misses the spelling nobody enumerated.
          Fixed by normalising inside the write guard only; widening is_root
          itself would move 52 call sites including native_path/to_key and every
          listing prefix, for a read-side defect that costs an error class
          rather than the container.
        outcome: ok
      - file: src/remote_store/aio/backends/_graph/backend.py
        section: "move, copy"
        read_type: verify
        extract: >-
          The destination sweep of round 1 keyed on backends carrying
          _reject_root_as_file(src), and Graph uses its own
          _require_writable_key, so the sweep passed straight over it. A sweep
          defined by the shape of the code it is patching rather than by the
          operations it is meant to cover will miss the one implemented
          differently — and Graph is exactly the backend a reader would assume
          safe, having been the most careful about root spellings all along.
        outcome: ok
      - file: src/remote_store/backends/_azure.py
        section: "write, and LocalBackend's three writers"
        read_type: verify
        extract: >-
          Four Raises: blocks the round-1 sweep did not reach, on top of the
          four async Azure ones re-derivation had already caught. Same cause
          both times: the sweep matched literal docstring wording, and these
          blocks phrase the same precondition differently. Two independent
          misses of one target set is the signal that the method was wrong, not
          the effort — the count was right each time and the set was short.
        outcome: ok
      - file: tests/backends/conformance/test_io.py
        section: "_ROOT_WRITE_DST_OPS"
        read_type: reference
        extract: >-
          The destination roster shipped without explicit param ids, so pytest
          derived them from the Capability member and the enum repr landed in
          the test id — which is also the cassette filename on every replay
          lane. _ROOT_FILE_OPS spells its move_src/copy_src ids out and the
          reason was there to copy.
        outcome: ok
      - file: sdd/specs/003-backend-adapter-contract.md
        section: "The write row is a second roster"
        read_type: verify
        extract: >-
          The paragraph still said the three writers are "one rule under
          Capability.WRITE" — the exact claim round 1 had already refuted in the
          test roster's own docstring, left standing in the spec that the
          docstring points at. A fix applied to one of two co-located
          descriptions is the drift the repo's rules exist to stop, committed
          inside a PR that amends those rules.
        outcome: ok
      - file: sdd/BACKLOG-DONE.md
        section: "(item) BUG-259, fence and coverage figures"
        read_type: verify
        extract: >-
          Both figures were stale, and the record asserted they had been
          re-derived against the final tree — true when written, false two
          rounds later. Re-run: the guard fence is 80 of 8749 (34 SFTP / 18
          Local / 17 conformance / 11 test_flat_ns) at the time of this round,
          not 47 of 8643; the
          conformance cells collect 182 and execute 130, not 84 and 58. A figure
          about a review loop is invalidated by the loop that reads it, which is
          the third time this pair of items has recorded that.
        outcome: ok

  - id: fix_round_3
    name: Round-3 fix pass (four-member panel)
    steps:
      - file: sdd/specs/003-backend-adapter-contract.md
        section: "compliance table, BE-029 clause, BE-020 pointer, § Reach"
        read_type: verify
        extract: >-
          Five defects in one artifact — the spec amendment this item adds — and
          they share a cause: the clause was written from the fix's narrative
          rather than re-derived from the tree it ships in. The sharpest was the
          compliance table putting LocalBackend's writers under "refused by
          observation", which describes the tree before BUG-247 rather than the
          base this sits on; git show origin/master:_local.py settles it in one
          command, and the sentence was written without running it. The most
          consequential was the clause binding "both spellings" while the guard
          it documents binds the normalised key: a backend author implementing
          BE-029 verbatim as `if is_root(path)` would have been conformant,
          passed the new cells, and corrupted its container. The permission was
          in the code and the obligation was not in the spec.
        outcome: ok
      - file: src/remote_store/aio/backends/_graph/backend.py
        section: "move, copy, _reject_root_as_source"
        read_type: verify
        extract: >-
          Graph again, third round running, and for the third distinct reason —
          writers (compliant), destination (missed by a sweep keyed on another
          backend's helper name), now source (decided by a round trip rather
          than from the key, which only became a breach when this item made the
          precondition order normative). Two members reached it independently
          and one measured it against an unreachable endpoint. The pattern worth
          keeping: a backend that implements a rule its own way is invisible to
          every sweep written against the shape of the majority, and it is
          exactly the backend a reader assumes is fine because it was careful
          first.
        outcome: ok
      - file: tests/backends/local/test_absent_root.py
        section: "test_the_root_as_a_move_or_copy_destination_never_becomes_a_file"
        read_type: verify
        extract: >-
          Three members found this. The cell accepted (NotFound, InvalidPath) —
          correct while the destination was unguarded, and after round 1 guarded
          it, a union that let the guard be deleted with the cell still passing
          through the NotFound arm. Its docstring meanwhile still argued the
          three-call-sites carve-out that round 1 withdrew, and said in terms
          "this cell fences no guard", which had become the only true sentence
          in a paragraph of false ones. The lesson is narrower than "update
          docstrings": a tolerant assertion written to accommodate an ordering
          becomes a hole the moment the ordering is fixed, and nothing fails
          when it does.
        outcome: ok
      - file: tests/backends/graph/aio/test_backend.py
        section: "root destination and source cells"
        read_type: reference
        extract: >-
          Graph's guards were pinned by nothing that executes: its conformance
          lane skips both new rosters for want of cassettes, and the one Graph
          cell that touched the helper called it directly, so it passed with
          both call sites deleted. Measured: the whole Graph suite passed with
          the destination guard reverted. The cells added here drive the real
          methods with no respx mock at all — the guards refuse before a request
          exists, so an InvalidPath is itself the proof, and reverting turns it
          into a connection error. A backend whose lane cannot record cassettes
          is not thereby unpinnable; it just cannot be pinned by cells that seed.
        outcome: ok
      - file: tests/backends/conformance/test_io.py
        section: "_OVERWRITE_MODES"
        read_type: verify
        extract: >-
          The clause says "in both overwrite modes" and the roster exercised
          one, so a normative claim was falsifiable on one of eleven bound
          classes — the one backend whose own module happened to carry the
          dimension. write and write_atomic skip their existence probe entirely
          on overwrite=True, which is why the item's own reproduction found
          those rows corrupting separately. Added as a param; the guard is a
          pre-check so the cost is collection count and no round trips.
        outcome: ok
      - file: src/remote_store/backends/_flat_ns.py
        section: "_addressable_segments"
        read_type: verify
        extract: >-
          Two findings on the shared helper. It was a byte-identical copy of
          Graph's _key_segments, in a change whose own argument leans on the two
          agreeing; Graph now imports it. A rule stated once in a spec should
          not be implemented twice in the source that spec describes. The second
          finding was that it claimed to match RemotePath's normalisation and
          did not fold backslashes, so "\\" — which RemotePath calls the root —
          walked past the guard. Folding looked like the smaller fix than
          narrowing two docstrings; it was landed, and round 4 measured what
          that missed. Because Graph now shares the helper, and Graph's
          _key_segments also builds native_path, the fold rewrote "a\\b" to the
          two-segment ref /drives/D/root:/a/b: and BE-025's round-trip identity
          broke on 4 of 7 probe keys (tmp/probe_graph_roundtrip.py). The fold was
          withdrawn and the docstrings narrowed instead — the option declined in
          round 3. The lesson is not "measure after landing" but that a helper
          two backends share is not free to widen: the second consumer's other
          use of it is invisible at the call site the widening was reasoned from.
        outcome: ok
      - file: docs-src/guides/custom-backend-guide.md
        section: "Step 11: Move and copy; Step 12: close_is_terminal"
        read_type: verify
        extract: >-
          The document a custom-backend author implements against, falsified by
          this change and not in its diff. It told implementers the root refusal
          was "a Store-enforced convention … promoting it to a formal
          backend-contract clause is tracked spec work" — this item *is* that
