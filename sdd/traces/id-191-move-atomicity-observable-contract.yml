id: ID-191
title: "Move atomicity: model the observable contract, then enforce it"
trigger: |
  Wave 1 (C)+(T) pair from the Formal Verification table, sibling of
  ID-188 (which landed via PR #689). ResourceSafety.dfy § 2 modelled
  the runtime MovePhase an implementation traverses (AtomicMove and
  CopyDeleteMove), but had no datatype pinning what a backend declaring
  atomic move may expose to its caller as a terminal observable state.
  The BE-018 prose says it ("never both gone") but no Dafny postcondition
  rules out a backend silently surfacing CopyDone (src gone, dst not
  yet written) as a completed move. The conformance side similarly
  lacked an executable encoding of the non-loss invariant under a
  copy-then-delete crash.
source_items:
  - ID-191
audience:
  - infra.test
co_shipped_items: []
discovery_followups:
  - BK-247
expected_ripples: []
review_rounds: 2
phases:
  - id: orient
    name: Orient
    steps:
      - file: sdd/BACKLOG.md
        section: "Formal Verification / Wave 1 / ID-191"
        read_type: gate
        extract: "Scope: (C) MoveContract datatype excluding CopyDone, (T) crash-injection conformance test (oracle does not certify)"
      - file: sdd/specs/003-backend-adapter-contract.md
        section: "BE-018 / Atomicity, Partial failure"
        read_type: gate
        extract: "Non-atomic backends MUST surface partial failure; caller MUST NOT assume atomicity; source may still exist alongside destination"
      - file: sdd/formal/ResourceSafety.dfy
        section: "§2 AtomicMove / CopyDeleteMove / MoveFinalStateEquivalence"
        read_type: reference
        extract: "Existing MovePhase models runtime state; no observable-contract datatype yet"
      - file: sdd/formal/BackendContract.dfy
        section: "§6 Move / CapAtomicMove"
        read_type: reference
        extract: "Move postcondition pins only the final state, not intermediate observability; CapAtomicMove is the capability that the new contract gates on"
  - id: design
    name: Design the contract datatype
    steps:
      - file: sdd/traces/id-188-quality-flags-cleanup.yml
        section: "phases / implement_c"
        read_type: reference
        extract: "Lesson 2 carry-over: ghost-only datatype + lemma additions don't require re-translating module_.py"
      - file: sdd/formal/ResourceSafety.dfy
        section: "§2.2 CopyDeleteMove / deleteFails branch"
        read_type: reference
        extract: "CopyDone is the structural discriminator between atomic and copy-then-delete; the new MoveContract must exclude it"
  - id: implement_c
    name: (C) Dafny contract — MoveContract datatype + lemmas
    steps:
      - file: sdd/formal/ResourceSafety.dfy
        section: "§2.3 (new) — Observable contract for atomic-move-capable backends"
        read_type: gate
        extract: "Add MoveContract (ObservedDeleteDone | ObservedFailed); ObservableForAtomicMove predicate; Observe ghost function (partial — undefined at CopyDone); three lemmas: AtomicMoveNeverExposesCopyDone, CopyDeleteMoveExposesCopyDoneOnDeleteFail, ObservedFailedPreservesSource. All carry @spec BE-018."
  - id: implement_t
    name: (T) Conformance — crash-injection wrapper
    steps:
      - file: tests/backends/conformance/test_atomic.py
        section: "TestMoveCrashInjection (new)"
        read_type: gate
        extract: "Local _CrashBetweenCopyAndDelete wrapper around a fresh in-process backend; move() does inner.copy + raise. Asserts non-loss invariant: src OR dst intact (never both gone). Not parametrised over fixture_params — contract is on the move *protocol*; marker @pytest.mark.spec(\"BE-018\") for traceability only (no oracle for crash injection per BACKLOG prose)."
  - id: verify
    name: Verify
    steps:
      - file: sdd/formal/ResourceSafety.dfy
        section: "(full — dafny verify)"
        read_type: verify
        extract: "Native dafny 4.11.0: ResourceSafety.dfy 17 verified, 0 errors (was 12; +5 from predicate + ghost function + 3 lemmas). MemoryBackend.dfy unchanged at 478 verified, 0 errors — confirms the ghost-only change does not ripple."
      - file: scripts/check_formal_trace.py
        section: "_BASELINE; BE-018 row"
        read_type: verify
        extract: "BE-018 was already in D (tagged in BackendContract.dfy) and in T (existing @pytest.mark.spec(\"BE-018\") markers in test_atomic.py); adding new @spec BE-018 tags in ResourceSafety.dfy and a new BE-018 marker on the new test class introduces no F1 / F2 violation."
      - file: sdd/CLAUDE-REFERENCE.md
        section: "Ripple-check table / Bug fix"
        read_type: verify
        extract: "Backlog move ID-191 → BACKLOG-DONE.md top of [Unreleased]; Wave-1 table cell updated to 'ID-191 landed; see BACKLOG-DONE.md'. backlogid.json no-op (191 < current max). Trace authored. No CHANGELOG (audience infra.test). No MemoryBackend-py/module_.py regen (ghost-only Dafny change). No Azure cassette ripple (new test fixture-independent)."
  - id: review_fix
    name: Review round 1 — sharpen contract clarity
    steps:
      - file: tests/backends/conformance/test_atomic.py
        section: "TestMoveCrashInjection::test_partial_move_preserves_at_least_one_copy"
        read_type: gate
        extract: "Reviewer flagged the three-assertion stack as a tautology: the OR-disjunction was discharged trivially by the unconditional src/dst asserts following it, burying the contract behind a stronger discharge. Rewrote so the disjunction is the single contract-level assertion (with explicit BE-018 message); demoted src/dst-AND assertions to a separately-commented 'observation on this wrapper shape' block that documents what _CrashBetweenCopyAndDelete produces without masquerading as the invariant. PT018 ruff rule then required splitting the AND into two separate assert statements."
      - file: sdd/formal/ResourceSafety.dfy
        section: "§2.3 ObservableForAtomicMove / Observe / ObservedFailedPreservesSource"
        read_type: gate
        extract: "Reviewer flagged Observe(Initial) = ObservedFailed('not started') as conflating 'never started' with 'rolled back'. Tightened ObservableForAtomicMove to exclude both CopyDone AND Initial — Initial is not a terminal observable state of a completed move (neither AtomicMove nor CopyDeleteMove ever returns it). Observe is now structure-preserving over the predicate's domain ({DeleteDone, Failed(_,_)}). ObservedFailedPreservesSource simplifies to `ensures phase.Failed?` (was `phase.Failed? || phase == Initial`). Re-verifies at 17 verified, 0 errors."
  - id: review_fix_2
    name: Review round 2 — structural binding + protocol-shape breadth
    steps:
      - file: sdd/BACKLOG.md
        section: "BK-247 (new)"
        read_type: gate
        extract: "Reviewer's principal blind-spot finding: MoveContract / ObservableForAtomicMove / lemmas are defined but never referenced from BackendContract.dfy's Backend.Move. Contract is defined, not imposed. Reviewer explicitly recommended deferring the wiring to a follow-up rather than expanding this PR's scope (the wiring requires either an include refactor between BackendContract.dfy and ResourceSafety.dfy or a ghost output threaded through Backend.Move's trait signature into both MemoryBackend variants). Filed BK-247 with the proposed shape; updated BACKLOG-DONE's ID-191 entry to honestly call out this PR as the contract-definition layer with enforcement deferred."
      - file: sdd/formal/ResourceSafety.dfy
        section: "method AtomicMoveIsObservable (new) + CopyDeleteMove postcondition tightening"
        read_type: gate
        extract: "Two structural bindings to replace the round-1 lemmas whose parameter lists advertised method-bindings that did not exist at the proof level. (1) Replaced lemma AtomicMoveNeverExposesCopyDone with method AtomicMoveIsObservable, which actually calls AtomicMove(...) and asserts ObservableForAtomicMove on the returned phase. Postcondition drift on AtomicMove now breaks verification of this method — the proof is coupled to the body rather than to a manual mirror of the ensures. (2) Dropped lemma CopyDeleteMoveExposesCopyDoneOnDeleteFail (vestigial parameters, body reduced to a tautology); added `srcExists && (!dstExists || overwrite) && deleteFails ==> !ObservableForAtomicMove(phase)` as a postcondition on CopyDeleteMove itself, with the matching assert inside the deleteFails branch. The structural reason copy-then-delete is a strictly weaker contract is now enforced on the method that produces the state. Net verifier count: 16 verified, 0 errors (was 17; -1 method-lemma swap + -1 dropped redundant lemma + +1 new method ensures)."
      - file: tests/backends/conformance/test_atomic.py
        section: "_CopyDeleteCrash (renamed from _CrashBetweenCopyAndDelete) + _CRASH_POINTS parametrize"
        read_type: gate
        extract: "Reviewer flagged the OR-disjunction as unfalsifiable: the single `copy(); raise` wrapper shape guarantees src_present=True, so the disjunction discharges solely from the left disjunct and the test mostly certifies inner.copy() (a BE-019 postcondition) rather than BE-018. Parametrised over _CRASH_POINTS = [after_copy, after_delete]: after_copy exercises the left disjunct (src intact, dst materialised); after_delete (copy + delete(src) + raise) exercises the right disjunct (src gone, dst intact). Both shapes satisfy BE-018; a buggy backend leaving both gone would fail the OR — that is the test's discriminating power. Also dropped the dead __getattr__ proxy on the wrapper (reviewer flagged: never invoked, test always uses inner.* directly), renamed the wrapper to _CopyDeleteCrash to reflect it is move-only, and documented the protocol-shape coverage explicitly in the docstring."
      - file: sdd/BACKLOG-DONE.md
        section: "ID-191 entry — spec line"
        read_type: gate
        extract: "Reviewer flagged `spec: BE-018, ASYNC-018` as broader than what the PR actually delivers — no @spec ASYNC-018 tag in Dafny, no ASYNC marker on the test, no async-side change. Dropped ASYNC-018 from the spec line; the entry now reads `spec: BE-018 · audience: infra.test`. ASYNC-018's spec section is `See also: BE-018` — pure cross-reference — so dropping the cite from the delivered-scope line is honest about what landed without losing the cross-document linkage."
