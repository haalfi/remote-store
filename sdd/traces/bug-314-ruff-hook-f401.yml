id: BUG-314
title: "The Edit/Write ruff hook deletes an import added before its use, so the next edit raises `NameError`"
trigger: >-
  A Claude Code session lost three imports in one session (json, io, Hashable in
  scripts/check_traces.py), each added one edit before its use, despite an
  agent-side note warning about exactly this; the maintainer asked for the cause
  to be fixed in the hook rather than tallied again.
source_items:
  - BUG-314
audience:
  - contributor.tooling
discovery_followups: []
expected_ripples:
  - sdd/BACKLOG-DONE.md
  - sdd/backlogid.json
surprising_ripples:
  - tests/scripts/test_record_decision.py
  - tests/scripts/test_check_readthedocs_python.py
phases:
  - id: orient
    name: Orient
    steps:
      - file: .claude/hooks/ruff-format.sh
        section: "whole file (PostToolUse on Edit/Write)"
        read_type: reference
        extract: >-
          Runs `ruff format` then `ruff check --fix` on the edited .py file.
          `--fix` applies F401 (unused import) as soon as an import has no use,
          which is always true for an import added one edit before its call site.
        outcome: ok
      - file: pyproject.toml
        section: "[tool.hatch.envs.default.scripts] lint; [tool.ruff.lint] select"
        read_type: gate
        extract: >-
          `lint` runs "ruff check src/ tests/ examples/ scripts/" without --fix,
          and select includes F, so an import that stays unused still fails lint
          once F401 is unfixable in the hook. `ruff check --help` lists
          `--unfixable <RULE_CODE>`, applicable when fix is enabled.
        outcome: ok
      - file: .github/workflows/ci.yml
        section: "setup HOOKS_PAT; tooling-tests job"
        read_type: gate
        extract: >-
          A .claude/hooks/-only diff sets hooks=true, which runs tooling-tests:
          `pytest tests/scripts/ -q` on ubuntu with bash and jq and the [dev]
          extra (ruff). A new tests/scripts/ module is therefore gated by the
          same trigger as the hook it pins.
        outcome: ok
      - file: sdd/BACKLOG.md
        section: "How this file works: Completing work, Assigning a new ID"
        read_type: gate
        extract: >-
          A parallel session was active, so the ID was reserved by the
          maintainer: BUG-314, the next free across pushed branches per
          `hatch run gen-backlogid --check --remote`. Filed and fixed in one PR,
          so the entry goes straight to BACKLOG-DONE.md as [x].
        outcome: ok
      - file: sdd/rfcs/rfc-0018-decision-capture-at-dialog-time.md
        section: "D4.0 binding rule"
        read_type: gate
        extract: >-
          Read to fill the new `decisions` key. This session's dialogs, including
          the three that approved this item, were recorded on the session's
          earlier work branch, so D4.0 binds them there, not here. That log also
          holds a private local-memory interview; by the maintainer's choice it
          is not committed, so this trace lists no `decisions`.
        outcome: ok
  - id: implement
    name: Implement
    steps:
      - file: tests/scripts/test_ruff_format_hook.py
        section: "test_hook_keeps_an_import_whose_use_is_not_written_yet, test_hook_still_formats_and_applies_other_fixes"
        read_type: verify
        extract: >-
          Runs the real hook with real bash, jq and ruff; a missing tool fails
          rather than skips. Written first and run before the fix: both failed
          with the import removed ('' == 'import json\n'), while the positive
          control's output showed the formatter and the F541 fix had run.
        outcome: ok
      - file: .claude/hooks/ruff-format.sh
        section: "ruff check line"
        read_type: verify
        extract: >-
          Now `ruff check --fix --unfixable F401`; both tests pass. Probed by
          hand that the F811 sweep of a redundant function-local re-import still
          applies (ruff reported "1 fixed" and removed the local import).
        outcome: ok
  - id: review_fix_1
    name: Review round 1 fixes
    steps:
      - file: tests/scripts/test_ruff_format_hook.py
        section: "bash resolution (review thread on line 34)"
        read_type: verify
        extract: >-
          My miss: I took `shutil.which("bash")` from test_record_decision.py and
          checked it only inside a Claude Code session, whose PATH leads with Git
          Bash. With PATH rebuilt as a fresh PowerShell does (Machine then User),
          `shutil.which("bash")` returned WSL's launcher in System32, and
          10 tests failed with WSL's `execvpe(/bin/bash) failed`: 2 here, 5 in
          test_record_decision.py, 3 in test_check_readthedocs_python.py, the
          last two already failing that way on master.
        outcome: ok
      - file: tests/_helpers.py
        section: "hook_bash"
        read_type: verify
        extract: >-
          One resolver for all three modules: on Windows it rejects a System32 or
          WindowsApps bash and derives Git Bash from git's install root. Under the
          same fresh-shell PATH with the venv in front, which still resolved
          `bash` to WSL, the four modules passed 42 of 42. The hook test now asks
          the chosen bash for jq and ruff instead of this process's PATH.
          tests/scripts/test_hook_bash.py pins the resolver on every OS by faking
          sys.platform and shutil.which; mutation (WSL rejection removed) failed
          4 of its 6 tests, each returning the WSL path.
        outcome: ok
      - file: sdd/traces/_schema.yml
        section: "expected_ripples, surprising_ripples"
        read_type: gate
        extract: >-
          expected_ripples is for files the ripple-check anticipated as
          tag-alongs; the hook and its test are the work, so they were removed.
          The two sibling test modules the review's class reached are recorded
          as surprising_ripples: no read or ripple-check row anticipated them.
        outcome: ok
  - id: review_fix_2
    name: Review round 2 fixes
    steps:
      - file: tests/scripts/test_hook_bash.py
        section: "test_windows_prefers_usr_bin_when_git_ships_both, test_windows_keeps_a_path_bash_that_is_not_wsl, test_windows_with_only_wsl_and_no_git_returns_none"
        read_type: verify
        extract: >-
          Review: the usr/bin over bin order was unpinned. Re-derived: with the
          tuple swapped, all 6 tests still passed. Swept hook_bash's six
          decisions for the same gap and found two more: a non-WSL PATH bash
          winning over the git-derived one (its test had no git tree), and
          WSL-plus-no-git returning None. One test each; mutations, all restored:
          order swapped (1 of 7 failed), PATH preference dropped (1 of 8), the
          git-None guard dropped (1 of 8, TypeError on Path(None)).
        outcome: ok
      - file: sdd/BACKLOG-DONE.md
        section: "BUG-314 entry"
        read_type: verify
        extract: >-
          Review: the entry named only the hook fix. Added the bash-resolution
          change and the two sibling modules it also fixed, so the register
          answers why hook_bash exists. The PR body was stale for the same
          reason and was rewritten from the branch diff.
        outcome: ok
