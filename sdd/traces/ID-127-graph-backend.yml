id: ID-127
title: "OneDrive / SharePoint backend (Microsoft Graph) — GR-FOUNDATION"
trigger: "ID-127 GR-FOUNDATION: stand up the live-provisioning runbook and the Stage-1 cassette spine before the Graph backend lands. No real Graph tenant existed; the Stage-1 replay machinery was Azure-hardcoded; httpx streaming-replay was an unproven path (RFC-0010)."
source_items:
  - ID-127
audience:
  - user.site
  - infra.test
  - contributor.tooling
expected_ripples:
  - CHANGELOG.md
surprising_ripples:
  # Adding @pytest.mark.spec("TEST-007") for the scrub security gate made the
  # spec's _ALLOWLIST_DESIGN entry stale; the allowlist had to be edited. No
  # ripple-check row anticipates "first mark for a previously-allowlisted spec".
  - scripts/check_spec_marks.py
review_rounds: 2
phases:
  - id: orient
    name: Orient
    steps:
      - file: sdd/plans/ID-127-graph-backend-implementation.md
        section: "Step 1 — GR-FOUNDATION; Where the spec-obligated work lands"
        read_type: gate
        extract: "Eight GR-FOUNDATION deliverables; the claim that fixture entries land here while only the factory defers to GR-CORE"
        outcome: misleading
      - file: sdd/adrs/0022-graph-auth-model.md
        section: "Decision; Flows covered by GraphAuth; Token caching"
        read_type: gate
        extract: "Dual flows behind a token-provider callable; client-credentials needs a tenant, device-code works for personal accounts; MSAL cache under platformdirs"
      - file: sdd/specs/044-graph-backend.md
        section: "GR-006, GR-007, GR-008, GR-057"
        read_type: gate
        extract: "Three resolve_drive_id shapes; the 'me' shape is delegated-only, so app-only (client-credentials) cannot reach a consumer OneDrive"
      - file: sdd/adrs/0021-graph-sdk-choice.md
        section: "Decision"
        read_type: reference
        extract: "httpx.AsyncClient + msal; bare httpx (no azure.core transport seam) — why the Azure replay shim cannot be borrowed"
  - id: provision
    name: Provision + live dogfood
    steps:
      - file: docs-src/guides/backends/azure-hns-setup.md
        section: "(full)"
        read_type: reference
        extract: "Setup-guide shape to mirror: Prerequisites -> register -> verify -> wire .env -> troubleshooting -> cleanup"
      - file: tests/backends/fixtures/_live_env.py
        section: "require_azure_live_connection_string; module docstring"
        read_type: reference
        extract: "Two-layer live gate shape (opt-in flag + creds, fail-loud); device-code variant needs no secret and GRAPH_TENANT_ID=consumers"
  - id: docs
    name: Author setup guide
    steps:
      - file: sdd/AUTHORING.md
        section: "Directory defaults"
        read_type: gate
        extract: "docs-src/**/*.md defaults to docs-only; no marker needed"
      - file: sdd/CONTENT-RULES.md
        section: "Rule 6 (sourced examples)"
        read_type: gate
        extract: "Hand-written fences allowed when the snippet needs real credentials; note the reason inline"
      - file: docs-src/guides/backends/_nav.yml
        section: "(full)"
        read_type: reference
        extract: "Setup guides live in _nav.yml only, not the Supported-Backends table (azure-hns precedent) — backend/extra do not exist yet"
      - file: scripts/check_no_tracker_refs.py
        section: "(run output)"
        read_type: verify
        extract: "Published docs surfaces may not cite GR-/ADR- coordinate IDs in prose; scrubbed four from graph-setup.md"
        outcome: ok
  - id: implement
    name: Implement cassette scrub + security gate
    steps:
      - file: tests/backends/fixtures/_cassettes.py
        section: "build_vcr_config; CASSETTE_DIR_AZURE; scrub lists"
        read_type: reference
        extract: "Azure scrub pattern (account/filesystem rewrite, header drop, body scrub); model for build_graph_vcr_config (bearer + downloadUrl + correlation)"
      - file: tests/backends/fixtures/_loader.py
        section: "_parse_fixture"
        read_type: gate
        extract: "Loader hard-rejects a fixture whose backend is not in backends.toml — graph_live entry cannot precede [backend.graph]"
      - file: tests/backends/fixtures/__init__.py
        section: "_load_all"
        read_type: gate
        extract: "Every fixtures.toml entry imports tests/backends/fixtures/<name>.py — graph_live needs a factory module building GraphBackend (GR-CORE). The plan's entries-here/factory-there split does not hold."
      - file: tests/backends/conformance/conftest.py
        section: "vcr_cassette_dir; _CASSETTE_ID_ALIASES; _AZURE_REAL_FIXTURE_IDS"
        read_type: reference
        extract: "vcr_cassette_dir hardcodes CASSETTE_DIR_AZURE; per-backend dispatch has no graph fixture to dispatch to yet — deferred to GR-CORE"
      - file: tests/backends/fixtures/test_live_env.py
        section: "(full)"
        read_type: reference
        extract: "Fixture-infra unit-test style and placement under tests/backends/fixtures/ for the scrub security-gate test"
  - id: spike
    name: Streaming-replay spike
    steps:
      - file: tests/backends/fixtures/test_httpx_streaming_replay.py
        section: "test_httpx_stream_records_then_replays_offline"
        read_type: verify
        extract: "vcrpy 8.1.1 records AND replays httpx.AsyncClient.stream() with NO transport shim (unlike Azure aiohttp) — de-risks GR-012/GR-015"
  - id: verify
    name: Verify
    steps:
      - file: scripts/check_spec_marks.py
        section: "_ALLOWLIST_DESIGN"
        read_type: verify
        extract: "Removed stale TEST-007 allowlist entry once the scrub test cited it"
      - file: CHANGELOG.md
        section: "[Unreleased]"
        read_type: verify
        extract: "user.site audience (setup guide) -> one-line stub; infra.test scrub/streaming are CHANGELOG-exempt"
      - file: sdd/CLAUDE-REFERENCE.md
        section: "Ripple-check table / CHANGELOG entry"
        read_type: verify
        extract: "Stub form '- <ID>: <Title>', one line, no sections; release skill expands"
