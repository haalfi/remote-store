id: BK-218
title: "Reshape tests/test_depth_listing.py (conformance marker + per-backend lift) (BK-191 slice 3/6)"
trigger: "BK-191 audit (sdd/audits/audit-014) flagged tests/test_depth_listing.py as a TEST-003 violation at root and proposed disposition (b) move the file body into a new conformance/test_depth_listing.py + (a) lift three backend-specific snippets. Re-reading spec 037 showed DEPTH-001/DEPTH-002 are Store-level features ('No Backend ABC change'), not backend-conformance-shaped, and DEPTH-003's cross-protocol result invariant is already covered by conformance/test_listing.py::TestListFilesCompleteness. The diagnosed pain (three function-local concrete-cloud imports firing Rule B) is real; the audit's proposed fix needed reframing."
source_items:
  - BK-218
  - BK-191
audience:
  - infra.test
  - contributor.process
expected_ripples:
  - sdd/backlogid.json
surprising_ripples:
  - tests/backends/azure/test_config.py  # audit planned a new azure/test_depth_listing.py; the Azure depth coverage already lived here
phases:
  - id: orient
    name: Orient
    steps:
      - file: sdd/audits/audit-014-grandfathered-tests-allow-list.md
        section: "tests/test_depth_listing.py — disposition: (b) conformance reshape + (a) lift three backend-specific snippets"
        read_type: gate
        extract: "audit proposes moving the whole file body into a new conformance/test_depth_listing.py plus lifting the SFTP/S3/Azure snippets — but a dedicated conformance file would duplicate the depth coverage that already exists in conformance/test_listing.py, and DEPTH-001/002 are Store-level, not backend-conformance-shaped"
        outcome: misleading
      - file: sdd/specs/037-depth-limited-listing.md
        section: "DEPTH-001, DEPTH-002, DEPTH-003"
        read_type: gate
        extract: "DEPTH-001 (Store.list_files max_depth) and DEPTH-002 (Store.list_folders max_depth) are Store-level features — spec says 'Client-side filtering at the Store level' / 'No Backend ABC change'. DEPTH-003 is the Backend ABC max_depth contract; the result is identical whether a backend prunes natively or the Store filters client-side — a cross-protocol invariant."
      - file: CLAUDE.md
        section: "Audits"
        read_type: gate
        extract: "rule 3: an audit's authority is its diagnosis; its prescription is advisory. Re-evaluate audit-014's proposed (b)+(a) against the diagnosed pain — three concrete-cloud imports at root — and pick the cleanest path."
      - file: tests/backends/conformance/test_listing.py
        section: "TestListFilesCompleteness"
        read_type: reference
        extract: "already parametrizes list_files(recursive=True, max_depth=…) (depth 0-3 + unlimited) over the full fixture registry; carries @pytest.mark.spec('BE-014') but not DEPTH-003 — the conformance reshape the audit asked for is effectively already done, only the spec link is missing"
      - file: scripts/check_test_placement.py
        section: "Rule B + _BACKEND_AT_ROOT_GRANDFATHERED"
        read_type: gate
        extract: "only three function-local imports fire Rule B: from remote_store.backends._sftp / ._s3_base / ._azure. The top-level imports (_memory, _local) are allowed; everything else in the file is clean."
      - file: tests/backends/sftp/test_ping.py
        section: "module-level importorskip guard + helper pattern"
        read_type: reference
        extract: "BK-217 per-backend file pattern: module-level pytest.importorskip('<dep>') guard, function-local concrete-backend import inside the helper (allowed once the file is under tests/backends/<x>/)"
  - id: implement
    name: Implement
    steps:
      - file: tests/backends/sftp/test_depth_listing.py
        section: "TestSFTPBackendNativeDepth (full file)"
        read_type: gate
        extract: "moved verbatim with its @pytest.mark.spec('DEPTH-003') markers; the listdir_attr call-count assertions verify SFTP's recursive-traversal pruning — a backend-specific implementation detail, not the result-correctness invariant conformance owns; added module-level pytest.importorskip('paramiko')"
      - file: tests/backends/s3/test_depth_listing.py
        section: "test_s3_base_accepts_max_depth"
        read_type: gate
        extract: "moved verbatim; _s3_base.py imports cleanly without s3fs, so the inspect.signature check stays an unguarded Stage-1 test pinning the shared S3-family ABC signature"
      - file: tests/backends/azure/test_config.py
        section: "TestAzureIntegration.test_list_files_max_depth"
        read_type: gate
        extract: "pre-existing behavioural Azure depth test (BUG-155) subsumes the lifted Azure signature snippet — a list_files(max_depth=…) call cannot run if the kwarg is absent. Consolidated per the slice's 'don't duplicate' rule: stacked @pytest.mark.spec('DEPTH-003') onto it instead of creating a near-duplicate azure/test_depth_listing.py."
      - file: tests/backends/conformance/test_listing.py
        section: "TestListFilesCompleteness.test_list_files_recursive_max_depth / test_list_files_unlimited_depth"
        read_type: gate
        extract: "stacked @pytest.mark.spec('DEPTH-003') alongside the existing BE-014 marker (multi-marker is an established pattern, e.g. test_io.py:75-76) — records that the cross-protocol DEPTH-003 invariant is owned here; this is the audit's '(b) conformance reshape' expressed as consolidation, not file creation"
      - file: tests/test_depth_listing.py
        section: "deletions: TestSFTPBackendNativeDepth, TestS3AzureMaxDepthSignature; imports"
        read_type: gate
        extract: "root file keeps DEPTH-001 (TestListFilesMaxDepth), DEPTH-002 (TestListFoldersMaxDepth), and the in-process DEPTH-003 tests (TestMemoryBackendNativeDepth, TestLocalBackendNativeDepth, TestStoreForwardsMaxDepth) — all TEST-010-compliant top-level tests using allowed backends. test_memory_backend_max_depth_no_typeerror folded into TestMemoryBackendNativeDepth; unused stat/MagicMock imports removed; no banned-backend import remains."
      - file: scripts/check_test_placement.py
        section: "_BACKEND_AT_ROOT_GRANDFATHERED + comment block"
        read_type: gate
        extract: "removed 'test_depth_listing.py' entry; updated 'remaining four files' → 'remaining three files'; three migration-pending entries plus the permanently-justified test_examples.py remain"
      - file: sdd/audits/audit-014-grandfathered-tests-allow-list.md
        section: "tests/test_depth_listing.py findings + summary table"
        read_type: gate
        extract: "rewrote the section to record the shipped (a)-lift + (b)-as-consolidation disposition; appended a rule-3 note explaining why the 'move file body to a new conformance file' prescription was reframed; updated the summary-table row"
      - file: sdd/BACKLOG.md
        section: "BK-218 (Lint / CI Completeness)"
        read_type: gate
        extract: "added [~] BK-218 entry; moved to BACKLOG-DONE.md in the same commit"
  - id: verify
    name: Verify
    steps:
      - file: scripts/check_test_placement.py
        section: "stale-grandfather detection"
        read_type: verify
        extract: "hatch run lint reports zero Rule B violations and zero stale grandfather entries after removing test_depth_listing.py from the allow-list"
      - file: tests/backends/fixtures/test_registry.py
        section: "TestLayoutBoundary.test_conformance_does_not_reference_concrete_backends"
        read_type: verify
        extract: "passes — no concrete backend class name leaked into the conformance subtree by the DEPTH-003 marker addition"
      - file: tests/backends/conformance/test_listing.py
        section: "(collection)"
        read_type: verify
        extract: "depth tests collect with both BE-014 and DEPTH-003 spec ids; 232 passed across listing + placement-boundary + relocated files"
      - file: tests/test_depth_listing.py
        section: "(collection)"
        read_type: verify
        extract: "root file still collects: DEPTH-001/002 Store-level + memory/local native DEPTH-003 + store-forwarding; no banned-backend import remains"
      - file: tests/backends/sftp/test_depth_listing.py
        section: "(collection)"
        read_type: verify
        extract: "per-backend dirs green: hatch run pytest tests/backends/{sftp,s3,azure}/ → 275 passed / 40 skipped at Stage 1 (azure depth test skips behind @_needs_azurite)"
      - file: sdd/traces/_schema.yml
        section: "audience (derived CHANGELOG rule)"
        read_type: verify
        extract: "audience is infra.test + contributor.process — no user.* entry — so CHANGELOG is skipped per the schema's audience-derived rule; backlogid.json bumped via gen-backlogid after the BACKLOG-DONE move"
discovery_followups: []
