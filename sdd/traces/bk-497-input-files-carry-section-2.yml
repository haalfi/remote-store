id: BK-497
title: "The input files carry only research § 4, so per-entry findings in § 2 reach no session"
trigger: >-
  Filed during BK-494's review: each sdd/observe/inputs/OP-NN.md copies only its
  entry's § 4 note of research-operation-catalogue.md, while § 2 also holds
  findings for single entries. `/observe OP-01` runs next, so OP-01's input must
  be complete first.
source_items:
  - BK-497
audience:
  - contributor.process
  - library.maintainer
discovery_followups: []
surprising_ripples: []
co_shipped_items: []
decisions:
  - sdd/decisions/22fc130b-3097-5256-958c-78b435403004.jsonl
  - sdd/decisions/441df0b2-ba2a-4355-a676-6faaec0a37e5.jsonl
orient:
  - items: [BK-485]
    verdict: constrains
    evidence: >-
      BK-485's entry: "Not done: § 9 steps 5 (`/observe OP-01`) and 6", so OP-01's
      session is the next consumer. shared.md (ground) names OP-01's flow for
      Handle, Lifetime and State, the error layer ("The error layer RFC-0024 D5
      grows from OP-01's flow") and "a bound shared by every operation, OP-01's
      flow"; research § 3's last row says the shared decisions of note 7 other
      than `..` and async parity are "input to `read()`'s session and each later
      one". So Q4's shared rows, which are not per-entry, bear on what OP-01's
      input must hold to be complete.
phases:
  - id: orient
    name: Read the item, RFC-0027 P1, the research doc and the input files
    steps:
      - file: sdd/BACKLOG.md
        section: "BK-497, BK-485"
        read_type: gate
        extract: "Copy each entry's § 2 findings with source, before that entry's session"
        outcome: ok
      - file: sdd/rfcs/rfc-0027-observe-playground.md
        section: "(full)"
        read_type: gate
        extract: "P1: input file never ground, each section names its source; § 4 copied, research stays"
        outcome: ok
      - file: sdd/research/research-operation-catalogue.md
        section: "(full)"
        read_type: gate
        extract: "§ 2 names entries in Q1's closing line, Q2's bullets, Q3, Q4's Prefix scope row, notes 1 to 6"
        outcome: ok
      - file: sdd/observe/inputs/OP-01.md
        section: "(full); OP-05, OP-09, OP-16 alike"
        read_type: gate
        extract: "One § 4 section per file with a Source line; OP-05 adds maintainer decisions"
        outcome: ok
      - file: sdd/backlog/bk-493-operation-catalogue.md
        section: "(full)"
        read_type: reference
        extract: "Input files hold semantics the ground must not; OP-05 and OP-18 seeded from the dialog"
        outcome: ok
      - file: sdd/backlog/bk-485-spec-first-reset.md
        section: "(full)"
        read_type: reference
        extract: "Shared decisions' homes: key refusal to 052, profile to OP-18, timeouts to AX-5 and OP-01"
        outcome: ok
      - file: sdd/observe/shared.md
        section: "(full)"
        read_type: reference
        extract: "OP-01's flow fills Handle, Lifetime, State, the error layer and a shared timeout bound"
        outcome: ok
      - file: sdd/observe/catalogue.md
        section: "Not in v1"
        read_type: reference
        extract: "Q1 rows already disposed as Form of OP-NN; the session decides the form"
        outcome: ok
      - file: tests/scripts/test_observe_ground.py
        section: "inputs"
        read_type: reference
        extract: "Pins one input file per entry and admission; nothing pins a file's sections"
        outcome: ok
  - id: build
    name: Copy § 2's passages into the input files
    steps:
      - file: sdd/research/research-operation-catalogue.md
        section: "§ 2"
        read_type: gate
        extract: >-
          Passages copied by a one-off script that asserts each prose passage,
          each table row's cells and each excerpted Q1-closing clause is a
          substring of § 2 (whitespace collapsed) before inserting it; dropped
          cross-references: "(Q4)" in Q2's Inspect bullet, "in § 5's row 24" in
          Q1's health-check clause. The clause excerpts were spliced, which
          round 3 replaced with the whole sentence
        outcome: ok
  - id: review_fix
    name: Review-round fixes
    steps:
      - file: sdd/research/research-operation-catalogue.md
        section: "§ 1, § 2 Q3 and Q4, § 3"
        read_type: gate
        extract: >-
          The denominator paragraph was a paraphrase of § 1, now two § 1
          passages, one from its comparables paragraph and one from its
          evidence paragraph, each asserted
          verbatim by one-off scripts. Q3's OpenDAL-gates
          sentence also names rename, copy, recursive listing and conditions,
          so OP-05, OP-07, OP-12 and OP-13 gain it, OP-05 also the Declared
          row. Key validation and async parity stay out of OP-01: research
          § 3 gives `..` containment to spec 052 and async parity to 053,
          BK-485's dossier the key refusal to 052. Identity token stays with
          OP-09, which names the token. Round 3: Q1's closing sentence goes
          whole, relabelled "the draft's own entries", to OP-07, OP-18 and
          OP-24; by shared.md's Lands elsewhere rows (missing-key delete to
          OP-10, a streamed-write exception to OP-03), note 7 also goes to
          OP-03 and OP-10 and Q4's Retries row, which names deletes, to OP-10.
          Routing decided in the round-3 dialog
        outcome: ok
      - file: sdd/backlog/bk-497-input-files-section-2.md
        section: "(full)"
        read_type: gate
        extract: >-
          Round 4: the routing condition was refuted for the fourth round
          running (repeat-site check), so the round-4 dialog replaced it with
          one literal rule: Q1 rows by the catalogue's disposition, every other
          passage by the IDs and operation words it contains, Q4 rows and note
          7 also to OP-01. A one-off script regenerates every § 2 section from
          the rule, asserts each passage against the research doc, and writes
          the routing table to the dossier; the `..` sentence leaves OP-16 as
          spec 052's. This supersedes round 1's "Identity token stays with
          OP-09": the row now also reaches OP-01, OP-03 and OP-20
        outcome: ok
