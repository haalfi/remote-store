id: BK-220
title: "Reshape tests/test_seekable.py (conformance reshape + Azure per-backend lift) (BK-191 slice 4/6)"
trigger: "BK-191 audit (sdd/audits/audit-014) flagged tests/test_seekable.py as a TEST-003 violation at root and proposed disposition (b) conformance reshape for SEEK-001 capability declaration + (a) lift the _AzureRangeReader cluster. Re-reading the actual Rule B violations confirmed the audit's prescription was accurate: test_azure_does_not_declare and test_http_does_not_declare import _azure/_http directly; the six TestAzureRangeReader methods import _azure._AzureRangeReader. The string-form parametrize table at lines 64-68 does not fire Rule B (AST-invisible) but logically belongs in the same conformance reshape."
source_items:
  - BK-220
  - BK-191
audience:
  - infra.test
  - contributor.process
expected_ripples:
  - sdd/backlogid.json
surprising_ripples:
  - tests/scripts/test_check_test_placement.py  # test_grandfathered_files_skipped used test_seekable.py as the example grandfathered filename — removing it from the allow-list caused a unit-test failure; updated to use test_coverage_gaps.py instead
phases:
  - id: orient
    name: Orient
    steps:
      - file: sdd/audits/audit-014-grandfathered-tests-allow-list.md
        section: "tests/test_seekable.py — disposition: (b) conformance reshape (capability) + (a) per-backend split (Azure range reader)"
        read_type: gate
        extract: "audit proposes (b) move TestCapabilityDeclaration to conformance parametrized over registry, (a) move TestAzureRangeReader to tests/backends/azure/test_seekable.py — prescription accurate; re-derived disposition matches"
      - file: tests/test_seekable.py
        section: "(full)"
        read_type: gate
        extract: "Rule B violations: test_azure_does_not_declare (line 85, _azure), test_http_does_not_declare (line 91, _http), TestAzureRangeReader 6 methods (lines 321-388, _azure); string-form pytest.param at 64-68 is AST-invisible but part of SEEK-001 and logically moves to conformance; Store-API tests SEEK-002 to SEEK-012 use only allowed MemoryBackend and stay at root"
      - file: sdd/specs/036-seekable-read.md
        section: "SEEK-001, SEEK-006"
        read_type: gate
        extract: "SEEK-001: capability declaration is cross-protocol (local/memory/s3/s3_pyarrow/sftp declare, azure/http do not) — universal conformance-shaped invariant; SEEK-006: _AzureRangeReader one-Range-request-per-readinto is Azure-specific implementation detail"
      - file: scripts/check_test_placement.py
        section: "Rule B + _BACKEND_AT_ROOT_GRANDFATHERED"
        read_type: gate
        extract: "_ALLOWED_BACKEND_MODULES = {_memory, _local, _fileinfo}; Rule B walks AST for ImportFrom/Import nodes only — string constants in pytest.param are AST-invisible and do not fire Rule B"
      - file: tests/backends/conformance/test_identity.py
        section: "TestAtomicMoveCapability"
        read_type: reference
        extract: "pattern for capability declaration conformance test: use all_fixtures() deduped by backend family, check Capability in fixture.capabilities against _DECLARES/_DOES_NOT_DECLARE sets; no concrete backend class imports"
      - file: tests/backends/fixtures/backends.toml
        section: "(full)"
        read_type: reference
        extract: "all registered backend families: local, memory, s3, s3_pyarrow, sftp, azure, http, dafny, sqlblob — need SEEKABLE_READ classification for all"
      - file: src/remote_store/backends/_sqlalchemy.py
        section: "_ALL_CAPABILITIES, _QUERY_CAPABILITIES"
        read_type: reference
        extract: "sqlblob: set(Capability) - {LAZY_READ} → declares SEEKABLE_READ; sqlquery: {READ, LIST, METADATA, GLOB, SEEKABLE_READ} → declares SEEKABLE_READ (but sqlquery not in fixture registry)"
      - file: tests/backends/dafny/_helpers.py
        section: "_ORACLE_CAPABILITIES"
        read_type: reference
        extract: "dafny: set(Capability) - {GLOB, LAZY_READ} → declares SEEKABLE_READ"
  - id: implement
    name: Implement
    steps:
      - file: tests/backends/azure/test_seekable.py
        section: "TestAzureRangeReader (full file)"
        read_type: gate
        extract: "new per-backend file; TestAzureRangeReader 6 tests + _FakeBlobClient + _FakeDownloader helpers moved verbatim from root test_seekable.py; all @pytest.mark.spec('SEEK-006') markers preserved"
      - file: tests/backends/conformance/test_identity.py
        section: "_seekable_canonical_fixtures + TestSeekableCapability"
        read_type: gate
        extract: "added _seekable_canonical_fixtures() (same dedup pattern as _atomic_move_canonical_fixtures) and TestSeekableCapability class with _DECLARES={'local','memory','s3','s3_pyarrow','sftp','sqlblob','dafny'} and _DOES_NOT_DECLARE={'azure','http'}; @pytest.mark.spec('SEEK-001') on the parametrized test; no concrete backend class imports"
      - file: tests/test_seekable.py
        section: "TestCapabilityDeclaration removal + TestAzureRangeReader removal + docstring update"
        read_type: gate
        extract: "removed TestCapabilityDeclaration (all 4 methods), TestAzureRangeReader, _FakeBlobClient, _FakeDownloader; removed unused Capability import; updated module docstring to point at conformance and per-backend homes for SEEK-001 and SEEK-006; Store-API tests SEEK-002 through SEEK-012 remain"
      - file: scripts/check_test_placement.py
        section: "_BACKEND_AT_ROOT_GRANDFATHERED + comment block"
        read_type: gate
        extract: "removed 'test_seekable.py' entry; updated 'remaining three files' → 'remaining two files'; two migration-pending entries (test_coverage_gaps, test_pbt_write_result) plus permanently-justified test_examples.py remain"
      - file: sdd/audits/audit-014-grandfathered-tests-allow-list.md
        section: "tests/test_seekable.py findings + summary table"
        read_type: gate
        extract: "appended BK-220 shipping note to per-file section; updated summary-table row disposition to '(b) + (a) Azure cluster — shipped BK-220, see § per-file findings'"
      - file: sdd/BACKLOG.md
        section: "BK-220 (Lint / CI Completeness)"
        read_type: gate
        extract: "BK-220 reserved as a transient [~] entry per the slice process, then moved to BACKLOG-DONE.md within the same commit"
  - id: verify
    name: Verify
    steps:
      - file: scripts/check_test_placement.py
        section: "stale-grandfather detection"
        read_type: verify
        extract: "hatch run lint reports zero Rule B violations and zero stale grandfather entries after removing test_seekable.py from the allow-list"
      - file: tests/backends/fixtures/test_registry.py
        section: "TestLayoutBoundary.test_conformance_does_not_reference_concrete_backends"
        read_type: verify
        extract: "passes — no concrete backend class name leaked into the conformance subtree by the TestSeekableCapability addition"
      - file: tests/backends/conformance/test_identity.py
        section: "TestSeekableCapability (collection)"
        read_type: verify
        extract: "SEEK-001 tests collect and pass for all registered backend families"
      - file: tests/test_seekable.py
        section: "(collection)"
        read_type: verify
        extract: "root file still collects: SEEK-002 through SEEK-012 (excluding SEEK-006) using MemoryBackend; no banned-backend import remains"
      - file: tests/backends/azure/test_seekable.py
        section: "(collection)"
        read_type: verify
        extract: "per-backend Azure file collects and passes: 6 tests in TestAzureRangeReader, all @pytest.mark.spec('SEEK-006')"
      - file: tests/scripts/test_check_test_placement.py
        section: "TestBackendImportsAtRoot.test_grandfathered_files_skipped"
        read_type: verify
        extract: "updated example filename from test_seekable.py to test_coverage_gaps.py; 53 placement unit tests pass"
discovery_followups: []
co_shipped_items: []
