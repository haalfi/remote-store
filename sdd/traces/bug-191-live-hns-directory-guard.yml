        read_type: gate
        extract: "Run it: mocked tests verify logic but not real-account behaviour"
      - file: sdd/specs/003-backend-adapter-contract.md
        section: "BE-021, BE-008, BE-010"
        read_type: gate
        extract: "InvalidPath on directory-path for write/write_atomic; postconditions"
      - file: sdd/specs/007-atomic-writes.md
