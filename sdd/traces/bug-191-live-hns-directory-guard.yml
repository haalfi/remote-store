        read_type: gate
        extract: "Atomic write precondition: path must not name an existing directory"

  - id: tests
    name: Tests (live integration)
    steps:
      - file: sdd/TESTING.md
        section: "Test Subpackage Placement"
        read_type: gate
        extract: "Placement: tests/backends/test_azure_live_hns.py::TestAzureLiveHnsDirectoryGuard"
