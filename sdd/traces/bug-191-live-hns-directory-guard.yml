        read_type: gate
        extract: "@pytest.mark.spec(BE-021/BE-008/BE-010/SAW-001)"

  - id: docs
    name: Docs
    steps:
      - file: sdd/DOCUMENTATION.md
        section: "PR documentation review checklist"
        read_type: reference
        extract: "Confirm azure-hns-setup.md guide updated to describe new gating layer"

  - id: verify
    name: Verify
    steps:
      - file: sdd/CLAUDE-REFERENCE.md
        section: "Ripple-check table / A bug fix"
