id: BUG-264
title: "A mapped Azure error can still reach the caller with an empty message"
trigger: >-
  BK-359 fixed the SFTP BackendUnavailable arms and left the same construction
  standing on Azure: classify_azure_error returned BackendUnavailable(str(exc))
  for the ServiceRequestError | ServiceResponseError arm, so an argument-less
  driver exception rendered as " | path='delivery.csv' | backend='azure'" —
  character for character the SFTP defect, reached from 13 call sites.
source_items:
  - BUG-264
  - BK-359
audience:
  - user.api
expected_ripples:
  # sdd/backlogid.json is deliberately absent: the split retired BUG-264 into
  # BACKLOG-DONE and minted BUG-276, and `hatch run gen-backlogid` left the file
  # byte-identical because it records the DONE-max per prefix (BUG=268) and 264
  # is below it. Listing it because the ripple-check row names it would report a
  # touch that `git diff` refutes.
  - CHANGELOG.md
  - sdd/BACKLOG.md
  - sdd/BACKLOG-DONE.md
review_rounds: 0
phases:
  - id: orient
    name: Orient
    steps:
      - file: sdd/BACKLOG.md
        section: "(item) BUG-264"
        read_type: gate
        extract: >-
          The measured Azure reproduction, the four aiohttp wrap sites, the 13
          call sites, and the Disposition naming SFTP's _unavailable as the
          shape to copy
        outcome: ok
      - file: sdd/BACKLOG.md
        section: "1. Failures are predictable"
        read_type: gate
        extract: >-
          The Promise's third clause — the failure a caller catches says which
          failure it was — and the Closes-when sentence naming BUG-264, which
          has to move to the remainder item when the Azure half closes
        outcome: ok
      - file: sdd/BACKLOG.md
        section: "How this file works (Completing work, Item authority)"
        read_type: gate
        extract: >-
          The partially-done split: done half to BACKLOG-DONE under its original
          ID, new ID here for the remainder, both linked — and that an item's
          prescription is advisory and presumed stale, which is what licensed
          re-measuring the reproduction rather than repeating it
        outcome: ok
      - file: sdd/specs/005-error-model.md
        section: "ERR-009"
        read_type: reference
        extract: >-
          "str() and repr() produce meaningful messages" — the general clause
          this defect breaches. Needed no amendment; the clause was already right
          and the Azure mapping was wrong
        outcome: ok
      - file: sdd/CLAUDE-REFERENCE.md
        section: "Ripple-check / Pre-work index"
        read_type: gate
        extract: >-
          Triggered rows: Error type (error model, every backend's mapping and
          tests, troubleshooting guide), Bug fix, Backlog item touched, CHANGELOG
          entry, New test file, Spec section
        outcome: ok
  - id: reproduce
    name: Reproduce
    steps:
      - file: src/remote_store/backends/_azure_common.py
        section: "classify_azure_error"
        read_type: gate
        extract: >-
          Drove the reproduction rather than reading it: a genuine TimeoutError
          from asyncio.timeout(0.001) around a sleep carries args=() and
          str()=='', ServiceResponseTimeoutError(err, error=err) and
          ServiceRequestTimeoutError(err, error=err) both give message='', and
          the arm returns BackendUnavailable rendering
          " | path='delivery.csv' | backend='azure'"
        outcome: ok
      - file: sdd/BACKLOG.md
        section: "(item) BUG-264 — end-to-end reproduction claim"
        read_type: verify
        extract: >-
          The item's "only the async timeout is an end-to-end reproduction" did
          not hold. azure-core's aiohttp transport builds its own
          ClientTimeout(sock_connect=, sock_read=) per request, overriding a
          session total, so aiohttp answers ServerTimeoutError with text.
          Driving AsyncAzureBackend.check_health() at a loopback socket returned
          a non-empty message for every shape the backend's own options can
          produce. The blank shape is a bare TimeoutError, which aiohttp raises
          for ClientTimeout(total=) — reachable for a caller supplying their own
          transport, not through the backend. Item body corrected in the same
          commit
        outcome: misleading
      - file: src/remote_store/_errors.py
        section: "_classify_by_message"
        read_type: reference
        extract: >-
          Enumerated the whole class rather than trusting the item's scope:
          rg -n 'BackendUnavailable\(' src/ returns five BackendUnavailable(str(exc))
          sites. Two are keyword-guarded (endpoint/connect/timeout/dns/
          name or service), which "" cannot satisfy, and the two boto arms are
          fed by classes that always format — str(ClientError({}, "GetObject"))
          and str(BotoCoreError()) both run non-empty. So this arm was the last
          reachable one
        outcome: ok
      - file: src/remote_store/backends/_sftp.py
        section: "_unavailable"
        read_type: reference
        extract: >-
          The rule to copy: synthesise only when str(exc) is empty, so a driver
          that explained itself reaches the caller intact. Not copied: the
          WARNING record, which would put a per-poll line under ping() and pull
          two guides into a bug fix
        outcome: ok
  - id: tests
    name: Failing tests first
    steps:
      - file: sdd/000-process.md
        section: "Rule 6 (bug-fix pipeline)"
        read_type: gate
        extract: "BACKLOG → CHANGELOG → failing test → fix, in one commit"
        outcome: ok
      - file: tests/backends/azure/aio/test_config.py
        section: "TestAsyncAzureErrorMapping"
        read_type: reference
        extract: >-
          The existing home of classify_azure_error unit tests. Added the blank
          shape and its do-not-overwrite counterpart; observed failing first
        outcome: ok
      - file: tests/backends/azure/test_config.py
        section: "TestAzureErrorMapping"
        read_type: reference
        extract: >-
          The sync twin's home, asserted through AzureBackend._classify. The
          sync side is exposed identically and has no end-to-end reproduction,
          so it is pinned at the classifier
        outcome: ok
  - id: implement
    name: Implement
    steps:
      - file: src/remote_store/backends/_azure_common.py
        section: "_unavailable, classify_azure_error"
        read_type: reference
        extract: >-
          One module-level helper for the arm, shared by both twins because the
          classifier already is. The two branches are the two base classes the
          arm tests, and the exception class name is the payload a reader greps
        outcome: ok
  - id: docs
    name: Specs
    steps:
      - file: sdd/specs/012-azure-backend.md
        section: "AZ-025"
        read_type: reference
        extract: >-
          The mapping table's ServiceRequestError/ServiceResponseError row gains
          the message guarantee as a Postcondition, rather than a new spec ID:
          it is the same invariant acquiring a clause
        outcome: ok
      - file: sdd/specs/029-async-store-backend-api.md
        section: "ASYNC-079"
        read_type: verify
        extract: >-
          Its See-also cited "AZ-013 through AZ-016", which are is_file(),
          atomic write and the two delete_folder clauses — not the error
          mapping. A reader arriving from the async twin landed on the wrong
          sections and would have missed the clause this PR adds. Corrected
        outcome: misleading
  - id: verify
    name: Verify
    steps:
      - file: sdd/CLAUDE-REFERENCE.md
        section: "Ripple-check / Detailed checklist"
        read_type: verify
        extract: "Error type, Bug fix, Backlog item touched, CHANGELOG entry, New test file rows"
        outcome: ok
      - file: docs-src/guides/troubleshooting.md
        section: "Azure: HNS vs flat namespace"
        read_type: verify
        extract: >-
          Checked rather than changed: the guide's only Azure section is about
          HNS mode, and no published page shows an Azure blank-message
          traceback, so the Error-type row's troubleshooting ripple is met by
          reading it
        outcome: ok
