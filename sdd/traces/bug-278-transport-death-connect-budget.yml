id: BUG-278
title: "A transport that dies mid-operation pays the connect budget up to three times over when the reconnect meets a host that is gone"
trigger: >-
  BUG-274 widened six re-entry guards to _probe_is_futile and scoped its
  guarantee to an operation whose first _sftp evaluation fails. Its round-2
  measuring reviewer drove a transport death between write_atomic's temp close
  and the promote instead, and the rename ladder's guards — still asking
  _is_connection_dead alone — declined the connect-time shape the reconnect
  raised, so the ladder re-entered _sftp at each rung: three _connect entries,
  12.01 s at shipped defaults. Filed rather than fixed there because it needed a
  live-then-dead fixture the suite did not have. Taken up as the one item the
  user chose to close before the 0.31.0 release.
source_items:
  - BUG-278
  - BUG-274
audience:
  - user.api
expected_ripples:
  - CHANGELOG.md
  - sdd/BACKLOG.md
  - sdd/BACKLOG-DONE.md
  # gen_backlogid takes the max per prefix from BACKLOG-DONE.md, and 278 is
  # above the stored 277, so the register move raises the BUG floor by one.
  - sdd/backlogid.json
  - sdd/specs/009-sftp-backend.md
  - src/remote_store/backends/_sftp.py
  - tests/backends/sftp/test_config.py
surprising_ripples:
  # Two docstrings that partition the seventeen guard sites — _probe_is_futile's
  # "six of the seventeen" and _is_unreachable's "**Six** of those guards" — sit
  # 800 lines from the sites this change widens, and the Bug-fix row reaches
  # the test and the spec, not the prose that counts the sites. Found by
  # re-running the reference walk the docstring names, not by reading the diff.
  - src/remote_store/backends/_sftp.py
  # The sibling test class's docstring asserted, in the present tense, that the
  # fault "still costs up to three budgets; that is BUG-278". A test docstring
  # is a register entry nobody sweeps; the `rg BUG-278` sweep the backlog's
  # completing-work rule prescribes is what found it.
  - tests/backends/sftp/test_config.py
# Derived from `git log --oneline origin/master..HEAD` minus the implementing
# commit, re-run before each push. One commit on the branch at authoring time,
# and it implements; value is 0 until a review round lands a fix.
review_rounds: 0
phases:
  - id: orient
    name: Orient
    steps:
      - file: sdd/BACKLOG.md
        section: "(item) BUG-278"
        read_type: gate
        extract: >-
          The mechanism (_sftp re-reads is_active() on every access), the
          three-row measurement with declining frames, the five sites with
          move's named as the one an implementer misses, and the two
          instructions that shaped the work: write the failing test first, and
          assert the budget on both overwrite paths
        outcome: ok
      - file: sdd/BACKLOG-DONE.md
        section: "(item) BUG-274"
        read_type: reference
        extract: >-
          The predecessor's shape to copy — a third predicate, not a widening;
          latent sites widened anyway; a second behaviour change (type, not
          cost) recorded rather than filed — and the SFTP-031 ID it minted,
          which is where this item's clause belongs rather than the SFTP-023
          the item was filed under
        outcome: ok
      - file: sdd/traces/bug-274-unreachable-host-connect-budget.yml
        section: "discovery_followups, fix_round_2, fix_round_3"
        read_type: reference
        extract: >-
          Where the item came from, and that its fifth site was found by a
          reviewer refuting the item's own four-site prescription — so the
          item's disposition was to be re-derived, not trusted
        outcome: ok
      - file: sdd/CLAUDE-REFERENCE.md
        section: "Ripple-check / Pre-work index"
        read_type: gate
        extract: >-
          Triggered rows: Bug fix, Backlog item touched, CHANGELOG entry, Spec
          section. Breaking change checked and does not trigger: the one type
          change (_is_absent's cell) moves a base RemoteStoreError to its
          subclass BackendUnavailable, so no except clause stops catching
        outcome: ok
      - file: sdd/traces/_schema.yml
        section: "(full)"
        read_type: gate
        extract: "Trace shape, the review_rounds derivation clause, audience enum"
        outcome: ok
  - id: reproduce
    name: Reproduce by measurement
    steps:
      - file: src/remote_store/backends/_sftp.py
        section: "_sftp, _promote, _displace, _is_absent, _move_fallback, move, write_atomic"
        read_type: gate
        extract: >-
          Walked the ladder by hand to predict which access reconnects after
          each death point, then measured instead of trusting the walk: a fake
          client whose is_active() flips at a chosen round-trip, _connect
          wrapped in a counter, retry disabled. The item's three rows
          reproduced at 3/3/3; four cells the item did not have added to reach
          _displace, _is_absent and _move_fallback by name (2/1/2) and the
          overwrite=False atomic write (2). The _is_absent cell came out at one
          entry on the pre-fix module — a type defect (base RemoteStoreError
          "[Errno None] Failure") rather than a budget one, which the item had
          not distinguished
        outcome: ok
      - file: tests/backends/sftp/test_config.py
        section: "TestSFTPProbeReconnectsIntoGoneHost"
        read_type: reference
        extract: >-
          The fixture shape to extend — a live-looking SSH/Transport/Client
          triple whose alive flag flips inside a chosen call — and the
          reasoning for asserting the guard frame per cell rather than only
          the outcome
        outcome: ok
      - file: sdd/BACKLOG-DONE.md
        section: "(item) BUG-274, wall-clock table"
        read_type: reference
        extract: >-
          How the predecessor timed shipped defaults — one machine, both
          revisions, first call discarded — copied rather than approximated.
          The first attempt warmed up with check_health on the live fake,
          which never connects, and the first timed row carried the 0.10 s
          the warm-up was meant to absorb; corrected to warm up on a real
          reconnect. The item's three rows: 12.01 s each before, 4.00 s each
          after, at the fix and at the stashed pre-fix module
        outcome: ok
  - id: tests
    name: Failing test first
    steps:
      - file: sdd/000-process.md
        section: "Rule 6 (bug-fix pipeline)"
        read_type: gate
        extract: "BACKLOG → CHANGELOG → failing test → fix, in one commit"
        outcome: ok
      - file: tests/backends/sftp/test_config.py
        section: "TestSFTPTransportDeathCostsOneConnect (new)"
        read_type: reference
        extract: >-
          Seven cells, each naming its guard. Run against the pre-fix module
          with the fix stashed: 7 failed — six on the entry count (3, 2, 3, 3,
          2, 2) and the _is_absent cell on the type, raising the base
          RemoteStoreError through pytest.raises(BackendUnavailable). With the
          fix: 7 passed, and the two sibling classes' 86 cells unchanged
        outcome: ok
  - id: implement
    name: Implement
    steps:
      - file: src/remote_store/backends/_sftp.py
        section: "move, _promote, _displace, _is_absent, _move_fallback (guards)"
        read_type: reference
        extract: >-
          _is_connection_dead → _probe_is_futile at the five sites, each with a
          comment naming which access reconnects there. Nothing else in the
          ladder changed
        outcome: ok
      - file: src/remote_store/backends/_sftp.py
        section: "_probe_is_futile, _is_unreachable (docstrings)"
        read_type: verify
        extract: >-
          Both carried the six/eleven partition. Re-ran the reference walk the
          docstring names (AST over attribute references, kept by owning
          function, excluding _probe_is_futile and _map_exception): 17 sites,
          11 wide, 6 narrow. The six that stay narrow are enumerated with the
          reason none can pay a budget — five cleanup guards gated on
          _sftp_client is None, which a failed reconnect has already set, plus
          the is_fatal handoff
        outcome: ok
      - file: sdd/specs/009-sftp-backend.md
        section: "SFTP-031"
        read_type: gate
        extract: >-
          The clause's "load-bearing subject" paragraph said the mid-operation
          fault is not covered and tracked as BUG-278, in the present tense.
          Rewritten as the invariant's second subject with the per-site
          measurement and the _is_absent type change; the item's spec field
          named SFTP-023, which owns the mapping, so the test carries SFTP-031
          on BUG-274's reasoning that pays and gets are different IDs
        outcome: ok
  - id: verify
    name: Verify
    steps:
      - file: sdd/BACKLOG.md
        section: "How this file works / Completing work"
        read_type: verify
        extract: >-
          Ran `rg -n 'BUG-278' -- sdd .claude scripts docs-src tests *.md` and
          read every hit: two present-tense claims fixed (SFTP-031's "tracked
          as", the sibling test class docstring's "still costs"); the
          BACKLOG-DONE BUG-274 entry, the ID-collision note in BACKLOG.md and
          the two traces are past-tense narration and stand
        outcome: ok
      - file: sdd/CLAUDE-REFERENCE.md
        section: "Ripple-check / Detailed checklist"
        read_type: verify
        extract: "Bug fix, Backlog item touched, CHANGELOG entry, Spec section rows"
        outcome: ok
