id: BK-261
title: "Graph small-write overwrite=True: replace-returns-409-for-files quirk"
trigger: >
  ID-127 GR-WRITE review (PR #761, F4) flagged that on the small PUT /content
  replace path, conflictBehavior=replace can still 409 nameAlreadyExists for a
  *file* on SharePoint-backed drives, which the BE-008 409 discrimination maps to
  AlreadyExists — a spurious failure for an intended overwrite. GR-018 carried a
  "no guard in v1, tracked in BK-261" deferral. Picking the item up: the guard
  disposition needs a live SharePoint-backed reproduction to confirm the exact
  409 body, but this project's live tier is consumer-only / device-code and
  cannot reach a SharePoint-backed drive, so the guard stays blocked.
source_items:
  - BK-261
audience:
  - user.api
  - library.maintainer
phases:
  - id: orient
    name: Orient
    steps:
      - file: sdd/BACKLOG.md
        section: "BK-261"
        read_type: gate
        extract: "Two dispositions when picked up: targeted replace-path guard OR document as a hard backend limitation; guard needs blocked SharePoint live testing"
        outcome: ok
      - file: sdd/specs/044-graph-backend.md
        section: "GR-018 (Known limitation — overwrite=True on a file conflict)"
        read_type: gate
        extract: "The v1 deferral note: replace-path 409 surfaces as AlreadyExists; not reproduced on consumer OneDrive; tracked in BK-261"
        outcome: ok
      - file: src/remote_store/aio/backends/_graph/backend.py
        section: "_write_small (409 branch)"
        read_type: gate
        extract: "409 routes through discriminate_write_conflict; replace path passes conflictBehavior=replace, so a plain-file 409 is the anomaly the guard would target"
        outcome: ok
      - file: src/remote_store/aio/backends/_graph/http.py
        section: "discriminate_write_conflict"
        read_type: reference
        extract: "Folder-target / file-ancestor -> InvalidPath; else AlreadyExists. A guard would have to recognise the SharePoint plain-file 409 body, which is unverifiable here"
        outcome: ok
  - id: design
    name: Choose disposition
    steps:
      - file: docs-src/guides/backends/graph.md
        section: "SharePoint-backed drives are less exercised"
        read_type: reference
        extract: "Backend already documents consumer-only live tier and SharePoint divergences; the overwrite quirk is the same family — document, do not speculate"
        outcome: ok
      - file: CLAUDE.md
        section: "Principles 5 + 6 (specs are source of truth; run it, don't just type-check)"
        read_type: reference
        extract: "Reproduction is the prerequisite for the guard and it is blocked; per 'don't guess blind', settle the documentation disposition rather than ship an unreproduced guard"
        outcome: ok
  - id: implement
    name: Settle as a hard limitation
    steps:
      - file: sdd/specs/044-graph-backend.md
        section: "GR-018, GR-027"
        read_type: gate
        extract: "Promote GR-018's deferral to a settled hard-limitation statement with the delete-then-write workaround; repoint the GR-027 parentReference cross-ref off the BK-261 anchor"
        outcome: ok
      - file: docs-src/guides/backends/graph.md
        section: "overwrite=True may still fail on SharePoint-backed drives"
        read_type: gate
        extract: "User-facing caveat, prose-only (no tracker IDs per check_no_tracker_refs): replace may surface AlreadyExists on SharePoint-backed drives; delete-then-write workaround"
        outcome: ok
      - file: CHANGELOG.md
        section: "[Unreleased]"
        read_type: gate
        extract: "user.api audience -> CHANGELOG entry required; one line recording the documented limitation"
        outcome: ok
  - id: verify
    name: Verify gates
    steps:
      - file: sdd/CLAUDE-REFERENCE.md
        section: "Ripple-check table / backlog completion"
        read_type: verify
        extract: "BK-261 moved to BACKLOG-DONE same commit; gen-backlogid a no-op (ledger max already past 261); check_no_tracker_refs clean (guide note carries no tracker ID); lint clean"
        outcome: ok
