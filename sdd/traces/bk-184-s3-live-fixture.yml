id: BK-184
title: "s3_live Stage 3 conformance fixture"
trigger: "Live S3 conformance coverage gap after BK-180 shipped Azure live fixtures but carved out S3 (no prefix support requiring deliberate bucket-isolation strategy)"
source_items:
  - BK-184
  - BK-180
phases:
  - id: orient
    name: Orient
    steps:
      - file: CLAUDE.md
        section: "Principles"
        read_type: gate
        extract: "Project-wide working rules"
      - file: sdd/CLAUDE-REFERENCE.md
        section: "Ripple-check table / A new test file"
        read_type: gate
        extract: "os_sensitive mark obligation; ask whether code touches OS-specific paths"

  - id: spec
    name: Spec reference
    steps:
      - file: sdd/specs/048-testing-architecture.md
        section: "TEST-010"
        read_type: gate
        extract: "Stage 3 fixture layout and kind=real-live requirements"
      - file: sdd/adrs/0028-testing-architecture-kind-stage-replay.md
        section: "(full)"
        read_type: reference
        extract: "Kind × stage axes; per-call isolation strategy decision"

  - id: reference_existing
    name: Reference existing shape
    steps:
      - file: tests/backends/fixtures/azure_live.py
        section: "(full)"
        read_type: reference
        extract: "azure_live.py per-call provisioning shape to mirror"
      - file: tests/backends/fixtures/fixtures.toml
        section: "(full)"
        read_type: reference
        extract: "Fixture registration format"
      - file: tests/backends/fixtures/_live_env.py
        section: "(full)"
        read_type: reference
        extract: "require_live_credentials helper signature to reuse"

  - id: implement
    name: Implement
    steps:
      - file: sdd/TESTING.md
        section: "Test Subpackage Placement"
        read_type: gate
        extract: "Placement for s3_live.py under tests/backends/fixtures/"
      - file: sdd/TESTING.md
        section: "Rules"
        read_type: gate
        extract: "Rules 4 (spec= on MagicMock), 6 (prefer real deps)"
      - file: sdd/000-process.md
        section: "Test traceability"
        read_type: gate
        extract: "@pytest.mark.spec(TEST-010) on layout-pinning tests"
      - file: sdd/DESIGN.md
        section: "1–4"
        read_type: reference
        extract: "Formatting, types, docstrings for fixture code"

  - id: verify
    name: Verify
    steps:
      - file: sdd/CLAUDE-REFERENCE.md
        section: "Ripple-check table / A new test file"
        read_type: verify
        extract: "Confirm os_sensitive mark decision documented"
      - file: CHANGELOG.md
        section: "[Unreleased]"
        read_type: verify
        extract: "Add one-line stub"
