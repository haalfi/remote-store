# yaml-language-server: $schema=_schema.yml
id: BK-294
title: "Retry Graph overwrite=True 409-under-replace (create-race) as transient"
trigger: >-
  BK-288 documented two situations where overwrite=True still surfaces
  AlreadyExists: a SharePoint-backed replace-rejection (unreproducible on this
  project's consumer-only live tier, settled as a hard limitation by BK-261) and
  a live-reproduced concurrent-create race for the same new key (the loser gets
  AlreadyExists despite the create-or-replace contract). BK-294 evaluates whether
  the create-race 409 can be retried so overwrite=True actually wins, without
  reversing BK-261's "don't paper over the conflict" stance.
source_items:
  - BK-294
  - BK-288
  - BK-261
audience:
  - user.api
  - user.api_docs
  - library.maintainer
expected_ripples:
  - CHANGELOG.md
  - sdd/BACKLOG.md
  - sdd/BACKLOG-DONE.md
  - docs-src/_data/graph/graph.json
  - docs-src/explanation/graph_viz.html
review_rounds: 2
surprising_ripples:
  # The public-API write() docstring change rippled to graph.json + the derived
  # graph_viz.html; not caught until the full `hatch run all` gate (the lighter
  # lint gate does not run gen-graph --check). Adding the constant block above
  # GraphBackend shifted its line number, regenerating graph.json a second time.
  - docs-src/_data/graph/graph.json
  - docs-src/explanation/graph_viz.html
phases:
  - id: orient
    name: Orient
    steps:
      - file: sdd/BACKLOG.md
        section: "BK-294"
        read_type: gate
        extract: >-
          The tension to resolve first: must not reverse BK-261's don't-swallow
          stance, must distinguish the create-race 409 from a SharePoint
          replace-409, needs live-Graph verification on both tiers before
          shipping. Disposition open between retry and document-only.
        outcome: ok
      - file: sdd/traces/bk-261-graph-overwrite-409-limitation.yml
        section: "(full)"
        read_type: reference
        extract: >-
          BK-261 rejected a *guard* that would treat a file-faceted replace-409
          as success-equivalent — it had to guess the unverifiable SharePoint
          body shape. A retry is a different mechanism: it re-issues the actual
          replace, so it needs no body classification and degrades to
          AlreadyExists if the conflict is terminal.
        outcome: ok
      - file: docs-src/guides/backends/graph.md
        section: "overwrite=True can still raise AlreadyExists"
        read_type: reference
        extract: >-
          BK-288 split the caveat into the SharePoint case and the
          live-reproduced consumer-OneDrive create race. Only the create race is
          reproducible here, and it is the one a retry can fix.
        outcome: ok
  - id: design
    name: Choose disposition
    steps:
      - file: src/remote_store/aio/backends/_graph/backend.py
        section: "write / _write_small (409 branch)"
        read_type: gate
        extract: >-
          The small PUT body is in-memory bytes (replayable) and the spooled
          reader is seekable, so a bounded re-attempt of the same write is cheap
          and safe. The 409 discriminator returns AlreadyExists only for the
          plain-target-file case; folder/ancestor 409s return InvalidPath and so
          are naturally excluded from the retry.
        outcome: ok
      - file: src/remote_store/aio/backends/_graph/http.py
        section: "discriminate_write_conflict; graph_send return_on/terminal"
        read_type: reference
        extract: >-
          409 is terminal in graph_send (return_on), discriminated in the
          backend. The retry must live in the backend write path, catch only
          AlreadyExists, and be gated on overwrite=True so the overwrite=False
          create-once-race single-winner outcome (GR-059) is preserved.
        outcome: ok
      - file: tests/backends/graph/aio/test_write.py
        section: "TestConflictDiscrimination"
        read_type: reference
        extract: >-
          Existing overwrite=True tests assert the file-ancestor InvalidPath
          (caught before any retry) and the replace->200 happy path; none assert
          a single replace-409 -> AlreadyExists, so adding the create-race retry
          does not contradict a locked contract.
        outcome: ok
  - id: implement
    name: Implement the bounded retry
    steps:
      - file: src/remote_store/aio/backends/_graph/backend.py
        section: "_write_replacing / _write_dispatch"
        read_type: gate
        extract: >-
          Bounded re-attempt loop around the small/session dispatch, gated on
          overwrite=True, catching only AlreadyExists, rewinding the seekable
          reader between attempts. Mirrors graph_send's last-error loop shape.
      - file: sdd/specs/044-graph-backend.md
        section: "GR-018 (Known limitation) / GR-032"
        read_type: gate
        extract: >-
          Narrow the GR-018 hard-limitation note to the SharePoint replace-409
          only; record the new create-race retry (bounded, overwrite=True only,
          surfaces AlreadyExists once the budget is spent — does not swallow).
      - file: docs-src/guides/backends/graph.md
        section: "overwrite=True can still raise AlreadyExists"
        read_type: gate
        extract: >-
          The concurrent-create case is now handled by a bounded retry; the
          SharePoint replace-rejection remains documented with delete-then-write.
          Prose-only, no tracker IDs (check_no_tracker_refs).
      - file: tests/backends/graph/aio/test_concurrency.py
        section: "TestOverwriteReplaceRetry (new) + live probe"
        read_type: gate
        extract: >-
          respx unit proof of the mechanism (409-then-200 under overwrite=True ->
          success; persistent 409 -> AlreadyExists; overwrite=False NOT retried);
          a Tier-3 live create-race probe under overwrite=True.
      - file: CHANGELOG.md
        section: "[Unreleased]"
        read_type: gate
        extract: "user.api -> CHANGELOG stub line recording the create-race retry."
  - id: reproduce
    name: Live-verify against consumer OneDrive
    steps:
      - file: tests/backends/graph/aio/test_concurrency.py
        section: "test_live_overwrite_create_race_all_succeed (RS_TEST_LIVE_GRAPH=1)"
        read_type: gate
        extract: >-
          First cut used immediate retries with a 3-attempt bound. The live 8-way
          race FAILED 7/8 — one straggler kept 409-ing in lockstep because the
          retriers re-issued in sync and the winner's create had not settled. The
          "winner has committed by the time the 409 returns" assumption was too
          optimistic under real contention.
        outcome: misleading
      - file: src/remote_store/aio/backends/_graph/backend.py
        section: "_write_replacing (backoff)"
        read_type: gate
        extract: >-
          Fix: full-jitter exponential backoff between attempts (desynchronises
          concurrent retriers) + raise the bound to 6. Re-verified 8/8 and 12/12
          across repeated live rounds, content intact. The bound/backoff are now
          live-tuned, not guessed.
        outcome: ok
  - id: verify
    name: Verify gates
    steps:
      - file: sdd/CLAUDE-REFERENCE.md
        section: "Ripple-check table / backends + errors"
        read_type: verify
        extract: >-
          Write-path behaviour change ripples to spec 044 (GR-018/GR-032),
          docstring Raises, the graph guide, and CHANGELOG. Live consumer-OneDrive
          verification passed after the backoff fix, so the item closes [x] and
          moves to BACKLOG-DONE in the same PR.
        outcome: ok
  - id: review
    name: PR #825 review fixes
    steps:
      - file: tests/backends/graph/aio/test_concurrency.py
        section: "TestOverwriteReplaceRetry (body-capture + session-branch)"
        read_type: gate
        extract: >-
          Review flagged the load-bearing reader.seek(0) rewind was unverified in
          CI (respx ignores the request body) and the upload-session retry branch
          uncovered. Added test_overwrite_create_race_reissues_full_body (captures
          each PUT body; a broken rewind would upload b"" and fail) and
          test_overwrite_create_race_retries_upload_session_branch (shrinks the
          small-file boundary so createUploadSession 409s once then succeeds).
      - file: src/remote_store/aio/backends/_graph/backend.py
        section: "_REPLACE_RACE_MAX_ATTEMPTS comment"
        read_type: gate
        extract: >-
          Review caught the "~sub-second worst-case latency" comment understated
          the cumulative bound; corrected to ~1.55s worst (5 sleeps) plus the up-to-6
          full re-PUTs on a terminal conflict. The "reuse an existing retry?" thread
          got a pushback reply (graph_send is transport-retry / 409-terminal / cannot
          re-materialise a body; only the duplicated backoff formula is shareable, a
          separate refactor) and was left open for the maintainer's call.
        outcome: ok
      - file: tests/backends/graph/aio/test_concurrency.py
        section: "test_overwrite_create_race_retries_upload_session_branch (comment)"
        read_type: gate
        extract: >-
          Round-2 review: the upload-session test's "(rewound)" wording overstated
          the guard — on the large-file path the create-race 409 fires at
          createUploadSession (POST, no body) before any reader.read(), so seek(0)
          is a no-op there. Reworded to claim only branch coverage (retry re-enters /
          re-opens the session) and point at the small-file body-capture test as the
          actual rewind guard. Comment-only; no behaviour change.
        outcome: ok
