id: BK-441
title: "Memory driver as the template: required-primitive refusal, lazy drivers import, buffer writes, Write's gate order"
trigger: >-
  PR #1144 (BK-394) put both Memory classes on the RFC-0017 kernel and filed
  four follow-ups. The maintainer's goal (2026-10-16): the Memory driver free
  of every known defect, as the template the remaining backends migrate to.
source_items:
  - BK-441
  - BK-442
  - BUG-328
  - BK-440
audience:
  - user.api
  - user.api_docs
  - library.maintainer
expected_ripples:
  - src/remote_store/_kernel/backend.py
  - src/remote_store/_kernel/aio_backend.py
  - src/remote_store/drivers.py
  - src/remote_store/backends/_memory.py
  - src/remote_store/aio/backends/_memory.py
  - sdd/specs/003-backend-adapter-contract.md
  - sdd/specs/013-memory-backend.md
  - sdd/formal/BackendContract.dfy
  - docs-src/guides/custom-backend-guide.md
surprising_ripples:
  - tests/_kernel/test_delete_folder.py
  - scripts/check_custom_backend_guide.py
  - src/remote_store/_kernel/_sync/_io.py
  - src/remote_store/_kernel/_async/_io.py
  - sdd/formal/README.md
  - sdd/formal/MemoryBackend-py
discovery_followups:
  - BUG-329
  - BUG-330
  - BUG-331
co_shipped_items:
  - BK-442
  - BUG-328
  - BK-440
decisions:
  - sdd/decisions/349646d5-1b21-4d77-8c1d-de2d30fe94ad.jsonl
  - sdd/decisions/820a011f-2470-4981-9a46-d721b604b082.jsonl
orient:
  - items: [BK-441, BK-442, BUG-328, BK-440]
    verdict: subsumes
    evidence: >-
      All four were filed by PR #1144 as BK-394's discovery_followups
      (sdd/traces/bk-394-memory-drivers-accept-adr-0042.yml). Each is effort S
      and is a defect in the Memory driver, the public driver API every later
      driver inherits, or the formal model of the order the kernel answers.
      Decisions (AskUserQuestion, 2026-10-16): BUG-328 first "widen
      WritableContent", re-asked twice once reading showed the public alias
      types every unmigrated backend (_types.py:9) and the kernel's own
      Content is bytes | BinaryIO (_kernel/_sync/_io.py:19), buffers passing
      only untyped through guard_content and feed; settled on the kernel
      converting a bytearray or memoryview to bytes before any driver sees it,
      public type unchanged; BK-441 refuse at construction (probe excepted);
      BK-442 lazy module __getattr__ with __dir__; BK-440 reorder Write
      gate-first, matching kernel.py write (key rule, then _require_metadata,
      then _prepare_write).
  - items: [BUG-298, BK-405]
    verdict: unrelated
    evidence: >-
      Both live in shared glob code (pattern_to_regex, ext.glob's fallback
      tier); Memory shows them only because it declares no GLOB. Excluded by
      the maintainer's scope choice.
  - items: [BK-407, BK-339]
    verdict: unrelated
    evidence: >-
      BK-407 is the mutation-scope config (infra.test); BK-339 is store.md's
      hand-kept matrix (user.site, M). Neither changes the driver. Excluded by
      scope choice.
phases:
  - id: orient
    name: Orient
    steps:
      - file: sdd/traces/bk-394-memory-drivers-accept-adr-0042.yml
        section: "whole"
        read_type: reference
        extract: "Follow-ups BK-440, BK-441, BK-442, BUG-328; driver.py read tagged unclear"
      - file: sdd/BACKLOG.md
        section: "BK-440, BK-441, BK-442, BUG-328 (backlog-show)"
        read_type: gate
        extract: "Open decisions per item"
      - file: src/remote_store/_kernel/_async/kernel.py
        section: "write, _write_atomic"
        read_type: reference
        extract: "Order: _guard, _write_key, _require_metadata, _prepare_write"
      - file: sdd/formal/BackendContract.dfy
        section: "method Write"
        read_type: reference
        extract: "WR-010 clause guarded below IsDir, ancestor, AlreadyExists; comment calls it a known divergence"
      - file: src/remote_store/_kernel/_sync/_io.py
        section: "Content, guard_content, feed"
        read_type: reference
        extract: "Content = BinaryIO | bytes, yet guard_content and feed test bytes | bytearray | memoryview at runtime"
      - file: tmp/repro_bk441_bug328.py
        section: "whole"
        read_type: verify
        extract: "Reproduced BUG-328 on both runtimes and through Store; BK-441 omitted delete returns, file remains; BK-442 drivers import loads remote_store.aio, azure.core, httpx"
  - id: implement
    name: Implement
    steps:
      - file: src/remote_store/_kernel/_async/kernel.py
        section: "_check_construction, write, _write_atomic"
        read_type: gate
        extract: "Primitive set derived from vars(AsyncDriver), checked after the declaration checks: every member must be present, and only probe's inherited body is exempt (round 2 of PR #1147 refused an absent probe); content converted or refused after the metadata gate (take_content since round 3); write_atomic guards caller content inside _write_atomic after its gates, the open_atomic spool opting out with caller=False (PR #1148)"
      - file: tests/_kernel/_fake.py
        section: "_SyncBase, _AsyncBase, make_kernel"
        read_type: reference
        extract: "Fakes are structural and define every required member; the delete_folder adapter and the guide checker's probe did not"
      - file: tmp/probe_classify_reach.py
        section: "whole"
        read_type: verify
        extract: "After the buffer fix, a StringIO, list or int still reached classify and the probe answered AlreadyExists: same defect class, folded into BUG-328 by the maintainer"
      - file: tmp/probe_mark_refusal.py
        section: "whole"
        read_type: verify
        extract: "A __slots__ exception accepts the mark; one whose __setattr__ refuses did not, and was answered AlreadyExists; marking via exc.__dict__ covers every class (tmp/probe_exc_dict.py)"
      - file: sdd/formal/MemoryBackend.dfy
        section: "MemoryBackend.Write, MemoryBackendMinimal.Write"
        read_type: gate
        extract: "Gate moved after AddressesRoot in both bodies; observed clauses exclude the gated inputs; twin parity holds without a re-pin"
  - id: verify
    name: Verify
    steps:
      - file: scripts/dafny_verify.sh
        section: "run"
        read_type: verify
        extract: "All six files verify, 0 errors (MemoryBackend.dfy 1834, BackendContract.dfy 60)"
      - file: sdd/formal/BackendContract.dfy
        section: "every ensures ... ==> fs == old(fs)"
        read_type: verify
        extract: "Enumerated for the README's 'only error-path frames' claim: BE-020 closed, BE-029 root, Write's WR-010 gate"
      - file: tests/backends/memory/test_buffer_content.py
        section: "_NoneMidStream"
        read_type: verify
        extract: "PR #1148: a sync read answering b'ab', None, b'c' stored b'ab' on MemoryBackend write and write_atomic; refused as a caller-marked TypeError after the fix, as async already was"
      - file: tests/_kernel/test_io.py
        section: "test_what_every_read_answers_reaches_the_driver_as_its_shape_or_the_callers_error"
        read_type: verify
        extract: "PR #1148, after the proxy's answer check was narrowed in four rounds: every forwarded read x every answer kind against one oracle (10 reads x 7 kinds = 70 cells); 12 failed, all readinto/readinto1 counts (2 reads x 6 non-int kinds), fixed by _count. Its __iter__ row reached _MarkedIteration only from the closing pass on, an iterable that is not its own iterator"
      - file: src/remote_store/backends/_memory_tree.py
        section: "MemoryTree.put"
        read_type: verify
        extract: "BUG-329: running MemoryBackend().write('d/f', b'x', metadata=5) is classified from dict(metadata) after _ensure_parents (folder d kept; AlreadyExists on an existing file); Store raises AttributeError from metadata.items()"
      - file: src/remote_store/_async_to_sync_adapter.py
        section: "_binaryio_to_async_iter"
        read_type: verify
        extract: "BUG-330: if not chunk ends the upload on a None read, so the sync adapter over AsyncMemoryBackend stores b'ab' where the kernel refuses"
      - file: tests/_kernel/_fake.py
        section: "_SyncBase.put"
        read_type: verify
        extract: "BUG-331: a raw stream whose readinto answers b'ab', None, b'c' is stored as b'ab' by the fake's unsized content.read() on write, write_atomic by put and by temp-rename (readall stops at the None the proxy never sees); MemoryBackend refuses it; BE-030 bounded to sized reads on sync"
      - file: tests/_kernel/test_io.py
        section: "test_a_readlines_answer_that_is_not_a_list_is_the_callers_type_error"
        read_type: verify
        extract: "A readlines answering a bare None or int raised an unmarked TypeError from the proxy's own loop, so it was classified; 3 of 7 cells failed (int, none, released), fixed by _lines"
      - file: tests/_kernel/test_backend.py
        section: "test_open_atomic_stores_a_strided_buffer_on_every_route"
        read_type: verify
        extract: "open_atomic's spool routes raised BufferError on memoryview(b'aXbXc')[::2] where the handle route stores b'abc' (2 of 3 cells failed, as on master); the spool's write now copies through memoryview(...).tobytes()"
