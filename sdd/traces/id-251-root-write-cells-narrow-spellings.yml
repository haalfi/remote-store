id: ID-251
title: "BE-029's widest clause is one the conformance suite cannot fail on"
trigger: >-
  The root write and move/copy destination cells ran only "" and "." and
  asserted is_root on the raised path, so a backend guarding with
  is_root(path) shipped green. BK-388 had since made the oracle refuse "./"
  on the raw string, uncertified. The maintainer invoked /ship with the
  oracle strategy, the raised-path assertion and the dossier treatment routed
  through plan-mode questions.
source_items:
  - ID-251
  - BK-388
audience:
  - infra.test
  - library.maintainer
  - user.site
expected_ripples:
  - sdd/BACKLOG.md
  - sdd/BACKLOG-DONE.md
  - sdd/backlog/id-251-root-write-cells-narrow-spellings.md
  - CHANGELOG.md
  - sdd/formal/MemoryBackend-py/module_.py
  - sdd/formal/README.md
phases:
  - id: orient
    name: Orient
    steps:
      - file: sdd/backlog/id-251-root-write-cells-narrow-spellings.md
        section: "(full)"
        read_type: gate
        extract: >-
          Prescribes `assert exc.value.path == root` and says the oracle passes
          "./" to the model unnormalised. Both stale after BK-388: the model
          refuses "./" on the raw string, and equality fails both oracle lanes
          for "" (they name "."), measured below.
        outcome: misleading
      - file: sdd/specs/003-backend-adapter-contract.md
        section: "BE-029, write clause; BE-008 precondition order"
        read_type: gate
        extract: >-
          The write clause requires InvalidPath "naming the root" under every
          spelling, and lists the six. Its own prose said the cells were narrow
          because they assert is_root, so the spec ripples with the cells.
        outcome: ok
      - file: sdd/formal/README.md
        section: "Root as \".\"; gaps 9-11"
        read_type: gate
        extract: >-
          Root spellings other than "." are outside WellFormedPath; RootPath.dfy
          §5 folds them before the trait. The oracle lane wraps MemoryBackend
          only, so §5 was proved but not compiled.
        outcome: ok
      - file: sdd/formal/RootPath.dfy
        section: "§5 WriteKey, MoveKey, CopyKey"
        read_type: gate
        extract: >-
          RootFold is a compiled function and the three entries are compiled
          methods over the trait, so including the module compiles them; the
          folded error names Root.
        outcome: ok
      - file: tests/backends/dafny/_helpers.py
        section: "_str_to_dafny; write, move, copy"
        read_type: gate
        extract: "Folds only \"\" to \".\"; write/move/copy call the class methods directly."
        outcome: ok
      - file: tests/backends/conformance/test_io.py
        section: "TestBackendRootPath; _ROOT_WRITE_OPS, _ROOT_WRITE_DST_OPS"
        read_type: gate
        extract: >-
          Three write-shaped cells (writers, destination, destination outranks
          a missing source), each over ["", "."]. The async twins mirror them
          minus open_atomic.
        outcome: ok
      - file: src/remote_store/backends/_flat_ns.py
        section: "_reject_root_as_write_target"
        read_type: verify
        extract: >-
          Raises path=path, the raw key; the Docker lanes this container cannot
          run (azurite, sftp_docker, MinIO) reach the refusal through it.
        outcome: ok
      - file: sdd/BACKLOG.md
        section: "How this file works, Item authority"
        read_type: reference
        extract: "Evidence gets a dated correction, not a rewrite; this settled decision 3."
        outcome: ok
  - id: design
    name: Design
    steps:
      - file: "tmp/measure (throwaway harness over conformance fixtures)"
        section: "6 spellings x write ops x overwrite modes, move/copy dst"
        read_type: verify
        extract: >-
          852 rows on 14 Stage-1 lanes, sync and async: InvalidPath everywhere,
          source survives every seeded move/copy; raw spelling named everywhere
          except both oracle lanes for "" ("."). sqlquery has no WRITE;
          s3_pyarrow_moto skips (needs MinIO); azure_replay_hns not collected.
        outcome: ok
      - file: scripts/_dafny_classorder.py
        section: "(native dafny build of the base sources)"
        read_type: verify
        extract: >-
          Native dafny 4.11.0 build plus the reorder reproduced the committed
          module_.py byte-for-byte (diff -rq, __pycache__ excluded), so option
          (a) needs no Docker.
        outcome: ok
  - id: implement
    name: Implement
    steps:
      - file: tests/backends/conformance/_helpers.py
        section: "_ROOT_WRITE_SPELLINGS, _names_the_root"
        read_type: verify
        extract: >-
          The PostToolUse formatter removed the new imports from the two test
          modules because they were added before their call sites; re-added.
        outcome: ok
      - file: src/remote_store/backends/_flat_ns.py
        section: "_reject_root_as_write_target (mutated in-session, reverted)"
        read_type: verify
        extract: >-
          Guard narrowed to is_root: 62 failed, 570 passed, 256 skipped over the
          three widened cells, sync and async; no failing id is empty or dot.
          Reverted; git diff src/ empty.
        outcome: ok
      - file: sdd/formal/MemoryBackend-py/module_.py
        section: "(regenerated)"
        read_type: verify
        extract: >-
          Adds default__.RootAnswersPerTable, RootFold, WriteKey, MoveKey,
          CopyKey; also reorders the closeIsTerminal field and property
          emission in both classes (inert). A second fresh translate was
          byte-identical. All five .dfy files verify with 0 errors.
        outcome: ok
      - file: tests/backends/dafny/test_root_write_entry.py
        section: "(new)"
        read_type: verify
        extract: >-
          Pins the routing, which conformance cannot see: 16 cells, all red
          with the adapter reverted to direct class calls (the raised path is
          then the raw key), green restored.
        outcome: ok
      - file: docs-src/guides/custom-backend-guide.md
        section: "move/copy root bullets"
        read_type: verify
        extract: >-
          Said conformance cannot catch an is_root guard. First rewritten to say
          the cells fail one, which review showed overclaims; the per-lane
          breakdown below narrowed it.
        outcome: ok
      - file: src/remote_store/backends/_flat_ns.py
        section: "_reject_root_as_write_target (mutated again, per-lane reading)"
        read_type: verify
        extract: >-
          Of the 62 red cells, local, sftp_inproc and local_async_adapted fail
          only test_root_destination_outranks_a_missing_source; writer cells go
          red only on s3_moto, seeded destination cells on s3_moto and
          s3_boto3_moto. A present root directory refuses "./" by its own
          is_dir check, naming the raw key.
        outcome: ok
discovery_followups: []
surprising_ripples:
  - docs-src/guides/custom-backend-guide.md
  - tests/backends/test_flat_ns.py
  - sdd/specs/003-backend-adapter-contract.md
