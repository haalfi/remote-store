id: ID-238
title: "Decide whether the trace-outcome report gets a review trigger, and what fires it"
trigger: >-
  A comparison of our SDD process against GitHub spec-kit was requested, then
  narrowed to "no nice-to-haves, real provable & measurable value". Answering the
  narrowed question required a measurement rather than a feature survey, and the
  only instrument for it was BK-330's report — which nothing in the repo caused
  anyone to run, the exact gap ID-238 was filed to close.
source_items:
  - ID-238
  - BK-330
audience:
  - contributor.process
co_shipped_items:
  - BK-343
discovery_followups:
  - ID-248
  - ID-249
expected_ripples:
  - sdd/backlogid.json
review_rounds: 5
phases:
  - id: orient
    name: Orient on the external comparison
    steps:
      - file: sdd/000-process.md
        section: "Rules, Attribution inside the intent domain"
        read_type: reference
        extract: >-
          Our authority model, to compare against spec-kit's constitution. Rule 7's
          four defeaters are what spec-kit has no counterpart for
      - file: sdd/DRIFT-RULES.md
        section: "(full)"
        read_type: reference
        extract: >-
          Rules 1 and 8 are what spec-kit's pairwise spec/plan/tasks/code comparison
          violates; used for the "where we are better" half
      - file: sdd/templates/spec-template.md
        section: "(full)"
        read_type: reference
        extract: >-
          Compare against spec-kit's spec-template — ours is invariant-shaped, theirs
          is user-story-shaped with [NEEDS CLARIFICATION] markers
      - file: sdd/CLAUDE-REFERENCE.md
        section: "Ripple-check table / Pre-work index"
        read_type: gate
        extract: >-
          Pre-work scan before touching backlog items, an authority direction, and a
          new sdd/ document. Retrospectively: the Backlog-item-touched row does not
          ask about inbound references to the item being closed, which is the gap
          this PR hit twice and filed as ID-248
        outcome: unclear
  - id: measure
    name: Measure instead of surveying
    steps:
      - file: sdd/CONTENT-RULES.md
        section: "Finding the documents that are failing readers"
        read_type: reference
        extract: >-
          Names `hatch run report-trace-outcomes` as the way to ask which documents
          fail readers — the instrument that turns the narrowed question into a
          measurable one
      - file: scripts/report_trace_outcomes.py
        section: "(full)"
        read_type: reference
        extract: "Run it; 268 traces, 204 negative tags, sdd/BACKLOG.md ranked first"
      - file: sdd/BACKLOG.md
        section: "(item) ID-238"
        read_type: gate
        extract: >-
          Found the decision already scoped, with its own justification and its Rule 6
          ownership stated. The answer to "what should we do" was an open item, not a
          spec-kit import. My own miss: the first answer to the user was assembled
          from spec-kit's feature list before this was read, and three of its five
          recommendations did not survive the measurement
      - file: sdd/research/research-inconsistency-detection-multi-artifact.md
        section: "5 (finding 7), 9 (step 3)"
        read_type: reference
        extract: >-
          Step 3 asked for report plus cadence; the hand-counted table gives the
          earlier value for the top-ranked reference (16, now 21), which measures the
          cost of the interval in which nothing consumed the report
  - id: design
    name: Choose the trigger shape
    steps:
      - file: sdd/DRIFT-RULES.md
        section: "Rule 9 (period), Rule 6 (tolerated), Rule 7 (miss-rate)"
        read_type: gate
        extract: >-
          Rule 9 rejects the calendar half of the TLA+ analogy; Rule 6 makes leaving
          ID-238 open an argument for deleting the report; Rule 7 requires the stated
          bound that a release is a proxy for corpus growth
      - file: sdd/formal/README.md
        section: "3 (CI informational / revisit cadence)"
        read_type: reference
        extract: >-
          The ID-150 pattern — each revisit tracked as a backlog entry, because "a
          calendar without a ticket is the same as no calendar". Kept; the six-month
          period is dropped
      - file: CHANGELOG.md
        section: "(release headings)"
        read_type: verify
        extract: >-
          Release cadence is roughly two weeks, which is what makes a release a
          usable anchor at BK-330's measured ~+3 negative tags per merged PR
      - file: CONTRIBUTING.md
        section: "Release / Phase 0: Pre-flight"
        read_type: reference
        extract: >-
          Phase 0 already gates on backlog hygiene, so the report step belongs beside
          it rather than in the content freeze
  - id: implement
    name: Ship both items
    steps:
      - file: sdd/BACKLOG.md
        section: "How this file works / Item authority"
        read_type: reference
        extract: "BK-343's rule — diagnosis durable, prescription advisory"
      - file: CLAUDE.md
        section: "Audits"
        read_type: reference
        extract: >-
          Rule 3 is the sibling precedent BK-343 cites. Confirmed it governs a
          different artifact pair, so the backlog rule is a new direction rather than
          a second copy of a direction (DRIFT-RULES Rule 4)
      - file: sdd/traces/_schema.yml
        section: "co_shipped_items, audience"
        read_type: gate
        extract: >-
          One owning trace with co_shipped_items rather than two traces; audience
          contributor.process with no new user-facing framework, so no CHANGELOG
  - id: verify
    name: Ripple-check
    steps:
      - file: sdd/BACKLOG.md
        section: "Cross-Artifact Consistency (preamble)"
        read_type: verify
        extract: >-
          The preamble asserted ID-238 "sits at the section's tail" — falsified by
          closing it. Found by grepping the ID, not by a ripple row
      - file: sdd/BACKLOG-DONE.md
        section: "(item) BK-330"
        read_type: verify
        extract: >-
          Two stale claims: "nothing yet causes anyone to read it", and a Rule 6
          register entry saying ID-238 "will settle" the report's fate. Both rewritten
          to the settled state per principle 3
      - file: sdd/AUTHORING.md
        section: "Directory defaults"
        read_type: verify
        extract: >-
          sdd/research/research-*.md defaults to dual with no marker needed, so the
          new research doc carries none
      - file: sdd/BACKLOG.md
        section: "(item) ID-246, ID-245"
        read_type: verify
        extract: >-
          Rebase race, the same shape ID-209's trace recorded. PR #951 (ID-241)
          landed on master while this branch was open and allocated ID-245, 246 and
          247; this PR's follow-up was renumbered ID-245 to ID-248 on rebase.
          `gen_backlogid --check` had passed pre-rebase against a branch that could
          not see master's allocations, so the green check was not evidence of no
          collision. Master's new ID-246 (dangling tracker IDs under `sdd/`) is the
          nearest neighbour to ID-248 and needed an explicit distinction added
  - id: review
    name: PR review round 1
    steps:
      - file: sdd/BACKLOG.md
        section: "Cross-Artifact Consistency (Shipped so far), ID-239 (Why ID, not BK)"
        read_type: verify
        extract: >-
          Review found the inbound sweep was half-done. My own miss, twice: the
          grep that found instances 1 and 2 was run against the section I was
          editing rather than the tree, so "Shipped so far" (asserting step 3 open,
          contradicted by this same commit) and ID-239's citation both survived.
          ID-239 is a distinct sub-shape — the close *deleted* the referent instead
          of moving it, so the ID resolved and the sentence pointed at nothing.
          n=2 became n=4 and ID-248's "thin evidence" disposition was re-derived
      - file: scripts/report_trace_outcomes.py
        section: "What this report does NOT catch, Reading the ranking"
        read_type: gate
        extract: >-
          The bounds the tool documents about itself, none of which the first draft
          cited: the BACKLOG.md-to-BACKLOG-DONE.md drain (so rows 1 and 5 are two
          halves of one artifact, combined 28), the sort key measuring exposure
          rather than failure rate (so "top-ranked" pre-selects BACKLOG.md for many
          releases), and `rate`'s coverage-dependent denominator (which can move
          BK-343's prediction with no behaviour change). Read at review time, not
          at design time — the decision was anchored to an instrument whose own
          docstring had not been read end-to-end
        outcome: misleading
      - file: sdd/BACKLOG-DONE.md
        section: "(item) BK-330, (item) ID-238"
        read_type: verify
        extract: >-
          Two corrections the review forced. The Rule 6 register named a closed item
          as owner, which is the unowned state BK-329's round 5 disqualified;
          re-pointed at the Phase 0 checklist step, which is self-renewing. And the
          "+3 negative tags per merged PR" figure was carried forward against the
          closing item's explicit re-measure instruction — and against BK-343,
          shipped in this same PR. Re-derived at the refs: 193 over 260 traces at
          `83e22a3`, 205 over 269 at `73d4079`, eight merged PRs, so ~+1.5 tags per
          PR, about half the inherited figure
      - file: sdd/traces/_schema.yml
        section: "surprising_ripples, expected_ripples"
        read_type: gate
        extract: >-
          Review caught `sdd/BACKLOG.md` and `sdd/BACKLOG-DONE.md` filed as
          surprising ripples when both are cited reads in this trace and are the
          definition of closing an item — seeding the two files every close touches
          would flatten the aggregate the field exists to produce. Removed rather
          than moved to `expected_ripples`: the schema frames that field as
          distinct from the cited reads in `phases`, so listing them there repeats
          the error one field over. The genuinely unanticipated thing is already
          recorded as the `unclear` on the Pre-work index step plus ID-248
  - id: review_2
    name: PR review round 2
    steps:
      - file: sdd/research/research-spec-kit-comparison.md
        section: "3.1 The filter"
        read_type: verify
        extract: >-
          The measurement table went stale a *second* time, and by my own hand:
          round 1's fix commit added a `misleading` tag to this very trace, so the
          head total was 207 not 206, reads 236 not 235, rate 9.3% not 9.4% — and
          9.4 was the published baseline for BK-343's prediction. Both stalings
          were caught by a reader, never by the artifact. Fixed the class rather
          than the row: the table now stamps the commit it was measured at, so the
          next drift is detectable by comparison instead of by suspicion
      - file: CHANGELOG.md
        section: "(release headings)"
        read_type: verify
        extract: >-
          "Eight PRs per release interval" reused the measurement window as if it
          were a release interval; #944 to #951 spans three days. Re-measured the
          intervals from the CHANGELOG dates (4-18 days, median ~10). The
          per-interval *commit counts* taken here were themselves wrong and round 3
          caught them — see the `git rev-parse` step in review_3; this step's
          correction fixed the framing and introduced a second bad number
        outcome: misleading
      - file: sdd/formal/README.md
        section: "3 (CI informational / revisit cadence), ID-150"
        read_type: gate
        extract: >-
          Re-read for the half round 1 missed. ID-150 works because the naming doc
          pins the *ID*, not merely because a ticket exists; "record a backlog
          entry" kept the ticket and dropped the pin, leaving the next release no
          way to find the previous decision. Filed ID-249 as the first revisit
          ticket, `[ ]` in BACKLOG.md, each revisit naming its successor on close
      - file: CONTRIBUTING.md
        section: "Authoritative Document Format / Scope"
        read_type: gate
        extract: >-
          Checked the review question about `BACKLOG.md` § How this file works not
          matching the authoritative-document format. The Scope line names
          `BACKLOG.md` in its explicit exclusion list, so the format does not
          govern it and adding a Rules section would conform it to a format that
          excludes it. Declined with that evidence rather than applied
  - id: review_3
    name: PR review round 3 (terminal unprimed)
    steps:
      - file: sdd/adrs/0034-ship-panel-rounds-and-unprimed-exit.md
        section: "Decision (stop rule)"
        read_type: gate
        extract: >-
          The loop cannot end until an unprimed reviewer has seen the final state.
          Both prior rounds reviewed states that no longer existed, and round 2 had
          found a defect round 1's fix created, so the ADR's premise was already
          confirmed twice on this PR. Ran a terminal unprimed review of `bb5188b`
      - file: sdd/research/research-spec-kit-comparison.md
        section: "4.1 (per-release measurement)"
        read_type: verify
        extract: >-
          `git rev-parse --is-shallow-repository` returns true and grafted history
          starts 2026-07-13, so round 2's per-interval commit counts were measured
          against truncated history: the "0 commits, a genuinely quiet 17 days" was
          the graft boundary, not a quiet period, and I had explicitly re-checked
          and confirmed that zero. The instrument's bound went unchecked — the same
          failure as round 1's selective reading of the report's own bounds, one
          layer down. Now states only what this clone supports (21 merged commits
          for v0.30.0 to HEAD) and names the shallow-clone limit
        outcome: misleading
      - file: sdd/research/research-spec-kit-comparison.md
        section: "4.1 (Bound 2)"
        read_type: verify
        extract: >-
          The 2x rate threshold shipped inert: 2 x 9.3% = 18.6%, above every row
          clearing the reads floor, so the second selector selected nothing and
          reinstated the under-selection it was written to prevent — and the worked
          example claimed it selected `_sftp.py`, which the arithmetic contradicts.
          Refitted to 1.5x (bar 14.0%) and labelled as fitted to one table. Round 4
          then caught that the refit named only `_sftp.py` because it was judged
          against the doc's five-row excerpt: the full report at `4076ed7` selects
          three rows, and the two omitted ones outrank the named one
        outcome: misleading
      - file: sdd/BACKLOG-DONE.md
        section: "(item) BK-250, (item) BK-343"
        read_type: verify
        extract: >-
          The `BACKLOG-DONE.md:3848` citation had drifted — correct when written,
          stale after the rebase and this PR's own edits grew the file. Re-pointed
          at BK-250 by item ID. This is BK-343's own defect class committed by
          BK-343's entry, and the second line-reference instance in this PR
        outcome: misleading
  - id: review_4
    name: PR review round 4 (terminal unprimed)
    steps:
      - file: scripts/report_trace_outcomes.py
        section: "(generated report, full ranking at 4076ed7)"
        read_type: verify
        extract: >-
          Round 3's refitted 1.5x threshold was validated against the research
          doc's five-row excerpt instead of the report it summarises. The full
          ranking has three rows clearing `reads` >= 20 at `rate` >= 13.95% —
          `CONTRIBUTING.md` (15.6%/32) and spec 029 (15.4%/26) alongside
          `_sftp.py` (14.5%/55) — and the two omitted ones rank higher than the
          named one. Third instance in this PR of concluding from a truncated view
          of an instrument, after the report's unread bounds and the shallow clone;
          recorded in the doc as the one recurring defect worth generalising from
        outcome: misleading
      - file: sdd/research/research-spec-kit-comparison.md
        section: "3.2 (exemplar list)"
        read_type: verify
        extract: >-
          BUG-220's quoted extract is filed against `_local.py`, not `BACKLOG.md` —
          the same wrong-row error round 3 fixed for BUG-221 and left in its
          sibling. Fixing the named instance rather than the class is what the
          fix-pr sweep rule exists to prevent, and it failed here. Every remaining
          exemplar was then checked individually against its filing row
        outcome: misleading
      - file: CHANGELOG.md
        section: "(release headings, full history)"
        read_type: verify
        extract: >-
          The 4-18 day interval range holds only over v0.23.0 onward; earlier
          history carries same-day and one-day releases. Window now stated in both
          the research doc and the DONE entry — an unstated measurement window is
          the same class as the shallow clone one round earlier
  - id: review_5
    name: PR review round 5 (terminal unprimed)
    steps:
      - file: sdd/research/research-spec-kit-comparison.md
        section: "4.2 (measurable prediction)"
        read_type: verify
        extract: >-
          Round 5 returned one minor finding and an explicit no-blocker verdict,
          having reproduced every stamped figure in worktrees at three refs. The
          finding: "20 merged PRs is about a week" used the 8-in-3-days burst rate
          that section 4.1 quarantines; at the sustained rate (21 commits / 19
          days) it is ~18 days, about two median intervals, so both halves of the
          sentence flip. Fixed by deleting the calendar conversion rather than
          restating it — every prior fix in this PR seeded a defect, and a removal
          cannot introduce a new wrong number
        outcome: misleading
