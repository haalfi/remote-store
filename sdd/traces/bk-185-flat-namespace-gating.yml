      - file: sdd/specs/003-backend-adapter-contract.md
        section: "(full)"
        read_type: reference
        extract: "Backend ABC capability declaration contract"
      - file: sdd/DESIGN.md
        section: "1–4"
        read_type: reference
        extract: "Formatting, types, docstrings"

  - id: verify
    name: Verify
    steps:
      - file: sdd/CLAUDE-REFERENCE.md
        section: "Ripple-check table / A capability"
        read_type: verify
        extract: "Check every backend's capabilities(); conformance tests; capabilities matrix page"
      - file: CHANGELOG.md
        section: "[Unreleased]"
        read_type: verify
        extract: "Add one-line stub"
