    name: Orient
    steps:
      - file: CLAUDE.md
        section: "Principles"
        read_type: gate
        extract: "Principle 5: specs are source of truth; code vs spec → code is wrong"
      - file: sdd/specs/048-testing-architecture.md
        section: "TEST-005"
        read_type: gate
        extract: "Capability gating as the authoritative mechanism for test skipping"
      - file: FEATURES.md
