id: BK-185
title: "Refactor flat-namespace gating from backend identity to capability/kind"
trigger: "Identity sets keyed by backend.name caused Azure emulator (Azurite) and live ADLS Gen2 to share gating even though they have different namespace shapes"
source_items:
  - BK-185
  - BK-186
audience:
  - infra.test
phases:
