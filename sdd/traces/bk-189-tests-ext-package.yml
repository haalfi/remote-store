id: BK-189
title: "tests/ root cleanup phase B: tests/ext/ package + ext-module moves"
trigger: "15 ext-module tests lived at tests/ root with inconsistent test_ext_* prefixes; tests/aio/ext/ already followed the mirror pattern but the sync side did not; spec 048 TEST-002 requires src/remote_store/ext/* to mirror to tests/ext/*"
source_items:
  - BK-189
  - BK-188
  - BK-179
audience:
  - infra.test
co_shipped_items:
  - BK-188
  - BK-190
review_rounds: 3
phases:
  - id: orient
    name: Orient
    steps:
      - file: sdd/specs/048-testing-architecture.md
        section: "TEST-002, TEST-010"
        read_type: gate
        extract: "TEST-002: tests/ext/ mirrors src/remote_store/ext/; TEST-010: canonical layout with tests/ext/ shown"
      - file: sdd/TESTING.md
        section: "Test Subpackage Placement"
        read_type: gate
        extract: "Placement table to extend with tests/ext/ and tests/aio/ext/ rows"
      - file: tests/aio/ext/
        section: "(directory structure)"
        read_type: reference
        extract: "Existing async mirror pattern to replicate on the sync side"

  - id: implement
    name: Implement (create tests/ext/, migrate 15 tests, drop test_ext_ prefix)
    steps:
      - file: sdd/DESIGN.md
        section: "1–4"
        read_type: reference
        extract: "Formatting; module docstrings on __init__.py; no test logic changes"
      - file: scripts/mutate_scopes.py
        section: "(full)"
        read_type: gate
        extract: "Collapse dual test_ext_*.py / bare-named matching; add ext-misc orphan-catch scope; scope count 59 → 60"

  - id: docs_update
    name: Docs update
    steps:
      - file: sdd/TESTING.md
        section: "Test Subpackage Placement"
        read_type: gate
        extract: "Add tests/ext/ and tests/aio/ext/ rows; add Naming column"
      - file: sdd/specs/048-testing-architecture.md
        section: "TEST-010"
        read_type: gate
        extract: "Update layout snippet to show tests/ext/"
      - file: sdd/CONTENT-RULES.md
        section: "Rules 1–6"
        read_type: reference
        extract: "6-month test on placement table entries"

  - id: verify
    name: Verify
    steps:
      - file: sdd/CLAUDE-REFERENCE.md
        section: "Ripple-check table / A spec section"
        read_type: verify
        extract: "TEST-002 and TEST-010 updated; @pytest.mark.spec traces valid at new paths"
      - file: CHANGELOG.md
        section: "[Unreleased]"
        read_type: verify
        extract: "Add one-line stub"
