id: BK-348
title: "Adapt the review loop from PR #956's evidence"
trigger: >-
  Third in the "Adapt ... from PR #NNN's evidence" series - BK-342, BK-344,
  BK-348, the three findable by that title pattern - and the first drawn from a
  delivery whose own subject was review selection. Its evidence is PR #956,
  BK-338's delivery, which is not itself in this series. That run converged -
  five posted rounds, a clean last round, green
  CI - and an author pass reading each changed file whole then found defects in
  seven of the eight files it touched. The item recorded three signals and
  withheld a prescription, so the design was chosen against the evidence, with
  the user, before anything was written.
source_items:
  - BK-348
  - BK-338
audience:
  - contributor.process
expected_ripples:
  - sdd/adrs/DIGEST.md
  - sdd/backlogid.json
  - sdd/CONTENT-RULES.md
# The ripple-check's "Authority direction amended" row anticipated CLAUDE.md and
# the persona CONSTRAINTS blocks; it did not anticipate that a new *exit gate*
# obliges editing the two ADRs whose clauses it joins, the skill that spawns the
# pass, the skill that must accept its findings (rvw-pr's FILE route), and the
# skill that authors the replies the same principle binds. Nor that citing a
# trace's figure obliges re-running that figure's derivation - which is how the
# bk-338 correction below was found.
surprising_ripples:
  - .claude/skills/rvw-pr/SKILL.md
  - .claude/skills/fix-pr/SKILL.md
  - sdd/traces/bk-338-review-roster.yml
  - sdd/traces/_schema.yml
  - sdd/adrs/0035-vary-method-not-model.md
# Commits on this branch that exist because feedback was incorporated, named
# rather than totalled, per the schema clause this PR adds to that field.
# `git log --oneline origin/master..HEAD` returns three:
#   26cf75b - the implementation. Does not count.
#   789d72d - PR #958 round 1's seven findings. Counts.
#   e0cacce - author-initiated, not feedback: I ran the shipped distribution
#             instrument on this PR and found it counting replies. Does not
#             count, on the same reading bk-338's trace states for its own
#             finishing commit - the schema counts feedback incorporated, and
#             the honest reading is the one that does not inflate the field.
# Value is the count of the counting commits above, which is 1. Not the number
# of steps in the `review` phase: a round can take more than one step to record,
# and a round refuted whole produces no commit at all.
review_rounds: 1
phases:
  - id: orient
    name: Orient
    steps:
      - file: sdd/BACKLOG.md
        section: "BK-348 (item)"
        read_type: gate
        extract: >-
          Three signals, no prescription, and an explicit instruction to read the
          trace before designing anything. Signal 1: eight claims asserted from
          memory, and the invariant is the last column of its table, not the
          fourth - not one was caught by re-reading the artifact, every one fell
          when someone opened the source. Signal 2: defects lived in the files
          and fell to one whole-file read. Signal 3: brief requirement 3 asks a
          question the loop has no instrument for.
          Tagged `misleading` for signal 2's figure, not for the diagnosis: the
          item states "15 defects" and cites a derivation that does not
          reproduce when run (see the measure phase). The diagnosis this item
          exists for is sound and is what the delivery was designed against; the
          number it carries is the class of claim the delivery ships a rule
          about. My own miss is that I restated the 15 in the first cut of the
          ADR, the skill and the backlog entry before checking it.
        outcome: misleading
      - file: sdd/traces/bk-338-review-roster.yml
        section: "(full)"
        read_type: gate
        extract: >-
          The per-round detail behind the item, read rather than the item's
          summary of it per the user's instruction. Two things the summary does
          not carry: the finishing pass's defects are enumerated per file in the
          commit message, and the trace's own stated derivation for the count is
          checkable - which is what made re-running it the first thing to do.
          Tagged `misleading` because that is exactly what running it found: the
          recorded derivation ("counted from the diff hunks of 1fe4749, six in
          orchestrate") returns four hunks in that file, so this artifact told a
          reader something that proved wrong. Corrected in the same PR. The tag
          belongs on this file rather than nowhere - a trace reporting `ok` here
          would tell `report-trace-outcomes` that the delivery's own headline
          evidence never happened.
        outcome: misleading
      - file: .claude/skills/rvw-pr/SKILL.md
        section: "Step 1; Step 4 (Comment rules)"
        read_type: gate
        extract: >-
          Confirms the item's diagnosis and refutes the obvious reading of it.
          Step 1 already obliges reading every changed file in full, and Step 4
          step 2 already offers subjectType FILE - so neither "reviewers do not
          read the files" nor "the anchoring rule forbids file-level findings" is
          the mechanism. What is left is that the block headed *comment rules*
          mentions only the `+`-line constraint, 56 lines below the FILE option,
          so a reviewer working from the rules section concludes wrongly. That
          set the fix as visibility, and the pass as a separate decision.
        outcome: ok
      - file: sdd/CLAUDE-REFERENCE.md
        section: "Ripple-check table / Pre-work index"
        read_type: gate
        extract: >-
          Triggered rows: Backlog item touched (trace + schema), Authority
          direction amended (a new CLAUDE.md principle - sweep the principles,
          the persona CONSTRAINTS blocks and sibling sdd/ authority docs by
          wording), CHANGELOG entry (assessed and not required). No row covers
          "a skill gains an exit gate", which is what the surprising_ripples
          above record.
        outcome: ok
  - id: measure
    name: Measure the evidence rather than restate it
    steps:
      - file: sdd/traces/bk-338-review-roster.yml
        section: "verify / author-initiated finishing pass"
        read_type: verify
        extract: >-
          Ran the derivation the trace names for its own defect count -
          `gh api repos/haalfi/remote-store/commits/1fe4749` - and it does not
          reproduce: four hunks in orchestrate against the six recorded, and the
          15 total is the whole commit including this trace file's own three
          hunks, which record the pass rather than fix anything. So the
          correction written to document a miscount carried a derivation that
          fails when run. Corrected in that trace to the reproducible figures,
          with no defect total asserted, since none is reconstructable from a
          commit whose hunks merge adjacent fixes. This is instance 8's shape
          rather than a ninth instance, and it is the strongest single argument
          for the principle this PR ships: it was checkable at all only because
          a derivation was named.
        outcome: ok
      - file: sdd/BACKLOG.md
        section: "BK-348 signal 3 (distribution)"
        read_type: verify
        extract: >-
          Re-measured the concentration the item reports, since the design turns
          it into a per-round instrument and an instrument is worth what its
          numbers are. **Got it wrong first, and the failure is the item's own
          class.** The first measurement counted every row
          `pulls/956/comments` returns - 29 over 6 submissions, 25 before the
          last, 16 of 25 on one file - and I wrote that into the ADR, the skill
          and this trace as a correction of the item's "16 of 24", with a gloss
          inventing a reason for the gap ("comments are not findings"). The
          endpoint returns replies. Filtering `in_reply_to_id == null` gives 28
          findings over 5 submissions (5, 8, 4, 7, 4), 24 across rounds 1-4, 16
          of those on orchestrate/SKILL.md, and 4 distinct paths touched so 8 of
          12 files with none - the item's figures exactly. The item was right;
          my correction was wrong. Caught by running the shipped instrument on
          this PR's own round 1, where 7 findings came back as 15 rows. Two
          things kept: a named derivation is what made a wrong number
          recoverable in one command, and an instrument must be exercised on a
          PR that has been *replied to* before it is trusted - the pollution is
          invisible on a PR with no replies yet, which is every PR at the moment
          its first brief is written.
        outcome: ok
      - file: sdd/traces/_schema.yml
        section: "audience (derived CHANGELOG rule)"
        read_type: verify
        extract: >-
          Checked rather than assumed whether this delivery owes a CHANGELOG
          entry. The rule fires on any `user.` audience or on
          contributor.process introducing a new user-facing framework; this is
          repo-internal process, so no entry. Corroborated against the three
          predecessors - grepping CHANGELOG.md for BK-338, BK-342 and BK-344
          returns nothing, so the same call was made three times before.
        outcome: ok
  - id: implement
    name: Implement
    steps:
      - file: sdd/templates/adr-template.md
        section: "Status, Decision"
        read_type: gate
        extract: >-
          Amends is clause-level and the amended clause is named in prose below
          the table; the whole Decision section is lifted verbatim into
          DIGEST.md. Set ADR-0037's split - two decisions with reversal
          conditions in Decision, the cost and the residual in Consequences, and
          the gate's mechanics left in ship/SKILL.md, which is the division
          ADR-0036 states for operational contract.
        outcome: ok
      - file: CLAUDE.md
        section: "Principles"
        read_type: gate
        extract: >-
          The new principle is **appended as 9, never inserted**: principles are
          cited by number across BACKLOG.md, BACKLOG-DONE.md, DRIFT-RULES.md,
          several specs and audits, and mutation/SKILL.md, so renumbering would
          falsify every one of those citations in a diff that never touches them.
        outcome: ok
      - file: CLAUDE.md
        section: "GitHub operations (ADR chain)"
        read_type: verify
        extract: >-
          The site that broke twice in PR #956 - once as a list whose
          grammatical object was ADR-0033, once as an overcorrection false for
          ADR-0036 - and whose second fix predicted it would go stale on
          ADR-0037. It did: the passage ended "every one of them withdraws a
          clause a reader lands on in an earlier one", which ADR-0037 falsifies
          by adding one. Rewritten so the parentheses are topics rather than
          amendment claims, with the reader sent to each record's own Amends
          field and told a record may withdraw or add.
        outcome: ok
      - file: .claude/skills/ship/SKILL.md
        section: "When not to use this; Round composition; The whole-file member; brief requirements; Stop rule; Rules; Step 5"
        read_type: verify
        extract: >-
          The gate lands as a *method* beside the measuring member rather than
          as a lens. The first draft justified /orchestrate's exclusion by that
          distinction - "a method does not cross the shared lens-menu link" -
          and round 1 refuted it: /orchestrate carries the measuring method
          already, written out locally, so methods reach it by restatement. What
          actually excludes the gate is that it has no exit gate to join; the
          reading mode is left open on that skill's own evidence. Sibling
          sweep of adding it: the cost paragraph said "two exit gates ... up to
          two further reviewer passes", the closing-gate row said "both exit
          gates", the stop rule said "all four" clauses and the ADR-reading list
          said "all three". Each is a cardinality claim about the same thing and
          each was false on arrival of the third gate.
        outcome: ok
      - file: .claude/skills/fix-pr/SKILL.md
        section: "Rules"
        read_type: verify
        extract: >-
          Where the action-claim half of principle 9 binds, because this is
          where replies are authored. The bound is stated rather than hidden: no
          reviewer fetches replies - rvw-pr Step 1 forbids it, and that
          restraint is what keeps /ship's unprimed passes unprimed - so a false
          "I swept X" in a reply is seen by nobody and re-read by /fix-pr on
          every later round. The check is the author's or there is none.
        outcome: ok
  - id: verify
    name: Verify
    steps:
      - file: .claude/agents/store-backend-expert.md
        section: "CONSTRAINTS (all five persona files)"
        read_type: verify
        extract: >-
          The "Authority direction amended" row sends a new principle to the
          persona CONSTRAINTS blocks. Read all five. The first pass through this
          step asserted "none restates a CLAUDE.md principle" and that was
          wrong - store-backend-expert's first CONSTRAINT is principle 5's
          content in full, down to the 000-process Rule 7 qualifier. The claim
          the sweep actually supports is narrower and is the one that decides
          the edit: no persona file states, contradicts, or is falsified by
          principle 9, which governs how a figure is written rather than any
          persona's domain, and none cites CLAUDE.md at all (grep for
          "principle|CLAUDE.md" over .claude/agents/ returns nothing). So none
          was edited. Recorded rather than left silent, because a sweep that
          found nothing reads exactly like one that never ran - and because the
          first version of this sentence is the class of claim this PR ships a
          rule about, caught by running the check the rule requires.
        outcome: ok
      - file: sdd/CONTENT-RULES.md
        section: "Rules (Rule 3)"
        read_type: verify
        extract: >-
          The third target of the same ripple row - sibling sdd/ authority docs -
          which the first cut of this phase did not sweep at all, caught by PR
          #958 round 1. Rule 3 forbids exact counts in narrative and is
          [review-enforced] over "all content", so a contributor landing there
          now meets an instruction that looks like principle 9's opposite. The
          boundary was stated only inside ADR-0037, which is not where a reader
          of Rule 3 goes. Fixed by a pointer from Rule 3 rather than a copy of
          the principle, per principle 4. Also checked AUTHORING.md and
          DOCUMENTATION.md, the other two members of the documentation trio:
          neither states a rule about figures or counts, so neither was edited.
        outcome: ok
  - id: review
    name: Review (PR #958)
    steps:
      - file: .claude/skills/ship/SKILL.md
        section: "Stop rule (Floor bullet); ADR-reading list; brief requirement 3"
        read_type: verify
        extract: >-
          Round 1, unprimed and solo, 7 findings, all must-fix, answered by one
          commit. The two that would have been wrong once merged were both the
          shape this PR exists to intercept, in the paragraphs describing it.
          (1) Adding a stop clause falsified the Floor bullet four lines below
          it, which still said "a clean round 1 ends the loop; stopping there is
          correct" - and the same permission is asserted in ADR-0035's
          Consequences, a record ADR-0037 declared untouched. The bullet is where
          an operator asks "may I stop here?", so the contradiction sat in the
          more consulted of the two. Now the bullet is explicitly a floor on what
          has been looked at and never a licence to stop, and ADR-0035's premise
          moves to past tense with its reasoning noted as holding a fortiori.
          (2) The brief-requirement recipe imported /rvw-pr's paging discipline
          onto output that cannot carry it: `group_by(.path)` prints per-path
          counts, never the page length the "exactly per_page means more" test
          needs, and grouping per page then concatenating splits a file across
          two rows. Both under-report the concentration exactly when the loop has
          run long enough for it to matter. Changed to emit one bare path per
          comment, so the output length is the page length, with the union stated.
        outcome: ok
      - file: sdd/adrs/0037-whole-file-gate-and-derived-figures.md
        section: "Context (ordinals); Consequences (/orchestrate)"
        read_type: verify
        extract: >-
          The other four round-1 findings, and two are miscounts of the kind this
          PR ships a rule about - written while writing the rule. "Fourth in the
          series after BK-342, BK-344 and BK-338" is wrong twice over: the item's
          own body derives **third**, and names its derivation (the two other
          members findable by that title pattern), and BK-338 is not in the
          series at all. A second sequence - deliveries whose review evidence
          produced a record - genuinely does put this fourth, and conflating the
          two is what produced the error. Both now state their membership rather
          than an ordinal. Separately the /orchestrate exclusion was argued from
          "a method does not cross the shared lens-menu link", which is false:
          that skill carries the measuring method already, written out locally,
          so methods reach it by restatement. The conclusion survives on the
          other half (no exit gate to join) and the reading mode is now left
          open rather than silently excluded. Class-swept to the two copies in
          BACKLOG-DONE and this trace.
        outcome: ok
      - file: sdd/BACKLOG-DONE.md
        section: "BK-348 (closure entry); BK-347; _schema.yml example"
        read_type: verify
        extract: >-
          Round 2, scoped to neglected surface and briefed with the measured
          distribution - round 1 had put its 7 findings on 4 of 16 files, so the
          other 12 were named in the brief. It returned 7 findings, 5 of them on
          files that had never carried one. The lens is doing exactly what
          ADR-0033 says it does. The sharpest: deleting the item body deleted
          the eight-row instance table, and **ADR-0037 cites that table as the
          named derivation for its own headline figure** ("the row count of the
          table in the BK-348 item") - so the record shipping principle 9 had
          made its own derivation unresolvable at the commit that ships it, with
          four sentences across three files pointing at nothing. Table carried
          into the closure entry, with row 7 rewritten to cite the commit's
          per-file enumeration rather than the "15" this delivery disproved.
          Also: two sibling descriptions of the round-1 recipe fix that the
          round-1 sweep did not reach (the closure entry and the PR body both
          still said "comments grouped by .path", naming the property removed
          *because* it broke the paging test); a present-tense description of
          /rvw-pr falsified by this PR's own fix to /rvw-pr, with a line-distance
          figure that no longer reproduced - dropped rather than recomputed,
          since a line distance in a closure record goes stale on the next edit;
          BK-347's "widen before scoping" surviving the widening done four lines
          above it in the same diff, which is that file's Item-authority rule
          violated inside the correction it governs; and "PR #958 head 26cf75b"
          naming a moving referent for an open PR.
        outcome: ok
      - file: sdd/traces/_schema.yml
        section: "examples (review_rounds)"
        read_type: verify
        extract: >-
          Round 2's best structural finding, and one no diff-scoped reading would
          reach: the clause this PR adds to `review_rounds` is contradicted 146
          lines below by the schema's own `examples:` block, which carries a bare
          `review_rounds: 1` - and CLAUDE.md routes every new trace author
          through exactly that block ("create one from the schema example"). The
          first thing an author does after the clause lands is copy a
          non-compliant instance of the field it governs. Nothing mechanical can
          catch it: a YAML comment is not data, so check_traces.py cannot see the
          absence, which makes the example the clause's only enforcement surface.
          Fixed by making the example compliant. My first fix invented two
          SHA-shaped strings to illustrate it - caught before commit - and they
          are now manifest placeholders with an explicit instruction to
          substitute real short SHAs, because a plausible-looking SHA that
          resolves to nothing is worse than no derivation at all.
        outcome: ok
