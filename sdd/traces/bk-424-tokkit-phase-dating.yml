id: BK-424
title: "The token kit dates a run's phases from records that can point at the wrong event"
trigger: |
  On run B, `tokkit.py report` took PR open from the first `pr-link` record,
  which Claude Code wrote for run A's PR #1093 because the worktree reused its
  branch name; it ended orient + plan at the first Edit or Write, a probe
  script; and it labelled commits run as `git -C <dir> commit` as plain `git`.
  The research record cut run B's phases by hand with `--until` instead.
source_items:
  - BK-424
  - BK-417
audience:
  - contributor.tooling
co_shipped_items:
  - BK-417
surprising_ripples:
  - scripts/fast_gate.py
  - sdd/research/token-usage/report.md
  - sdd/research/token-usage/gates.py
  - sdd/research/token-usage/prep_cost.py
  - sdd/research/token-usage/route_baseline.py
expected_ripples:
  - sdd/backlogid.json
  - sdd/GATE-INVENTORY.md
  - .github/workflows/ci.yml
  - sdd/CLAUDE-REFERENCE.md
decisions:
  - sdd/decisions/7e2144db-5246-424e-94cb-0aa53970a7fc.jsonl
orient:
  - items: [BK-431]
    verdict: constrains
    evidence: |
      BK-431 (sdd/BACKLOG.md § 8) is to be "measured on a delivery as run B
      was", and the roadmap orders it after BK-424 because that measurement
      reads the kit's phase table. It changes nothing in this fix; it asks
      that the phase rows and the JSON `phases` keys stay readable by a
      comparison against run B's figures.
  - items: [BK-417]
    verdict: unrelated
    evidence: |
      BK-417 is about `scripts/report_token_usage.py`'s character-per-token
      constants and carried ranking (sdd/BACKLOG.md § 6). That script shares
      no code with `tokkit.py`, which takes its constants from
      `sdd/research/token-usage/_common.py`, and neither dates phases. The
      maintainer chose to ship it in the same PR anyway (decision log, scope
      dialog), so it is a co-shipped item, not a dependency.
phases:
  - id: orient
    name: Orient
    steps:
      - file: sdd/BACKLOG.md
        section: "BK-424 (hatch run backlog-show BK-424)"
        read_type: gate
        extract: "Three defects: pr-link PR open, missed git -C commits, orient ended at a probe write"
      - file: sdd/research/token-usage/tokkit.py
        section: "(full)"
        read_type: gate
        extract: "Phase split at the first pr-link event and first Edit/Write (cmd_report); commit events need bash_cat to return exactly `git commit`"
      - file: sdd/research/token-usage/report.md
        section: "Run B; Learnings; Reproducing"
        read_type: reference
        extract: "Run B's hand cuts: plan approval 13:58:24Z, PR creation 14:08:33Z; run_b_plan/run_b_pr_open give 44 and 93 main calls, the oracle for the fix"
      - file: .claude/skills/ship/SKILL.md
        section: "Orient"
        read_type: gate
        extract: "Find by spec IDs and touched files, cluster, read, judge per cluster"
      - file: sdd/research/token-usage/_common.py
        section: "(full)"
        read_type: reference
        extract: "session_prs already prefers a PR named in the prompt over pr-link; default_transcripts; write_result provenance"
      - file: sdd/BACKLOG.md
        section: "BK-417, BK-431 (backlog-find tokkit|token kit|token-usage)"
        read_type: reference
        extract: "The only open items naming the kit or its research; verdicts above"
      - file: sdd/research/token-usage/results/run_b_plan.json
        section: "main_calls; with run_b_pr_open.json and run_b_final.json"
        read_type: reference
        extract: >-
          44, 93 and 95 main calls: the oracle; run B's transcript found by run_b_final's input
          SHA-256 (ffe95a39) among the sandbox snapshots. The 44 is one call too many: --until
          compared strings, so the first build call at 13:58:24.977Z fell inside a cut at
          13:58:24Z. Fixed here; the record is a snapshot and keeps its figure.
        outcome: misleading
  - id: implement
    name: Implement
    steps:
      - file: scripts/report_token_usage.py
        section: "(full)"
        read_type: gate
        extract: "chars // 4 for results, bytes // 4 for exposure; carried ranking holds tool results only"
      - file: tests/scripts/test_report_token_usage.py
        section: "(full)"
        read_type: gate
        extract: "Synthetic transcripts with concrete figures; the shape test_tokkit.py copies"
      - file: sdd/research/token-usage/results/calibration.json
        section: "tokens_per_char; context_per_hidden_output_token"
        read_type: reference
        extract: "0.421 result, 0.318 visible assistant, 0.947 hidden kept: the constants BK-417 owes"
      - file: sdd/research/token-usage/results/composition.json
        section: "shares_pct"
        read_type: reference
        extract: "Session prefix 22.3%, hidden thinking 11.8%: the derivation for the new ranking rows' comment"
  - id: verify
    name: Verify
    steps:
      - file: sdd/CLAUDE-REFERENCE.md
        section: "Ripple-check / Test whose subject is outside src/ or scripts/ (hatch run ref-rows script)"
        read_type: verify
        extract: "test_tokkit.py's and test_token_kit_cuts.py's subjects sit in sdd/research/; added to HOOKS_PAT and the mechanical-gate list, as BUG-295 did for RFC-0015's scripts"
      - file: .github/workflows/ci.yml
        section: "HOOKS_PAT"
        read_type: verify
        extract: "Narrow tooling-tests output, not CODE_PAT; comment names the rule"
      - file: sdd/CLAUDE-REFERENCE.md
        section: "PR validation gates"
        read_type: verify
        extract: >-
          Mechanical-gate path list: after the rebase onto #1120 it names "the sdd/ scripts in CI's
          HOOKS_PAT" instead of copying the paths, which keeps one list and the process budget
          (295,217 of 295,228 bytes, hatch run check-process-budget)
      - file: sdd/BACKLOG.md
        section: "How this file works / Completing work"
        read_type: verify
        extract: "Delete both items, add [x] entries under Unreleased, regenerate backlogid.json"
  - id: fix
    name: Review fix pass (PR 1122, round 1)
    steps:
      - file: sdd/research/token-usage/tokkit.py
        section: "when; --until; related sessions"
        read_type: gate
        extract: >-
          Reproduced the offset-less --until TypeError, the old bash_cat returning "git" for the
          cherry-pick (so the PR body's "before" claim was false; commit-tree was the real misread)
          and the 3,738 figure living in inventory.json, not composition.json
      - file: sdd/research/token-usage/gates.py
        section: "UNTIL; records"
        read_type: reference
        extract: >-
          Class sweep for string-compared cuts: gates.py --until, prep_cost.py --since/--until,
          route_baseline.py --checkpoint (documented to reconcile with a tokkit --until cut) and
          tokkit find --since; fixed together through _common.when at the maintainer's choice
      - file: sdd/research/token-usage/route_baseline.py
        section: "split, checkpoint"
        read_type: verify
        extract: >-
          Own-fix sweep: the first rewrite dropped calls without a timestamp, which the string
          compare had kept as before the cut; restored in route_baseline and tokkit --until
  - id: fix
    name: Review fix pass (PR 1122, round 2)
    steps:
      - file: sdd/research/token-usage/tokkit.py
        section: "plan_end"
        read_type: gate
        extract: "plan_end took an approval from the review loop; now bounded by pr_idx, both cases seen failing first"
      - file: sdd/research/token-usage/report.md
        section: "Reproducing"
        read_type: reference
        outcome: misleading
        extract: >-
          Its tokkit.py report rows stopped reproducing at this PR's head. The kit as of eff7953bb
          reproduces run_a_final, run_b_final and run_b_plan field for field (scratch run, compared
          key by key), so the section is pinned to that commit at the maintainer's choice
      - file: scripts/fast_gate.py
        section: "DAFNY_ORACLE_DIR comment"
        read_type: verify
        extract: >-
          "The one directory ... on sys.path" became false with the kit's two test modules; the
          enumeration (Grep sys.path.insert under tests/) now names both
