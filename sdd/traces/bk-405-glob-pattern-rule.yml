id: BK-405
title: "One glob pattern rule across tiers, anchored at the true end"
trigger: "Maintainer: make the kernel/driver Memory backend the template for later drivers, closing the spec gaps it exposes; BK-405 and BUG-298 are the two open wrong-answer items on Memory (both reproduced on master 2026-10-17)"
