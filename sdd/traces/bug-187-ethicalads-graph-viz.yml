      - file: sdd/DESIGN.md
        section: "1–4"
        read_type: reference
        extract: "Formatting and type annotations for script changes"

  - id: verify
    name: Verify
    steps:
      - file: sdd/CLAUDE-REFERENCE.md
        section: "Ripple-check table / Bug fix"
