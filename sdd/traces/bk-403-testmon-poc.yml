id: BK-403
title: "No change-scoped test selector has been chosen for this suite; one of three candidates is measured"
trigger: >-
  Audit-022 found that both gates run the whole suite for every diff and
  proposed evaluating runtime-coverage selectors (P1). BK-403 was filed for it;
  this trace covers the first PR of that work, a pytest-testmon PoC run in a
  throwaway venv, which changes no shipped behaviour.
source_items:
  - BK-403
audience:
  - infra.test
  - contributor.tooling
expected_ripples:
  - sdd/BACKLOG.md
  - sdd/backlog/bk-403-test-selector-evaluation.md
  # Anticipated by the BK-403 dossier ("ID-266 needs this answered"), a cited
  # read; I still missed it until review round 2.
  - sdd/backlog/id-266-two-speed-ci-gate.md
# No path-level surprise. The one surprise is below path granularity: BK-401's
# index entry, whose sysmon switch would break testmon in the same job, found
# when 3.14's default core failed the PoC. Neither the audit nor the
# ripple-check links a coverage-core change to a selector.
surprising_ripples: []
phases:
  - id: orient
    name: Orient
    steps:
      - file: sdd/audits/audit-022-gate-speed-strategies.md
        section: "H1, M1, Proposals, P1's seeded changes"
        read_type: gate
        extract: "seeded-change classes, fail-open rule, open xdist / pytest-cov / portability questions"
      - file: sdd/backlog/bk-403-test-selector-evaluation.md
        section: "(full)"
        read_type: gate
        extract: "criteria and scope; the dossier was written one PR earlier from the same audit"
      - file: sdd/traces/_schema.yml
        section: "(full)"
        read_type: reference
        extract: "trace shape; review block is pasted at the close"
      - file: sdd/AUTHORING.md
        section: "placement table, sdd/research row"
        read_type: reference
        extract: "research notes live in sdd/research/research-*.md and are dual-published"
      - file: scripts/check_sdd_index.py
        section: "R1"
        read_type: reference
        extract: "a research doc needs a parseable **Date:** header"
  - id: design
    name: Seed design
    steps:
      - file: tests/conftest.py
        section: "RestrictedBackend, hypothesis profiles"
        read_type: reference
        extract: "one runtime-executed seed (fixture helper body) and one import-time seed (profile registration)"
      - file: tests/backends/fixtures/_loader.py
        section: "module docstring"
        read_type: reference
        extract: "fixture facts come from fixtures.toml and backends.toml, a non-Python registry input the audit's list does not name"
      - file: scripts/gen_features.py
        section: "_parse_registry_order"
        read_type: reference
        extract: "reads _registry.py as text with a double-quote regex"
      - file: scripts/check_test_placement.py
        section: "_BANNED_BACKEND_NAMES"
        read_type: reference
        extract: "AST-walks backend modules at import"
  - id: measure
    name: Measure
    steps:
      - file: pyproject.toml
        section: "[tool.pytest.ini_options] addopts"
        read_type: reference
        extract: >-
          `-m 'not live'` makes testmon deactivate selection; read only after a
          no-change rerun ran the whole suite and the run header named -m
      - file: tests/conftest.py
        section: "hypothesis profiles"
        read_type: reference
        extract: >-
          my first hypothesis seed (deadline=1e-6) rounded to 0 ms and failed
          at import, testing nothing; replaced with deadline=0.01
      - file: sdd/audits/audit-022-gate-speed-strategies.md
        section: "P1's seeded changes"
        read_type: reference
        outcome: unclear
        extract: >-
          the fixture class did not separate Python fixture code from the TOML
          data the registry loads, and the expected-miss list did not name
          module-level-only files such as __init__.py; both were misses here
  - id: fix
    name: Review fixes
    steps:
      - file: sdd/audits/audit-022-gate-speed-strategies.md
        section: "H1, fail-open rule (Today those are...)"
        read_type: reference
        outcome: misleading
        extract: >-
          the audit's two text-reading test files were carried into rule 3 as
          the complete set; an audit-hook scan of the Stage-1 suite found 15
          readers of src/ alone, and readers of tests/ and scripts/ .py files
          stay unmeasured. My miss was copying the list without measuring it,
          then calling the src/ scan complete
      - file: sdd/audits/audit-022-gate-speed-strategies.md
        section: "P1's seeded changes"
        read_type: reference
        extract: >-
          my seed table skipped the generated-artifact class; added as a
          FEATURES.md seed (missed, non-Python input)
  - id: report
    name: Report
    steps:
      - file: sdd/research/research-decision-capture-at-dialog-time.md
        section: "header"
        read_type: reference
        extract: "research header shape: Date, Backlog items, Status"
      - file: sdd/BACKLOG.md
        section: "How this file works / Item scope"
        read_type: gate
        extract: "[~] for multi-PR work; five-line diagnosis cap held on the BK-403 and BK-401 edits"
      - file: sdd/CONTENT-RULES.md
        section: "Rule 7 (Kernsatz)"
        read_type: gate
        extract: >-
          the first note answered "does testmon work?" and read as a run log;
          the PoC's question was "is selection worth adopting for faster
          in-progress rounds?". Rewritten to lead with question, answer
          ("not now") and revisit condition, evidence moved to appendices;
          BK-403 back to [ ] and BK-404's open decision gated on the same
          condition. My miss, caught by the maintainer, not by any review round
