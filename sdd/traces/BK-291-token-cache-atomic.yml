# yaml-language-server: $schema=_schema.yml
id: BK-291
title: "GraphAuth MSAL token-cache write made multi-process-safe via msal-extensions PersistedTokenCache (lock + read-retry, not atomic rename)"
trigger: >-
  The Graph concurrency review flagged GraphAuth.flush_cache as a plain
  open(path,"w").write(serialize()) at the default shared cache path, with no
  atomicity and no lock: concurrent GraphAuth/GraphBackend instances or
  processes sharing the default cache (the common multi-worker deployment)
  could truncate/tear it, forcing a re-login. Filed as an inspection finding.
source_items:
  - BK-291
audience:
  - user.api
  - library.maintainer
expected_ripples:
  - sdd/backlogid.json
surprising_ripples:
  - docs-src/guides/backends/graph.md
  - docs-src/reference/tested-versions.md
  - infra/drift-locks/graph.txt
review_rounds: 3
phases:
  - id: orient
    name: Orient
    steps:
      - file: sdd/BACKLOG.md
        section: "BK-291"
        read_type: gate
        extract: >-
          Prescription: atomic write (temp + os.replace) plus an advisory lock
          (or per-process cache path). The os.replace half proved wrong on
          Windows (see reproduce) — the lock is the load-bearing part
        outcome: misleading
      - file: src/remote_store/aio/backends/_graph/auth.py
        section: "flush_cache, _load_cache, get_token"
        read_type: gate
        extract: >-
          The non-atomic truncate-then-write; cache built as a bare
          SerializableTokenCache loaded once in _build_app; flush called from
          get_token and from GraphBackend.close()
      - file: src/remote_store/aio/backends/_graph/backend.py
        section: "aclose() flush hook (line 373)"
        read_type: reference
        extract: >-
          close() invokes flush_cache duck-typed (getattr) — so the method must
          survive even though persistence becomes continuous
  - id: reproduce
    name: Reproduce
    steps:
      - file: tests/backends/local/test_concurrency.py
        section: "{analog} concurrency repro shape"
        read_type: reference
        extract: >-
          Sandbox repro (6 writers + 2 readers): the current pattern produced
          empty reads (truncate window is payload-independent) and torn JSON ->
          hypothesis CONFIRMED. The atomic temp+os.replace variant produced 0
          content corruption but crashed every writer with PermissionError
          (WinError 5) on os.replace under concurrent access -> bare atomic
          replace is NOT safe on Windows; the cross-process lock is required
  - id: design
    name: Design
    steps:
      - file: sdd/adrs/0022-graph-auth-model.md
        section: "Token caching"
        read_type: gate
        extract: >-
          Canonical cache-path + override authority. Decision: adopt
          msal_extensions.PersistedTokenCache (lock-coordinated modify +
          read-retry search, FilePersistence) — solves corruption AND lost
          updates with no os.replace (so no WinError 5). Verified the 1.3.1
          source: modify() holds CrossPlatLock + reload-merge + save;
          flush_cache becomes a no-op
  - id: tests
    name: Tests
    steps:
      - file: tests/backends/graph/aio/test_auth.py
        section: "TestCachePersistence"
        read_type: reference
        extract: >-
          RED-first: test_cache_is_multiprocess_safe_persisted_cache asserts
          _load_cache returns a PersistedTokenCache with a sibling .lockfile
          (failed on SerializableTokenCache). Reworked the obsolete flush
          write/error tests into a write-through-to-disk behavioural test and a
          flush_cache no-op test; dropped the dead SerializableTokenCache fake
  - id: implement
    name: Implement
    steps:
      - file: src/remote_store/aio/backends/_graph/auth.py
        section: "_load_cache, flush_cache, get_token, cache_path docstring"
        read_type: reference
        extract: >-
          _load_cache builds PersistedTokenCache(FilePersistence(path)) lazily;
          flush_cache is a best-effort no-op (persistence is continuous);
          removed the redundant flush call from get_token
      - file: pyproject.toml
        section: "graph extra + mypy overrides"
        read_type: reference
        extract: >-
          Added msal-extensions>=1.3 to the graph extra (>=1.3 keeps portalocker
          optional); added a msal_extensions.* ignore_missing_imports override
  - id: docs
    name: Docs
    steps:
      - file: sdd/specs/044-graph-backend.md
        section: "GR-007, GR-051"
        read_type: reference
        extract: >-
          GR-007 postcondition now states atomic + multi-process-safe (lock)
          persistence; GR-051 invariant reframed — close()'s flush hook is a
          no-op for GraphAuth because the cache is persisted continuously
      - file: docs-src/guides/backends/graph.md
        section: "Installation, token cache"
        read_type: reference
        extract: >-
          Added msal-extensions to the pulled-in deps line and a multi-process
          safety note (the .lockfile coordinates concurrent writers). The
          msal-only graph-setup.md diagnostic snippet left as-is (single-process,
          deliberately no graph extra)
  - id: verify
    name: Verify
    steps:
      - file: tests/backends/graph/aio/test_auth.py
        section: "(full file)"
        read_type: verify
        extract: "All auth + backend close/flush tests green against the worktree src"
      - file: sdd/CLAUDE-REFERENCE.md
        section: "Ripple-check table / Bug fix"
        read_type: verify
        extract: >-
          BACKLOG->BACKLOG-DONE move (S->M), CHANGELOG entry, ADR-0021/0022
          updates, gen-backlogid + gen-features no-op confirmed, trace ships same
          PR
