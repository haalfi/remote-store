id: BK-169
title: "Add unit tests for DOCFRAME-004 gate (G-02 through G-06)"
trigger: "BK-167a implemented G-01..G-06 checks but deferred unit tests for G-02..G-06; tests ensure each gate fails precisely on its trigger condition"
source_items:
  - BK-169
  - BK-167a
phases:
