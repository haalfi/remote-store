    - "sdd/backlog/id-267-trace-outcome-revisit.md"
    - "sdd/backlogid.json"
    - "sdd/traces/bug-304-windows-tooling-tests.yml"
    - "sdd/traces/bug-305-report-trace-outcomes-cp1252.yml"
    - "tests/scripts/test_check_backlog_ids_vs_base.py"
    - "tests/scripts/test_check_dafny_oracle_fresh.py"
    - "tests/scripts/test_check_traces.py"
