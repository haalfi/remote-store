id: BK-217
title: "Split tests/test_ping.py (conformance + per-backend) (BK-191 slice 2/6)"
trigger: "BK-191 audit (sdd/audits/audit-014) flagged tests/test_ping.py as a TEST-003 violation at root and proposed disposition (a) per-backend split. Re-reading the PING contract showed Backend.check_health() is an ABC method (PING-002), not a capability — the healthy-path invariant 'returns None when reachable and authorized' is one line that every backend must satisfy. Pure (a) would have duplicated that assertion across four per-backend files. Pain point (TEST-003 violation) is real; the audit's proposed fix needed reframing."
source_items:
  - BK-217
  - BK-191
audience:
  - infra.test
  - contributor.process
expected_ripples:
  - sdd/backlogid.json
phases:
  - id: orient
    name: Orient
    steps:
      - file: sdd/audits/audit-014-grandfathered-tests-allow-list.md
        section: "tests/test_ping.py — disposition: (a) per-backend split"
        read_type: gate
        extract: "audit's original (a) prescription: move per-backend helpers + tests to tests/backends/<x>/test_ping.py, keep Store.ping() at root"
        outcome: misleading
      - file: sdd/specs/026-health-check.md
        section: "PING-001 .. PING-010"
        read_type: gate
        extract: "PING-002 declares check_health() as a concrete ABC method with a default no-op; PING-009 specifies the standard taxonomy mapping (NotFound / PermissionDenied / BackendUnavailable). Backend.check_health() is ABC-level, not capability-gated — the healthy-path invariant applies uniformly to every registered backend."
      - file: CLAUDE.md
        section: "Audits"
        read_type: gate
        extract: "rule 3 (added in the same branch as this slice): an audit's authority is its diagnosis; its prescription is advisory. Re-evaluate audit-014's proposed disposition against the diagnosed pain — TEST-003 violation at root — and pick the cleanest path."
      - file: tests/backends/conformance/conftest.py
        section: "pytest_generate_tests, backend indirect fixture"
        read_type: reference
        extract: "auto-walk over fixture_params(is_async=False); test methods taking backend get parametrized across the registry without an explicit marker"
      - file: tests/backends/conformance/test_identity.py
        section: "TestBackendIdentity (full file)"
        read_type: reference
        extract: "structural template for a class-scoped conformance test that takes the backend indirect fixture"
  - id: implement
    name: Implement
    steps:
      - file: tests/backends/conformance/test_check_health.py
        section: "TestCheckHealthConformance.test_check_health_returns_none_when_healthy"
        read_type: gate
        extract: "single parametrized test asserts backend.check_health() is None across every fixture; replaces four per-backend 'healthy returns None' lines"
      - file: tests/backends/local/test_ping.py
        section: "TestLocalCheckHealth (full file)"
        read_type: gate
        extract: "moved test_local_missing_root and test_local_unreadable_root; LocalBackend-specific filesystem failure injection has no conformance analogue"
      - file: tests/backends/s3/test_ping.py
        section: "TestS3CheckHealth (full file)"
        read_type: gate
        extract: "renamed test_s3_healthy → test_s3_probe_is_head_bucket to make the per-backend intent explicit; dropped the redundant 'result is None' assertion (conformance covers it); kept test_s3_errors as the SDK-specific error-mapping cluster"
      - file: tests/backends/sftp/test_ping.py
        section: "_sftp_backend helper + tests"
        read_type: gate
        extract: "renamed test_sftp_healthy → test_sftp_probe_is_stat_basepath; kept _BACKENDS tracker + autouse fixture because SFTPBackend.__del__ emits ResourceWarning at GC"
      - file: tests/backends/azure/test_ping.py
        section: "_azure_backend helper + tests"
        read_type: gate
        extract: "renamed test_azure_healthy → test_azure_probe_is_get_container_properties; same _BACKENDS tracker pattern as sftp"
      - file: tests/backends/s3/test_pyarrow.py
        section: "(appended) test_s3_pyarrow_health (PING-005)"
        read_type: gate
        extract: "PING-005 test appended; module-level pytest.importorskip('pyarrow') already gates execution, no per-test importorskip; added 'from remote_store._errors import NotFound' to top-level imports"
      - file: tests/test_ping.py
        section: "deletions: helpers, TestLocalCheckHealth, test_default_check_health_is_noop, test_memory_backend_always_healthy, test_healthy_local"
        read_type: gate
        extract: "root file now contains only TestStorePing (PING-001) and TestPingObserve (PING-010); no _<x> backend imports remain"
      - file: scripts/check_test_placement.py
        section: "_BACKEND_AT_ROOT_GRANDFATHERED + comment block"
        read_type: gate
        extract: "removed test_ping.py entry; updated 'five migration-pending' → 'four migration-pending' in the comment; four entries plus test_examples.py remain"
      - file: sdd/audits/audit-014-grandfathered-tests-allow-list.md
        section: "tests/test_ping.py findings + summary table"
        read_type: gate
        extract: "rewrote the test_ping.py section to record the actual (b)+(a) hybrid disposition; appended a Reconsidered-against-rule-3 paragraph documenting why the original (a) prescription was reframed; updated summary table row"
      - file: sdd/BACKLOG.md
        section: "BK-217 (Lint / CI Completeness)"
        read_type: gate
        extract: "added [~] BK-217 entry; moved to BACKLOG-DONE.md in the same commit"
  - id: discover
    name: Discover
    steps:
      - file: tests/backends/conformance/test_check_health.py
        section: "TestCheckHealthConformance (first run)"
        read_type: verify
        extract: "first naive assertion was 'check_health() is None'; failed against http (404 on directory URL — per PING-004 spec note), sftp_inproc (base_path not mkdir'd at fixture yield), and s3_moto (PytestUnraisableExceptionWarning from leaked aiobotocore coroutine)"
        outcome: misleading
      - file: src/remote_store/backends/_s3.py
        section: "S3Backend.check_health"
        read_type: gate
        extract: "self._fs.s3 is aiobotocore.client.S3 (AioBaseClient); head_bucket returns a coroutine that the current code never awaits. The HEAD never reaches the server; check_health silently returns None regardless of bucket state, and the leaked coroutine surfaces as a RuntimeWarning at GC. Real previously-untested defect — filed as BUG-208 and xfail-gated in the conformance test."
      - file: sdd/specs/026-health-check.md
        section: "PING-002 + PING-009 combined"
        read_type: reference
        extract: "revised invariant: outcome is either None or a RemoteStoreError subclass — captures the real ABC contract, accommodates fixture-precondition variance, and still catches leaked SDK exceptions"
  - id: verify
    name: Verify
    steps:
      - file: scripts/check_test_placement.py
        section: "stale-grandfather detection"
        read_type: verify
        extract: "hatch run lint reports zero Rule B violations and zero stale grandfather entries after removing test_ping.py from the allow-list"
      - file: tests/backends/conformance/test_check_health.py
        section: "(collection)"
        read_type: verify
        extract: "6 passed, 1 skipped, 1 xfailed (s3_moto xfailed against BUG-208); conformance asserts outcome is None or RemoteStoreError"
      - file: tests/backends/local/test_ping.py
        section: "(collection)"
        read_type: verify
        extract: "hatch run pytest tests/backends/local/test_ping.py collects 2 tests; both pass"
      - file: tests/backends/s3/test_ping.py
        section: "(collection)"
        read_type: verify
        extract: "hatch run pytest tests/backends/s3/test_ping.py collects 4 tests (1 + 3-parametrize); pass under s3fs importorskip"
      - file: tests/backends/sftp/test_ping.py
        section: "(collection)"
        read_type: verify
        extract: "hatch run pytest tests/backends/sftp/test_ping.py collects 2 tests under paramiko importorskip"
      - file: tests/backends/azure/test_ping.py
        section: "(collection)"
        read_type: verify
        extract: "hatch run pytest tests/backends/azure/test_ping.py collects 2 tests under azure.storage.blob importorskip"
      - file: tests/backends/s3/test_pyarrow.py
        section: "(collection of PING-005 block)"
        read_type: verify
        extract: "hatch run pytest tests/backends/s3/test_pyarrow.py collects the new PING-005 parametrize (2 ids); pyarrow importorskip already gates the module"
      - file: tests/test_ping.py
        section: "(collection)"
        read_type: verify
        extract: "hatch run pytest tests/test_ping.py collects only TestStorePing (3 tests) + TestPingObserve (3 tests); no banned-backend imports"
      - file: sdd/CLAUDE-REFERENCE.md
        section: "Ripple-check table / Backlog item touched"
        read_type: verify
        extract: "audience infra.test + contributor.process skips CHANGELOG per _schema.yml audience-derived rule; backlogid.json bumped via gen-backlogid after the BACKLOG-DONE move"
discovery_followups:
  - BUG-208
co_shipped_items: []
surprising_ripples:
  - CLAUDE.md
  - sdd/BACKLOG.md  # new "## S3 Correctness" section for BUG-208
