id: BK-397
title: "Interview-mode decisions leave no record in the repo, so their rejected options are unrecoverable"
trigger: "/ship BK-397: accept RFC-0018 with the failed path omitted, build D5 step 1 (recorder, wrapper, registration)"
source_items:
  - BK-397
audience:
  - contributor.process
  - contributor.tooling
expected_ripples:
  - "sdd/rfcs/rfc-0018-decision-capture-at-dialog-time.md"
  - ".claude/settings.json"
  - ".claude/hooks/record-decision.sh"
  - "scripts/record_decision.py"
  - "tests/scripts/test_record_decision.py"
  - ".claude/hooks/gate-commit.sh"
  - ".claude/skills/pr/SKILL.md"
  - ".claude/skills/ship/SKILL.md"
  - ".claude/skills/orchestrate/SKILL.md"
  - "sdd/CLAUDE-REFERENCE.md"
  - "sdd/BACKLOG.md"
  - "tests/scripts/fixtures/record_decision/live-pre.json"
  - "tests/scripts/fixtures/record_decision/live-post.json"
  - "sdd/decisions/24c9a1ec-ee6e-4d95-ab22-352eea31346e.jsonl"
surprising_ripples:
  - ".claude/skills/rvw-pr/SKILL.md"
phases:
  - id: orient
    name: Orient
    steps:
      - file: sdd/rfcs/rfc-0018-decision-capture-at-dialog-time.md
        section: "whole file, incl. Step 0 observations and the 2026-10-03 follow-up"
        read_type: gate
        extract: "D5 step 1 is recorder, wrapper, registration. D2's gate-commit staging, the /pr tail commit and the /ship and /orchestrate porcelain exclusions are listed in Impact but owned by no D5 step; registering the hook alone would leave an untracked sdd/decisions/ file after every dialog, tripping /pr's clean pre-check and the /ship and /orchestrate tree checks. Asked the maintainer: D2 mechanics built in this PR. Step 0's raw payloads were deleted, so 'feed the recorded step-0 payloads' could not be literal; fixtures are rebuilt from the RFC's verbatim fragments plus one live pair from this session"
        outcome: unclear
      - file: .claude/skills/ship/SKILL.md
        section: "Steps 1-5, Reviewer permissions and the tree check"
        read_type: gate
        extract: "Main-tree porcelain capture is required unchanged across a round; a dialog during a round would break it once the recorder exists"
        outcome: ok
      - file: sdd/CLAUDE-REFERENCE.md
        section: "Pre-work index; Interview mode"
        read_type: gate
        extract: "Rows hit: Backlog item touched, Test whose subject is outside src/ or scripts/ (HOOKS_PAT already matches ^.claude/hooks/; the recorder is under scripts/, in CODE_PAT), New test file (not os_sensitive: runs on Linux CI, also passes on Windows Git Bash). Interview-mode table gains a Record row"
        outcome: ok
      - file: tests/scripts/test_claude_hooks.py
        section: "test_settings_hook_commands_point_at_files_that_exist"
        read_type: reference
        extract: "Existence check matches .sh paths only, so the wrapper keeps the new registration covered without a new test"
        outcome: ok
      - file: sdd/traces/_schema.yml
        section: "audience derived rule"
        read_type: reference
        extract: "contributor.process and contributor.tooling only; the recorder is internal process tooling, not a user-facing framework: no CHANGELOG entry"
        outcome: ok
  - id: build
    name: Build
    steps:
      - file: tests/scripts/test_record_decision.py
        section: "whole file"
        read_type: verify
        extract: "Seen red first (ModuleNotFoundError before the recorder existed). First green run failed 5 bash tests on Windows: subprocess 'bash' resolves to WSL's System32 launcher before PATH, fixed by shutil.which. Wrapper mutation (no guard, no exit 0) turned both fail-open tests red with exit 2, which also measured D1's premise that a missing .py exits 2"
        outcome: ok
      - file: tests/scripts/test_claude_hooks.py
        section: "Windows skips; test_settings_hook_commands_point_at_files_that_exist"
        read_type: verify
        extract: "Before rebasing onto BUG-304's fix, its 9 notification tests failed on Windows (symlink privilege, no termios); after it they skip ('the hook harness needs symlinks, setsid and a pty'). Its settings existence check runs and passes on both, covering the new wrapper path. tests/scripts after the rebase: 2063 passed, 38 skipped"
        outcome: ok
  - id: e2e
    name: End-to-end
    steps:
      - file: sdd/decisions/24c9a1ec-ee6e-4d95-ab22-352eea31346e.jsonl
        section: "first two lines"
        read_type: verify
        extract: "One real AskUserQuestion dialog in this local Windows session, after registration and with no restart: asked then answered, same tool_use_id, branch bk-397-decision-recorder, HEAD recorded. A temporary uncommitted settings.local.json probe dumped the raw pair, kept as tests/scripts/fixtures/record_decision/ with the three local paths replaced. New since step 0: an annotations key in tool_input and tool_response, effort as an object; both kept verbatim. A cloud session was exercised later, in phase cloud_e2e. The trace cannot list the log under decisions: until step 2 adds the key"
        outcome: ok
      - file: .claude/skills/ship/SKILL.md
        section: "Reviewer permissions: main-tree capture"
        read_type: verify
        extract: "In this worktree, git status --porcelain --untracked-files=all (orchestrate's spelling) with and without -- . ':(exclude)sdd/decisions/' while the log was untracked: the excluded form omitted exactly that path. That was not ship's spelling, which uses the default untracked mode (review finding). Measured that one in a scratch repo, git 2.52.0.windows.1, sdd/ tracked and sdd/decisions/ wholly untracked: plain porcelain printed '?? sdd/decisions/' (the collapsed directory entry); git status --porcelain -- . ':(exclude)sdd/decisions/' printed nothing, and still printed ' M sdd/BACKLOG.md' once a tracked file beside it was edited"
        outcome: ok
  - id: cloud_e2e
    name: Cloud end-to-end
    steps:
      - file: scripts/record_decision.py
        section: "live run in a claude.ai/code cloud session"
        read_type: verify
        extract: "Run by the maintainer in a separate cloud session (Linux) on its own branch, with this PR's files copied into its working tree and removed afterwards; reported, not observed from this session. Copying settings.json mid-session registered the hooks without a restart. One real AskUserQuestion dialog wrote asked then answered to sdd/decisions/<session_id>.jsonl, same tool_use_id, that session's branch and HEAD, and remote_session_id set (cse_ prefix), so the CLAUDE_CODE_REMOTE_SESSION_ID path works there. tests/scripts/test_record_decision.py: 29 of 29 after copying gate-commit.sh as well (pip-installed pytest, PYTHONPATH=src; the image has no hatch env). Not checked there: whether the cse_ suffix matched that session's Claude-Session trailer, the /pr tail commit, a real gate-commit staging (exercised in this session instead: fix commit 046121605 carried the log lines it staged)"
        outcome: ok
  - id: review_fix_1
    name: Review fix pass 1
    steps:
      - file: scripts/record_decision.py
        section: "imports, _git, record fallback"
        read_type: verify
        extract: "Three findings, each pinned by a test seen red first. datetime.UTC is 3.11+ and the hook runs the host python, which requires-python does not bind: replaced by timezone.utc; no 3.10 on this host (py -3.10 absent), so the test deletes datetime.UTC before loading the recorder, an injection. The raw-name fallback committed cwd, transcript_path and scratchpad_dir; now dropped, and a grep of sdd/decisions/ for those keys and for drive or home paths found 0 matches. Two git calls at 5 s each could reach the hook's 10 s timeout and lose the event: one shared 4 s deadline. Mutations: per-call budget instead of shared (elapsed 2.0 s against the 1.0 s assertion); budget 6.0 (fits-inside assertion). My miss: the formatter rewrote timezone.utc to UTC in the first pass and I accepted it against the repo floor, not the hook's interpreter"
        outcome: ok
      - file: .claude/skills/pr/SKILL.md
        section: "Steps 1 and 6"
        read_type: verify
        extract: "The tail commit moved from Step 1 to a new Step 6, after the last step that can ask (maintainer's choice), so /pr's own questions reach the PR; review fix pass 2 moved it on to Step 4. Step 1 checks the tree clean apart from sdd/decisions/. Measured in a scratch repo: git commit -m X -- sdd/decisions/ fails on an untracked path ('pathspec did not match any file(s) known to git'); after git add -- sdd/decisions/ it commits only the log and leaves an unrelated staged file staged"
        outcome: ok
      - file: sdd/rfcs/rfc-0018-decision-capture-at-dialog-time.md
        section: "D1, D2 Who commits it, Impact"
        read_type: verify
        extract: "Impact listed AUTHORING.md directory defaults and a GATE-INVENTORY.md regeneration as ripples; neither was needed or made. Narrowed to what was run (docs-check, docs-build, gen_gate_inventory --check pass with the log present), the maintainer's choice over an AUTHORING row. D1's fallback sentence and D2's tail-commit placement follow the code changes"
        outcome: misleading
  - id: review_fix_2
    name: Review fix pass 2
    steps:
      - file: sdd/rfcs/rfc-0018-decision-capture-at-dialog-time.md
        section: "D4.3; D2 Per session"
        read_type: verify
        extract: "D4.3 still said Step 1 commits the tail; my pass-1 sweep searched 'Step 1 commits' and missed 'after Step 1 has committed'. In /pr the body was drafted (Step 5) before the tail commit (Step 6), so the tail now runs as Step 4, after the last asking step (maintainer's choice); D2 and D4.3 say it lands before the body is drafted. The renumbering staled the Rules' 'Step 5 builds the body', fixed; bk-363's dossier cites SKILL.md:27-46 in a correction dated 2026-09-28, true then, left as a dated record. D2's 'cannot conflict on merge' measured false for one session across two branches (scratch repo, git 2.52.0.windows.1): blocked switch from a modified committed log, blocked switch back over an untracked log, CONFLICT (add/add) merging A and B. Bounded in D2 and added to BK-397's pending list (maintainer's choice), no code change"
        outcome: misleading
  - id: review_fix_3
    name: Review fix pass 3
    steps:
      - file: sdd/CLAUDE-REFERENCE.md
        section: "Branch freshness check"
        read_type: verify
        extract: "The freshness check asks before rebasing, and with the recorder registered that answer modifies the tracked log. Measured in a scratch repo (git 2.52.0.windows.1, rebase.autoStash unset): git rebase refused with 'cannot rebase: You have unstaged changes'; after the pathspec tail commit it rebased cleanly and kept the decision-log commit. The check now commits the tail first, pointing at /pr Step 4 for the commands (maintainer's choice over --autostash, whose stash stack is shared across sessions). I had not hit this earlier because my rebases in this session ran under a standing instruction, without the question. The PR body's '26 tests' was stale against 29 (def test_ count with parametrizations, matching pytest's 29 passed); body corrected"
        outcome: ok
  - id: review_fix_4
    name: Review fix pass 4
    steps:
      - file: .claude/skills/rvw-pr/SKILL.md
        section: "Bash allowlist; Step 1"
        read_type: verify
        extract: "The committed log sat in the PR diff and Step 1 reads changed files in full, so /ship's unprimed passes read earlier findings and their dispositions; this PR's own log held four. Step 1 now never reads sdd/decisions/ (maintainer's choice). gh 2.86.0's pr diff has no path filter, so the default path reads per-file patches from the PR files API filtered by jq; the root path takes a pathspec. Both run against PR 1073: 14 files, the log absent, against 15 from gh pr diff --name-only. /orchestrate's reviewers are briefed, not unprimed, so it needs no change; step 3's body section is flagged in BK-397 as the same question"
        outcome: ok
      - file: .claude/hooks/record-decision.sh
        section: "header comment"
        read_type: verify
        extract: "The comment claimed 'not via $CLAUDE_PROJECT_DIR', but the registration runs the file through that variable, so the two are one path. Comment now states the anchor; D2 states the bound that a session committing in another checkout than its project directory leaves the log behind there. The recorder keeps the project-directory anchor: the cwd would send logs into /ship's tmp/review worktrees, which are removed"
        outcome: misleading
  - id: review_fix_5
    name: Review fix pass 5
    steps:
      - file: .claude/skills/rvw-pr/SKILL.md
        section: "Step 1"
        read_type: verify
        extract: "Primed measuring self-review at 242999127 in a subagent (solo pass, review worktree; tree checks clean, branch unmoved). Four findings, all taken. The no-root read used --paginate unchecked, which Step 4 of the same file forbids, and printed null for a missing patch: now an explicit page= walk at per_page=100 with a visible marker. Measured: at per_page=5 the 16 files end on a page of 1; jq on synthetic rows printed the marker for a binary and a rename and dropped the log row. Grep, Glob, git show and git log -p were a third route to the log: Step 1 now names the glob and pathspec. CLAUDE-REFERENCE's PR I/O table still gave the unfiltered root diff: fixed. The trace lacked surprising_ripples for rvw-pr, and three changed files sat in neither list: added"
        outcome: ok
  - id: review_fix_6
    name: Review fix pass 6
    steps:
      - file: .claude/skills/ship/SKILL.md
        section: "Whole-file member; Stop rule; Step 5; Rules"
        read_type: verify
        extract: "Unprimed review at 833be5680 in a subagent (PR number, root and constraints only; tree checks clean, branch unmoved). Two findings, both taken. /ship's whole-file gate, stop rule and Rules still required every changed file read whole, which rvw-pr's exclusion makes unsatisfiable on any PR carrying a log: the three clauses now say outside sdd/decisions/. ADR-0037's Decision says the same and stays as written; RFC-0018 D2 records the narrowing (maintainer's choice over amending the ADR). /ship's close had no tail commit, since /pr runs before the loop: Step 5 now commits the tail after its last commit with /pr Step 4's commands. /orchestrate's whole-file read is an open question there, not a rule, so unchanged"
        outcome: ok
  - id: review_fix_7
    name: Review fix pass 7
    steps:
      - file: .claude/skills/orchestrate/SKILL.md
        section: "Tree captures; residual table"
        read_type: verify
        extract: "Closing pass at a55c0d38a in a subagent, whole-file and measuring at once (tree checks clean, branch unmoved; it measured both diff reads at 15 files, the status pathspecs, and the tail-commit and rebase behaviour in a scratch repo, all as documented). Two findings, both taken. The sdd/decisions/ exclusion hides a reviewer's own write there from every capture, measured by the reviewer (an overwritten tracked log and a planted file vanished from the excluded captures); 'no reviewer writes there' assumed the bound the captures exist to test. /orchestrate's residual table gains the row, and /ship's main-tree sentence and RFC D2 state the bound instead of the premise; /ship's worktree check is unexcluded and still sees such a write. The test module docstring claimed every payload reconstructed and every test on a real repo: narrowed to the ANSWERED fixtures and the live pair, with the three departing tests named (grep: all four names resolve). The reviewer also noted the fix commits lack the BK-397 prefix CLAUDE.md asks for; /fix-pr prescribes 'fix: address PR #N review', and this pass's commit carries both"
        outcome: ok
  - id: review_fix_8
    name: Review fix pass 8 and close
    steps:
      - file: .claude/skills/orchestrate/SKILL.md
        section: "Tree captures; residual paragraph"
        read_type: verify
        extract: "Scoped measuring verification of 4ba2a98d2 in a subagent (tree checks clean, branch unmoved): all four changes measured true, including /ship's claim that its unexcluded worktree check sees a write under sdd/decisions/ while the excluded capture does not, and 29 tests passed. One finding: the residual paragraph still said committing before review would restore detection of every case above, false for the new sdd/decisions/ row and, before this PR, for the gitignored row; narrowed to the first three rows. The maintainer ended the review loop after this round, past the five-round soft ceiling with severity falling. Stated bounds of the close: no unprimed pass after 833be5680, no whole-file pass after a55c0d38a, and this last fix (one sentence) unreviewed"
        outcome: ok
