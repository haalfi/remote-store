id: BK-386
title: "File BK-386 and ship report-done-length, the reader for ADR-0041's done-entry shape"
trigger: >-
  ADR-0041 (merged in #1041) left its own evidence unscheduled: its Neutral
  consequence says whether new entries follow the short shape shows only in
  the next release section's median, and nothing schedules that measurement.
  The maintainer chose an item anchored to the next release plus a committed,
  tested, advisory reporter over a hand-run scratch script.
source_items:
  - BK-386
audience:
  - contributor.tooling
  - contributor.process
expected_ripples:
  - sdd/BACKLOG.md
  - sdd/backlog/
  - scripts/
  - tests/scripts/
  - pyproject.toml
  - sdd/GATE-INVENTORY.md
surprising_ripples:
  - CONTRIBUTING.md
# The close, at the v0.33.0 release, is recorded in the `close_*` phases below
# and shipped in the release PR; the review block above them is #1042's.
discovery_followups:
  - BK-406
co_shipped_items:
  - ID-259
phases:
  - id: orient
    name: Orient
    steps:
      - file: sdd/adrs/0041-done-register-links-dossiers.md
        section: "Decision; Consequences"
        read_type: gate
        extract: >-
          No length rule and review enforcement are decided, so the reporter
          must not grow a threshold; the Neutral consequence is the gap this
          item closes. The ADR text is not edited.
        outcome: ok
      - file: sdd/backlog/id-259-trace-outcome-revisit.md
        section: "(full)"
        read_type: reference
        extract: >-
          The release-anchor pattern: a Phase 0 checklist line in the published
          CONTRIBUTING.md that names no tracker ID, and the backlog item as the
          pin that says which ticket is open.
        outcome: ok
      - file: scripts/report_trace_outcomes.py
        section: "module docstring; Drift-gate block"
        read_type: reference
        extract: >-
          Report shape: exit code independent of findings, Rule 5 reason and
          Rule 7 bound in the docstring, `kind: report` so gen-gate-inventory
          lists it as advisory.
        outcome: ok
      - file: sdd/DRIFT-RULES.md
        section: "Rules 5 and 7"
        read_type: gate
        extract: "An advisory check says why it does not gate and states its bound."
        outcome: ok
  - id: implement
    name: Implement
    steps:
      - file: tests/scripts/test_report_done_length.py
        section: "(new)"
        read_type: verify
        extract: >-
          Written first and seen failing at collection (the script did not
          exist), then 10 passed. Word counts in the fixtures were hand-derived
          with str.split() and two were corrected before the first run.
          Review found two parser gaps, ID-less Decided-against entries dropped
          and repeated `##` headings merged; both got a failing test first.
          Neither changes a release section's figures. Review also found that
          splitting by link text would drop a long entry that omits its link
          from the dossier half; the split now also reads `sdd/backlog/`
          filenames and reports such entries as Unlinked (0 today). A link
          counts only when it points at the entry's own `<id>-` dossier.
        outcome: ok
      - file: sdd/BACKLOG-DONE.md
        section: "per-release sections"
        read_type: verify
        extract: >-
          `hatch run report-done-length` at 8fa22d6 reproduces ADR-0041's
          Context figures (v0.32.0 403, v0.31.0 646, 599.5 for the 16
          pre-rule Unreleased entries) and adds BK-365's close as Unreleased's
          one dossier entry at 67 words (BUG-241 under Absorbed is the other
          in the register); those rows are the dossier's baseline.
        outcome: ok
  - id: verify
    name: Verify
    steps:
      - file: scripts/gen_backlogid.py
        section: "--check"
        read_type: gate
        extract: "R1–R4 pass with BK-386 in § 6; next safe BK is 387."
        outcome: ok
      - file: sdd/GATE-INVENTORY.md
        section: "gen-gate-inventory"
        read_type: gate
        extract: "Regenerated; the new row reads `report-done-length` | advisory."
        outcome: ok
  - id: close_orient
    name: Close at v0.33.0 — read the step and the decision it owes
    steps:
      - file: CONTRIBUTING.md
        section: "Release / Phase 0: Pre-flight"
        read_type: gate
        extract: >-
          Read report-done-length and close the scheduling item against it:
          keep, gate or reverse. A report, never a gate
        outcome: ok
      - file: sdd/backlog/bk-386-done-entry-shape-measure.md
        section: "Read at the release; Record at the revisit; Exit criteria"
        read_type: gate
        extract: >-
          The figure is the With dossier median of the section the release
          renames, against its Without median, plus Unlinked; record the
          entries counted; a kept Phase 0 line needs a named successor
        outcome: ok
  - id: close_measure
    name: Close at v0.33.0 — run the report and name what it counted
    steps:
      - file: scripts/report_done_length.py
        section: "(report at 39059422c)"
        read_type: reference
        extract: >-
          Unreleased: 30 entries, 11 with a dossier at a median of 100 words,
          0 unlinked, 19 without at 529. The script reports counts only, so
          the eleven IDs came from re-running its own parse() with the item ID
          kept
        outcome: ok
  - id: close_implement
    name: Close at v0.33.0 — record keep, open the successor
    steps:
      - file: pyproject.toml
        section: "report-done-length comment"
        read_type: verify
        extract: >-
          Said the script is read at "the release that decides" the shape,
          which this release did; re-worded to the open revisit item without
          naming its ID, so the comment survives the next handover
        outcome: ok
