id: BK-226
title: "Coalesce local `from azure.core.exceptions import ...` imports in `_azure.py` (sync + async)"
trigger: |
  PR #650 review noted that both `src/remote_store/backends/_azure.py` and
  `src/remote_store/aio/backends/_azure.py` repeated local
  `from azure.core.exceptions import ResourceNotFoundError` /
  `HttpResponseError` inside ~8 methods each — a pattern that pre-dated
  the consolidation work and was deferred so PR #650 stayed scoped to the
  bug fixes.
source_items:
  - BK-226
audience:
  - contributor.tooling
expected_ripples:
  - sdd/BACKLOG.md
  - sdd/BACKLOG-DONE.md
  - sdd/backlogid.json
phases:
  - id: orient
    name: Orient
    steps:
      - file: sdd/BACKLOG.md
        section: "Azure HNS Correctness / BK-226"
        read_type: gate
        extract: "Canonical statement of the refactor: promote local `azure.core.exceptions` imports to module level in both `_azure.py` files; `azure.core` is a hard dep so no extras guard needed"
      - file: src/remote_store/backends/__init__.py
        section: "AzureBackend import try/except"
        read_type: gate
        extract: "Confirm module-level azure import is safe: the whole `_azure` module already lives behind `try/except ImportError`, so a top-level `from azure.core.exceptions import ...` cannot break installs that lack the `[azure]` extra"
  - id: implement
    name: Promote imports
    steps:
      - file: src/remote_store/backends/_azure.py
        section: "module-level imports + 10 local `from azure.core.exceptions import` sites"
        read_type: reference
        extract: "Add `from azure.core.exceptions import HttpResponseError, ResourceNotFoundError` at module level; remove 9 local `ResourceNotFoundError` imports + 1 local `HttpResponseError` import — net deletion"
      - file: src/remote_store/aio/backends/_azure.py
        section: "module-level imports + 7 local `from azure.core.exceptions import` sites"
        read_type: reference
        extract: "Same shape as sync sibling: one module-level import line, drop 6 `ResourceNotFoundError` + 1 `HttpResponseError` local re-imports"
  - id: verify
    name: Ripple-check verify
    steps:
      - file: sdd/CLAUDE-REFERENCE.md
        section: "Pre-work index — refactor row"
        read_type: verify
        extract: "Refactor must produce net line reduction; confirm via `git diff --shortstat` (20 lines deleted, 4 added → net -16 LOC against 17 import sites removed)"
      - file: sdd/BACKLOG.md
        section: "(item)"
        read_type: verify
        extract: "BK-226 removed from BACKLOG.md and migrated to BACKLOG-DONE.md as `[x]`; `hatch run gen-backlogid` re-run to refresh `sdd/backlogid.json`"
