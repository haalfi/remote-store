id: BK-358
title: "Two paramiko exception shapes escape `_ErrorMappingStream` unmapped"
trigger: >-
  A dropped SFTP connection reached a caller holding a `Backend.read()` stream as a raw
  `paramiko.SSHException`, because `_ErrorMappingStream` caught `(OSError, EOFError)` only
  and `SFTPClient._read_response` converts the underlying `EOFError` before the wrapper
  sees it — while the same drop on `read_bytes()`, which fails inside `_errors()`, mapped
  to `BackendUnavailable` correctly.
source_items:
  - BK-358
  - BK-355
  - BK-357
audience:
  - user.api
expected_ripples:
  - sdd/backlogid.json
  - CHANGELOG.md
  - docs-src/reference/migration.md
surprising_ripples:
  # Neither is reachable by grepping the item ID: the first names no ID at all,
  # and the second's staleness is an ordinal two closures behind rather than a
  # citation that fails to resolve.
  - sdd/BACKLOG.md
  - sdd/BACKLOG-DONE.md
phases:
  - id: orient
    name: Orient
    steps:
      - file: sdd/BACKLOG.md
        section: "BK-358 (item)"
        read_type: gate
        extract: >-
          The three fix options and the reason the item was filed rather than folded into
          BK-355: the wrapper serves six other construction sites, so widening its base
          tuple changes what all of them map
        outcome: ok
      - file: src/remote_store/_stream.py
        section: "_ErrorMappingStream (full)"
        read_type: gate
        extract: "Six separate `except (OSError, EOFError)` clauses; the class docstring states the breach as live"
        outcome: ok
      - file: src/remote_store/backends/_sftp.py
        section: "read(), _map_exception, _is_connection_dead, _unavailable"
        read_type: gate
        extract: >-
          The mapper already handles both shapes correctly — `SFTPError` through
          `_is_connection_dead`, `SSHException` through its own client-clearing arm — so
          only the caught set is at fault. Decided the fix against converting to `OSError`
          at an adapter, which would discard the type the mapper dispatches on
        outcome: ok
      - file: sdd/specs/006-streaming-io.md
        section: "SIO-010, SIO-011"
        read_type: gate
        extract: >-
          Both clauses describe the caught tuple only to say what it fails to reach, and
          both cite BK-358 as an open breach — so both go stale on the fix, and neither
          owns the tuple
        outcome: ok
      - file: sdd/CLAUDE-REFERENCE.md
        section: "Ripple-check > Pre-work index"
        read_type: gate
        extract: >-
          Triggered rows: Spec section, Bug fix, Backlog item touched, CHANGELOG entry,
          Breaking change (the `except`-clause half, which owes the migration section
          without the marker), New test file
        outcome: ok

  - id: reproduce
    name: Reproduce against a real socket
    steps:
      - file: tests/backends/sftp/test_io_timeout.py
        section: "_StallRelay, sftp_server fixture"
        read_type: reference
        extract: >-
          The relay pattern to model a drop on, and the fact that `sftp_server` is
          in-process rather than Docker — so the new tests run in the Stage-1 gate
        outcome: ok
      - file: tests/backends/sftp/test_config.py
        section: "test_read_stream_eoferror_maps_and_reconnects"
        read_type: reference
        extract: >-
          Why the gap survived: this test injects `EOFError` from a fake handle, which
          bypasses `_read_response` — the line that does the converting. Confirms an
          injected shape cannot reach a defect whose cause is which shape paramiko produces
        outcome: ok
      - file: src/remote_store/backends/_sftp.py
        section: "read() (measurement, not a read)"
        read_type: verify
        extract: >-
          Measured the drop end to end before writing anything: the stream raised
          `SSHException` unmapped, the client stayed cached, and the read raised rather
          than returning short — which answered the item's own open question about
          SFTP-030 in the spec's favour. Retrospectively, the first relay I wrote reached
          the defect 2 times in 15: a bare close races paramiko's transport-reader thread,
          and when the transport wins the next read raises `OSError('Socket is closed')`,
          which the base tuple already caught. Found by running the staging 15 times
          rather than once. Silencing server->client first and closing on the reply the
          client will never see is 15 of 15
        outcome: ok

  - id: tests
    name: Failing tests first
    steps:
      - file: sdd/000-process.md
        section: "Rule 6 (bug-fix protocol)"
        read_type: gate
        extract: "BACKLOG -> CHANGELOG -> failing test -> fix -> commit together; the test is run and seen to fail"
        outcome: ok
      - file: tests/backends/sftp/test_connection_drop.py
        section: "(full)"
        read_type: gate
        extract: >-
          Five tests written and run against unmodified source: all five failed on
          `paramiko.ssh_exception.SSHException` escaping the wrapper
        outcome: ok
      - file: sdd/TESTING.md
        section: "(full)"
        read_type: gate
        extract: "Assertion depth and mock discipline for the new module and the rewritten unit pins"
        outcome: ok

  - id: implement
    name: Implement
    steps:
      - file: src/remote_store/_stream.py
        section: "__init__, the six except clauses"
        read_type: gate
        extract: >-
          Opt-in `also_catch`, resolved once into `self._caught` rather than spelled at
          each clause — six clauses catching the same set is the invariant, and building
          it per site is how one drifts
        outcome: ok
      - file: src/remote_store/backends/_sftp.py
        section: "read()"
        read_type: gate
        extract: "Supply `(paramiko.SSHException, paramiko.SFTPError)`; leave `is_fatal` alone"
        outcome: ok

  - id: spec
    name: Specs
    steps:
      - file: sdd/specs/006-streaming-io.md
        section: "SIO-012 (new), SIO-010, SIO-011"
        read_type: gate
        extract: >-
          New clause owning the per-site caught set, so SIO-010 and SIO-011 can link it
          rather than each re-explaining the tuple. Recorded the 0.00 s close-cost
          measurement in SIO-010 as the reason `is_fatal` was left alone
        outcome: ok
      - file: sdd/specs/009-sftp-backend.md
        section: "SFTP-024, SFTP-030"
        read_type: gate
        extract: >-
          SFTP-024's invariant was false for the streamed handle and is now true; SFTP-030
          gains the drop beside the stall on its no-short-read claim
        outcome: ok

  - id: verify
    name: Ripple-check
    steps:
      - file: sdd/CLAUDE-REFERENCE.md
        section: "Ripple-check > Detailed checklist"
        read_type: verify
        extract: "Walked the triggered rows before committing"
        outcome: ok
      - file: sdd/BACKLOG.md
        section: "Section 1 prose"
        read_type: verify
        extract: >-
          Two sites went stale and neither names the ID in a way a grep for it would have
          surfaced as broken: the `Closes when` clause naming BK-358 beside BUG-245, and a
          "Five further disagreements" count that included it. Fixing the second exposed a
          third — "BUG-259 was a sixth of this kind", an ordinal over a list that has
          stood at five and at six within one release. Replaced with a derived count and
          no ordinal
        outcome: misleading
      - file: sdd/BACKLOG-DONE.md
        section: "BK-357 (entry)"
        read_type: verify
        extract: >-
          Present-tense assertion inside a past-tense record ("the caught tuple is
          unchanged, so a `paramiko.SFTPError` from the probe still escapes unmapped").
          Retensed rather than deleted, per BACKLOG.md's rule that tense decides
        outcome: ok
      - file: docs-src/reference/migration.md
        section: "v0.30.0 to v0.31.0"
        read_type: verify
        extract: >-
          A fix that breaks an `except paramiko.SSHException` clause without earning
          `**Breaking**` owes the section alone — the error becomes *more* specific to the
          library's own type, and an `except RemoteStoreError` handler is unaffected
        outcome: ok
