orient:
  - items: [BK-456]
    verdict: constrains
    evidence: >-
      BK-456 dossier § Prescription: "Move only in the split PR: no clause is
      reworded there, so its review is a check that text moved whole"; its
      candidate cut is to be "re-derived against the sections before the split
      PR", and the stage-one leftovers belong to the prune.
  - items: [BK-454, BK-455, BK-460, BK-461]
    verdict: constrains
    evidence: >-
      BK-455: "The Session has obligations in BE-033 but no state set" (spec:
      BE-033, BE-028); BK-460 is "due with the first lifetime given a module
      (BK-454 or BK-455)". The lifetime work these items plan reads BE-020,
      BE-028 and BE-033 together, which argues for one lifetime spec holding all
      three rather than BE-028 alone in an environment spec.
  - items: [BK-450]
    verdict: constrains
    evidence: >-
      BK-450 dossier: driver duties "stated on the protocol and in BE-032 A.8",
      re-derived "against BK-449's outcome, spec 003 BE-033's exit-owner
      table". The kernel-to-driver boundary is the interface Rule 2's second
      cut names, so BE-030 to BE-032 form one spec; its dossier's reference to
      BE-033 follows the section.
  - items: [BUG-323, BUG-293, BUG-255, BUG-257, BUG-245, BUG-339, BUG-318, BUG-319, BUG-334, BUG-292, BK-439, BK-345, BK-451, BK-446, BK-452, BUG-260, ID-244, ID-247, ID-262, BUG-310, BK-434, BK-436, BK-438, BK-433]
    verdict: unrelated
    evidence: >-
      `hatch run backlog-find --spec BE-020 --spec BE-021 --spec BE-028 --spec
      BE-029 --spec BE-030 --spec BE-031 --spec BE-032 --spec BE-033 --spec
      CAP-007 --max 40`: code defects and test gaps on those sections. A pure
      move changes no clause they rest on, and they cite sections by ID, which
      the move keeps.
phases:
  - id: orient
    name: Orient
    steps:
      - file: sdd/backlog/bk-456-split-spec-003.md
        section: "(full)"
        read_type: gate
        extract: "Candidate cut to re-derive; move only; stage-one leftovers belong to the prune"
        outcome: ok
      - file: sdd/adrs/0048-how-specs-are-designed.md
        section: "(full)"
        read_type: reference
        extract: "Cut by kind, never by component; inside a kind, at an interface"
        outcome: ok
      - file: sdd/SPEC-DESIGN.md
        section: "Rules 2, 3, 6"
        read_type: gate
        extract: "Kind is the witness shape; larger kind wins; one skeleton per spec"
        outcome: ok
      - file: .claude/skills/ship/SKILL.md
        section: "Orient"
        read_type: gate
        extract: "Find, cluster, read, judge, recommend in one dialog"
        outcome: ok
      - file: sdd/backlog/bk-450-driver-boundary-enforcement.md
        section: "(full)"
        read_type: reference
        extract: "Driver duties live in BE-032 A.8 and BE-033's exit-owner rows"
        outcome: ok
  - id: build
    name: Build
    steps:
      - file: sdd/specs/003-backend-adapter-contract.md
        section: "(full)"
        read_type: reference
        extract: >-
          Witness per section: BE-021 and BE-029 single call with
          function-shaped parts, BE-020/BE-028/BE-033 lifetime, BE-030 to
          BE-032 single call at the kernel-to-driver interface. Three "this
          spec" sentences change referent when moved
        outcome: ok
      - file: sdd/backlog/bk-456-split-spec-003.md
        section: "Prescription"
        read_type: gate
        extract: "Its candidate called BE-021, BE-029 and BE-032 function specs; their witnesses need a state and a call"
        outcome: misleading
      - file: sdd/templates/spec-template.md
        section: "(full)"
        read_type: gate
        extract: "Overview, Terms, sections, Assumptions, Notes, Tested against"
        outcome: ok
      - file: scripts/check_dafny_oracle_fresh.py
        section: "docstring"
        read_type: reference
        extract: >-
          Rebuilds each oracle and compares; run after the .dfy comment edits:
          both oracles match a fresh dafny 4.11.0 build
        outcome: ok
      - file: sdd/research/bk-456-split/check_move.py
        section: "(full)"
        read_type: gate
        extract: >-
          `python sdd/research/bk-456-split/check_move.py` (base pinned to
          4694e7a): IDs 40 before, 40 after, sets equal; 41 of 41 blocks (40
          sections and the Contract kernel intro) byte-identical after folding
          link targets and the 3 "this spec" retargets; 66 links into the
          three files, 0 unresolved; 0 unanchored links to 003 naming a moved
          ID; PASS. Four mutations (a reworded word, a link to the wrong file,
          a bare in-file link to a moved anchor, a wrapped BE-028 link put back
          on 003) each made it exit 1
        outcome: ok
