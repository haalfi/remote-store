id: BK-456
title: "Spec 003 is too long to keep free of contradictions, so it is split (stage two: the split)"
trigger: >-
  Stage one (PR #1168) took project state out of spec 003. The maintainer asked
  for the dossier's second stage: split spec 003 by kind of truth as a pure
  move, every section whole, IDs unchanged, no prune and no rewording.
