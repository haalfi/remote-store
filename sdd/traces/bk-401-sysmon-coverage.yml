        read_type: reference
        extract: "service images and ports, to start Azurite and SFTP by hand"
      - file: tests/conftest.py
        section: "_container_reachable"
        read_type: reference
        extract: "MinIO reachability is a bare TCP probe, so a moto server on the port serves the fixture"
  - id: design
    name: Mechanism
    steps:
      - file: sdd/BACKLOG-DONE.md
        section: "BUG-304"
        read_type: reference
        extract: "Windows dev boxes run hatch run all, ruling out an `env VAR=` script prefix; coverage's own fallback rules (core.py) are in the measurement notes above"
  - id: verify
    name: Verify
    steps:
      - file: sdd/CLAUDE-REFERENCE.md
        section: "Detailed checklist / Dependency"
        read_type: verify
        extract: "dev-extra floor only; the conda recipe carries no test tooling"
      - file: sdd/BACKLOG.md
        section: "How this file works / Completing work"
        read_type: verify
        extract: "BK-401 hits in id-266 and bk-403 dossiers are dated records; nothing to fix"
