id: BK-222
title: "Migrate tests/test_coverage_gaps.py — per-backend split (BK-191 slice 6/6)"
trigger: "BK-191 audit (sdd/audits/audit-014) flagged tests/test_coverage_gaps.py as a TEST-003 violation at root and proposed disposition (b) conformance reshape (secret-masking) + (a) per-backend split (init coverage). Re-reading the actual Rule B violations confirmed two clusters: function-local imports of _s3/_s3_pyarrow/_sftp/_azure in factory helpers (lines 377–429) used by the masking tests, plus __import__ lambda forms (491–512) specifically crafted to evade the AST checker. All violations serve three test groups (test_backend_masks_set_secrets, test_backend_shows_none_for_unset_secrets, test_backend_accepts_secret) that check backend-specific repr formats (key='***') and internal attribute names (_key, _secret, _password, _account_key, etc.). The (b) conformance prescription was reframed: conformance files must not name concrete backend classes, and the masking tests encode per-backend implementation details rather than generic invariants. The universal 'no credential leakage' invariant is already covered by TestBackendIdentity::test_repr_masks_secrets in test_identity.py. Disposition reframed to (a) per-backend split for all masking tests."
source_items:
  - BK-222
  - BK-191
audience:
  - infra.test
  - contributor.process
expected_ripples:
  - sdd/backlogid.json
  - sdd/audits/audit-014-grandfathered-tests-allow-list.md
surprising_ripples: []
phases:
