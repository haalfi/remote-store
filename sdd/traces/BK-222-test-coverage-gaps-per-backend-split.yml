        read_type: gate
        outcome: misleading
        extract: "audit proposes (b) conformance reshape for secret-masking + (a) per-backend for init tests; prescription reframed — conformance files cannot name concrete backend classes; the 'per-backend init tests' mentioned are actually the factory helpers for the masking tests, not standalone tests; all violations serve the three masking test groups"
      - file: tests/test_coverage_gaps.py
        section: "(full)"
        read_type: gate
        extract: "Rule B violations: _s3_with_secrets/_s3_no_secrets (lines 377/384), _s3pa_with_secrets/_s3pa_no_secrets (390/396), _sftp_with_secrets/_sftp_no_secrets (402/408), _azure_with_secrets/_azure_no_secrets (414/427) — all function-local, all are factory helpers for the three masking test groups; __import__ lambda forms (491–512) for _SECRET_CASES (SEC-004 marker); TestBackendRepr (test_local_repr, test_memory_repr*) uses only LocalBackend + MemoryBackend — stays; all other tests use only allowed backends"
      - file: tests/backends/conformance/test_identity.py
        section: "TestBackendIdentity::test_repr_masks_secrets"
        read_type: gate
        extract: "already covers the universal 'no credential leakage' invariant via fixture registry; checks that fixture-specific secrets (testing, testpass, Eby8vdM02xNOcqFlqUwJPLlmEtl) do not appear in repr — this is the generic conformance form; the masking tests in test_coverage_gaps.py go deeper (check specific masked format key='***' and Secret wrapper storage)"
      - file: scripts/check_test_placement.py
        section: "Rule B + _BACKEND_AT_ROOT_GRANDFATHERED + _ALLOWED_BACKEND_MODULES"
        read_type: gate
        extract: "_ALLOWED_BACKEND_MODULES = {_memory, _local, _fileinfo}; Rule B walks full AST so function-local imports fire; __import__ string forms do NOT fire Rule B (they are function-call nodes, not ImportFrom nodes); after removal of factory helpers and masking tests, only LocalBackend + MemoryBackend imports remain — no Rule B violations"
