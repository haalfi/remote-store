  derivation: "hatch run ship-report 1060 --trace-block-only"
  pr: 1060
  review_rounds: 1
  submissions: 1
  findings: 1
  by_round:
    - round: 1
      findings: 1
      origin: {original: 1}
      triage: {must-fix: 1}
      duration_hours: 0.04
  by_file:
    - path: "sdd/rfcs/rfc-0018-decision-capture-at-dialog-time.md"
      findings: 1
  untouched_files:
