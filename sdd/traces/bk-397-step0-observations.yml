id: BK-397
title: "Interview-mode decisions leave no record in the repo, so their rejected options are unrecoverable"
trigger: "RFC-0018 D5 step 0: observe the payloads the AskUserQuestion hooks actually receive before any reader is written; the maintainer authorized a temporary local probe"
source_items:
  - BK-397
audience:
  - contributor.process
  - contributor.tooling
expected_ripples:
  - "sdd/rfcs/rfc-0018-decision-capture-at-dialog-time.md"
  - "sdd/BACKLOG.md"
review:
