id: BK-180
title: "Implement Spec 048 Phase 2: live Azure conformance fixtures"
trigger: "Spec 048 Phase 1 (BK-179) landed the fixture registry; Phase 2 adds azure_live / azure_live_async (Stage 3, kind=real-live) so conformance runs against a real ADLS Gen2 account"
source_items:
  - BK-180
  - BK-175
audience:
  - infra.test
phases:
  - id: orient
    name: Orient
    steps:
      - file: sdd/specs/048-testing-architecture.md
        section: "TEST-001, TEST-004"
        read_type: gate
        extract: "Stage 3 fixture registration contract; real-live kind requirements"
      - file: sdd/adrs/0028-testing-architecture-kind-stage-replay.md
        section: "(full)"
        read_type: gate
        extract: "Kind × stage design decision; per-call isolation rationale"
      - file: tests/backends/fixtures/registry.py
        section: "(full)"
        read_type: reference
        extract: "BackendFixture record shape including optional aclose field"
      - file: tests/backends/fixtures/azurite.py
        section: "(full)"
        read_type: reference
        extract: "Existing emulator fixture shape to mirror for live variant"

  - id: tests
    name: Tests
    steps:
      - file: sdd/TESTING.md
        section: "Test Subpackage Placement"
        read_type: gate
        extract: "Placement for azure_live.py under tests/backends/fixtures/"
      - file: sdd/TESTING.md
        section: "Rules"
        read_type: gate
        extract: "Rule 6: prefer real deps; rule 4: spec= on mocks"
      - file: sdd/000-process.md
        section: "Test traceability"
        read_type: gate
        extract: "@pytest.mark.spec(TEST-001/004) on fixture registration tests"

  - id: implement
    name: Implement
    steps:
      - file: sdd/DESIGN.md
        section: "1–4"
        read_type: reference
        extract: "Formatting, types, module docstring, Google docstrings"

  - id: verify
    name: Verify
    steps:
      - file: sdd/CLAUDE-REFERENCE.md
        section: "Ripple-check table / New test file"
        read_type: verify
        extract: "os_sensitive mark decision for live test files"
      - file: CHANGELOG.md
        section: "[Unreleased]"
        read_type: verify
        extract: "Add one-line stub"
