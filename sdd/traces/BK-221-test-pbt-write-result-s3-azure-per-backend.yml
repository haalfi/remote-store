id: BK-221
title: "Migrate tests/test_pbt_write_result.py — per-backend split (BK-191 slice 5/6)"
trigger: "BK-191 audit (sdd/audits/audit-014) flagged tests/test_pbt_write_result.py as a TEST-003 violation at root and proposed disposition (b) conformance reshape (size regimes) + (a) per-backend split (SDK metadata round-trip). Re-reading the actual Rule B violations confirmed only two sites fire: the s3_backend fixture (line 267, _s3) and the azure_backend fixture (line 299, _azure). PBT 1 (size regime) uses only _memory and _local — both allowed at root — so the (b) conformance prescription was reframed: the deliberately narrow backend selection is documented in the module docstring (TESTING.md Rules 5 and 6) and the BUG-168 boundary is LocalBackend-specific. Disposition reframed to (a) per-backend split only."
