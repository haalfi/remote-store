id: BUG-280
title: "`LocalBackend`'s three listing methods leak a raw `PermissionError`"
trigger: |
  BUG-275's closing measuring member found that `LocalBackend.list_files`,
  `list_folders` and `iter_children` let a `PermissionError` from `iterdir`
  escape unmapped, breaching BE-021's never-leak invariant. Same generator
  shape BUG-249 fixed on `S3Boto3Backend`.
source_items:
  - BUG-280
audience:
  - user.api
discovery_followups:
  # Born at orient, from the probe that measured the recursive branches: the
  # same swallowing walk sits under glob and get_folder_info, outside the
  # agreed scope.
  - BUG-318
  # Born in review round 1, from the probe that refuted the migration note's
  # "every other LocalBackend operation" premise.
  - BUG-319
surprising_ripples:
  # Line-number citations into _local.py that the edit shifted; replaced by
  # symbol names (round 4).
  - sdd/backlog/bk-389-kernel-step-1-memory.md
  - sdd/backlog/bk-396-kernel-delete-folder-sequence.md
  - sdd/rfcs/rfc-0012-doc-graph-model.md
  - sdd/rfcs/rfc-0017-contract-kernel-over-thin-drivers.md
  # Follow-up: the Known-divergences count paragraph, stale since round 5
  # added a bullet the count did not follow.
  - sdd/specs/003-backend-adapter-contract.md
expected_ripples:
  # The two generated artefacts the ripple-check names for a public docstring
  # change; sdd/backlogid.json is not here, since gen-backlogid takes the max
  # from BACKLOG-DONE.md and BUG-280 sits below the stored BUG floor.
  - docs-src/_data/graph/graph.json
  - docs-src/explanation/graph_viz.html
decisions:
  - sdd/decisions/04387f02-b97f-4133-ab2e-e9c3b7b02bc4.jsonl
  - sdd/decisions/4b0278bb-bdf1-40a2-bfdb-7f645ce7a779.jsonl
  - sdd/decisions/aea513e5-6990-4bc5-a9c4-d38cca0637b8.jsonl
orient:
  - items: [BK-389, BK-394, BK-345]
    verdict: subsumes
    evidence: >-
      RFC-0017 § Summary: error mapping "at a single choke point that invokes
      the driver's operation-scoped classify(exc, op, key) on every call,
      listing page and stream"; § Motivation names BUG-280 as the per-method
      miss this removes. But § D3's table migrates `LocalBackend` at step 5,
      after Memory (step 1, BK-389 + BK-394, both "after the v0.33.0 tag",
      neither started), S3Boto3 (2), SQL (3) and Azure (4). § Alternatives
      calls a Store-boundary mapper "worth doing first as a stop-gap if D3 is
      delayed; not a substitute". So the item's "pattern once across backends"
      option is the kernel's job and lands far off; an in-place Local fix now
      is right and is rewritten into a driver at step 5. BK-345 is a gate over
      the absent-container rule, not the ACL row, and its kernel half is BK-389.
  - items: [BUG-257, BUG-255]
    verdict: constrains
    evidence: >-
      Spec 003 § BE-021 Known divergences: a listing that ends cleanly when a
      sub-walk fails "returns a short result as a complete one" is a defect,
      and "Contrast S3Boto3Backend.list_files, where ... a 404 on any
      sub-prefix propagates — that is the shape a fix takes". Measured on
      master (tmp probe, Python 3.13.11): Local's recursive `list_files`
      (both the `rglob` and the `os.walk`/`max_depth` branch) silently drops a
      subfolder whose scan is denied, and the `max_depth` branch answers `[]`
      for a denied root; `glob` and `get_folder_info` drop it too. `rglob`
      swallows via `glob._StringGlobber`'s `except OSError: pass`; `os.walk`
      via its default `onerror=None`. So fixing only the top-level `iterdir`
      would leave `list_files(recursive=True)` answering a denial with a
      truncated listing: the fix must cover every branch of the three methods
      and propagate a sub-walk denial, not swallow it.
  - items: [BUG-293, BUG-245]
    verdict: unrelated
    evidence: >-
      Both share BE-021 only. BUG-293 is Azure `except Exception` arms
      re-typing an already-typed error (its index entry); BUG-245 is SQLBlob
      construction, deferred to RFC-0017 step 3. Neither touches Local or
      listing generators.
  - items: [BK-405]
    verdict: unrelated
    evidence: >-
      Found via `LocalBackend`; it is `ext.glob` pattern canonicalisation by
      capability tier (GLOB-007..014), not error mapping.
  # Follow-up pass (session F, after review closed): re-oriented on the
  # rebased branch for the merge conditions in the research record.
  - items: [BUG-318, BUG-319]
    verdict: constrains
    evidence: >-
      `sdd/BACKLOG.md` entries on this branch, no dossiers. BUG-318 keeps
      `glob` and `get_folder_info` and the mid-walk skip's open decision, so
      the link skip must stay inside the three listings and must not decide
      the vanished-subfolder question. BUG-319 keeps the single-path stats.
      #1093's BUG-311 and BUG-313 dossiers measured both on master's code for
      those methods (`git diff eff7953bb HEAD -- _local.py` touches neither
      `glob`, `get_folder_info`, `get_file_info` nor the predicates), so their
      diagnosis carries over; BK-416, which they defer to, does not, since
      this PR fixes the walks it was filed for.
  - items: [BUG-299]
    verdict: unrelated
    evidence: >-
      Found by `backlog-find` on `LocalBackend`; it is `write` on a `..` key,
      not a listing or a stat.
phases:
  - id: orient
    name: Orient
    steps:
      - file: sdd/BACKLOG.md
        section: "(item) BUG-280 + dossier"
        read_type: gate
        extract: "Repro by patching Path.iterdir; open decision: fix the three here, or the listing-generator pattern once across backends"
      - file: sdd/CLAUDE-REFERENCE.md
        section: "Pre-work index"
        read_type: gate
        extract: "Triggered rows: Spec section, Error type (no new type), Bug fix, Backlog item touched, CHANGELOG entry, Tracker ID in published prose"
      - file: src/remote_store/backends/_local.py
        section: "list_files, list_folders, iter_children, glob, get_folder_info"
        read_type: reference
        extract: "Three unguarded iterdir loops; recursive forms via rglob and os.walk"
      - file: sdd/backlog/bk-389-kernel-step-1-memory.md
        section: "Split, Decisions 1-7"
        read_type: reference
        extract: "Kernel PR then Memory PR, both after v0.33.0; Local is revisited at step 5"
      - file: sdd/rfcs/rfc-0017-contract-kernel-over-thin-drivers.md
        section: "Summary, Motivation, D3 table, Alternatives (Store-boundary mapper)"
        read_type: reference
        extract: "Choke point maps every listing page; Local migrates at step 5; boundary mapper is a stop-gap, not a substitute"
      - file: sdd/specs/003-backend-adapter-contract.md
        section: "BE-021 table and Known divergences"
        read_type: reference
        extract: "ACL row -> PermissionDenied; a sub-walk failure that truncates silently is a defect, S3Boto3's propagate is the fix shape"
      - file: tmp/bug280_probe.py
        section: "(probe, not committed)"
        read_type: verify
        extract: >-
          Reproduced the three leaks; found the recursive branches, glob and
          get_folder_info swallow a denied subfolder scan silently
  - id: design
    name: Design
    steps:
      - file: tests/backends/sftp/test_config.py
        section: "TestSFTPBug146ListingEioRaises"
        read_type: reference
        extract: "Listing precedent: ENOENT means empty, any other error raises mapped; adopted for Local"
      - file: docs-src/reference/migration.md
        section: "v0.30.0 to v0.31.0 (BUG-249 listing paragraph)"
        read_type: reference
        extract: "Shape for the upgrade note: name the methods, the old type, what to catch now"
  - id: tests
    name: Failing test first
    steps:
      - file: tests/backends/local/test_listing_errors.py
        section: "test_a_listing_maps_every_os_error_it_meets"
        read_type: verify
        extract: >-
          Branch x site x error class, 36 cells, plus a baseline, a Store-facade
          and a POSIX chmod test. On master: 33 failed, 11 passed (the passing
          ones are absent cells master already answered). After the fix, 44
          passed on Windows 3.13 and 46 on python:3.11-slim as uid 1000, with
          the real chmod cells included. Three mutants (walk swallows all,
          denial mapped to the base class, every error absent) were killed by
          8, 15 and 27 cells
  - id: implement
    name: Implement
    steps:
      - file: src/remote_store/backends/_local.py
        section: "list_files, list_folders, iter_children, _listing_error, _scan, _stat_entry, _raise_walk_error"
        read_type: reference
        extract: >-
          Dropping the is_dir() pre-check was needed, not cosmetic: it swallows
          a denied stat and answers empty, the fail-open determinant spec 003
          forbids. Non-folder and missing targets still list empty, through the
          scan's own ENOENT/ENOTDIR (checked on Windows)
  - id: review
    name: Review fixes
    steps:
      - file: tmp/probe_eloop.py
        section: "(probe, not committed): a self-referential symlink at the root"
        read_type: verify
        extract: >-
          python:3.11-slim, uid 1000. master skips the link in list_files,
          its recursive form, list_folders and iter_children, and leaks a raw
          OSError(ELOOP) from the max_depth branch; the reviewed head raised
          RemoteStoreError from all five. ELOOP is now absent, like a dangling
          link. Matrix gained a loop class (12 injected cells) and a real
          symlink case per branch (5, POSIX only); against the reviewed head
          17 failed, after the fix 63 passed in Docker and 56 passed, 7
          skipped on Windows 3.13
      - file: tmp/probe_premise.py
        section: "(probe, not committed): an injected EACCES on one file's os.stat"
        read_type: verify
        extract: >-
          Windows 3.13: glob, get_folder_info, get_file_info, exists and
          is_file each let the raw PermissionError through; read_bytes did not.
          So "every other LocalBackend operation" mapping it, in this trace's
          trigger and the migration note, was false; deleted from both, and
          the leaks filed as BUG-319
      - file: tmp/probe_note.py
        section: "(probe, not committed): master listings of a folder at mode 000 and 0o444"
        read_type: verify
        extract: >-
          python:3.11-slim and 3.14-slim, uid 1000. Mode 000: the recursive
          list_files returned [] (both branches) where the flat ones leaked
          PermissionError. Mode 0o444 on 3.14: the three flat listings
          returned []. The migration note had said only "leaked
          PermissionError"; narrowed to name both outcomes. Head: 10 of 10
          cases PermissionDenied on 3.14
      - file: sdd/specs/003-backend-adapter-contract.md
        section: "BE-021: the empty listing is about a container absent when the listing began; Known divergences (GraphBackend, BUG-257)"
        read_type: reference
        extract: >-
          A sub-walk 404 part-way through a recursive walk must propagate, not
          end the listing short. The orient verdict quoted this clause and the
          build applied it to denials only, skipping a vanished subfolder; a
          round 3 reviewer caught it, and round 3's fix raised NotFound for a
          subfolder absent when the walk reached it. Reverted in round 4 (see
          the junction step below)
      - file: tmp/probe_midwalk.py
        section: "(probe, not committed): rmtree(sub) after the first yield, Windows 3.13"
        read_type: verify
        extract: >-
          master: both recursive branches return ['other/d.txt'] after a.txt,
          no error. Head: NotFound path 'sub'. Same shape pinned by
          test_a_subfolder_deleted_during_the_walk_raises, which failed before
          the change. The Windows loop shape (winerror 1921, errno 22, not
          ELOOP) was added to _listing_error and the injected loop cell;
          before it the 12 loop cells failed on Windows. After: 58 passed, 7
          skipped on Windows 3.13; 65 passed on python:3.11 and 3.14 in Docker
      - file: src/remote_store/backends/_local.py
        section: "_raise_walk_error, under a Windows directory junction (round 4 measuring member)"
        read_type: verify
        extract: >-
          os.walk descends into a junction (is_symlink() is False for it), so a
          dangling or looping junction is absent from the start, not deleted;
          round 3's NotFound arm aborted the whole recursive listing on it
          (Windows 3.13) where master and list_folders skip it. The divergence
          check fired; the re-plan (user decision) reverted the arm: a vanished
          subfolder is skipped again, as on master, and the BE-021 question
          moved to BUG-318's open decision. Kept: the winerror-1921 loop. Added
          test_a_file_path_lists_empty (5 cases; removing NotADirectoryError
          from the absent tuple fails all 5). After: 63 passed, 7 skipped on
          Windows 3.13; 70 passed on python:3.11 and 3.14 in Docker
      - file: sdd/specs/003-backend-adapter-contract.md
        section: "BE-021 Known divergences (round 5: the ceiling, closed on recorded checks by user decision)"
        read_type: reference
        extract: >-
          With the skip kept, a BE-021-marked test pinned what the clause calls
          a breach. A LocalBackend bullet now records the mid-walk skip (and
          glob/get_folder_info's denied-subfolder skip) as a divergence tracked
          by BUG-318, overriding the build's "no spec change" decision for the
          register only; the skip test carries no spec mark
      - file: tests/backends/local/test_listing_errors.py
        section: "the 12 'other' (EIO) cells run against master's source, python:3.11-slim"
        read_type: verify
        extract: >-
          master raised a raw OSError from every entry stat and from the plain
          recursive branch's scans, and the max_depth branch skipped an EIO
          subfolder and listed an EIO target empty; the 3 flat target cells are
          inconclusive (3.11's iterdir uses os.listdir, not os.scandir). The
          migration note's EIO sentence is narrowed to that
  # Session F: the follow-up the maintainer made a condition of merging, after
  # the review loop above had closed. Scope: the link skip, winerrors 21 and
  # 123, the delete-pending divergence, the BUG-318/319 dossiers, and #1093's
  # runbook section and real-denial cases (user decision, scope dialog).
  - id: followup
    name: Merge-condition follow-up
    steps:
      - file: sdd/research/token-usage/report.md
        section: "Run B; The two deliveries compared"
        read_type: gate
        extract: "What #1113 owes before merge: link skip, winerrors 21/123, delete-pending documented, BUG-318/319 dossiers"
      - file: "bug280-diff-comparison.md (token kit, outside the repo)"
        section: "Risks found in the diffs; Verification of risk 1"
        read_type: reference
        outcome: misleading
        extract: >-
          Risk 2 says the link regression is "on 3.14 only". Measured (next
          step), master's max_depth branch already skipped a junction on
          Windows 3.11 to 3.13, and leaked on POSIX 3.14, so the regression's
          reach is per branch and platform, not per interpreter alone
      - file: sdd/research/token-usage/delete_pending_probe.py
        section: "P1b (classic disposition)"
        read_type: reference
        extract: "SetFileInformationByHandle(FileDispositionInfo) on an empty sub with a second handle open; the test reuses this shape"
      - file: tmp/probe_link.py
        section: "(probe, not committed): a link in a/ into a locked folder, master vs #1113 git-archive trees"
        read_type: verify
        extract: >-
          Windows (junction, locked denied (S)): master 3.11, 3.12, 3.13 leak a
          bare PermissionError from list_files, its recursive form,
          list_folders and iter_children, and the max_depth branch skips the
          junction; master 3.14.2 skips it in all five. #1113 raises
          PermissionDenied path a/j from all five on 3.11 and 3.14. POSIX
          (python:3.11-slim and 3.14-slim, uid 1000, file symlink into a mode-000
          folder): master 3.11 leaks a bare PermissionError from all five;
          3.14 skips it in four and leaks from the max_depth branch; #1113
          raises PermissionDenied from all five on both
      - file: "origin/bug-280-local-listing-permission: tests/backends/local/test_listing_permission.py, sdd/TESTING-RUNBOOK.md"
        section: "link, junction and ACL cases; Real OS denials on Windows"
        read_type: reference
        extract: "Junction + (S) and symlink + chmod 0 recipes, (RD) for a folder denial; carried over adapted to test_listing_errors.py"
      - file: tests/backends/local/test_listing_errors.py
        section: "winerror cells, link skip and its boundary, delete-pending pin, real chmod and ACL denials"
        read_type: verify
        extract: >-
          Before the fix: 29 failed on Windows 3.13 (24 winerror-21/123 cells, 5
          link cells), 5 failed on python:3.11-slim (link cells). After: 104
          passed, 15 skipped on Windows 3.11, 3.13 and 3.14; 88 passed, 31
          skipped on python:3.11 and 3.14 in Docker. Mutants: the link skip on
          the target scan (killed by 3 boundary cells), on the walk's top (2),
          never in the walk's onerror (2, so os.walk does descend into the
          junction), winerror 5 read as absent (12, the 2 delete-pending pins
          among them)
      - file: sdd/specs/003-backend-adapter-contract.md
        section: "BE-021 Known divergences count; Broad exception handler rule"
        read_type: reference
        outcome: misleading
        extract: >-
          The count paragraph still said "two live bullets" after this PR's
          round 5 added the LocalBackend bullet, and "every live entry created
          by a clause that grew", which that bullet is not; both corrected. The
          handler rule allowed silent returns only for the three predicates,
          so the listings' skips needed naming there; the link rule is written
          as that exception
      - file: "origin/bug-280-local-listing-permission: sdd/backlog/bug-311-*.md, bug-313-*.md"
        section: "Evidence"
        read_type: reference
        extract: >-
          Measured on #1093's branch, whose glob, get_folder_info, get_file_info,
          predicates and delete_folder are master's code, as on #1113 (its
          _local.py hunks touch only the listings, helpers and imports); folded
          into the BUG-318 and BUG-319 dossiers. BK-416 not carried
