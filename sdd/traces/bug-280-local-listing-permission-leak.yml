id: BUG-280
title: "LocalBackend's listing methods leak a raw PermissionError"
trigger: |
  Filed by BUG-275's closing measuring member: list_files, list_folders and
  iter_children on LocalBackend let a raw PermissionError from iterdir escape,
  breaching BE-021's never-leak invariant, while read, write and delete map
  it. Measured before planning, the recursive list_files branches were
  found to answer the same denial differently again: they drop the denied
  subtree silently.
source_items:
  - BUG-280
audience:
  - user.api
  - user.api_docs
discovery_followups:
  # Same silent drop, reached through Path.glob rather than rglob; left out of
  # scope by decision at framing, not by oversight.
  - BUG-311
  # Born in the closing round's sibling sweep over .is_file()/.is_dir(); the
  # same 3.14 mechanism outside the walks this PR fixes.
  - BUG-313
phases:
  - id: orient
    name: Orient
    steps:
      - file: sdd/BACKLOG.md
        section: "(item) BUG-280"
        read_type: gate
        extract: "Three methods, BE-021, and the open decision: fix here or the listing-generator pattern once across backends"
      - file: sdd/backlog/bug-280-local-listing-permission-leak.md
        section: "(full)"
        read_type: gate
        extract: >-
          The reproduction (patch Path.iterdir to raise PermissionError(13)) and
          the BUG-249 / SFTP BUG-146 twins. The table measures the
          non-recursive call only, so it says nothing about list_files'
          recursive=True branches
      - file: sdd/specs/003-backend-adapter-contract.md
        section: "BE-014, BE-015, BE-021"
        read_type: gate
        extract: >-
          The canonical table's ACL row (PermissionDenied) governs a denied
          listing; BE-014/015's missing-path clause covers absence only, so an
          empty answer for a denied folder has no clause to stand on
      - file: sdd/rfcs/rfc-0017-contract-kernel-over-thin-drivers.md
        section: "Motivation"
        read_type: reference
        extract: >-
          Cites BUG-280 as an instance of "the fix lands per method, so it is
          missed per method". The cross-backend remedy the item's open decision
          names is this RFC's kernel, so it is not this item's to build
      - file: src/remote_store/backends/_sftp.py
        section: "list_files / list_folders / iter_children"
        read_type: reference
        extract: >-
          The twin: the whole generator body runs inside one try that maps
          through _map_exception, and the recursive walk raises PermissionDenied
          on a denied subfolder rather than skipping it
      - file: sdd/CLAUDE-REFERENCE.md
        section: "Pre-work index"
        read_type: gate
        extract: "Triggered rows: Spec section, Public method signature (Raises: docstrings), Bug fix, Backlog item touched, CHANGELOG entry"
  - id: reproduce
    name: Reproduce
    steps:
      - file: src/remote_store/backends/_local.py
        section: "list_files / list_folders / iter_children"
        read_type: verify
        extract: >-
          Measured on 3.13.11 with a script under tmp/: the three non-recursive
          calls raise builtins.PermissionError with no path. With os.scandir
          denied on a subfolder, list_files(recursive=True, max_depth=5) returns
          the parent's file only (os.walk's onerror=None swallows), and
          list_files(recursive=True) goes through rglob, whose 3.13 selector
          wraps scandir in `except OSError: pass`. So a denied subtree is
          dropped silently and a denied top folder lists as empty
        outcome: ok
      - file: sdd/backlog/bug-280-local-listing-permission-leak.md
        section: "reproduction table"
        read_type: reference
        extract: >-
          The table measured each method once, with recursive left at its
          default, so the dossier reported three unguarded methods where the
          defect also sat in two branches of the first. An item's measurement
          is evidence of where the symptom was seen, not of where the subject
          ends
        outcome: misleading
  - id: design
    name: Design
    steps:
      - file: docs-src/reference/migration.md
        section: "v0.30.0 to v0.31.0 (S3Boto3 listing ClientError)"
        read_type: reference
        extract: >-
          BUG-249's precedent: an exception type changing under an except clause
          earned a migration paragraph without the Breaking marker. This fix
          owes the same, plus the recursive behaviour change
      - file: CONTRIBUTING.md
        section: "When to bump"
        read_type: gate
        extract: "A bug fix is a patch, so the section is v0.33.0 to v0.33.1"
  - id: tests
    name: Failing test first
    steps:
      - file: tests/backends/local/test_listing_permission.py
        section: "(new)"
        read_type: verify
        extract: >-
          Entry point x denied site, injected at os.scandir and os.listdir.
          Before the fix, 7 target cells failed (5 with the listed folder
          denied, 2 recursive with a subfolder denied). The unbounded
          vanishing-subfolder control also failed, for an instrument reason:
          3.13's glob._StringGlobber binds os.scandir at class creation, so the
          patch never reached rglob. That stops mattering once the branch walks
          with os.walk
        outcome: ok
  - id: implement
    name: Implement
    steps:
      - file: src/remote_store/backends/_local.py
        section: "list_files / list_folders / iter_children, _raise_if_denied"
        read_type: verify
        extract: >-
          Each generator wraps its whole body in except PermissionError ->
          PermissionDenied(from None), which also catches 3.11/3.12's
          is_file/is_dir re-raising EACCES. The two recursive branches became
          one os.walk with an error hook that re-raises a denial and tolerates
          the rest. That keeps a subfolder vanishing mid-walk an absence and
          adds the is_file filter the old max_depth branch lacked. Seven
          mutants run by tmp/bug280/mutate.py all die. The is_file-filter
          mutant needed a portable cell (a name handed out by the walk but not
          on disk): the broken-symlink cell is POSIX-only, and a broken junction
          on Windows lands in dirnames, so neither could reach the filter on
          this machine
        outcome: ok
  - id: verify
    name: Verify
    steps:
      - file: tests/backends/local/test_listing_permission.py
        section: "(full)"
        read_type: verify
        extract: >-
          14 passed, 4 skipped on each of 3.11, 3.12, 3.13 and 3.14 (uv
          isolated envs with the package editable). The 4 skips are the POSIX
          symlink and chmod cells, which CI's Linux lanes run
        outcome: ok
      - file: sdd/backlog/bug-311-local-glob-denied-subtree.md
        section: "Evidence"
        read_type: verify
        extract: >-
          The per-interpreter claims about Path.glob were first written from
          memory, then checked against the installed 3.11, 3.12 and 3.14
          standard libraries before being kept
      - file: sdd/BACKLOG.md
        section: "Assigning a new ID"
        read_type: gate
        extract: >-
          The local --check offered BUG-310 as safe, and the follow-up was
          minted from it. Before the push, --check --remote reported BUG-310
          already minted on a pushed branch (bug-azure-range-reader-closed),
          so it was re-minted as BUG-311 before anything left this machine.
          The rule says a lone session may use the local value, and that was
          true when this session started; a parallel session pushed in between
        outcome: ok
  - id: fix
    name: Fix pass (round 1)
    steps:
      - file: src/remote_store/backends/_local.py
        section: "get_folder_info"
        read_type: verify
        extract: >-
          Round 1's unprimed pass found a fifth local walk the subject list had
          never named: get_folder_info still aggregated with rglob("*"). So
          Store.get_folder_info, which goes to the backend for max_depth=None
          and to list_files otherwise, now answered one denial two ways.
          Measured with a real ACL denial (icacls /deny RD) on 3.13: (1, 1)
          silently for max_depth=None, PermissionDenied for max_depth=5. Before
          this PR both forms under-counted alike, so the split was this PR's own
          doing. The framing enumerated the methods the item named and their
          branches, not every walk the item's *claim* (a denied subtree is
          dropped silently) is true of. A grep for rglob/os.walk/iterdir/
          scandir/listdir over src/ was the derivation that would have named it,
          and it was run only in this fix pass's sibling sweep. It found six
          local walks: four fixed, glob (BUG-311), and this one
      - file: tests/backends/local/test_listing_permission.py
        section: "_ENTRY_POINTS, ACL cell"
        read_type: verify
        extract: >-
          get_folder_info and both Store.get_folder_info forms joined the
          enumeration. Six cells failed before the fix, and the Store max_depth
          cells already passed, which is the split itself. A Windows real-denial
          cell (icacls) now runs on the platform the local gate uses, so the
          real-OS answer is executed here as well as on CI's POSIX lanes. Ten
          mutants all die. get_folder_info's is_file filter survived until the
          ghost-name cell was parametrised over it too
        outcome: ok
  - id: fix_2
    name: Fix pass (round 2)
    steps:
      - file: tests/backends/local/test_listing_permission.py
        section: "test_a_subfolder_vanishing_mid_walk_is_still_an_absence"
        read_type: verify
        extract: >-
          Round 2's measuring pass confirmed every premise on master and every
          new-behaviour claim at the head with real ACL denials. It found one
          gap: the vanishing-subfolder control drove list_files only, so
          get_folder_info's own error hook could be made to raise on any
          OSError with nothing failing. Parametrised over all five recursive
          walks. A per-site mutant (get_folder_info's hook re-raising
          everything) now dies on the 2 new cells
      - file: tmp/bug280/mutate.py
        section: "list_files mutants"
        read_type: verify
        extract: >-
          The instrument was wrong for one fix pass. The list_files mutants
          matched "dirnames, filenames in os.walk", which is also a substring
          of get_folder_info's "_dirnames, filenames in os.walk", so they
          mutated both sites at once. The round-1 reply's per-mutant claims
          held, but "list_files-no-onerror: 15 failed" measured two sites.
          Re-anchored on "for dirpath, dirnames"; it now kills 9 cells alone.
          No outcome tag: the author built the instrument
  - id: fix_3
    name: Fix pass (round 3, closing panel)
    steps:
      - file: src/remote_store/backends/_local.py
        section: "_stat_or_absent; the four walks' classification"
        read_type: verify
        extract: >-
          The whole-file member guessed, unreproduced, that "3.13+" Path.is_file
          answers False for an entry the OS refuses to stat. Reading the stdlib
          put it on 3.14 only: 3.13's _abc.is_file re-raises EACCES, 3.14's
          calls os.path.isfile, whose POSIX form swallows any OSError. Measured
          by denying os.stat on a/sub's entries with genericpath.isfile
          substituted: on master, 3.11, 3.12 and 3.13 leak the raw
          PermissionError and 3.14 returns ['a/f.txt'] and (1, 1). So the
          guarantee this PR's docstrings state ("never missing a subtree it
          could not read") was false on CI's 3.14 Linux lanes. Every walk now
          classifies and measures with one stat whose denial propagates, which
          also closed the unprimed member's is_file-then-stat window. The
          sibling sweep (rg on .is_file()/.is_dir() in _local.py) found the
          same defect in the four walks' own starting-folder checks, fixed
          with them; get_file_info and glob have it outside this PR's methods
      - file: tests/backends/local/test_listing_permission.py
        section: "_deny_child_stat, three new tests, chmod 0o444"
        read_type: verify
        extract: >-
          The entry-stat cells failed first on 3.14 (8 of 8) and pass on 3.13
          before the fix, as they must; the race cells failed first on 3.13 (7
          of 7) and not on 3.14, whose native is_file never reaches the patched
          os.stat. The instrument needed both genericpath.isfile and isdir:
          with isfile alone, a get_folder_info top-check mutant survived on
          Windows 3.14 because os.path.isdir is native there. With both, all 19
          mutants die on 3.14; three of them only can, by construction. The
          BE-014 marks on BE-017 cells are now per-parameter
      - file: sdd/CLAUDE-REFERENCE.md
        section: "Pre-work index, Breaking change row; Detailed checklist, Breaking change row"
        read_type: reference
        extract: >-
          The trace's surprising_ripples entry claimed no ripple row names a
          migration section for an unmarked fix. Both presentations do, so the
          entry was removed. The reviewer's half that the quoted clause appears
          only in other traces was wrong: it is the Pre-work index's own text
      - file: docs-src/reference/migration.md
        section: "v0.33.0 to v0.33.1"
        read_type: verify
        extract: >-
          "the type every other LocalBackend operation already answers a denial
          with" was false for glob (measured, [] for a denied top folder) and
          for get_file_info (no PermissionError mapping, read). Narrowed to
          read, write and delete, each checked for an except PermissionError
          arm, and glob is named as unchanged
  - id: fix_4
    name: Fix pass (round 4, panel)
    steps:
      - file: src/remote_store/_store.py
        section: "Store.get_folder_info (max_depth branch)"
        read_type: verify
        extract: >-
          All three members found the claim "Store.get_folder_info answers a
          denial alike for every max_depth" false again, at the site fix_3
          added: a starting folder whose parent cannot be traversed. The
          max_depth branch asks backend.is_folder first, and BE-021 forbids that
          predicate from raising, so no walk-side change reaches it. This is the
          second refutation of the same claim (round 1 at the subtree site), so
          the condition's space was enumerated rather than argued: both Store
          forms joined _ON_SUB, making the table every entry point x every
          denial site, and the one cell that diverges is a strict xfail naming
          BUG-313. The claim was narrowed in BACKLOG-DONE, the test module and
          the PR body, and BUG-313 widened (decided with the user) to the
          predicates exists/is_file/is_folder and this Store path
        outcome: ok
      - file: docs-src/reference/migration.md
        section: "v0.33.0 to v0.33.1, the not-traversable paragraph"
        read_type: verify
        extract: >-
          The measuring member refuted fix_3's own sentence on base 3.14.2: the
          max_depth branch never classified with is_file, so it raised the bare
          PermissionError there rather than losing entries. The paragraph now
          names which calls vanished entries on 3.14 and which raised. fix_3
          measured the premise with list_files(a, recursive) and
          get_folder_info only, and generalised to "these listings"
      - file: tests/backends/local/test_listing_permission.py
        section: "test_an_entry_gone_before_its_stat_is_skipped"
        read_type: verify
        extract: >-
          iter_children's `if st is None: continue` was reached by no cell
          (coverage line 656 missed; deleting it passed the module, and crashed
          on a real dangling junction). The new cell makes an entry's stat find
          it gone for all eight entry points; the deletion mutant now dies. 20
          mutants, all die on 3.14
