$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://github.com/haalfi/remote-store/blob/master/sdd/traces/_schema.yml"
title: "Agent use-case trace"
description: |
  Schema for sdd/traces/*.yml files. Each trace records the ordered sequence
  of files and sections an agent reads to complete a specific type of work,
  tagged with a read_type so cross-trace aggregation can identify hotspot
  files, gate-density rankings, and co-read pairs — signals that drive
  optimisation of the sdd/ documentation structure.

  Traces record what actually happened, not what was supposed to happen.
  Authoring discipline: when a step led nowhere, surfaced an unrelated
  followup, or felt misleading, the step still belongs in the trace —
  tagged with an `outcome` other than `ok`. Cleaned-up "ideal" traces
  silently lie to the aggregator and defeat the whole point of the data.
  The same principle applies to top-level fields: `surprising_ripples`,
  `discovery_followups`, and `review_rounds` are where the messy reality
  of the work lands, and they are the most analytically valuable parts
  of the trace.

  Files prefixed with an underscore (this file: _schema.yml) are
  infrastructure, not traces. Aggregator scripts should glob
  "sdd/traces/[!_]*.yml" to skip them.

type: object
required: [id, title, trigger, source_items, audience, phases]
additionalProperties: false

properties:
  id:
    type: string
    pattern: "^(BK|BUG|ID|AF|BL|UC)-[0-9]+[a-z]?$"
    description: |
      Identifier for the use case — **not unique**. Backlog-derived traces
      reuse the backlog ID (BK-NNN, BUG-NNN, ID-NNN, AF-NNN, BL-NNN per
      sdd/BACKLOG.md "ID prefixes"); hypothetical / generic use cases use
      UC-NNN. The trailing letter form (BK-167a, BK-167b) is allowed for
      split items.

      Because that convention reuses the backlog ID, an item worked across
      several PRs produces several traces carrying the same id. Aggregators
      must key on the trace **filename**, which the filesystem guarantees
      unique; keying on `id` silently collapses those traces into one.

  title:
    type: string
    minLength: 1
    description: One-line title; mirrors the backlog item title where applicable.

  trigger:
    type: string
    minLength: 1
    description: |
      The state of the world that caused this work to be needed. Describes
      what an agent would observe before recognising this use case applies.
      Past tense for backlog-derived traces; present tense for generic ones.

  source_items:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: string
      pattern: "^(BK|BUG|ID|AF|BL)-[0-9]+[a-z]?$"
    description: |
      Backlog IDs this trace was derived from. Convention: the trace's own
      id (without the UC- prefix case) is the first entry; related or
      predecessor items follow.

  audience:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: string
      enum:
        - user.api
        - user.api_docs
        - user.site
        - user.discoverability.llm
        - user.discoverability.human
        - library.maintainer
        - contributor.process
        - contributor.tooling
        - infra.test
        - infra.ci
        - internal.style
    description: |
      Who this change is for. List sorted by priority — the dominant
      audience first; secondary audiences follow when a single change
      legitimately serves multiple constituencies (e.g. a docs-framework
      rollout that also restructures end-user nav).

      Values:
      - user.api                    Runtime behavior, signature, or error
                                    visible to package consumers.
      - user.api_docs               New information in a public docstring
                                    (added Raises:, new param semantics).
                                    Surfaces via help() / IDE hover.
      - user.site                   docs.remotestore.dev pages, layout,
                                    rendering, images.
      - user.discoverability.llm    Outside-package metadata for LLM /
                                    agent discovery (context7.json,
                                    llms.txt, MCP-targeted metadata).
      - user.discoverability.human  Outside-package signals for humans
                                    (README badges, GitHub topics, social
                                    cards).
      - library.maintainer          Internal architecture, invariants, or
                                    implementation choices for people
                                    maintaining the library; not visible to
                                    package consumers.
      - contributor.process         Repo-internal "how we work" artefacts:
                                    specs, ADRs, audits, AUTHORING,
                                    templates.
      - contributor.tooling         hatch scripts, lint / check scripts,
                                    gen scripts, pre-commit hooks.
      - infra.test                  Fixtures, registries, conformance,
                                    placement, live-cloud coverage.
      - infra.ci                    Workflow files, mutation matrix,
                                    scheduled jobs.
      - internal.style              Format-only normalisation with no
                                    content or behavior delta (RST→backtick
                                    sweep, em-dash policing).

      Derived rule: CHANGELOG entry required if any entry in `audience`
      starts with `user.`, or `contributor.process` introduces a new
      user-facing framework / spec. Items tagged only `library.maintainer`,
      `contributor.tooling`, `infra.test`, `infra.ci`, or `internal.style`
      are not user-facing and skip CHANGELOG.

      **One direction, not a biconditional** (`DRIFT-RULES.md` Rule 4,
      declared here because this file owns the rule). "Required" is the half
      that governs: an item that owes an entry and has none is a defect. An
      entry with no such item is not, because an item still open in
      `BACKLOG.md` may have shipped a single bullet.

      **Only part of the required half is mechanised.**
      `scripts/check_changelog_unreleased.py` reads the `user.` prefix, which
      is decidable. The `contributor.process` clause is equally required and is
      **not checked by anything**: whether a change "introduces a user-facing
      framework / spec" is a judgement, so an item tagged only
      `contributor.process` that does introduce one, and ships no entry, passes
      every gate. That is a reviewer's to catch, and naming it here is the only
      thing keeping it from reading as covered — the gate's own Bounds list and
      `CONTRIBUTING.md` § Release Phase 1 both defer to this rule. The gate
      registers the open-item case against `BACKLOG.md` rather than reporting
      it.

  discovery_followups:
    type: array
    uniqueItems: true
    items:
      type: string
      pattern: "^(BK|BUG|ID|AF|BL)-[0-9]+[a-z]?$"
    description: |
      Backlog IDs born during this PR's review or implementation that did
      not exist when the trace was first written. Filled post-merge to
      capture the discovery-cascade pattern (a fix-for-X reveals Y, Z).
      Optional; absent on traces with no surprises.

  co_shipped_items:
    type: array
    uniqueItems: true
    items:
      type: string
      pattern: "^(BK|BUG|ID|AF|BL)-[0-9]+[a-z]?$"
    description: |
      Other backlog IDs closed by the same PR. Use when one PR roll-up
      ships multiple related items so trace aggregators do not double-count
      shared file reads. The owning trace's id is implicit and not
      repeated here.

  expected_ripples:
    type: array
    uniqueItems: true
    items:
      type: string
    description: |
      File paths mechanically touched alongside the work because the
      ripple-check table (or another anticipatory authority) already
      covers them. Examples: `sdd/backlogid.json` after any
      `BACKLOG`/`BACKLOG-DONE` edit; `docs-src/_data/graph/graph.json`
      and `docs-src/explanation/graph_viz.html` after public-API
      docstring changes per the "A public method signature" ripple-check
      row; `src/remote_store/_proxy.py` and `src/remote_store/ext/*.py`
      after a new Store method per the "A Store method" row. These tag
      along by design; recording them lets aggregators distinguish
      "files the schema anticipated" from the cited reads in `phases`.

  surprising_ripples:
    type: array
    uniqueItems: true
    items:
      type: string
    description: |
      File paths the work needed to touch but neither the trace's cited
      reads nor the ripple-check table anticipated — places where doc /
      gate coverage failed. These are the analytically valuable ripples:
      a recurring entry here points at a missing ripple-check row, a
      stale spec, or a doc that did not flag a downstream dependency.
      Examples observed in Phase 3: `.github/workflows/ci.yml` after a
      `pyproject.toml` lint-scope expansion (caught only in PR review);
      `docs-src/_data/graph/graph.json` after a docstring sweep when the
      ripple-check table did not flag graph regen.

  review_rounds:
    type: integer
    minimum: 0
    description: |
      Count of review-driven iterations on the merged PR — commits that
      exist specifically because review feedback was incorporated.
      0 means the first push merged without revision; higher counts
      signal the trace under-modelled the actual work surface.

      **Superseded at the top level by `review:` below, from BK-378
      onward.** A trace authored under RFC-0015 D4 carries this field
      *inside* the `review:` block, where `scripts/ship_report.py` writes
      it; the top-level field stays declared, and optional, because the
      existing corpus uses it and is not retrofitted. Run
      `rg '^review_rounds:' sdd/traces` for that corpus's extent.

      **The derivation is the script, and that is the whole clause now.**
      What stood here before was a rule for hand-counting: name the
      commits, or better name the query, in a comment above the field.
      It failed in four measured ways on one branch (PR #994), the
      governing one being that a transcribed list goes stale on the next
      push. A hand-written figure about the loop is what D4 removes, so
      the remedy is no longer a better convention for writing one.

      **Two members of that class survive, by construction, and deriving
      removes neither.** First, a list cannot include the commit that
      carries it: the script reads ``<base>..<head>`` before the paste
      commit exists, so re-running the stated derivation afterwards
      returns one more. Second, the SHAs stop resolving at the merge —
      they name commits on the PR branch and this repo squash-merges, so
      a derived list is orphaned on arrival exactly as a transcribed one
      is. See ``review_driven_commits`` and ``pr`` in the `review:` block
      below; `pr` is the handle that survives. Both offsets are fixed and stated in
      ``scripts/ship_report.py``'s Bounds; what D4 removes is the drift,
      not the offsets. The block measures the loop up to the close.

      Where a deterministic count of a *different* thing is wanted —
      formal review-submission events rather than fix commits — the
      `review:` block prints it as `submissions` beside this one, from the
      same run. Reaching for `gh` directly instead needs care the block
      avoids: `gh pr view <N> --json reviews` emits
      `{"reviews": [...]}`, so a bare `--jq 'length'` returns 1, the
      object's key count, and the filter has to reach into `.reviews`. A
      "deterministic independent measurement" that silently returns 1 is
      the fail-silently class this repo calls worse than none.

  review:
    type: object
    additionalProperties: false
    required:
      # All ten, because the emitter writes all ten unconditionally. Leave any
      # of them optional and an emitter that *dropped* that field would validate
      # everywhere, making the "cannot diverge silently" claim below false in
      # the direction that matters. `additionalProperties: false` catches a
      # field added without a property; this catches one removed without one.
      [derivation, pr, review_rounds, submissions, findings, by_round, by_file, untouched_files,
       review_driven_commits, ci]
    description: |
      The loop's own figures, derived from the PR after it closed and
      pasted verbatim (RFC-0015 D4, BK-378). **Produced by
      `hatch run ship-report <PR> --trace-block-only`; never hand-written
      and never hand-edited.** That is the point of the key: it gives the boundary
      between the deliverable and the record a name a check can see, so
      the trace's *reads* stay logged as they happen while everything
      about the review arrives in one block at the close.

      The authority runs one way: the script's output governs, and this
      schema describes what the script emits. The pair is a drift gate
      rather than a convention, and it closes in **both** directions —
      `additionalProperties: false` fails a field the emitter adds
      without a property here, and the all-ten `required:` list fails
      one it drops. Either alone leaves the other direction silent.

      **What it does not reach**, per DRIFT-RULES Rule 7: the field
      *values*. A property declares a type, so an emitter that wrote a
      correct-shaped wrong number passes. The figures are checked by the
      script's own guards, not here.

      Traces predating BK-378 carry their hand-derived `review_rounds` at
      the top level and are not retrofitted.

      **Adding a required field retrofits existing blocks by hand, and that
      is the one sanctioned hand-edit.** Re-running the script instead would
      re-measure the loop at today's head rather than at the close it
      recorded — `pr` was added to `bk-378-d1-d4.yml` this way, and a
      regeneration would have moved its `review_rounds` from 9 to 11, which
      is the paste-commit offset, not a correction. Copy the new field's
      value from the block the script emits now; leave every field the
      original run measured alone, and mark the retrofit in a comment.
    properties:
      derivation:
        type: string
        minLength: 1
        description: >-
          The command that produced this block, re-runnable as written. A
          re-run after the paste commit lands returns `review_rounds + 1`;
          see that field and `scripts/ship_report.py`'s Bounds.
      pr:
        type: integer
        minimum: 1
        description: |
          The pull request this block measures — **the only field here that
          still resolves once the PR is merged.** Every `sha` in
          `review_driven_commits` names a branch commit, and a squash merge
          retires them all, so a reader who needs the commit that actually
          landed resolves it from this number:
          `gh pr view <N> --json mergeCommit`.

          The squash SHA itself is deliberately not a field. The block is
          pasted while the PR is still open, where GitHub's
          `merge_commit_sha` is an ephemeral test-merge commit rather than the
          eventual squash — a plausible hash that resolves to nothing, which
          is the failure the `examples` block below already warns about.
      review_rounds:
        type: integer
        minimum: 0
        description: |
          Commits in `<base>..<head>` authored **at or after** the first
          review submission that carried a finding — the same boundary the
          origin tag uses to call a line `loop-introduced`, which splits on
          `authored < first_review_ts`, so the tie belongs to the loop on
          both sides and the two cannot disagree about when the loop began.
          Author dates are the discriminator because they survive a rebase;
          commit identity does not. **Excludes the commit that pastes this
          block**, which does not exist when the script reads the range, so
          a re-run afterwards returns one more.
      submissions:
        type: integer
        minimum: 0
        description: |
          Formal review submissions carrying at least one finding. A
          different measurement from `review_rounds` — review events, not
          fix commits — and reported beside it rather than instead of it.
      findings:
        type: integer
        minimum: 0
        description: Findings across all submissions; comments with no `in_reply_to_id`.
      by_round:
        type: array
        description: Per submission, in submission-time order — findings, origin and triage counts, elapsed hours.
        items:
          type: object
          additionalProperties: false
          # All five: the emitter writes every one for every entry, so an
          # optional field here reopens the drop direction the top-level
          # `required:` closes.
          required: [round, findings, origin, triage, duration_hours]
          properties:
            round: {type: integer, minimum: 1}
            findings: {type: integer, minimum: 0}
            origin: {type: object, description: "Origin tag counts, per sdd/rfcs/rfc-0015-findings.py."}
            triage: {type: object, description: "Triage verdict counts, per the same classifier."}
            duration_hours:
              type: [number, "null"]
              description: |
                Wall-clock from the previous submission, or from the PR's
                creation for the first. Elapsed time, not work: a pass that
                waited on a human reads as a long pass.
      by_file:
        type: array
        description: |
          Findings per file, descending. This is the distribution a brief
          quotes to say which surface review has *not* reached; it replaced
          a two-call recipe run by hand each round.
        items:
          type: object
          additionalProperties: false
          required: [path, findings]
          properties:
            path: {type: string, minLength: 1}
            findings: {type: integer, minimum: 1}
      untouched_files:
        type: array
        description: Changed files carrying no finding — the changed-file list minus the union of finding paths across every page.
        items: {type: string}
      review_driven_commits:
        type: array
        description: |
          The commits `review_rounds` counts, oldest first.

          **These SHAs are a mid-loop handle and stop resolving at the merge.**
          They name commits on the PR branch, and this repo squash-merges, so
          none of them reaches `master` — measured on the first trace shipped
          under D4, where `git merge-base --is-ancestor <sha> origin/master`
          succeeded for 0 of its 9. Reachability rather than `git cat-file -e`,
          which answers whether *this clone* has fetched the PR's refs and so
          reports the clone instead of the repository. That is true of a
          *derived* list exactly as it was
          of a hand-written one; what deriving removes is the content going
          silently stale, not the SHAs dying. The durable handle is `pr`.

          The `subject` line is what survives as content, and is why each entry
          carries one rather than a SHA alone.
        items:
          type: object
          additionalProperties: false
          required: [sha, subject]
          properties:
            sha: {type: string, minLength: 7}
            subject: {type: string}
      ci:
        type: object
        additionalProperties: false
        # All three, as everywhere else in this block: the emitter writes them
        # unconditionally. Without a `required:` at all, `ci: {}` validated and
        # an emitter that stopped writing the verdict passed.
        required: [verdict, failed, pending]
        description: |
          CI's verdict on the final head. `pending` is reported separately
          from `failed` because a still-running matrix is not a green one.
        properties:
          verdict: {type: string, enum: [GREEN, RED, PENDING, "NO CHECKS"]}
          failed: {type: integer, minimum: 0}
          pending: {type: integer, minimum: 0}

  phases:
    type: array
    minItems: 1
    items:
      $ref: "#/$defs/phase"
    description: |
      Ordered list of phases the work moved through. Common phase ids:
      orient, spec, tests, implement, fix, docs, verify, reproduce,
      design, classify, audit, report, wire. The schema does not enum
      these — phases are contextual; aggregators discover them.

$defs:
  phase:
    type: object
    required: [id, name, steps]
    additionalProperties: false
    properties:
      id:
        type: string
        pattern: "^[a-z][a-z0-9_]*$"
        description: |
          Short snake_case identifier, stable across traces so an
          aggregator can count phase occurrences (e.g. "orient appears in
          92% of traces"). Reuse existing ids when the meaning matches.
      name:
        type: string
        minLength: 1
        description: Human-readable phase name shown to readers.
      steps:
        type: array
        minItems: 1
        items:
          $ref: "#/$defs/step"

  step:
    type: object
    required: [file, section, read_type, extract]
    additionalProperties: false
    properties:
      file:
        type: string
        minLength: 1
        description: |
          Repo-relative file path (e.g. "CLAUDE.md", "sdd/specs/001-store-api.md",
          "pyproject.toml") OR a guidance placeholder:
          - "sdd/specs/{analog}" — pick one similar spec as a structural reference
          - directory paths like "tests/aio/ext/" — "browse this tree"
          External URLs and absolute paths are not allowed.

      section:
        type: string
        minLength: 1
        description: |
          Section reference within the file. Accepted forms:
          - Heading text: "Principles", "Bug-fix protocol"
          - Numbered heading: "4 (Docstrings)", "12 (Extension API contract)"
          - Spec ID or list: "WR-001a, WR-004", "BE-008, BE-010, BE-021"
          - Cross-doc table row: "Ripple-check table / Bug fix"
          - Special markers: "(full)", "(item)", "[Unreleased]"
          The section text should be precise enough for an agent to find
          the section without re-reading the whole file.

      read_type:
        type: string
        enum: [gate, reference, verify]
        description: |
          gate      — must be read and satisfied before the phase can
                      proceed; blocks progress if skipped.
          reference — consulted during the phase; conditional on specifics.
          verify    — checked at the end to confirm completeness; the
                      ripple-check phase is all verify.

      extract:
        type: string
        minLength: 1
        description: |
          One short phrase capturing what to take from this read — the
          information that justifies the step appearing in this phase.
          Imperative mood, no terminal period required. When the
          motivation for the read is non-obvious from the section name
          alone (e.g., the agent reached for this doc to clarify an
          edge case the previous step did not cover), encode the
          motivation here too rather than splitting it into a separate
          field. Pair with `outcome` when the read did not deliver
          what was hoped for.

          The field therefore carries two registers, and both are
          licensed: the prospective phrase above, and a retrospective
          clause recording how the step actually landed. The
          retrospective half is where an agent's **own** miss goes — a
          verification that returned a false pass, a conclusion drawn
          from the wrong artifact — because `outcome` names which
          document failed a reader and must not be used to blame a
          document for the reader's error. A retrospective clause may
          be a sentence rather than a phrase and past tense rather than
          imperative; keep it to what a later reader needs.

          Aggregators: nothing marks which register a given `extract`
          is in, so it cannot be read as a description of the failure.

      outcome:
        type: string
        enum: [ok, unclear, misleading]
        description: |
          Optional retrospective tag for how the read landed:
          - ok          (default if absent) — the read delivered the
                        information the `extract` describes; no further
                        work needed at this step.
          - unclear     the section was on-topic but vague or
                        incomplete; the agent had to compensate (read
                        adjacent sections, ask for clarification, infer
                        from code). Recurring `unclear` on a section is
                        a doc-improvement signal.
          - misleading  the section told the agent something that
                        proved wrong, stale, or contradictory with
                        another authority. The strongest doc-failure
                        signal in the schema.
          Authors fill this post-merge when known; aggregators treat
          absent values as `ok` for ranking but should still surface
          coverage gaps (e.g., "12% of steps carry an explicit outcome
          tag" is itself a signal about authoring discipline).

examples:
  - id: BK-176
    title: "AsyncMemoryBackend metadata round-tripping parity"
    trigger: "AsyncMemoryBackend.get_file_info omitted metadata=node.metadata while sync MemoryBackend passed it through"
    source_items:
      - BK-176
    audience:
      - user.api
    discovery_followups:
      - BK-192
    expected_ripples:
      - sdd/backlogid.json
    # This example is what CLAUDE.md tells a new trace author to copy, so it
    # carries the `review:` block rather than a hand-counted `review_rounds`.
    # Do not fill it in by hand: run `hatch run ship-report <PR> --trace-block-only`
    # at the close and paste its output as a top-level key (it already opens with
    # `review:`; the bare command prints the Markdown report instead). The
    # placeholder SHA below is deliberately not a
    # plausible one — a fake that resolves to nothing is worse than no
    # derivation, and the script writes the real ones.
    review:
      derivation: "hatch run ship-report 1025 --trace-block-only"
      pr: 1025
      review_rounds: 1
      submissions: 1
      findings: 2
      by_round:
        - round: 1
          findings: 2
          origin: {original: 2}
          triage: {must-fix: 2}
          duration_hours: 0.52
      by_file:
        - path: src/remote_store/aio/_async_memory.py
          findings: 2
      untouched_files:
        - tests/backends/memory/test_async_metadata.py
      review_driven_commits:
        - sha: "0000000"
          subject: "BK-176: round-trip metadata in AsyncMemoryBackend"
      ci: {verdict: GREEN, failed: 0, pending: 0}
    phases:
      - id: orient
        name: Orient
        steps:
          - file: sdd/specs/029-async-store-backend-api.md
            section: "ASYNC-016"
            read_type: gate
            extract: "AsyncMemoryBackend metadata round-trip contract"
            outcome: ok
      - id: verify
        name: Verify
        steps:
          - file: sdd/CLAUDE-REFERENCE.md
            section: "Ripple-check table / Bug fix"
            read_type: verify
            extract: "BACKLOG item, CHANGELOG stub, failing test before fix"
            outcome: ok
