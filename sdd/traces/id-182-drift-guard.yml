id: ID-182
title: "Scheduled CI drift guard for unbounded extra-dependency floors"
trigger: |
  PR 613 closed two paramiko silent-upgrade breakages back-to-back
  (BUG-204 channel_timeout: 2.x -> 3.x; BK-198 ssh-rsa: 4.x -> 5.x).
  Both shared the same shape: an unbounded floor in `pyproject.toml`,
  a working install on day N, a transitive upgrade on day N+3, a
  broken install on day N+3. The pattern applies to every extra
  (s3, azure, sql, arrow, ...), not just sftp. Without a guard, the
  next one is just a matter of time.

source_items:
  - ID-182

audience:
  - user.site
  - infra.ci
  - contributor.tooling

expected_ripples:
  - sdd/backlogid.json
  - CHANGELOG.md

phases:
  - id: orient
    name: Orient
    steps:
      - file: pyproject.toml
        section: "[project.optional-dependencies] (lines 53-74)"
        read_type: gate
        extract: "Inventory the extras the guard must cover; confirm none have ceilings"
      - file: sdd/traces/BUG-204-paramiko-lower-bound.yml
        section: "phases / tests"
        read_type: reference
        extract: "Shape of the signature-introspection test that would have caught the 2.x->3.x drift if run weekly"
      - file: sdd/traces/BK-198-ssh-rsa-compat.yml
        section: "(full)"
        read_type: reference
        extract: "Shape of the legacy-sftp e2e — the deterministic fixture the backlog cites as the model"
      - file: .github/workflows/mutation.yml
        section: "schedule + workflow_dispatch + setup job"
        read_type: reference
        extract: "Established pattern for scheduled jobs with matrix-from-script and per-event dispatch fallback"
      - file: .github/actions/start-backends/action.yml
        section: "(full)"
        read_type: reference
        extract: "Reuse for s3/azure/sftp smokes; legacy-sftp comes via docker-compose"

  - id: design
    name: Design
    steps:
      - file: scripts/gen_features.py
        section: "_load_pyproject + main (--check pattern)"
        read_type: reference
        extract: "Existing template for tomllib-driven scripts with a --check staleness mode"
      - file: sdd/traces/_schema.yml
        section: "audience derived rule (line 115)"
        read_type: gate
        extract: "user.site in audience -> CHANGELOG entry required"

  - id: implement
    name: Implement
    steps:
      - file: scripts/drift_check.py
        section: "(full)"
        read_type: reference
        extract: "Stdlib-only resolver + diff + render-docs subcommands"
      - file: scripts/drift_smoke_map.py
        section: "SMOKE_TARGETS / backends_needed"
        read_type: reference
        extract: "Per-extra pytest selection routing; existing tests/ext/ modules as the most-likely-to-break surface"
      - file: scripts/drift_report.py
        section: "(full)"
        read_type: reference
        extract: "Rolling-issue reconciliation via the gh CLI"
      - file: .github/workflows/drift-guard.yml
        section: "(full)"
        read_type: reference
        extract: "Mon 07:00 UTC + workflow_dispatch; matrix over extras; per-extra artefacts; single report job"
      - file: infra/drift-locks/README.md
        section: "(full)"
        read_type: reference
        extract: "File-format and bootstrap docs for the lock directory; stubs ship empty awaiting first refresh"
      - file: docs-src/reference/tested-versions.md
        section: "(generated)"
        read_type: reference
        extract: "User-facing page derived from the locks; first-population-pending sections until baselines are refreshed"

  - id: verify
    name: Verify
    steps:
      - file: sdd/CLAUDE-REFERENCE.md
        section: "Ripple-check table / Dependency"
        read_type: verify
        extract: "pyproject extras + pins, README install, docs prerequisites — README install is unchanged; docs prerequisites get the new Tested-versions page"
      - file: sdd/CLAUDE-REFERENCE.md
        section: "Ripple-check table / Backlog item touched"
        read_type: verify
        extract: "Trace ships in the same PR; audience priority-sorted; CHANGELOG required because user.site is in audience"
      - file: sdd/CLAUDE-REFERENCE.md
        section: "Ripple-check table / Docs navigation"
        read_type: verify
        extract: "docs-src/reference/_nav.yml updated for the new Tested-versions page"
