id: BK-191
title: "Audit _BACKEND_AT_ROOT_GRANDFATHERED allow-list"
trigger: "BK-190 grandfathered seven legacy tests/test_*.py files that import concrete cloud backends; BK-191 asks for a per-file disposition (a: per-backend split, b: conformance reshape, c: keep at root) before any of them can be retired from the allow-list"
source_items:
  - BK-191
  - BK-190
audience:
  - infra.test
  - contributor.process
phases:
  - id: orient
    name: Orient
    steps:
      - file: scripts/check_test_placement.py
        section: "_BACKEND_AT_ROOT_GRANDFATHERED, _BANNED_BACKEND_NAMES, _ALLOWED_BACKEND_MODULES, _compute_backend_violations"
        read_type: gate
        extract: "Rule B walks the full AST so function-local imports also fire; allowed modules are _memory, _local, _fileinfo; stale-grandfather detection auto-reports dead allow-list entries"
      - file: sdd/specs/048-testing-architecture.md
        section: "TEST-003"
        read_type: gate
        extract: "backend-specific tests live under tests/backends/<x>/; cross-protocol behaviour goes to conformance"
      - file: sdd/CLAUDE.md
        section: "Audits"
        read_type: gate
        extract: "Report only. Present findings with evidence. Do not fix anything. User decides next steps."
  - id: classify
    name: Per-file classification
    steps:
      - file: tests/test_config.py
        section: "test_sftp_* / test_s3_* / test_azure_* / test_s3_pyarrow_* (lines 351-881)"
        read_type: reference
        extract: "every nested concrete-backend import is a per-backend assertion; disposition (a) per-backend split"
      - file: tests/test_coverage_gaps.py
        section: "_MASKING_UNSET_CASES, _SECRET_CASES, factory helpers (lines 378-512)"
        read_type: reference
        extract: "lines 491-512 use __import__ string form to evade the AST scan; lines 378-427 are normal function-local imports; secret-masking is cross-protocol (b), init coverage is per-backend (a)"
      - file: tests/test_depth_listing.py
        section: "lines 294 (sftp), 459 (s3_base), 469 (azure)"
        read_type: reference
        extract: "bulk file is DEPTH-001..004 on Memory/Local; three nested imports inject backend-specific flat-namespace / HNS cases — (b) reshape conformance, lift three snippets per-backend"
      - file: tests/test_examples.py
        section: "line 531 (ReadOnlyHttpBackend)"
        read_type: reference
        extract: "single banned-backend site; file purpose (ID-044) is example-test 1:1 binding — disposition (c) keep at root with documented justification"
      - file: tests/test_pbt_write_result.py
        section: "lines 267 (s3 moto), 299 (azure azurite)"
        read_type: reference
        extract: "Hypothesis-driven WR-* on Local/Memory; S3/Azure metadata round-trip is per-backend SDK boundary — (b) conformance for size regimes, (a) per-backend for metadata round-trip"
      - file: tests/test_ping.py
        section: "_s3_backend / _sftp_backend / _azure_backend helpers (lines 46, 61, 79, 206)"
        read_type: reference
        extract: "each helper mocks one SDK; tests assert backend-specific health endpoint — disposition (a) per-backend split"
      - file: tests/test_seekable.py
        section: "parametrize table (64-68), _ALL_CAPABILITIES imports (85, 91), _AzureRangeReader cluster (324-388)"
        read_type: reference
        extract: "SEEK-001 capability declaration is cross-protocol (b conformance); _AzureRangeReader cluster is Azure-specific (a per-backend)"
  - id: verify
    name: Verify
    steps:
      - file: scripts/check_test_placement.py
        section: "stale-grandfather detection"
        read_type: verify
        extract: "experiment: removed test_config.py from allow-list, lint produced 11 fresh Rule B violations; confirms (c) easy-removal path does not exist; reverted the experimental edit"
      - file: sdd/audits/audit-014-grandfathered-tests-allow-list.md
        section: "(full)"
        read_type: gate
        extract: "captured findings, corrected the pre-audit chat-only summary, suggested per-slice follow-up items BK-209..BK-215"
      - file: sdd/BACKLOG.md
        section: "BK-191 (umbrella item)"
        read_type: gate
        extract: "added audit-link block to the BK-191 entry; BK-191 stays open as umbrella until per-slice follow-ups close"
discovery_followups: []
surprising_ripples: []
review_rounds: 0
