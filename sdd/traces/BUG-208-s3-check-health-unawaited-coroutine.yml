id: BUG-208
title: "S3Backend.check_health() silently no-ops (unawaited aiobotocore coroutine)"
trigger: |
  BK-217's conformance assertion (tests/backends/conformance/test_check_health.py)
  ran check_health() against the moto-backed s3_moto fixture for real and
  surfaced a PytestUnraisableExceptionWarning: S3Backend.check_health() called
  self._fs.s3.head_bucket(Bucket=...) on the raw aiobotocore client, whose
  head_bucket returns a coroutine the code never awaited. The HEAD never
  reached the server, check_health() silently returned None regardless of
  bucket state, and the orphaned coroutine raised RuntimeWarning at GC. Every
  mocked test patched the s3fs client, so the aiobotocore path was never
  exercised.
source_items:
  - BUG-208
  - BK-217
audience:
  - user.api
expected_ripples:
  - sdd/backlogid.json
  - CHANGELOG.md
phases:
  - id: orient
    name: Orient
    steps:
      - file: sdd/BACKLOG.md
        section: "BUG-208 (S3 Correctness)"
        read_type: gate
        extract: "defect, fix direction (s3fs sync wrapper, not the raw aiobotocore client), and the ask to audit every other self._fs.s3.<method> use"
      - file: sdd/000-process.md
        section: "Rule 6 (Workflows / Bug fixes)"
        read_type: gate
        extract: "bug-fix pipeline BACKLOG -> CHANGELOG -> failing TEST -> FIX -> COMMIT together; update the spec when the bug contradicts a spec invariant"
      - file: sdd/specs/026-health-check.md
        section: "PING-004, PING-009"
        read_type: gate
        extract: "PING-004's code block codified the buggy call self._fs.s3.head_bucket(...) verbatim — the spec itself carried the defect"
        outcome: misleading
      - file: src/remote_store/backends/_s3.py
        section: "check_health + write/get_file_info call_s3 usages"
        read_type: gate
        extract: "call_s3('head_object', ...) is the established synchronous s3fs wrapper, already used twice; check_health was the lone raw-client caller"
      - file: src/remote_store/backends/_s3_base.py
        section: "_s3fs_errors, call_s3 usage across S3 backends"
        read_type: reference
        extract: "audit result: check_health is the only self._fs.s3.<method> call; _s3_base and _s3_pyarrow already route everything through call_s3 — no guard needed"
  - id: reproduce
    name: Reproduce
    steps:
      - file: src/remote_store/backends/_s3.py
        section: "check_health (moto reproduction)"
        read_type: verify
        extract: "confirmed against moto: current code leaks the coroutine and returns None for a missing bucket; call_s3('head_bucket', Bucket=...) issues the HEAD and raises NotFound on a 404"
  - id: tests
    name: Failing test first
    steps:
      - file: tests/backends/conformance/test_check_health.py
        section: "TestCheckHealthConformance (BUG-208 xfail block)"
        read_type: gate
        extract: "removed the s3 xfail block and the now-unused request param; test fails for s3_moto on the leaked-coroutine warning before the fix"
      - file: tests/backends/s3/test_ping.py
        section: "TestS3CheckHealthMoto (new class)"
        read_type: gate
        extract: "new moto-backed regression class — live bucket -> None, missing bucket -> NotFound — exercises the real aiobotocore path the MagicMock tests skipped"
  - id: fix
    name: Fix
    steps:
      - file: src/remote_store/backends/_s3.py
        section: "check_health"
        read_type: gate
        extract: "self._fs.s3.head_bucket(Bucket=...) -> self._fs.call_s3('head_bucket', Bucket=self._bucket)"
      - file: tests/backends/s3/test_ping.py
        section: "_s3_backend helper + test_s3_probe_is_head_bucket"
        read_type: reference
        extract: "mocked tests retargeted from s3.head_bucket to call_s3; probe-identity assertion now checks call_s3('head_bucket', Bucket=...)"
      - file: sdd/specs/026-health-check.md
        section: "PING-004"
        read_type: gate
        extract: "code block updated to call_s3('head_bucket', ...); note added on why the raw aiobotocore client returns an un-issued coroutine"
  - id: verify
    name: Verify
    steps:
      - file: tests/backends/s3/test_ping.py
        section: "(collection) + conformance test_check_health.py + s3/test_moto.py"
        read_type: verify
        extract: "all pass after the fix; conformance s3_moto no longer xfailed"
      - file: sdd/CLAUDE-REFERENCE.md
        section: "Ripple-check table / Bug fix"
        read_type: verify
        extract: "BACKLOG item moved to BACKLOG-DONE, CHANGELOG stub under [Unreleased], failing test before fix, spec updated since the invariant was contradicted"
      - file: sdd/traces/_schema.yml
        section: "audience derived rule"
        read_type: verify
        extract: "audience user.api -> CHANGELOG entry required; stub added"
  - id: iterate
    name: Iterate (CI + review + self-audit)
    steps:
      - file: tests/backends/s3/test_ping.py
        section: "_s3_backend helper / new _sync_call_s3_spec"
        read_type: gate
        extract: "CI failed on Python 3.13 only: MagicMock(spec=S3FileSystem).call_s3 was auto-promoted to AsyncMock because unittest.mock._mock_add_spec (3.12+) calls inspect.unwrap() before iscoroutinefunction, and s3fs's call_s3 = sync_wrapper(_call_s3) carries __wrapped__ to the async _call_s3. Pinned the child mock to sync via MagicMock(spec=_sync_call_s3_spec). Python 3.11 was unaffected locally — the drift was version-specific and only caught at CI (commit 5a2375f)"
        outcome: misleading
      - file: sdd/specs/026-health-check.md
        section: "PING-004 (post-review)"
        read_type: gate
        extract: "Reviewer flagged pre-existing inaccuracy: spec said 'inside _errors()' but the S3 backend uses _s3fs_errors(). Pre-existed the PR; fixed here because the section was edited (commit eb3cff1)"
        outcome: misleading
      - file: CHANGELOG.md
        section: "[Unreleased] BUG-208 stub"
        read_type: gate
        extract: "Reviewer applied the CLAUDE-REFERENCE.md ripple-check 'CHANGELOG entry' rule (one-line stub at top of [Unreleased]; release skill expands at version bump). Reduced from three sentences to a single line (commit eb3cff1)"
      - file: tests/backends/s3/test_ping.py
        section: "module docstring + _sync_call_s3_spec docstring"
        read_type: gate
        extract: "Reviewer asked to relocate the Python 3.12+ __wrapped__ rationale from the spec-stub function docstring (which a developer may not read) into the module docstring (commit eb3cff1)"
      - file: sdd/CONTENT-RULES.md
        section: "Rules 4 and 5"
        read_type: gate
        extract: "Self-audit found rule 4 (one copy per fact) and rule 5 (source-code facts in source) violations: the _s3.py code comment duplicated the spec's WHY, and the PING-004 note's '(the same path head_object already uses)' cross-referenced source state that could rot. Trimmed both (commit 739eddf)"
      - file: tests/backends/s3/test_ping.py
        section: "module-level importorskip block"
        read_type: gate
        extract: "Second-round review (LGTM, non-blocking minor): TestS3CheckHealthMoto imported boto3 inside the test body with no module-level pytest.importorskip('boto3'). moto pulls in boto3 transitively so the _s3_available()-gated moto_server fixture covers it in practice, but tests/backends/s3/test_moto.py keeps the defensive importorskip for parity. Added pytest.importorskip('boto3') next to the existing s3fs guard (commit 8f12bf7)"
discovery_followups: []
