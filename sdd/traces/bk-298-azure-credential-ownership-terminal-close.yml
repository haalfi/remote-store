id: BK-298
title: "Azure credential ownership + cross-backend terminal close (Azure + S3)"
trigger: >
  Audit-019 (ID-219 Azure DX review) flagged two orthogonal close-time risks.
  H1: close()/aclose() close self._resolved_credential with no ownership flag,
  so a caller-supplied credential= (e.g. a shared DefaultAzureCredential) is
  torn down across the user's app. M1: neither Azure twin has a _closed guard
  and AZ-029 blesses re-initialise-on-demand — the exact postcondition that was
  Graph's BUG-219, live-confirmed (exists() succeeded after close()). The user
  chose to align Azure + all three S3 backends with Graph's terminal close.
source_items:
  - BK-298
audience:
  - user.api
  - library.maintainer
discovery_followups:
  - BK-306
expected_ripples:
  - sdd/backlogid.json
surprising_ripples:
  - src/remote_store/_backend.py
  - src/remote_store/aio/_async_backend.py
  - src/remote_store/backends/_s3_pyarrow.py
  - src/remote_store/backends/_s3_boto3.py
phases:
  - id: orient
    name: Orient
    steps:
      - file: sdd/audits/audit-019-azure-backend-review.md
        section: "H1, M1, G1 proposal"
        read_type: gate
        extract: "H1 is a clear ownership bug (add created_credential flag, close only backend-created creds); M1 is a posture decision (terminal vs reuse). H2/M2 already fixed separately."
        outcome: ok
      - file: sdd/traces/bug-219-graph-aclose-guard.yml
        section: "(full)"
        read_type: gate
        extract: "Graph's terminal-close pattern: _closed bool, central client property raises BackendUnavailable, aclose() flips _closed first and cleans via raw refs. BackendUnavailable reused (no new ERR id)."
        outcome: ok
      - file: src/remote_store/backends/_azure_common.py
        section: "resolve_credential"
        read_type: gate
        extract: "Owned credential is only the DefaultAzureCredential branch (credential/account_key/sas_token all None). account_key/sas_token resolve to strings; connection_string never populates _resolved_credential. Ownership is computable from constructor inputs — no signature change needed."
        outcome: ok
      - file: sdd/specs/003-backend-adapter-contract.md
        section: "BE-020, BE-028"
        read_type: gate
        extract: "BE-020 says close() is optional/no-op; no cross-backend terminal-close contract exists. BE-028 is the posture-family home for a declared close posture."
        outcome: ok
  - id: tests
    name: Failing test first
    steps:
      - file: tests/backends/azure/test_config.py
        section: "TestAzureLifecycle"
        read_type: gate
        extract: "H1: caller-supplied credential= must not be closed (pre-fix the close-everything code closed it — confirmed failing for the right reason). Updated the BUG-156 test to model an owned credential (account_key=None)."
        outcome: ok
      - file: tests/backends/s3/test_shared.py
        section: "TestS3SharedTerminalClose"
        read_type: gate
        extract: "Parametrised use-after-close + posture-declared assertions over all three S3 backends; construct directly with a fake endpoint since the guard short-circuits before any network."
        outcome: ok
  - id: implement
    name: Implement
    steps:
      - file: src/remote_store/backends/_azure.py
        section: "__init__ (_created_credential, _closed), close(), _raise_if_closed, lazy properties"
        read_type: gate
        extract: "H1: compute _created_credential from constructor inputs (no resolve_credential signature change → no ripple to its unit tests or the detect path); close() gates the credential close on it. M1: _raise_if_closed guards all four lazy properties; close() flips _closed first, tears down via raw refs."
        outcome: ok
      - file: src/remote_store/_backend.py
        section: "Backend.close_is_terminal, close() docstring"
        read_type: gate
        extract: "Declared close_is_terminal: ClassVar[bool] = False on the ABC (and mirror on AsyncBackend) so the posture is a first-class contract; terminal backends override True. Conformance lane reads it directly."
        outcome: ok
      - file: src/remote_store/backends/_s3_base.py
        section: "close_is_terminal, _closed class attr, _raise_if_closed"
        read_type: gate
        extract: "Shared guard for S3Backend + S3PyArrowBackend. _S3Base has no __init__, so _closed is a class-attribute default flipped by each subclass close(). S3Boto3Backend (not _S3Base) carries its own copy."
        outcome: ok
  - id: verify
    name: Verify / ripple-check
    steps:
      - file: src/remote_store/backends/_azure.py
        section: "BackendUnavailable import"
        read_type: verify
        extract: "Formatter (ruff --fix) stripped the BackendUnavailable import added before its first usage existed → NameError surfaced as a classified RemoteStoreError at runtime. Re-added after usages were in place; add the import last in future."
        outcome: misleading
      - file: tests/backends/conformance/test_close_posture.py
        section: "test_close_posture (+ aio sibling)"
        read_type: verify
        extract: "Cross-backend lane. Terminal assertion is tier-safe (guard short-circuits before cassette/network). The in-memory SQLite fixture loses its table on close(), so the reusable branch forbids only the terminal 'is closed' guard, not all errors."
        outcome: ok
      - file: sdd/CLAUDE-REFERENCE.md
        section: "Ripple-check table / Backend behaviour + error surface"
        read_type: verify
        extract: "Spec amended (AZ-029/BE-020/S3-019/S3PA-020/GR-051), failing test before fix, CHANGELOG (user.api ×2), BACKLOG→DONE + backlogid.json, trace shipped same PR. BK-306 filed for the orthogonal s3fs session-release gap."
        outcome: ok
