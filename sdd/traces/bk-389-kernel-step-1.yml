# The kernel PR's orient (2026-10-11); the planning PRs predate the key.
orient:
  - items: [BK-399]
    verdict: constrains
    evidence: >-
      Its open decision is this PR's: BK-389's dossier decision 6 says what a
      listing yields for a stored backslash key "is BK-399's, decided in this
      item's kernel PR", and BK-395's dossier § Outcome leaves it open, so the
      kernel's listing path must encode an answer.
  - items: [BK-394, BK-398]
    verdict: constrains
    evidence: >-
      BK-394's dossier decision 2 makes the kernel public there, so this PR
      exports nothing; its item 4 keeps every spec amendment but BK-389's
      item 8 clauses. BK-398 lands before BK-394 and "not before this item's
      kernel PR" (BK-389 decision 6, Clauses checked).
  - items: [BK-345]
    verdict: constrains
    evidence: >-
      BK-345's dossier § Correction (2026-10-02): the absent-container answers
      per Op "is now a fake-driver kernel cell in BK-389"; the registry gate
      stays BK-345's from D3 step 2.
  - items: [BUG-276, BUG-293]
    verdict: constrains
    evidence: >-
      BUG-276's dossier § Decision: "synthesise", the kernel's ERR-009 floor;
      RFC-0017 D2: "a RemoteStoreError already typed passes through untouched
      (BUG-293)". The kernel encodes both once; the per-site Azure, S3 and
      SFTP fixes stay on those items.
  - items: [BUG-257, BUG-245, BUG-255, BUG-260, BUG-318, BUG-319, BUG-298, ID-247, ID-260, ID-262, ID-245]
    verdict: unrelated
    evidence: >-
      Defects and gates on classes that migrate at later D3 steps (RFC-0017
      D3 table); the kernel's shape answers them at their step (BUG-257 by
      decision 1 at step 7, BUG-245 by OQ5 at step 3), and a fake-driver
      kernel changes no cell of theirs. BUG-298 is pattern_to_regex's
      anchoring, which the kernel does not call.
