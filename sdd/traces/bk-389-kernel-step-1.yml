id: BK-389
title: "RFC-0017 D3 step 1: the async kernel and its generated sync twin (planning, then the kernel PR)"
trigger: >-
  A read-only audit of master 9caef6b found BK-389 technically ready (BK-388
  done, Memory conformance and the oracle green) but its plan open: RFC-0017
  Open Questions 2, 3 and 5 unanswered, spec 013 assigned to no step, the
  public identity of the Memory classes undecided, and BK-345, ID-244 and
  ID-261 re-homed by no item. The maintainer chose to split the step into a
  kernel PR and a Memory PR and to settle every decision before kernel code.
source_items:
  - BK-389
  - BK-387
  - BK-388
  - BK-390
audience:
  - contributor.process
  - library.maintainer
discovery_followups:
  - BK-394
  - BUG-299
expected_ripples:
  - sdd/BACKLOG-DONE.md
surprising_ripples:
  - sdd/specs/003-backend-adapter-contract.md
  - sdd/backlog/bk-390-rfc-0017-spec-amendments.md
phases:
  - id: orient
    name: Orient (planning PR)
    steps:
      - file: sdd/BACKLOG.md
        section: "How this file works; BK-389, BK-345, ID-244, ID-261, BK-325, BK-332, BUG-257, BUG-245"
        read_type: gate
        extract: "item rules for partly done, absorbed and minted IDs; the index lines this PR corrects"
      - file: sdd/backlog/bk-389-kernel-step-1-memory.md
        section: "(full)"
        read_type: gate
        extract: "what step 1 owes; item 4 omits spec 013, item 6 ties acceptance to one PR"
        outcome: unclear
      - file: sdd/rfcs/rfc-0017-contract-kernel-over-thin-drivers.md
        section: "D1, D2, D3, D6, D8, Impact, Open Questions 2, 3, 5"
        read_type: gate
        extract: "the open questions step 1 must answer or bound; D1 lists no close-posture attribute"
        outcome: unclear
      - file: sdd/adrs/0042-contract-kernel-over-thin-drivers.md
        section: "Status, Decision, Amendments on acceptance"
        read_type: reference
        extract: "acceptance rides with the first backend on the design"
      - file: sdd/backlog/bk-387-rfc-0017-acceptance.md
        section: "What it does not include; Correction (2026-09-29)"
        read_type: reference
        extract: "BK-345, ID-244, ID-251 become kernel or driver cells at step 1; re-homing assigned to BK-389"
      - file: sdd/backlog/bk-388-dafny-kernel-clauses.md
        section: "As landed; Exit criteria"
        read_type: reference
        extract: "root rule landed as postconditions; exit criteria still say preconditions"
        outcome: misleading
      - file: sdd/specs/013-memory-backend.md
        section: "MEM-001 to MEM-020"
        read_type: reference
        extract: "which MEM clauses describe behaviour the kernel takes over"
      - file: sdd/specs/003-backend-adapter-contract.md
        section: "BE-020 close posture; BE-021 Reach, page-boundary paragraph"
        read_type: reference
        extract: "close_is_terminal is per backend; the no-page-boundary divergence clause OQ2 rests on"
      - file: sdd/formal/MemoryBackend.dfy
        section: "closeIsTerminal"
        read_type: reference
        extract: "the model carries the close posture as a flag the RFC's Driver protocol lacks"
      - file: sdd/backlog/bug-257-graph-walk-first-page-bound.md
        section: "(full)"
        read_type: reference
        extract: "the bound restarts per request; the fix keys it per operation"
      - file: sdd/backlog/bug-245-sqlblob-no-such-table.md
        section: "(full)"
        read_type: reference
        extract: "construction is outside BE-021's operation scope"
      - file: sdd/CLAUDE-REFERENCE.md
        section: "Ripple-check > Pre-work index"
        read_type: gate
        extract: "Spec section and Store or Backend ABC rows; sdd/-only PR triggers BACKLOG and backlogid"
  - id: reproduce
    name: Re-derive the code audit
    steps:
      - file: src/remote_store/backends/_memory.py
        section: "_split_path; get_folder_info; backend= literals"
        read_type: verify
        extract: "42 backend=\"memory\" literals; './' and './/' split to root; sentinel not skipped"
      - file: src/remote_store/aio/backends/_memory.py
        section: "_split_path; get_folder_info; backend= literals"
        read_type: verify
        extract: "40 backend=\"async-memory\" literals; same root and sentinel behaviour"
      - file: src/remote_store/_path.py
        section: "is_root"
        read_type: verify
        extract: "accepts '' and '.' only"
      - file: src/remote_store/_backend.py
        section: "read, read_seekable, open_atomic, check_health, close"
        read_type: verify
        extract: "sync-only members and no probe(); the surfaces unasync cannot map by token"
      - file: src/remote_store/aio/_async_backend.py
        section: "read, aclose, check_health"
        read_type: verify
        extract: "AsyncIterator read, aclose not close, no probe()"
  - id: design
    name: Interview and record the decisions
    steps:
      - file: sdd/backlog/bk-390-rfc-0017-spec-amendments.md
        section: "Where this comes from; Amendment by step"
        read_type: reference
        extract: "the step-1 boundary named BK-389; moved to BK-394 at the split, spec 013 added"
      - file: sdd/BACKLOG-DONE.md
        section: "Absorbed"
        read_type: reference
        extract: "entry shape for ID-261 into BK-389 and BK-325 into BK-394"
      - file: sdd/specs/003-backend-adapter-contract.md
        section: "BE-029 Conformance pins the outcome, not the order"
        read_type: verify
        extract: "cites ID-261 in the present tense; re-pointed to BK-345 and BK-389 once ID-261 was absorbed"
  - id: fix
    name: Review round 1 fix pass
    steps:
      - file: sdd/specs/013-memory-backend.md
        section: "every ### MEM- heading"
        read_type: verify
        extract: "enumerate the 31 headings so the placement table covers each once; my first table missed MEM-004 and MEM-014"
      - file: sdd/backlog/bk-345-absent-container-conformance.md
        section: "(full)"
        read_type: verify
        extract: "the dossier still prescribed one registry cell after the index re-scoped it; dated correction added"
      - file: sdd/BACKLOG-DONE.md
        section: "BUG-296, BK-387 entries"
        read_type: verify
        extract: "two Unreleased entries named BK-389 for scope that moved to BK-394"
  - id: fix_round2
    name: Review round 2 fix pass
    steps:
      - file: src/remote_store/_path.py
        section: "RemotePath normalisation"
        read_type: verify
        extract: "RemotePath folds '/a/b' and converts '\\', so decision 6 cites MEM-DS-005, not RemotePath; my first wording named the wrong rule source"
      - file: sdd/formal/BackendContract.dfy
        section: "§5c Root rule; §6 Backend contract"
        read_type: verify
        extract: "the predicate is §5c, the trait's postconditions §6; BK-388's correction conflated them"
      - file: sdd/specs/013-memory-backend.md
        section: "MEM-015, MEM-025, MEM-040"
        read_type: verify
        extract: "MEM-015 moves to SupportsFolderStats for MEM-040's O(1) space; the recursive-listing shape surfaced as decision 7, which keeps MEM-025's snapshot either way"
  - id: fix_round3
    name: Review round 3 fix pass
    steps:
      - file: sdd/specs/003-backend-adapter-contract.md
        section: "BE-008 source predicate; BE-029 read-side cost"
        read_type: verify
        extract: "the floor is is_root and a backend MAY exceed it; deciding the root on the canonical key closes the './' hole decision 6 opened"
      - file: sdd/formal/BackendContract.dfy
        section: "§5c AddressesRoot"
        read_type: verify
        extract: "AddressesRoot accepts a leading '/', which the leading-slash refusal reaches first with the same InvalidPath"
      - file: sdd/specs/013-memory-backend.md
        section: "MEM-DS-005"
        read_type: verify
        extract: "claimed to mirror RemotePath normalisation, measured false; corrected in the spec"
        outcome: misleading
  - id: replan_round4
    name: Round 4 re-plan, key rule enumerated
    steps:
      - file: src/remote_store/backends/_memory.py
        section: "every key-taking member, 17 keys"
        read_type: verify
        extract: "measure both Memory classes per member and key class; Δ cells are get_folder_info on './'-shaped roots and raw addressing answers; three prose rules had each been refuted, so the rule became a table"
      - file: tests/backends/conformance/test_identity.py
        section: "TestBackendNativePath, _RESOLVE_PATHS"
        read_type: verify
        extract: "addressing cells use canonical keys only, so normalising addressing changes no conformance cell"
      - file: src/remote_store/backends/_local.py
        section: "_resolve; write"
        read_type: verify
        extract: "_resolve accepts in-root '..' and NUL, so spec 013's 'mirrors LocalBackend' was also false; write('a/../b.txt') writes then raises, filed as BUG-299 (the reserved BUG-298 was also minted on PR #1054's branch; re-minted with the maintainer's approval)"
      - file: sdd/specs/013-memory-backend.md
        section: "MEM-DS-005"
        read_type: verify
        extract: "my round-3 correction kept the false LocalBackend half; rewritten from a three-way comparison"
