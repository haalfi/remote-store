id: BK-444
title: "Three repo traps cost sessions retries that a check would catch before commit"
trigger: "Sessions lost retries to three traps no check caught: a write_text without newline= rewrote tracked LF files as CRLF on Windows, a tool parameter decoded a four-digit unicode escape into a raw U+2028 inside test source, and a hatch alias without {args} dropped flags silently"
source_items:
  - BK-444
audience:
  - contributor.tooling
  - internal.style
decisions:
  - sdd/decisions/c29e9ca6-10af-44f2-86cd-e1db3fe67d75.jsonl
  - sdd/decisions/cbdb79c5-8b32-4b68-9b25-5092ca7d0ce1.jsonl
expected_ripples:
  - sdd/GATE-INVENTORY.md
  - sdd/backlogid.json
surprising_ripples:
  - .github/workflows/ci.yml
orient:
  - items: [BUG-327]
    verdict: constrains
    evidence: "sdd/BACKLOG.md BUG-327: `lint` and `format-check` run ruff on `src/ tests/ examples/ scripts/` only, and its open decision is whether to widen that to sdd/*.py. BK-444's write_text rule is scoped to scripts/ and states sdd/*.py as a bound owned by BUG-327; the invisible-character rule reads git ls-files, so it does not depend on BUG-327's answer."
  - items: [ID-235]
    verdict: unrelated
    evidence: "sdd/BACKLOG.md ID-235 adds BACKLOG-DONE.md integrity rules to gen_backlogid.py --check; none of its candidate rules reads source characters, write calls or hatch aliases."
phases:
  - id: orient
    name: Orient
    steps:
      - file: sdd/BACKLOG.md
        section: "BK-444, BUG-327, ID-235 (hatch run backlog-show; backlog-find CRLF, ruff, invisible, hatch)"
        read_type: gate
        extract: "BUG-327 is the only open item sharing BK-444's files (ruff scope); BK-334, the hatch-alias ripple row, was absorbed into BK-346 and is done"
        outcome: ok
      - file: sdd/backlog/bk-444-repo-traps-lint.md
        section: "write_text table, Ruff PLE, Hatch {args}"
        read_type: gate
        extract: "14 calls without newline=, 6 to tracked targets; PLE coverage of invisible characters was unmeasured"
        outcome: unclear
      - file: pyproject.toml
        section: "[tool.ruff.lint] select; [tool.hatch.envs.default.scripts]"
        read_type: verify
        extract: "no PLE or RUF selected; 21 bare aliases forward {args}, 10 bare aliases whose script reads argv do not"
        outcome: ok
      - file: .gitattributes
        section: "* text=auto eol=lf"
        read_type: verify
        extract: "commits normalise CRLF, so the write_text trap costs a dirty-with-no-diff tree, measured on sdd/process-budget.json"
        outcome: ok
      - file: scripts/gen_gate_inventory.py
        section: "Drift-gate block parsing"
        read_type: gate
        extract: "a single-pass script may declare several Drift-gate blocks without entrypoint:, so one check_repo_traps.py can carry three rules"
        outcome: ok
  - id: implement
    name: Implement
    steps:
      - file: sdd/backlog/bk-444-repo-traps-lint.md
        section: "Plan"
        read_type: gate
        extract: "one script, three rules, no allowlists; the rules' first run named exactly the dossier's 14 write_text calls and 10 aliases"
        outcome: ok
      - file: scripts/gen_gate_inventory.py
        section: "module docstring; _VALID_FIELDS, _KIND_FIELDS, _VALID_DOMAINS"
        read_type: reference
        extract: "block fields and closed domain set for the three declarations"
        outcome: ok
      - file: sdd/DRIFT-RULES.md
        section: "Rules 2-7"
        read_type: gate
        extract: "localize, derived claim space, authority for the {args} pair stated in the script's docstring, bounds in the same docstring"
        outcome: ok
      - file: .github/workflows/ci.yml
        section: "CODE_PAT, DOCS_PAT"
        read_type: verify
        extract: "lint runs only on CODE_PAT diffs, so rule 1's sdd/ and docs-src/ reach needed docs-gate too; asked, and wired both. The plan named lint alone"
        outcome: ok
      - file: scripts/fast_gate.py
        section: "ALWAYS"
        read_type: verify
        extract: "lint always runs locally, so a path matching neither CI pattern is still reached by fast"
        outcome: ok
      - file: .pre-commit-config.yaml
        section: "no-rst-roles"
        read_type: verify
        extract: "the pygrep pattern does not match the \\N{ZERO WIDTH SPACE} spelling in check_rst_roles.py"
        outcome: ok
  - id: verify
    name: Verify
    steps:
      - file: tests/scripts/test_check_repo_traps.py
        section: "(full)"
        read_type: verify
        extract: "59 pass; deleting each rule's condition failed 26, 4 and 2 tests (tmp/mutate_traps.py)"
        outcome: ok
      - file: sdd/CLAUDE-REFERENCE.md
        section: "Ripple-check / New or changed cross-artifact check; New test file; Backlog item touched"
        read_type: verify
        extract: "DRIFT-RULES applied; the new test exercises no OS-specific code, so no os_sensitive mark"
        outcome: ok
