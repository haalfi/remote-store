id: BUG-246
title: "An absent container answers the contract on the four backends that raised"
trigger: >-
  BE-004, BE-005 and BE-021 decide what an absent container owes — False from the
  probes, NotFound from the file-shaped operations, an empty listing from the
  listings — and BE-021 § Known divergences recorded four backends answering
  otherwise. S3Boto3Backend, AzureBackend and AsyncAzureBackend raised NotFound
  from exists and is_folder; SQLBlobBackend raised BackendUnavailable from every
  operation except the two deletes; and three S3Boto3Backend listings let a raw
  botocore.ClientError escape (BUG-249), which is the never-leak invariant rather
  than the mapping row.
source_items:
  - BUG-246
  - BUG-249
  - BUG-243
co_shipped_items:
  - BUG-249
discovery_followups:
  - BUG-254
  - BUG-255
  - BUG-256
  - BUG-257
audience:
  - user.api
  - user.api_docs
expected_ripples:
  - CHANGELOG.md
  - sdd/BACKLOG.md
  - sdd/BACKLOG-DONE.md
  - sdd/specs/003-backend-adapter-contract.md
  - sdd/specs/040-sql-blob-backend.md
  - docs-src/_data/graph/graph.json
  - docs-src/explanation/graph_viz.html
surprising_ripples:
  - src/remote_store/_errors.py
  - tests/backends/azure/aio/test_config.py
  - sdd/specs/026-health-check.md

# Counted from `git log --oneline origin/master..HEAD`. b492cc0 is the
# implementation and does not count. `git log --oneline origin/master..HEAD`
# returns 12; minus b492cc0 that is 11 review-driven commits, named: 7928f47
# (round 1's Azure listings and five prose findings), 3f5102c (round 1's
# code-scanning alert), 35b7281 (round 1's residual docstring map), f164c97
# (round 2), b5b0646 (round 3), b5af269 (round 4), fb5ff36 (the closing measuring
# gate's mid-scan truncation finding and the false correction it retracted),
# 0fc3611 (the closing figure audit), 3026d4b (the first verification pass's six
# findings), 2e80fb1 (the second pass's ten), and aaa3c38 (the prose pass's
# seven). The commit carrying this edit is excluded: it closes the loop and
# incorporates no finding, which is the line this count draws.
#
# Four times in this PR that head sentence went stale while its tail was
# re-derived, because it restates a number the log already holds. It is the
# clearest single instance of what ID-245's fourth bullet asks to be generated
# rather than maintained, and it sits in the schema's own required comment.
review_rounds: 11

phases:
  - id: orient
    name: Orient
    steps:
      - file: sdd/BACKLOG.md
        section: "BUG-246, BUG-249, § Item authority"
        read_type: gate
        extract: >-
          Take the diagnosis and treat the prescription as advisory. Retrospect:
          this was the right call — the item's SQLBlob table listed twelve
          operations and a run found fourteen raising, the two it omitted being
          iter_children and glob. (Eleven is the same table's *owing* count,
          twelve minus write, which pairs with thirteen rather than fourteen;
          mixing the two frames makes the delta look like three.) The fix shape
          it proposed ("one shape at three call sites") was
          also stale; the applied shape is one context manager at fifteen new
          call sites, seventeen counting BUG-243's two deletes.
      - file: sdd/specs/003-backend-adapter-contract.md
        section: "BE-004, BE-005, BE-021"
        read_type: gate
        extract: >-
          BE-021 § Reach is the operation-by-operation answer, and § Known
          divergences is the list this change shrinks. The fail-open/fail-closed
          paragraph is what forbids widening the catch past the container's 404.
      - file: sdd/CLAUDE-REFERENCE.md
        section: "Ripple-check / Pre-work index"
        read_type: gate
        extract: "Triggered rows: Error type, Backend, Spec section, Public method signature"

  - id: reproduce
    name: Reproduce
    steps:
      - file: tests/backends/sqlblob/test_absent_table.py
        section: "(full)"
        read_type: reference
        extract: >-
          The absent-table fixture and _drop_table, plus the residue cell that
          pinned BUG-246 so closing it would be visible rather than silent. It
          was: the cell's assertions flipped rather than the cell being deleted.
      - file: tests/backends/s3/test_denied_probe.py
        section: "_serve_missing_bucket_stub, TestEveryLaneAnswersAnAbsentBucketTheSameWay"
        read_type: reference
        extract: >-
          The absent-bucket and 403 wire stubs, and the two-sided pin that
          asserted the leak *is* a ClientError and is *not* a RemoteStoreError.
          That pin lived in TestS3Boto3ListingsLeakTheirNativeError, which the
          fix removed rather than left vacuous; the surviving assertion is
          test_no_native_error_escapes_a_broken_listing in the class named above.
      - file: tests/backends/azure/_helpers.py
        section: "serve_absent_container, serve_denied"
        read_type: reference
        extract: "Stage-1 Blob stubs shared by the sync and async suites (TEST-003)"

  - id: implement
    name: Implement
    steps:
      - file: src/remote_store/backends/_flat_ns.py
        section: "_children_or_absent_container"
        read_type: reference
        extract: >-
          The shared absent-container probe already existed for the deletes, so
          the S3 and Azure halves are a call-site swap rather than new machinery.
          Its docstring described itself as a tolerant delete's helper and needed
          rewriting once the probes became callers.
      - file: src/remote_store/backends/_sqlalchemy.py
        section: "_absent_table_is_absent_path, _table_is_absent"
        read_type: reference
        extract: >-
          Generalise the helper's axis from missing_ok to raises, and keep it
          inside _map_errors so the driver exception type survives — that
          placement is the whole no-extra-round-trip budget. _table_is_absent's
          docstring argued at length that read and exists answer inconsistently
          and cited this item as the fix, so it became false with the change.
      - file: src/remote_store/backends/_s3_boto3.py
        section: "exists, is_folder, list_files, list_folders, iter_children"
        read_type: reference
        extract: >-
          _children_or_absent_bucket already existed for delete_folder. The
          listings needed the mapper *inside* the generator body, as BUG-249
          warned — outside, it would not be entered until the first next().

  - id: fix
    name: Fix (round 1)
    steps:
      - file: src/remote_store/backends/_azure.py
        section: "list_files, list_folders, iter_children"
        read_type: reference
        extract: >-
          Round 1 found the Azure half only half closed: the non-HNS listings
          still raised NotFound where § Reach wants an empty listing, while the
          HNS branch of the same methods already returned early on a mapped
          NotFound. Measured on both adapters before fixing — nine cells.
          Retrospect: this was subject 12 on the Step 1 list, marked
          "measure", and never measured. The diff did not touch these methods, so
          diff-shaped attention could not reach it; only the subject list could,
          and it was not executed.
        outcome: ok
      - file: src/remote_store/aio/backends/_azure.py
        section: "_errors"
        read_type: reference
        extract: >-
          The async listings map inline rather than through the _errors context
          manager, so the same tail text appears in four places and a
          search-and-replace applied the listing rule to _errors itself — which
          would have made every async operation swallow NotFound. Caught by
          checking which methods the edit landed in rather than trusting the
          replacement count.
        outcome: ok
      - file: tests/backends/azure/aio/test_config.py
        section: "TestAsyncAzureErrorPropagation"
        read_type: verify
        extract: >-
          Two cells pinned the old listing behaviour and had to flip. The
          passthrough cell moved to PermissionDenied so the property it exists
          for stays pinned for everything the new catch does not swallow.
        outcome: ok

  - id: fix_2
    name: Fix (round 2)
    steps:
      - file: sdd/specs/003-backend-adapter-contract.md
        section: "BE-029"
        read_type: gate
        extract: >-
          The round-2 measuring pass showed get_folder_info("") raising NotFound
          against a dropped table. BE-029's root row decides that — the root is a
          folder that always exists and get_folder_info on it never raises
          NotFound — so the fix keys the tolerance on is_root.
          Retrospect: this clause was not read during implement, and BUG-254 was
          filed in round 1 claiming no clause decided the root case. That was
          read off BE-021 § Reach, which decides operations and says nothing
          about the root. § Reach is where a reader looking for per-operation
          answers lands, and it does not point at BE-029.
        outcome: misleading
      - file: src/remote_store/_errors.py
        section: "BackendUnavailable"
        read_type: reference
        extract: >-
          Round 1's own fix put false advice here: check_health() was offered as
          the way to tell a gone store from an empty one, and it returns cleanly
          against an absent container on S3PyArrowBackend and SQLBlobBackend.
          Measured across all five backends before rewriting; write() is the one
          operation that reports an absent container everywhere, which follows
          from it being the operation the contract declines to decide.
        outcome: ok

  - id: fix_3
    name: Fix (round 3)
    steps:
      - file: sdd/specs/003-backend-adapter-contract.md
        section: "BE-021 § Reach"
        read_type: gate
        extract: >-
          Round 3's panel found the precedence this change relies on — BE-029's
          root row outranking § Reach's NotFound row — stated only in a code
          docstring and a backlog item, while § Reach itself still read as
          deciding the root. § Reach now says BE-029 governs there, and names
          its roster rather than silently including read_bytes, iter_children
          and glob. Both are the trap BUG-254 was filed into, left standing by
          the round-2 fix that named it. The roster figure this round wrote was
          itself wrong — eleven, leaving the tolerant deletes out — and round 4
          corrected it to twelve. A fix that adds a figure adds a defect, which
          is the pattern ID-245's fourth bullet was filed for.
        outcome: unclear
      - file: sdd/specs/026-health-check.md
        section: "PING-001"
        read_type: verify
        extract: >-
          Publishing a measured fact in a docstring obliged reconciling the spec
          that asserted the opposite: PING-001 gives ping() a NotFound for a
          missing container, and two backends return cleanly. Recorded as a
          known divergence and filed as BUG-256. The ripple-check's Error type
          row names the error-model spec and the guides; it was walked for
          BE-021 and not for the health-check clause the new advice touched.
        outcome: ok
      - file: tests/backends/sqlblob/test_absent_table.py
        section: "TestTheWiderCatchStaysNarrow, root cells"
        read_type: verify
        extract: >-
          Two mutations survived the round-2 cells — a wrong seeded FolderInfo
          path, and a root tolerance ungated on table absence, the second of
          which would report a damaged store as an empty one. Both now fail.
          The lesson is that a cell asserting only spelling-independent fields
          cannot justify a two-spelling parametrisation.
        outcome: ok

  - id: fix_4
    name: Fix (round 4)
    steps:
      - file: sdd/specs/003-backend-adapter-contract.md
        section: "BE-021 § Reach, § Known divergences"
        read_type: gate
        extract: >-
          Round 4's adjudication converged on twelve of fourteen findings, eleven
          of which were hand-maintained figures or scope sentences computed in
          four incompatible frames — bullets, classes, operations, call sites.
          Two disputes went to measurement. The first overturned a finding: a
          claimed over-broad docstring in _s3_boto3 is correct at exactly three
          call sites. The second I got wrong, and only the closing gate caught
          it — I "refuted" the claim that this change introduced silent mid-scan
          truncation on Azure with a base-versus-head run whose base half set
          PYTHONPATH to a worktree *root*; this package lives under src/, so the
          import fell back to the editable install and measured head twice. Rerun
          with PYTHONPATH at <worktree>/src and the module __file__ printed, the
          base raises where head truncated. The claim was right; the refutation
          was an instrument failure, and it reached the backlog, this trace and
          the PR record before the gate found it. Filed as ID-245's fourth
          bullet, because the figure count is what generates the defects.
        outcome: ok
      - file: src/remote_store/_errors.py
        section: "BackendUnavailable"
        read_type: verify
        extract: >-
          The round-2 advice was wrong once and the round-3 rewrite was wrong
          again: catching RemoteStoreError around a trial write() reports "gone"
          for PermissionDenied on a present store, CapabilityNotSupported on any
          read-only backend, and AlreadyExists on the second call, since
          overwrite defaults to False. The docstring now says there is no
          portable probe rather than naming one.
        outcome: ok

  - id: fix_5
    name: Fix (verification pass)
    steps:
      - file: src/remote_store/backends/_flat_ns.py
        section: "_ListingCursor"
        read_type: verify
        extract: >-
          The verification pass on the round-4 fix found the first-page bound
          keyed on the wrong event. It set the flag immediately before each
          yield, so a page that came back 200 and was then emptied by the
          operation's own filter left it false and the next page's container 404
          was still swallowed — list_files discards common prefixes, list_folders
          discards keys, glob discards non-matches, and each of those is an
          ordinary first page rather than a corner case. Reproduced before
          fixing: 4 of 5 S3-Boto3 listings returned a truncated listing cleanly
          against a stub serving one good page then NoSuchBucket, iter_children
          being the one that passed because it yields both kinds and so has no
          blind shape. The flag now marks a page, which on Azure meant iterating
          by_page() instead of item-by-item. Mutation-checked in both directions:
          neutering the page flag kills the 12 Azure mid-scan cells and leaves
          the 12 Azure absent-from-the-start cells green, and forcing the guard
          always-on kills those 12 and leaves the mid-scan cells green — so the
          two halves are pinned independently rather than by one assertion.
          (An earlier draft of this step said "13 absent-from-the-start cells",
          a figure matching no enumeration; on the Azure frame the sentence uses
          it is 12, and across all three lanes 18.)
        outcome: ok
      - file: tests/backends/azure/aio/test_config.py
        section: "_async_iter"
        read_type: reference
        extract: >-
          The by_page() move broke the mock doubles, and the break was the
          finding: list_blobs/walk_blobs/get_paths return an ItemPaged, which is
          iterable *and* pageable, while the doubles returned a bare generator or
          a list. A double that under-describes the SDK cannot fail the way the
          service does. Replaced with _AsyncPaged / _Paged, one helper per file,
          which fixed 30-odd call sites without touching them; only the two sync
          HNS sites that pass a list directly needed editing.
        outcome: ok
      - file: sdd/specs/003-backend-adapter-contract.md
        section: "BE-021 § Reach, § Known divergences"
        read_type: gate
        extract: >-
          The pass also found the mid-scan behaviour had no clause: § Reach still
          said only that a listing over an absent container comes back empty,
          while the code now raises under a condition nothing stated. Writing the
          bound into the clause changed what counts as a divergence from it —
          BUG-255 had been justified as *outside* this clause, and is now a
          breach of it, so it moves into § Known divergences and § 1's counts
          move with it. That ripple is the argument for writing the clause first:
          the code shipped a rule the spec did not have, and the backlog's
          bookkeeping was reasoning off the spec's silence.
        outcome: ok

  - id: fix_6
    name: Fix (verification pass 2)
    steps:
      - file: tests/backends/azure/_helpers.py
        section: "serve_hns_*"
        read_type: verify
        extract: >-
          The claim that the Azure HNS branches are "reachable only through the
          Docker-gated fixtures" was made in four places and is false. ADLS Gen2's
          List Path is an ordinary JSON REST call, so the same pytest-httpserver
          technique the flat lane has used since BUG-243 reaches all six HNS
          listing branches in process — three methods on each of the two
          adapters; glob has no HNS branch of its own and recursive is a
          parameter inside list_files rather than a second branch. The guard
          those branches gained was the one part of this change nothing executed,
          and the stated reason for that was never measured. Now covered by 30
          cells, 15 per adapter-half (absent, mid-scan, denied x five listings);
          mutation-checked, the ten mid-scan cells die when the page flag is
          neutered. The pragmas stay:
          the branch is executed but its file-ancestor fallback is not, so
          removing them would overstate coverage in the other direction.
        outcome: ok
      - file: sdd/specs/003-backend-adapter-contract.md
        section: "BE-021 § Known divergences"
        read_type: gate
        extract: >-
          Adding the BUG-255 bullet took the list from one bullet to two and left
          five sentences in the same file still saying "one bullet" and "the
          list's remaining entry" — while BACKLOG § 1, edited in the same commit,
          already said two. A count restated in prose beside the thing it counts
          goes stale in the commit that changes it, every time; this is the same
          defect ID-245's fourth bullet was filed for, now caught inside the
          artifact the backlog defers to. This step first recorded three of the
          five and fixed those three, and the under-count is exactly why the
          other two survived to be found by the next pass: a sweep bounded by a
          remembered number rather than by a search finds the number, not the
          instances. The two that survived were "this list held five and now
          holds one" and "this list's one remaining bullet".
        outcome: ok
      - file: src/remote_store/aio/backends/_graph/backend.py
        section: "_iter_child_items, _walk_files"
        read_type: reference
        extract: >-
          Writing the first-page bound into § Reach enlarged what the clause
          governs, and GraphBackend breaches the enlarged version: its bound is
          per HTTP request while a recursive walk issues one request per folder,
          so a folder whose /children 404s ends that folder's listing cleanly.
          Measured with respx on the real backend. Recorded as a divergence and
          filed as BUG-257 rather than fixed here — the user's call, and the
          per-request-versus-per-walk choice is a design question this PR did not
          open. The general lesson is the one this trace keeps recording: a spec
          edit is a behaviour change to every backend the clause binds, and needs
          the same ripple walk as a code change.
        outcome: ok

  - id: verify
    name: Verify
    steps:
      - file: sdd/CLAUDE-REFERENCE.md
        section: "Ripple-check / Detailed checklist"
        read_type: verify
        extract: >-
          Error type, Backend, Spec section and Public method signature rows.
          The Error-type row's guide targets needed no edit and that is the
          finding: docs-src/guides/custom-backend-guide.md already stated both
          invariants this change implements — Step 5's "exists() never raises
          NotFound" and Step 9's "non-existent paths yield nothing (no
          exception)" — while three shipped backends broke them. The guide was
          the one artifact that never drifted; the code moved to meet it.
          docs-src/guides/troubleshooting.md says nothing about an absent
          container, and sdd/specs/005-error-model.md ERR-007 states
          BackendUnavailable's invariant without naming the case.
      - file: sdd/BACKLOG.md
        section: "BUG-254, BUG-255, BUG-256, ID-245"
        read_type: verify
        extract: >-
          The closing audit re-derived every figure in the items this PR filed,
          and three were wrong after round 4 had passed the same set: BUG-256's
          title said "two backends" over a body table naming three; the
          root-breach cell count read "six" in both BUG-254 and BE-021's pointer
          paragraph, where expanding the grouped rows over their classes gives
          seven (two operations on two classes, plus one on three); and BUG-255
          said "all three" of a truncating set the same item had just reduced to
          two. BUG-254 also still claimed SQLBlob's cell was an em dash, which
          the table above it contradicted — re-measured on this branch against a
          dropped table (tmp/measure_254_sqlblob.py, module __file__ printed and
          checked to be the worktree's src/): compliant on all three columns,
          for "" and "." alike. Every one is the ID-245 fourth-bullet class, and
          all three are in prose this PR wrote, which is the evidence for its
          "each fix pass adds figures and produces a fresh defect" claim.
        outcome: ok
      - file: sdd/specs/040-sql-blob-backend.md
        section: "SQL-BLOB-050"
        read_type: verify
        extract: >-
          Its absent-table paragraph said every operation but the deletes maps
          through the exception table; after the change only write does.
