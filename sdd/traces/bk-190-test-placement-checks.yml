id: BK-190
title: "tests/ root cleanup phase C: CI-enforced placement rules S, B, E + TESTING.md and spec 048 update"
trigger: "BK-188 and BK-189 moved files manually; BK-190 adds CI enforcement so new files cannot violate placement rules undetected; three rules derived from spec 048 encoded in scripts/check_test_placement.py"
source_items:
  - BK-190
  - BK-189
  - BK-188
  - BK-179
phases:
  - id: orient
    name: Orient
    steps:
      - file: sdd/specs/048-testing-architecture.md
        section: "TEST-003, TEST-010"
        read_type: gate
        extract: "TEST-003: source of truth for rule B (backend-specific imports banned from root tests); TEST-010: layout to enforce"
      - file: sdd/TESTING.md
        section: "Test Subpackage Placement"
        read_type: gate
        extract: "Authoritative placement table; rule S already documented; rules B and E to add"
      - file: sdd/CLAUDE-REFERENCE.md
        section: "Ripple-check table / A spec section"
        read_type: gate
        extract: "Tests with @pytest.mark.spec must trace to spec IDs for all new gate tests"

  - id: spec
    name: Spec reference
    steps:
      - file: sdd/000-process.md
        section: "Rules"
        read_type: gate
        extract: "Rule 1: spec before code; tooling specs use appropriate prefix; tests trace to spec IDs"
      - file: sdd/000-process.md
        section: "Spec format"
        read_type: reference
        extract: "TEST-NNN skeleton: Invariant, Preconditions, Postconditions"

  - id: tests
    name: Tests for the checker itself
    steps:
      - file: sdd/TESTING.md
        section: "Test Subpackage Placement"
        read_type: gate
        extract: "Checker tests live in tests/scripts/test_check_test_placement.py"
      - file: sdd/TESTING.md
        section: "Rules"
        read_type: gate
        extract: "Rule 1: 33 tests covering positive, negative, grandfather-skip, and allow-list paths; rule 6: tmp_path fixture trees"
      - file: sdd/000-process.md
        section: "Test traceability"
        read_type: gate
        extract: "@pytest.mark.spec(TEST-003/TEST-010) on placement rule tests"

  - id: implement
    name: Implement checker + wire into lint gate
    steps:
      - file: sdd/DESIGN.md
        section: "1–4"
        read_type: reference
        extract: "Formatting, types, module docstring for scripts/check_test_placement.py"
      - file: pyproject.toml
        section: "[tool.hatch.envs.default.scripts]"
        read_type: reference
        extract: "Existing lint script to extend with check-test-placement"

  - id: docs_update
    name: Docs update
    steps:
      - file: sdd/TESTING.md
        section: "Test Subpackage Placement"
        read_type: gate
        extract: "Extend table with rules B and E; add note that rules are CI-enforced"
      - file: sdd/specs/048-testing-architecture.md
        section: "TEST-010"
        read_type: gate
        extract: "Update layout snippet after BK-189 moves; confirm TEST-003 covers rule B"
      - file: sdd/CONTENT-RULES.md
        section: "Rules 1–6"
        read_type: reference
        extract: "6-month test on placement table prose; rule 5: checker behaviour stays in source"

  - id: verify
    name: Verify
    steps:
      - file: sdd/CLAUDE-REFERENCE.md
        section: "Ripple-check table / A spec section"
        read_type: verify
        extract: "TEST-003/TEST-010 now have 33 @pytest.mark.spec tests; TESTING.md placement table updated"
      - file: CHANGELOG.md
        section: "[Unreleased]"
        read_type: verify
        extract: "Add one-line stub"
