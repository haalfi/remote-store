id: BUG-332
title: "`gen_backlogid.py --help` regenerates `sdd/backlogid.json` instead of printing usage"
trigger: "Running `python scripts/gen_backlogid.py --help` printed \"Updated sdd\\backlogid.json\" and rewrote the file: main() read only --check and --remote, so any other argument fell through to generate mode (reproduced 2026-10-16)"
source_items:
  - BUG-332
audience:
  - contributor.tooling
expected_ripples:
  - sdd/backlogid.json
surprising_ripples:
  - "sdd/backlogid.json was already regenerated by the .claude/settings.json Edit(*BACKLOG-DONE*) hook when the close's manual `gen-backlogid` ran, which then printed the new `is current` line: the hook, not the documented manual step, is what keeps the file current in a Claude session"
decisions:
  - sdd/decisions/c29e9ca6-10af-44f2-86cd-e1db3fe67d75.jsonl
orient:
  - items: [ID-235]
    verdict: unrelated
    evidence: "sdd/BACKLOG.md ID-235: adds BACKLOG-DONE.md status-mark, absorbed-host and conflict-marker rules plus inbound-citation resolution to the --check pass; its open decision is which rules to add. Argument parsing in main() is outside it, and BUG-332's entry already records `ID-235 lints the same files, separate rules`."
phases:
  - id: orient
    name: Orient
    steps:
      - file: sdd/BACKLOG.md
        section: "BUG-332, ID-235 (hatch run backlog-show)"
        read_type: gate
        extract: "BUG-332 diagnosis; ID-235 is the only other open item naming gen_backlogid.py (hatch run backlog-find gen_backlogid)"
        outcome: ok
      - file: scripts/gen_backlogid.py
        section: "main(), _generate()"
        read_type: gate
        extract: "main() tests membership of --check/--remote in sys.argv and falls through to _generate() for anything else; _generate() prints Updated unconditionally"
        outcome: ok
      - file: pyproject.toml
        section: "gen-backlogid, gen-backlogid-check, lint"
        read_type: verify
        extract: "callers pass nothing, --check, or {args}; .pre-commit-config.yaml passes --check with pass_filenames false; .claude/settings.json hooks pass nothing"
        outcome: ok
  - id: verify
    name: Verify
    steps:
      - file: tests/scripts/test_gen_backlogid.py
        section: "TestMain, TestGenerate::test_says_updated_only_when_the_file_changed"
        read_type: verify
        extract: "4 of the 5 new tests failed before the fix (DID NOT RAISE SystemExit; second run printed Updated); 95 pass after"
        outcome: ok
      - file: scripts/gen_backlogid.py
        section: "real-tree runs: --help, --chek, no argument, --check"
        read_type: verify
        extract: "--help exit 0 with usage; --chek exit 2 `unrecognized arguments`; no argument prints `is current`; --check clean. The docstring's em dash printed as mojibake on the cp1252 console, so the argparse description is ASCII"
        outcome: ok
      - file: sdd/BACKLOG.md
        section: "How this file works / Completing work"
        read_type: gate
        extract: "Done: delete from BACKLOG.md, add [x] entry under BACKLOG-DONE.md § Unreleased"
        outcome: ok
review:
