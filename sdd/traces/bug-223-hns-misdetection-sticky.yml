id: BUG-223
title: "Azure HNS misdetection is sticky for the instance lifetime"
trigger: >
  The HNS probe (get_account_information) was wrapped in a bare except that
  cached _hns_enabled = False on any exception, so a transient failure on the
  first probe permanently degraded a real ADLS Gen2 (HNS) account to flat-blob
  semantics for the backend's lifetime, with no error surfaced.
source_items:
  - BUG-223
audience:
  - user.api
expected_ripples:
  - sdd/backlogid.json
surprising_ripples:
  # Editing the backend import block / class bodies shifted the backend
  # class def line numbers, so gen_graph --check failed until graph.json
  # (and the graph_viz.html derived from it) were regenerated.
  - docs-src/_data/graph/graph.json
  - docs-src/explanation/graph_viz.html
discovery_followups:
  # PR #841 review surfaced that the implicit GetAccountInfo probe is the
  # root cause; the explicit-hns redesign is tracked separately.
  - BK-302
review_rounds: 3
phases:
  - id: orient
    name: Orient
    steps:
      - file: sdd/BACKLOG.md
        section: "Azure / BUG-223 (item)"
        read_type: gate
        extract: "Disposition: do not cache a False from a transient probe failure; distinguish probed-flat from probe-errored; spec stickiness in AZ-006"
        outcome: ok
      - file: sdd/audits/audit-019-azure-backend-review.md
        section: "M5"
        read_type: reference
        extract: "Origin of the finding; caching logic statically certain, transient blip not cheaply reproducible live"
        outcome: ok
  - id: spec
    name: Spec
    steps:
      - file: sdd/specs/012-azure-backend.md
        section: "AZ-006"
        read_type: gate
        extract: "Invariant said 'performed at most once' / cached 'for the lifetime'; reword to 'at most once successfully', failed probe re-probes, fail-open per-op"
        outcome: ok
  - id: implement
    name: Implement
    steps:
      - file: src/remote_store/backends/_azure.py
        section: "_hns property"
        read_type: gate
        extract: "Drop self._hns_enabled = False in except; return False fail-open without caching; warn once via _hns_probe_warned (init + reset in close())"
        outcome: ok
      - file: src/remote_store/aio/backends/_azure.py
        section: "_ensure_hns()"
        read_type: gate
        extract: "Byte-symmetric twin change; same _hns_probe_warned flag, init + reset in aclose()"
        outcome: ok
  - id: tests
    name: Tests
    steps:
      - file: tests/backends/azure/test_config.py
        section: "TestAzureHNSDetection"
        read_type: gate
        extract: "Add transient-then-success re-probe test (side_effect=[Exception, {is_hns_enabled: True}]); first _hns False, second True, call_count == 2"
        outcome: ok
      - file: tests/backends/azure/aio/test_config.py
        section: "TestAsyncAzureHNSDetection"
        read_type: gate
        extract: "Async mirror over await _ensure_hns()"
        outcome: ok
  - id: verify
    name: Verify
    steps:
      - file: sdd/CLAUDE-REFERENCE.md
        section: "Ripple-check table / Bug fix"
        read_type: verify
        extract: "BACKLOG→DONE, CHANGELOG stub, failing test before fix, spec + guide reconciled"
        outcome: ok
      - file: docs-src/guides/backends/azure.md
        section: "HNS detection fallback note"
        read_type: verify
        extract: "Doc said the backend 'falls back to non-HNS behavior' on detection failure; reword to retry-on-error so it does not imply a permanent degrade"
        outcome: ok
      - file: tests/backends/azure/test_live_hns.py
        section: "(full)"
        read_type: verify
        extract: "Stage-3 live: confirm real ADLS Gen2 still detected as HNS after the error-branch change"
        outcome: ok
  - id: fix
    name: Fix (PR review)
    steps:
      - file: src/remote_store/backends/_azure.py
        section: "_hns property except branch + move/copy"
        read_type: gate
        extract: "PR #841 review round 1 tried classify+cache-403; round 2 (threads 4 & 5) showed cache-403 reintroduces sticky misdetection (RBAC-propagation 403) and never-cache causes intra-op torn reads. Settled interim: never-cache + warn-once + per-op snapshot of _hns in move/copy threaded into _maybe_check_no_file_ancestor. Root fix deferred to BK-302 (explicit hns=)."
        outcome: misleading
      - file: tests/backends/azure/test_config.py
        section: "TestAzureHNSDetection (warn-once / close-reset / snapshot)"
        read_type: gate
        extract: "Assert the _hns_probe_warned throttle (one warning across consecutive failures), flag reset on close()/aclose(), and that _maybe_check_no_file_ancestor honors a caller's hns= snapshot without re-probing -- both twins"
        outcome: ok
      - file: sdd/BACKLOG.md
        section: "Azure / BK-302 (item)"
        read_type: reference
        extract: "Filed BK-302: replace implicit HNS auto-detection with explicit hns= + AzureUtils.detect_hns(), mirroring SFTPUtils/GraphUtils; needs ADR + migration"
        outcome: ok
      - file: src/remote_store/backends/_azure.py
        section: "_hns comment + AZ-006 + spec note"
        read_type: gate
        extract: "Round-3 review: corrected the follow-up ID cited in the spec note and both backend comments from BK-300 (an unrelated WriteResult.digest item) to BK-302"
        outcome: ok
      - file: tests/backends/azure/test_config.py
        section: "test_move_snapshots_hns_once_under_probe_flip"
        read_type: gate
        extract: "Round-3 review: the helper-level snapshot test did not prove move/copy read a single snapshot end-to-end; added a test rigging the probe to flip mid-op (side_effect [error, hns=True]) asserting one probe call and a single consistent (non-HNS) path -- both twins"
        outcome: ok
