id: BUG-261
title: "Two breaking changes are on master with no upgrade path, and the obligation is stated where their authors never read"
trigger: >-
  Entries in CHANGELOG.md's [Unreleased] section carried a **Breaking** marker
  with no matching section in docs-src/reference/migration.md, and the rule
  requiring one lived only in CONTRIBUTING.md's release checklist — read by the
  releaser, not by the author of the breaking PR. The ripple-check table, which
  that author does read before starting, had no row for a breaking change.
source_items:
  - BUG-261
  - BK-357
  - BUG-248
  - BK-324
  - BUG-247
  - BUG-246
  - BUG-243
audience:
  - user.api_docs
  - user.site
  - contributor.tooling
expected_ripples:
  - sdd/backlogid.json
surprising_ripples:
  # Three separate misses land in this one file, none of them reached by a
  # ripple-check row. (1) The item's own body named ID-252 as reading the same
  # CHANGELOG section, so closing it falsified a present-tense "both stand"
  # sentence three sections away — found by the completing-work sweep, which is
  # BK-346 instance 6's class exactly. (2) and (3) came from review round 1:
  # BUG-256's enumerated "five documentation surfaces" became six when this PR
  # added one, and BUG-254 acquired a published-docs consequence it did not
  # carry. Writing a migration section is what created both, and no row asks
  # whether a new published promise lands inside an open item's measured extent.
  - sdd/BACKLOG.md
# Named from `git log --oneline origin/master..HEAD`, per _schema.yml's
# review_rounds description. c691866 implements and does not count. c337327
# corrects a figure I found while drafting the PR body, not review feedback, so
# it does not count either. fdfba64 incorporates review round 1 and counts; the
# commit carrying round 2 is the second, and round 3's is the third. Value is 3
# at the time of writing, and the field is set rather than omitted because the
# rounds have run and are documented as phases below — an earlier draft
# justified omitting it by saying no review had run, which was false in the same
# file 130 lines further down. Raise it if a later round lands another commit.
review_rounds: 3
phases:
  - id: orient
    name: Orient on the item and re-derive its figures
    steps:
      - file: sdd/BACKLOG.md
        section: "5 (A release cannot ship a surprise) / BUG-261"
        read_type: gate
        extract: >-
          Close condition (write the two missing migration sections), the three
          dispositions, and the shallow-checkout warning about deriving the rate
        outcome: ok
      - file: CHANGELOG.md
        section: "[Unreleased]"
        read_type: gate
        extract: >-
          Re-derive the **Breaking** count rather than trusting the item.
          `rg -n 'Breaking' CHANGELOG.md` returns 5, four in [Unreleased]
          (BK-356, BK-357, BUG-248, BK-324) against the item's three — BK-356
          landed after filing. Confirms the item's own advice that a figure is
          re-run, not recalled.
        outcome: ok
      - file: docs-src/reference/migration.md
        section: "v0.30.0 to v0.31.0"
        read_type: gate
        extract: >-
          The section already covers BK-356 and BK-357, so the rate was 2 of 4
          at the start of the work, not the 1 of 3 the item states. The two
          uncovered entries were still the two the item named.
        outcome: ok
      - file: CONTRIBUTING.md
        section: "Release Phase 1"
        read_type: gate
        extract: >-
          The obligation as written — "a PR making the break **may** write its
          own section" — and the bump table it leans on for the version pair
        outcome: ok
      - file: sdd/CLAUDE-REFERENCE.md
        section: "Pre-work index / Release & meta"
        read_type: gate
        extract: >-
          Confirm the diagnosed absence: rows for Bug fix, CHANGELOG entry and
          Version number, none for a breaking change
        outcome: ok
  - id: design
    name: Settle the dispositions with the user
    steps:
      - file: sdd/BACKLOG.md
        section: "5 / BUG-261 (Three dispositions) and 6 / BK-346"
        read_type: reference
        extract: >-
          The row's shape is BK-346's unanswered shared question. Put ruling
          versus tooling versus marker-survival, the row shape, and the softer
          half's three unmarked candidates to the user as one interview.
          Answers: ruling only; a new "Breaking change" row; one shared section
          for BUG-247, BUG-246 and BUG-243.
        outcome: ok
  - id: docs
    name: Write the upgrade paths
    steps:
      - file: sdd/adrs/0038-absent-container-outranks-drive-identity.md
        section: "Decision, Consequences"
        read_type: gate
        extract: >-
          BUG-248's per-scope answers, the four callers keeping the escalation,
          and the check_health → write → exists("") order with the base_path
          bound on the third
        outcome: ok
      - file: sdd/specs/003-backend-adapter-contract.md
        section: "BE-021, BE-025, BE-029, BE-017"
        read_type: gate
        extract: >-
          BK-324's roster for the two type-mismatch rows (read, read_bytes,
          read_seekable, delete, get_file_info, delete_folder, get_folder_info,
          move/copy source) and why the write half is excluded on a flat
          namespace; BE-029's root answers and the write-to-root refusal
        outcome: ok
      - file: sdd/specs/037-depth-limited-listing.md
        section: "DEPTH-003"
        read_type: reference
        extract: >-
          max_depth is inert at recursive=False on the Backend ABC, and Store
          normalises before delegating — so the break reaches direct Backend
          callers only
        outcome: ok
      - file: sdd/BACKLOG-DONE.md
        section: "BUG-247, BUG-246, BUG-243, BK-324"
        read_type: reference
        extract: >-
          Which backends each absence fix reaches, and that SQLBlob's write
          keeps the BackendUnavailable escalation because BE-021 § Reach
          declines to decide write
        outcome: ok
      - file: tests/backends/sqlblob/test_absent_table.py
        section: "test_write_still_reports_a_backend_failure"
        read_type: verify
        extract: >-
          Confirm write still raises against a dropped table before telling
          users not to use write as a reachability probe. Paired with
          tests/backends/local/test_absent_root.py, where the same call
          recreates the root and succeeds — the two together are why the guide
          says the answer is backend-specific rather than naming one.
        outcome: ok
      - file: src/remote_store/_store.py
        section: "Store.ping()"
        read_type: verify
        extract: >-
          Retrospective: the item, both backlog entries and the ADR all name
          `check_health()`, which is the Backend method. Store exposes it as
          `ping()`. Writing the section straight from those artifacts would have
          told users to call a method the Store facade does not have — caught by
          opening the source, not by re-reading the prose.
        outcome: ok
      - file: sdd/CONTENT-RULES.md
        section: "Rules"
        read_type: gate
        extract: >-
          Rule 6 (sourced code examples) is why the new subsections carry tables
          rather than fences: a before/after pair against a released version
          cannot execute in CI
        outcome: ok
  - id: wire
    name: Move the obligation to where the author reads
    steps:
      - file: CONTRIBUTING.md
        section: "Release Phase 1"
        read_type: gate
        extract: >-
          Promote the permission to an obligation on the breaking PR; keep the
          line as backstop and as owner of the softer half
        outcome: ok
      - file: scripts/check_ripple_parity.py
        section: "(full)"
        read_type: gate
        extract: >-
          A row must land in both presentations, under the same section and in
          the same relative order — a Detailed-only row that is not a sync/async
          expansion fails the gate
        outcome: ok
      - file: sdd/CLAUDE-REFERENCE.md
        section: "Pre-work index and Detailed checklist / Release & meta"
        read_type: gate
        extract: >-
          Add the Breaking change row after CHANGELOG entry in both, naming both
          artifacts, the knowable version pair, and the no-tracker-ID bound on
          the published guide
        outcome: ok
  - id: verify
    name: Ripple-check and close
    steps:
      - file: scripts/check_no_tracker_refs.py
        section: "_TRACKER_RE, _EXTERNAL_PREFIXES"
        read_type: verify
        extract: >-
          The new docs-src prose cites no PREFIX-NNN coordinate; class names and
          Graph's own error codes are not tracker shapes
        outcome: ok
      - file: sdd/BACKLOG.md
        section: "How this file works / Completing work"
        read_type: gate
        extract: >-
          Delete from BACKLOG.md, add to BACKLOG-DONE.md under ## Unreleased in
          the same commit, then sweep every site asserting the item is tracked
          and fix by tense
        outcome: ok
      - file: sdd/BACKLOG.md
        section: "5 (Closes when) and 6 (ID-252)"
        read_type: verify
        extract: >-
          Two present-tense sentences went stale on closure: section 5's Closes
          when named BUG-261 as an open condition, and ID-252 said the two
          surfaces "both stand". Both repaired in the same commit.
        outcome: ok
      - file: sdd/CLAUDE-REFERENCE.md
        section: "Detailed checklist / Bug fix, CHANGELOG entry, Backlog item touched"
        read_type: verify
        extract: "BACKLOG item moved, CHANGELOG stub added, trace shipped in the same PR"
        outcome: ok
  - id: fix
    name: Review rounds 1, 2 and 3
    steps:
      - file: sdd/BACKLOG.md
        section: "1 / BUG-256, BUG-254"
        read_type: gate
        extract: >-
          Retrospective, and the round's central miss. Both items are open, both
          measure the exact absent-container behaviour the new section
          prescribes, and neither was read while writing it. BUG-256 measures
          check_health() returning cleanly on SQLBlobBackend against a dropped
          table — so naming ping() as the replacement was wrong on one of the
          five backends the section lists, and the draft then forbade the
          write() fallback that item records as the reason BUG-246's advice used
          write(). BUG-254 measures get_folder_info("") raising NotFound on
          S3Boto3Backend, AzureBackend and AsyncAzureBackend, three of those
          same five, against a root row the draft promised flatly. The reads in
          the docs phase went to the specs and to the shipped items' own
          BACKLOG-DONE entries, and neither surface says a later item reopened
          the question. Section 1 of BACKLOG.md does.
        outcome: ok
      - file: sdd/specs/003-backend-adapter-contract.md
        section: "BE-029 (Applies to)"
        read_type: gate
        extract: >-
          Retrospective: the clause is scoped to backends declaring
          Capability.LIST and names ReadOnlyHttpBackend as the counterexample in
          its opening paragraph. The docs phase read BE-029 for its root answers
          and took the heading wording from BK-324's CHANGELOG entry instead,
          which says "on every backend" — a copy inheriting a flat guarantee
          from a source that had the qualifier.
        outcome: ok
      - file: CHANGELOG.md
        section: "[Unreleased]"
        read_type: gate
        extract: >-
          Re-derive the softer half's candidate set rather than inheriting the
          item's three, since the marker count had already been re-derived for
          the same reason. Parsing the section for `- <ID>: ` lines returns 19
          entries, 4 marked; classifying the other 15 against Phase 1's test
          yields 6 candidates, not 3 — BUG-259, BUG-249 and BUG-242 join the
          named three, and the last two had no coverage in this PR at all.
        outcome: ok
      - file: src/remote_store/backends/_http.py
        section: "_CAPABILITIES"
        read_type: verify
        extract: "ReadOnlyHttpBackend declares {READ, METADATA, LAZY_READ} and no LIST, so BE-029's carve-out is live rather than hypothetical"
        outcome: ok
      - file: src/remote_store/aio/backends/_graph/backend.py
        section: "check_health"
        read_type: verify
        extract: >-
          Sibling sweep for the ping() finding: the Graph section prescribes
          ping() too. It probes the effective root at identity scope, so a
          drive-identity resourceNotFound still escalates — sound, and left as
          written. Graph is absent from BUG-256's measured table, so the check
          was the source rather than that item.
        outcome: ok
      - file: sdd/BACKLOG.md
        section: "1 / BUG-254 (measured table)"
        read_type: gate
        extract: >-
          Round 2, and the round-1 fix's own defect. BUG-254's table has three
          breaching columns and counts seven class-cells; round 1 bounded the
          guide against one column (get_folder_info on three classes) and left
          the other two — exists("") and is_folder("") answering False on
          S3Backend and S3PyArrowBackend — promised flatly by the root table.
          Worse, the round-1 reply asserted that table "describes a store whose
          container is present", which the table itself never said. Fixed by
          stating the scope in the text and tabulating all seven cells. The
          lesson is that reading one row of a measured table and fixing what it
          names is the same miss the table exists to prevent.
        outcome: ok
      - file: sdd/specs/003-backend-adapter-contract.md
        section: "BE-021 (type mismatch outranks missing_ok)"
        read_type: gate
        extract: >-
          Round 2. The clause at lines 738-741 says delete(folder,
          missing_ok=True) and delete_folder(file, missing_ok=True) raise
          InvalidPath, and the flat-namespace section omitted it — the one
          interaction most likely to newly raise in existing code, since a
          cleanup loop passing missing_ok=True is exactly the idiom that used to
          get the silent no-op. The other two new sections both documented their
          missing_ok interaction, so this one was the outlier.
        outcome: ok
      - file: sdd/BACKLOG.md
        section: "How this file works / Completing work"
        read_type: gate
        extract: >-
          Round 2. Recording two dispositions as "declined for this PR, not
          decided against" while closing the item [x] with no successor ID is
          the partially-done branch wearing the fully-done mark. Settled on the
          author's decision as decided-against: two entries in BACKLOG-DONE
          § Decided against using the `—`-prefixed form that section defines for
          a refused idea that never had an ID, so the diagnoses survive with no
          open item and no ID consumed.
        outcome: ok
      - file: src/remote_store/aio/backends/_graph/backend.py
        section: "_GRAPH_CAPABILITIES, exists"
        read_type: gate
        extract: >-
          Round 3, and the read that settles the round's sharpest finding.
          GraphBackend declares Capability.LIST, so it is inside the root
          section's own scope, and its exists() suppresses every 404 including a
          drive-identity resourceNotFound — so a dead drive probes as False. The
          root section said two backends diverge; three do. The third is
          deliberate rather than unfinished, and this PR's own absent-drive
          recipe 3 depends on it, so the fix distinguishes the two kinds instead
          of lengthening a list.
        outcome: ok
      - file: src/remote_store/backends/_s3_pyarrow.py
        section: "_ALL_CAPABILITIES, check_health"
        read_type: verify
        extract: >-
          Round 3. Retrospective, and a claim caught before it shipped: a draft
          of the widened ping() bound said S3PyArrowBackend "is read-only in this
          respect and has no such fallback". It declares every capability except
          ATOMIC_MOVE and USER_METADATA, so it has WRITE — and BUG-256 does not
          measure write there against an absent bucket either way. The published
          text now says the question is unanswered on that backend rather than
          prescribing a substitute nobody has measured.
        outcome: ok
      - file: sdd/specs/003-backend-adapter-contract.md
        section: "BE-021 (The root is decided by BE-029, not here)"
        read_type: gate
        extract: >-
          Round 3. The flat-namespace section's scope sentence said the write
          half is "unchanged", drawing on BE-021's hierarchical-only rule but
          stopping before the clause that carves the root out of it: write on the
          root and the move/copy destination are decided by BE-029 and raise
          InvalidPath from the key. The next section of the same guide documents
          exactly that change, including the S3Boto3Backend root-destination move
          that used to delete the source — so two passages three paragraphs apart
          contradicted each other, and the reader who stops at the first is the
          one with the data-loss shape.
        outcome: ok
