        read_type: gate
        extract: "20 flagged sites across 10 files; scope of the fix"
      - file: sdd/DESIGN.md
        section: "4 (Docstrings)"
        read_type: gate
        extract: "RST role ban; double-backtick replacement pattern"

  - id: implement
    name: Implement
    steps:
      - file: sdd/DESIGN.md
        section: "4 (Docstrings)"
        read_type: reference
        extract: "Bad/good examples: :class:`Store` → ``Store`` or plain Store"

  - id: verify
    name: Verify
    steps:
      - file: sdd/CLAUDE-REFERENCE.md
        section: "Ripple-check table / A public method signature"
        read_type: verify
        extract: "Docstring changes: confirm no RST role patterns remain in touched files"
