id: BK-178
title: "Fix all RST cross-reference roles in audit-013-touched files"
trigger: "audit-013 identified RST inline roles (:class:, :meth:, :func:, :data:, :mod:) in docstrings; BK-178 fixes all 20 flagged sites plus additional roles found in the same files during broader sweep"
source_items:
  - BK-178
audience:
  - internal.style
known_ripples:
