id: BK-418
title: "`/ship` spends most of a delivery after the PR opens, and no intervention against it is measured"
trigger: >-
  Session C of the token-usage plan (the token kit's UNDERSTANDING.md, outside
  the repo, agreed 2026-10-10): build run B's comparison baseline. Run A's route 2 (after
  the re-plan at cdcaa35c6) per round, a fix-commit classifier for prose against
  code findings, and real /ship rounds instead of review submissions.
source_items:
  - BK-418
audience:
  - contributor.tooling
expected_ripples:
  - sdd/research/token-usage/report.md
surprising_ripples:
  - sdd/research/token-usage/rounds.py
discovery_followups: []
decisions: []
phases:
  - id: orient
    name: Orient
    steps:
      - file: token kit UNDERSTANDING.md (outside the repo)
        section: "(whole)"
        read_type: reference
        extract: >-
          Route 2 is the baseline because run B has its scope; ship-report's
          13 "rounds" are submissions and its file-based classes hid the prose
          share. The 27.8 M route figure was to be re-derived, not trusted
      - file: sdd/research/token-usage/report.md
        section: "Run A final, Reproducing"
        read_type: reference
        extract: "31.5 M is the round-7 checkpoint cut (--until 2026-10-09T13:35:51Z), not the re-plan"
      - file: sdd/research/token-usage/tokkit.py
        section: "parse_file, rounds_of"
        read_type: reference
        extract: >-
          rounds_of gives per spawn the members, main context, main units to
          the next spawn and the spawned subagents' units, each rounded to
          0.01 M. Summing those rounded values put the route-2 loop at
          22.63 M; the review of PR 1104 caught it, and route totals now sum
          unrounded call units (22.62 M)
      - file: sdd/research/token-usage/rounds.py
        section: "(whole)"
        read_type: reference
        outcome: misleading
        extract: >-
          Counts each review submission with comments as a round. On #1093 a
          round posts one summary review and its fix pass one reply submission
          per finding: 88 submissions for 13 rounds. Now points to pr_rounds.py
  - id: baseline
    name: Route-2 baseline
    steps:
      - file: run A main transcript (tokkit snapshot), calls 395-500
        section: "emits and timestamps"
        read_type: reference
        extract: >-
          Call 408 asks the maintainer how to go on after round 7, call 409
          enters plan mode, the narrowing commit cdcaa35c6 lands at call 474
          and route 2's round 1 spawns at call 494. Route start = call 409; the
          checkpoint cut differs by calls 409-412 (0.38 M)
  - id: classify
    name: Rounds and fix classifier
    steps:
      - file: PR #1093 reviews (GitHub GraphQL)
        section: "submissions, top-level comments, replies"
        read_type: reference
        extract: >-
          Top-level comments grouped by originalCommit reproduce the hand
          reading's route-2 rounds (3, 4, 7, 9, 15, 11) including the CodeQL
          alert in round 2. Replies cite the fix commit as an abbreviated SHA;
          route-1 heads were dropped by a rebase but resolve via the commits
          API and fetch by full SHA
      - file: sdd/research/token-usage/pr_rounds.py
        section: "classify"
        read_type: verify
        extract: >-
          File scope gives 30 prose against the hand count's 37. Reading the 18
          code labels' replies: six are prose fixes batched in a commit with a
          code fix to the same file or a test file, plus the unfixed CHANGELOG
          finding: 30 + 6 + 1 = 37. A def-level scope was tried and dropped: it
          labelled the round-1 link fix prose because the fix added a new
          helper. Re-run from cache gives a byte-identical result
review:
  # Derived by `hatch run ship-report 1104 --trace-block-only` at head 4cf5bb8.
  # Do not hand-edit, except a newly required field per sdd/traces/_schema.yml
  # section review: RFC-0015 D4 makes this script the only producer.
  derivation: "hatch run ship-report 1104 --trace-block-only"
  pr: 1104
  review_rounds: 1
  submissions: 1
  findings: 4
  by_round:
    - round: 1
      findings: 4
      origin: {original: 4}
      triage: {must-fix: 4}
      duration_hours: 0.05
  by_file:
    - path: "sdd/research/token-usage/pr_rounds.py"
      findings: 2
    - path: "sdd/research/token-usage/report.md"
      findings: 2
  untouched_files:
    - "sdd/research/token-usage/results/pr_1093_rounds.json"
    - "sdd/research/token-usage/results/run_a_route2.json"
    - "sdd/research/token-usage/rounds.py"
    - "sdd/research/token-usage/route_baseline.py"
    - "sdd/traces/bk-418-run-b-baseline.yml"
  review_driven_commits:
    - sha: "4cf5bb8"
      subject: "fix: address PR #1104 review"
  ci: {verdict: PENDING, failed: 0, pending: 2}
