id: BK-198
title: "SFTP legacy-server (ssh-rsa / SHA-1) compatibility"
trigger: |
  Connecting to a legacy third-party SFTP service (a PSFTPd server) raised
  `paramiko.ssh_exception.IncompatiblePeer` during the SSH handshake.
  Initial analysis assumed paramiko 3.x+ had removed `ssh-rsa` from
  defaults; empirical re-test against the same legacy server pattern
  across paramiko 2.12 / 3.0 / 3.5 / 4.0
  (`sandbox/bk-198-empirical-verification.md`) showed paramiko's defaults
  already negotiate `ssh-rsa`-only servers. The user's empirical fix
  worked because their environment had pre-mutated paramiko's
  class-level defaults somewhere upstream; the helper restored them.
  `disabled_algorithms` cannot re-add a removed algorithm, so no
  consumer-side remedy existed for the recovery / future-removal case
  without class-level patching.

source_items:
  - BK-198

audience:
  - user.api
  - user.site

co_shipped_items:
  - BUG-204
  - BK-197
  - BK-199

# BUG-205 was filed during this work after I misread the SFTP backend's
# TOFU close-side save_host_keys path and concluded persistence was
# unreachable through Registry.get_store(). Empirical reproduction (failing
# test first, per Rule 6) showed paramiko's AutoAddPolicy already auto-saves
# via client._host_keys_filename, which SFTPBackend.load_host_keys sets in
# the TOFU branch. Withdrawn the same session in commit 57fb6c291.
discovery_followups:
  - BUG-205

expected_ripples:
  - sdd/backlogid.json
  - CHANGELOG.md
  - docs-src/reference/api/sftp-utils.md

phases:
  - id: reproduce
    name: Reproduce
    steps:
      - file: src/remote_store/backends/_sftp.py
        section: "_map_exception (lines 1013-1036)"
        read_type: reference
        extract: "All SSHException subclasses fall through to BackendUnavailable(str(exc)); IncompatiblePeer is not distinguished"
      - file: tests/backends/sftp/test_config.py
        section: "TestSFTPErrorMapping"
        read_type: reference
        extract: "Existing pattern: instantiate backend with dummy host + AUTO_ADD, call _map_exception directly"

  - id: design
    name: Design
    steps:
      - file: src/remote_store/backends/_sftp.py
        section: "SFTPUtils (lines 117-141)"
        read_type: reference
        extract: "Public namespace for SFTP helpers; new method belongs as a staticmethod wrapping a module-level function"
      - file: sdd/CLAUDE-REFERENCE.md
        section: "Ripple-check table / Public API"
        read_type: gate
        extract: "Secondary public API (e.g. SFTPUtils) needs its own api/*.md page and index entry; sftp-utils.md exists and gets a new method block"

  - id: tests
    name: Failing tests first
    steps:
      - file: tests/backends/sftp/test_config.py
        section: "TestSFTPEnableSshRsaCompat, TestSFTPIncompatiblePeerHint"
        read_type: gate
        extract: |
          Snapshot/restore fixture for paramiko class-attr state; tests
          assert the four-site patch and idempotency, plus the hint
          presence on IncompatiblePeer and absence on plain SSHException.

  - id: implement
    name: Implement
    steps:
      - file: src/remote_store/backends/_sftp.py
        section: "enable_ssh_rsa_compat + SFTPUtils.enable_ssh_rsa_compat"
        read_type: reference
        extract: |
          Module-level function applies four idempotent patches:
          Transport._preferred_keys (append ssh-rsa), Transport._key_info
          (register RSAKey), RSAKey.HASHES (register SHA1),
          Transport._preferred_pubkeys (append ssh-rsa). Wrapped as a
          staticmethod on SFTPUtils for the public API.
      - file: src/remote_store/backends/_sftp.py
        section: "_map_exception IncompatiblePeer branch"
        read_type: reference
        extract: "Detect paramiko.ssh_exception.IncompatiblePeer before the generic SSHException branch; map to BackendUnavailable with appended hint pointing at SFTPUtils.enable_ssh_rsa_compat"

  - id: docs
    name: Docs
    steps:
      - file: docs-src/guides/backends/sftp.md
        section: "Legacy Servers (ssh-rsa / SHA-1)"
        read_type: reference
        extract: "New section: four-site removal table, helper usage, security tradeoff, paramiko<3 pin alternative with EOL/cryptography caveats"
      - file: docs-src/reference/api/sftp-utils.md
        section: "Methods / enable_ssh_rsa_compat"
        read_type: reference
        extract: "mkdocstrings directive for the new function rendered on the api page"

  - id: verify
    name: Verify
    steps:
      - file: sdd/CLAUDE-REFERENCE.md
        section: "Ripple-check table / Public method signature"
        read_type: verify
        extract: "Docstring Args/Returns/Raises updated; example added"
      - file: sdd/CLAUDE-REFERENCE.md
        section: "Ripple-check table / Error type"
        read_type: verify
        extract: "_map_exception now distinguishes IncompatiblePeer; covered by TestSFTPIncompatiblePeerHint"
      - file: sdd/CLAUDE-REFERENCE.md
        section: "Ripple-check table / Public API"
        read_type: verify
        extract: "SFTPUtils api page entry added; index summary description still covers the new method conceptually"
