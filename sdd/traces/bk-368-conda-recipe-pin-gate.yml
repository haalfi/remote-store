id: BK-368
title: "Nothing held the conda recipe's run_constraints to pyproject's extras"
trigger: >-
  A conda-forge reviewer on staged-recipes#32401 found pyarrow pinned at
  >=12.0.0 while the s3-pyarrow extra needs >=14.0.0. The recipe's comment
  claimed the loosest floor was correct and asked the reader to keep the list
  exhaustive; no mechanism checked either claim.
source_items:
  - BK-368
  - ID-018
audience:
  - contributor.tooling
  - library.maintainer
co_shipped_items:
  - BUG-283
expected_ripples:
  - sdd/backlogid.json
  - sdd/GATE-INVENTORY.md
surprising_ripples:
  - sdd/CLAUDE-REFERENCE.md
# Derivation, per the schema's review_rounds clause: `gh api
# repos/haalfi/remote-store/pulls/1004/commits --jq '.[] | .sha[0:7] + "  " +
# (.commit.message | split("\n")[0])'`, counting the commits that exist because
# of review feedback on PR #1004 — including the commit carrying this line.
# Those are `3f7ced8 fix: address PR #1004 review` and this round's fix commit:
# value 2. Every trace on this branch first said 0, which the branch refuted the
# moment 3f7ced8 landed; the field was re-read rather than re-derived. The
# conda-forge review that started the work is on another repo's PR and is not
# counted here.
review_rounds: 2
phases:
  - id: orient
    name: Orient
    steps:
      - file: packaging/conda-forge/recipe.yaml
        section: "requirements.run_constraints"
        read_type: gate
        extract: >-
          The comment argued the loosest floor (>=12.0.0) is the correct single
          pin. It is backwards: a run_constraint asserts compatibility, so a
          floor below what any shipped surface needs leaves a broken combination
          installable. The strictest floor is the sound pin.
        outcome: misleading
      - file: pyproject.toml
        section: "[project.optional-dependencies]"
        read_type: gate
        extract: "The authoritative per-extra ranges the recipe restates"
      - file: .github/workflows/conda-recipe.yml
        section: "(full)"
        read_type: verify
        extract: >-
          rattler-build --render-only validates syntax and never opens
          pyproject.toml, so nothing in CI could have caught the drift

  - id: design
    name: Design the gate
    steps:
      - file: sdd/DRIFT-RULES.md
        section: "Rules 2, 3, 4, 5, 7"
        read_type: gate
        extract: >-
          Derive the enumeration from pyproject (3), declare pyproject as the
          governing side in writing (4), localize to the package (2), default
          into lint (5), state the bounds and the Drift-gate:: block (7)
      - file: scripts/check_backend_order.py
        section: "(full)"
        read_type: reference
        extract: >-
          The precedent for parsing recipe.yaml textually, and the docstring
          shape a gate in this repo carries
      - file: scripts/gen_features.py
        section: "_EXCLUDE_EXTRAS"
        read_type: reference
        extract: >-
          The dev/build extras are already enumerated once; import that constant
          rather than restating which extras are user-facing

  - id: verify
    name: Verify
    steps:
      - file: .github/workflows/ci.yml
        section: "CODE_PAT / DOCS_PAT"
        read_type: verify
        extract: >-
          The gate shipped wired into `lint` alone, and CI's `lint` job is
          CODE_PAT-gated. Neither classifier matched `^packaging/`, so a
          recipe-only diff — the exact event this gate was built for — ran only
          `rattler-build --render-only`, which its own docstring says cannot see
          the drift. Half the pair was unreachable. Caught in review;
          `^packaging/` added to DOCS_PAT and the gate added to `docs-gate`.
        outcome: misleading
      - file: scripts/check_conda_recipe_pins.py
        section: "_collapse / Bounds"
        read_type: verify
        extract: >-
          `_collapse` folded `>`, `==` and `~=` into `>=` and dropped `!=` and
          `===` entirely, so a pyproject `pkg>1.2` would have made the gate
          demand the weaker `>=1.2` and fail the recipe for carrying the correct
          pin — inverting the gate's own authority rule — while `==1.2.*` raised
          InvalidVersion rather than a violation. The Bounds section said none of
          it. Now only `>=`, `<` and `<=` are accepted and anything else is
          reported.
        outcome: misleading
      - file: sdd/DRIFT-RULES.md
        section: "Rule 7 (seed known discrepancies)"
        read_type: verify
        extract: >-
          tests/scripts/test_check_conda_recipe_pins.py seeds one case per
          claimed failure mode — weaker floor, missing entry, stray entry,
          dropped ceiling, marker-gated dependency — plus the real tree
      - file: sdd/GATE-INVENTORY.md
        section: "(generated)"
        read_type: verify
        extract: "gen_gate_inventory.py --check passes; the new mechanism appears with its declared pair"
      - file: sdd/CLAUDE-REFERENCE.md
        section: "Ripple-check / Dependency"
        read_type: verify
        extract: >-
          Neither ripple presentation named the recipe, so a floor change swept
          every artifact except the one that restates floors. Both now do; the
          parity gate is unaffected because the trigger set is unchanged.
        outcome: misleading
