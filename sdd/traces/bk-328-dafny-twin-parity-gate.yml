id: BK-328
title: "Gate MemoryBackend / MemoryBackendMinimal twin parity in the Dafny model"
trigger: >-
  Asked which consistency-fixing topic should land next. Ranked the research
  doc's § 9 steps by decay rate rather than by its own suggested slice: step 1
  is the only candidate with live exposure, and BK-324 will edit the very file
  the duplication lives in, so the gate wants to exist before that edit.
source_items:
  - BK-328
audience:
  - contributor.tooling
  - library.maintainer
discovery_followups:
  # The research plan's remaining steps, filed as items in the same PR: the
  # `orient` phase found the plan was reachable only from a research doc, so
  # BACKLOG.md never showed it. Owners now exist for steps 2-8.
  - BK-329
  - BK-330
  - BK-331
  - BK-332
  - ID-236
  - ID-237
expected_ripples:
  - sdd/backlogid.json
  - pyproject.toml
review_rounds: 2
surprising_ripples:
  # The ripple-check has no row tying a new lint gate to CI's path filters, and
  # the local `hatch run lint` wiring looked complete. Review caught that CI's
  # lint job is CODE_PAT-gated and CODE_PAT excludes sdd/, so the gate skipped
  # the .dfy-only PR it exists to catch. `verify-formal` already documented the
  # fix pattern for three sibling gates.
  - .github/workflows/ci.yml
  # Not anticipated by the ripple-check: the work's own justification, quoted
  # from formal/README.md, turned out to be overstated. Running dafny against
  # seeded edits corrected the README rather than merely citing it.
  - sdd/formal/README.md
  - sdd/formal/MemoryBackend.dfy
  # Filing the plan into BACKLOG.md rippled back into the research doc's § 9
  # preamble, which kept its own sequencing and had to be removed rather than
  # left to drift. Review caught it; no ripple-check row covers "a doc that
  # proposes an ordering the backlog now owns".
  - sdd/research/research-inconsistency-detection-multi-artifact.md
phases:
  - id: orient
    name: Orient and choose the item
    steps:
      - file: sdd/research/research-inconsistency-detection-multi-artifact.md
        section: "9 (Plan of next steps), 7 (Gaps, ranked)"
        read_type: reference
        extract: "Step 1 closes G-1, the top-ranked gap; step 3 and step 5.1 are the alternatives"
        outcome: ok
      - file: sdd/BACKLOG.md
        section: "(full)"
        read_type: gate
        extract: "Find the competing candidates and the next free ID"
        outcome: unclear
        # None of the research doc's eight steps exist as backlog items; the
        # plan is reachable only via three `Related:` annotations on other
        # items. A reader of BACKLOG.md alone would not find step 1 at all.
      - file: sdd/formal/README.md
        section: "Notable properties"
        read_type: gate
        extract: "The documented statement of the defect: drift invisible in CI, caught only in review"
        outcome: misleading
        # Overstated. Verification does catch one-sided edits that change what a
        # class can prove; only the underdetermined band is silent. Corrected in
        # this PR rather than propagated into the new script's docstring.
  - id: design
    name: Design the gate
    steps:
      - file: sdd/DRIFT-RULES.md
        section: "Rules"
        read_type: gate
        extract: "Rule 1 pairwise exemption, Rule 4 declared authority, Rule 6 register, Rule 7 stated bounds"
        outcome: ok
      - file: scripts/check_docstring_parity.py
        section: "(full)"
        read_type: reference
        extract: "The identical-versus-intentionally-divergent registry pattern to model on"
        outcome: ok
      - file: scripts/check_capability_parity.py
        section: "(full)"
        read_type: reference
        extract: "Dafny source-scanning idiom and the empty-parse guard"
        outcome: ok
      - file: sdd/formal/MemoryBackend.dfy
        section: "MemoryBackend, MemoryBackendMinimal"
        read_type: reference
        extract: "Member sets are equal but ordered differently; compare by name, not position"
        outcome: ok
  - id: implement
    name: Implement
    steps:
      - file: scripts/check_dafny_twin_parity.py
        section: "(full)"
        read_type: reference
        extract: "Scoped Dafny scan, per-member normalised comparison, pinned divergences"
        outcome: ok
      - file: sdd/formal/BackendContract.dfy
        section: "(full)"
        read_type: verify
        extract: "Swept every .dfy for lexer hazards; found prime-suffixed identifiers a naive quote scanner would mis-lex"
        outcome: ok
  - id: verify
    name: Verify behaviour, not signatures
    steps:
      - file: sdd/formal/MemoryBackend.dfy
        section: "MemoryBackendMinimal"
        read_type: verify
        extract: >-
          Seeded five one-sided edits and ran `dafny verify` on each. Dropped and
          weakened postconditions are rejected by Dafny; the GetFolderInfo
          folder-name field and a stray proof hint both verify at 478 verified,
          0 errors while the gate catches them. This measurement redefined the
          gate's claimed territory and both cases are now in the corpus.
        outcome: ok
      - file: tests/scripts/test_check_dafny_twin_parity.py
        section: "TestSeededMutations"
        read_type: verify
        extract: "In-scope mutations caught, out-of-scope ones asserted missed, so the stated bound stays executable"
        outcome: ok
      - file: sdd/CLAUDE-REFERENCE.md
        section: "Ripple-check table / New or changed cross-artifact check"
        read_type: verify
        extract: "Routes to DRIFT-RULES.md, which states its own scope and needs no edit for an added gate"
        outcome: ok
      - file: sdd/traces/_schema.yml
        section: "audience"
        read_type: gate
        extract: >-
          Derived rule: no `user.` audience, so no CHANGELOG entry. Matches the
          precedent of the two closest analogues (BK-297 docstring parity,
          BK-245 capability parity), neither of which appears in the CHANGELOG.
        outcome: ok
  - id: file
    name: File the rest of the programme
    steps:
      - file: sdd/BACKLOG.md
        section: "How this file works"
        read_type: gate
        extract: "Section shape, attribute line, ordering rule (higher-priority first within a group)"
        outcome: ok
      - file: sdd/BACKLOG.md
        section: "Cross-Artifact Consistency"
        read_type: reference
        extract: >-
          New section holding the programme in execution order. Steps 2-8 filed
          as BK-329/330/331/332 and ID-236/237; ID-207 and BK-324 moved in from
          Lint/CI Completeness and Docs & Discoverability, BK-327 moved in as an
          independent member. ID-235 and BK-325 deliberately left where they are
          (single-artifact rule check, and guide content, respectively).
        outcome: ok
      - file: sdd/research/research-inconsistency-detection-multi-artifact.md
        section: "9 (Plan of next steps)"
        read_type: verify
        extract: >-
          Stamped an owner ID on every step and resolved the step-5 classification
          note, so the doc carries the argument and the backlog carries the work
          rather than both carrying a copy of the plan.
        outcome: unclear
        # Incomplete: the § 9 preamble kept its own slice and strategic-pair
        # sentences, so the plan was left sequenced two ways across two artifacts
        # -- the exact duplication the new note claimed to prevent. Caught in
        # review, not by the edit.
  - id: fix
    name: Address review
    steps:
      - file: scripts/check_dafny_twin_parity.py
        section: "class_members, class_body"
        read_type: reference
        extract: >-
          Two unstated bounds were real defects, both of the shape the PR fixed
          elsewhere. The member vocabulary was a keyword allow-list, so a
          const/var field on one class only was dropped (before the first
          recognised declaration) or absorbed into a neighbour; membership is now
          derived from every two-space declaration with an unknown keyword
          failing loudly. Brace counting ran over text with literals intact, so a
          brace inside a string desynced the class slicer; scanning now runs on a
          literal-blanked, length-preserving copy.
        outcome: ok
      - file: sdd/formal/MemoryBackend.dfy
        section: "MemoryBackendMinimal.Write"
        read_type: verify
        extract: >-
          The widened declaration scan first failed on Write's multi-line
          signature, whose parameter list closes with `  )` at declaration
          indent. Loud failure did its job on its first real encounter.
        outcome: ok
      - file: tests/scripts/test_check_dafny_twin_parity.py
        section: "OUT_OF_SCOPE, TestSeededMutations"
        read_type: verify
        extract: >-
          The corpus held 1 of the 5 documented bounds while the docstring
          claimed the set. Bounds are now tagged by how each is held (corpus,
          argued, structural), order-sensitivity is held as a fires-by-intent
          test, and the trait bound is held structurally by running against a
          copy with no BackendContract.dfy beside it.
        outcome: ok
      - file: .github/workflows/ci.yml
        section: "setup (path filters), lint, verify-formal"
        read_type: gate
        extract: >-
          Round 2. Wiring the gate into `hatch run lint` alone left it skipped in
          CI for a .dfy-only PR, because the lint job is CODE_PAT-gated and
          CODE_PAT excludes sdd/. Reproduced both filters against the scenario:
          code=false, formal=true. Added the gate to verify-formal, following the
          pattern that job already documents for three sibling checks.
        outcome: ok
      - file: sdd/CONTENT-RULES.md
        section: "Rules 1 and 3"
        read_type: gate
        extract: >-
          Round 2. The exact line counts added in round 1 are pseudo-precise
          values in durable prose that no gate holds; they go stale on a lockstep
          edit to Write while the gate stays green. Docstring is now qualitative;
          the snapshot stays in BACKLOG-DONE, where a completion record is the
          right home for it.
        outcome: ok
