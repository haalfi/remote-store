id: BK-194
title: "Ripple-check rewrite: compact pre-work index + detailed verify checklist"
trigger: "Trace research (sdd/research/research-agent-workflow-substrate.md § 2.3) sampled 9 merged PRs and found 3/9 missed ripples — PR #604 missed .github/workflows/ci.yml, PR #591 missed graph.json + graph_viz.html, PR #592 missed _proxy.py + extension wrappers — because agents consulted the ripple-check table only at verify-end. The detailed table is structured for closing-checks; nothing in CLAUDE-REFERENCE.md prompts the agent to scan triggers before starting work. First live-authored trace under the BK-193 CLAUDE.md rule."
source_items:
  - BK-194
audience:
  - contributor.process
expected_ripples:
  - sdd/backlogid.json
surprising_ripples:
  - .claude/skills/review-pr/SKILL.md
  - .claude/skills/release/SKILL.md
  - .claude/skills/orchestrate/SKILL.md
  - sdd/rfcs/rfc-0009-multi-agent-orchestration.md
review_rounds: 1
phases:
  - id: orient
    name: Orient
    steps:
      - file: sdd/BACKLOG.md
        section: "Backlog (Prioritized) / BK-194"
        read_type: gate
        extract: "Spec: compact Quick reference index at top + detailed checklist below; header explains two purposes; two presentations one data source; driven by surprising_ripples"
        outcome: ok
      - file: sdd/research/research-agent-workflow-substrate.md
        section: "2.3 Phase 3: Trace vs merged PR (n=9)"
        read_type: reference
        extract: "Empirical motivation: 3/9 PRs missed ripples (#604 ci.yml, #591 graph.json+graph_viz.html, #592 _proxy.py+extension wrappers) — table consulted only at verify-end"
        outcome: ok
      - file: CLAUDE.md
        section: "Trace authoring (mandatory)"
        read_type: gate
        extract: "Live-authored discipline: open trace before work, fill as it proceeds, surprising_ripples + audience priority-sort before submit, ships in same PR"
        outcome: ok
      - file: sdd/traces/_schema.yml
        section: "(full)"
        read_type: gate
        extract: "audience enum + derived CHANGELOG rule (contributor.process without new framework skips CHANGELOG); surprising_ripples are the analytically valuable signal"
        outcome: ok

  - id: implement
    name: Implement
    steps:
      - file: sdd/CLAUDE-REFERENCE.md
        section: "Ripple-check table"
        read_type: reference
        extract: "Initial rewrite: keep H2 'Ripple-check table' intact so existing trace section strings still resolve; add header explaining the two presentations; add Pre-work index H3 above Detailed checklist H3; row count parity 24 == 24. Reviewer pushback came after this commit — see rev. 2 step below."
        outcome: unclear
      - file: .claude/skills/review-pr/SKILL.md
        section: "Ripple check"
        read_type: reference
        extract: "Verify-time → point at '§ Ripple-check table > Detailed checklist'"
        outcome: ok
      - file: .claude/skills/release/SKILL.md
        section: "Description (line 46)"
        read_type: reference
        extract: "Release follows the section order of the Detailed checklist; point at '§ Ripple-check table > Detailed checklist'"
        outcome: ok
      - file: .claude/skills/orchestrate/SKILL.md
        section: "Step 1: Pre-check (line 18); Step 7: Finish (line 287)"
        read_type: reference
        extract: "Two call-sites: orient → Pre-work index; verify-end audit → Detailed checklist. Line 292 (CHANGELOG entry row reference) unchanged — row name preserved."
        outcome: ok
      - file: CLAUDE.md
        section: "Principles / 2"
        read_type: reference
        extract: "Restate principle 2 to mention both pre-work index and verify-end checklist usages — was written for verify-end-only world"
        outcome: ok
      - file: sdd/CLAUDE-REFERENCE.md
        section: "Ripple-check table (rev. 2)"
        read_type: reference
        extract: "Reviewer feedback: Pre-work index had no ordering, trigger phrasing mixed article-form ('A backend') with bare-topic ('Version number'). Restructured: 5 H4 groups by SDD lifecycle phase (Spec & contract / Code surface / Tests / Docs / Release & meta); all 24 rows renamed to bare-topic form; column header changed from 'If you changed…' to 'Trigger' to match the noun form."
        outcome: ok
      - file: sdd/traces/
        section: "(36 files)"
        read_type: reference
        extract: "Mechanical rename of 50 'Ripple-check table / A <X>' section strings across 35 existing traces + _schema.yml example + this trace itself — done via tmp/migrate_ripple_section_strings.py one-shot script (kept under tmp/, not committed)."
        outcome: ok
      - file: sdd/rfcs/rfc-0009-multi-agent-orchestration.md
        section: "References (line 134)"
        read_type: reference
        extract: "PR-review surprising ripple: line 134 quoted the old column header 'If you changed…' as a live pointer (`§ \"If you changed…\"`). Renaming the column to 'Trigger' broke the pointer. Replaced with `§ Ripple-check table > Detailed checklist` matching the skill-files pattern. Exactly the 'agent missed ripple' case BK-194 is designed to prevent — flagged in PR review, not by the ripple-check table."
        outcome: misleading

  - id: verify
    name: Verify
    steps:
      - file: sdd/CLAUDE-REFERENCE.md
        section: "Ripple-check table / New authoritative process doc in `sdd/`"
        read_type: verify
        extract: "Is this a *new* process doc? No — restructuring an existing section. Skip framework / sibling back-reference updates."
        outcome: ok
      - file: sdd/CLAUDE-REFERENCE.md
        section: "Ripple-check table / Backlog item touched"
        read_type: verify
        extract: "Trace at sdd/traces/bk-194-ripple-check-rewrite.yml ships with the PR; audience contributor.process; CHANGELOG skipped per derived rule"
        outcome: ok
      - file: sdd/BACKLOG.md
        section: "Backlog (Prioritized)"
        read_type: verify
        extract: "BK-194 removed from BACKLOG.md; added to BACKLOG-DONE.md § Unreleased with audience tag"
        outcome: ok
      - file: sdd/backlogid.json
        section: "(full)"
        read_type: verify
        extract: "Re-stamped BK 193 -> 194 via hatch run gen-backlogid; was already stale before this PR (master had BK-194 in BACKLOG.md but JSON at 193)"
        outcome: misleading
