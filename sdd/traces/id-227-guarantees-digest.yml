id: ID-227
title: "Consumer guarantees & cost digest — phases 1-3 (atomicity, retryable-vs-terminal, read-after-write consistency, per-operation cost)"
trigger: >
  Feedback on the ID-220 `llms-full.txt` bundle and the ID-226 API skeleton was
  that both answer *how to call* a backend but not the deeper cross-backend
  contract: per-op atomicity and the retryable-vs-terminal error split. A
  docstring census found those facts present-but-scattered (rich only on Graph),
  and the two phase-1 dimensions are in-repo harvestable — so they can be
  projected drift-proof onto FEATURES.md (the ID-221/222 doc-graph surface that
  already flows into the bundle) rather than authored fresh.
source_items:
  - ID-227
  - ID-226
  - ID-222
  - ID-221
  - ID-220
audience:
  - user.discoverability.llm
  - user.site
  - user.api_docs
  - contributor.tooling
discovery_followups:
  - ID-228
  # Born in Phase 2: empirically validating the consistency matrix surfaced that
  # FEATURES.md §LIST/§GLOB advertise Iterator[str] where the Store API yields
  # FileInfo/FolderEntry (a stale-doc regression relative to ID-072).
  - BUG-227
expected_ripples:
  - CHANGELOG.md
  # The Memory/SQLBlob docstring additions shifted a class def line, so the graph
  # regenerated (one `line` field on SQLQueryBackend) and the viz followed — the
  # "public docstring change" ripple-check row anticipates this.
  - docs-src/_data/graph/graph.json
  - docs-src/explanation/graph_viz.html
# Round 1: caught the s3-pyarrow write/write_atomic atomicity cells inverted
# (plain write is the non-atomic streaming path; write_atomic buffers first),
# which the move-only ATOMIC_MOVE cross-check could not detect — a curated cell
# can silently contradict source when no capability encodes it. Also scoped the
# "uniform across backends" retry framing to the HTTP transports.
# Round 2: the retryability status table (generated from _retry's union only)
# omitted 408, which _http.py's _TRANSIENT_STATUSES adds — so `http` reads as
# treating 408 terminal when it actually retries it. Fixed with a † footnote on
# the http mechanism row AND a live drift-guard importing _http._TRANSIENT_STATUSES
# (http_extra must == {408}), closing the same class of gap the round-1 finding
# exposed: a backend-local extension of a shared constant escaping the guards.
# Round 3 (phase 3): the read<->LAZY_READ cross-check had a negative test only for
# the sync table; the async branch (which passes each node's cls_uri straight into
# the guard, distinct from the sync qname->cls: lookup) had no failure-mode test,
# so a mistyped _COST_ASYNC read cell would slip past. Added a parallel monkeypatch
# test flipping AsyncMemoryBackend's read cell off "Streaming" — the very row the
# guard exists to keep honest against its buffering sync mirror.
review_rounds: 3
phases:
  - id: orient
    name: Orient
    steps:
      - file: sdd/BACKLOG.md
        section: "Docs & Discoverability / ID-227"
        read_type: gate
        extract: "Phase-1 scope is atomicity + retryable-vs-terminal, both in-repo harvestable; extend the ID-221/222 doc-graph, drift-proof, surface in the bundle; do not expose the raw SDD subtree. Phases 2/3 (consistency, cost) are author+external-verify and stay out."
        outcome: ok
      - file: scripts/gen_features.py
        section: "project_store_api_ungated + _replace_regions + project_all"
        read_type: gate
        extract: "Curated-prose + graph-derived-membership + --check drift-guard is the established pattern (_UNGATED_STORE_DETAILS); _REGION_RE needs a non-empty body between markers; project_all registers each region."
        outcome: ok
      - file: src/remote_store/_retry.py
        section: "RETRYABLE_STATUSES + terminal comment"
        read_type: gate
        extract: "Retryable set is a named frozenset (429 + 5xx); the terminal set {403,404,409,423,507} lived only in a prose comment — promote it to a TERMINAL_STATUSES constant so both halves of the split are single-sourced from code."
        outcome: ok
  - id: design
    name: Design / decisions
    steps:
      - file: sdd/specs/050-doc-graph-model.md
        section: "DGM-002/003 (deferred error/raises kinds), DGM-013"
        read_type: gate
        extract: "error nodes + raises edges are deferred; adding them is a schema bump (1.4→1.5) with a heavy ripple. Phase 1 needs no graph-queryability — keep schema 1.4 and project curated cells with real guards instead."
        outcome: ok
      - file: sdd/specs/025-retry-policy.md
        section: "RET-014, RET-015"
        read_type: reference
        extract: "Per-backend mechanism differences (Local/Memory no retry; S3 max_attempts only; Azure SDK ExponentialRetry; SFTP tenacity connection-scope; Graph hand-rolled) and the terminal/retryable enumeration that grounds TERMINAL_STATUSES and the status→error rows."
        outcome: ok
      - file: src/remote_store/_capabilities.py
        section: "ATOMIC_MOVE"
        read_type: reference
        extract: "ATOMIC_MOVE is the only machine-harvestable atomicity signal (already a graph node/edge). Use it to cross-check the curated move cell; the Azure-HNS / SFTP-posix_rename mechanism-atomic-but-undeclared cases must be an allow-listed footnote, not a guard failure."
        outcome: ok
  - id: implement
    name: Implement
    steps:
      - file: src/remote_store/_retry.py
        section: "TERMINAL_STATUSES"
        read_type: gate
        extract: "Added the frozenset citing RET-015/GR-018; comment notes disjointness with RETRYABLE_STATUSES."
        outcome: ok
      - file: scripts/gen_features.py
        section: "project_retryability + project_atomicity + _STATUS_DETAIL/_RETRY_MECHANISM/_ATOMICITY"
        read_type: gate
        extract: "Status split imported live from _retry; _STATUS_DETAIL guarded to == RETRYABLE|TERMINAL; mechanism/atomicity key-sets guarded against the registry; move cell cross-checked against ATOMIC_MOVE. Cells name the mechanism (Atomic / Copy+delete / Buffered) so non-atomic ops stay visible instead of hiding behind a dash."
        outcome: ok
      - file: FEATURES.md
        section: "## Backends (atomicity), ## Error Model (retryability)"
        read_type: gate
        extract: "Added atomicity + retryability regions with static intro/footnote prose; regenerated with hatch run gen-features. Reaches llms-full.txt with no nav change (reference/FEATURES.md already in the llmstxt sections)."
        outcome: ok
      - file: src/remote_store/backends/_memory.py
        section: "MemoryBackend docstring"
        read_type: reference
        extract: "Authored the under-lock atomicity sentence (body only, summary unchanged → no graph.json change) so the human docstring agrees with the matrix; same for SQLBlobBackend (DB-transaction atomicity)."
        outcome: ok
  - id: tests
    name: Tests
    steps:
      - file: tests/test_retry.py
        section: "TERMINAL_STATUSES coverage + disjointness"
        read_type: gate
        extract: "Pin the terminal set and assert it is disjoint from RETRYABLE_STATUSES (the loops' branch condition)."
        outcome: ok
      - file: tests/scripts/test_gen_features.py
        section: "TestRetryability / TestAtomicity + region integrity"
        read_type: gate
        extract: "Shape + drift-guard tests (status-detail, mechanism, ATOMIC_MOVE cross-check via monkeypatch); extended test_features_md_has_all_regions with the two new regions."
        outcome: ok
  - id: verify
    name: Verify
    steps:
      - file: sdd/CLAUDE-REFERENCE.md
        section: "Ripple-check / capabilities + versions"
        read_type: verify
        extract: "No doc-graph schema change (gen-graph --check stays green, graph.json byte-identical); docstring bodies changed but summaries did not, so no graph regen; FEATURES.md is user-facing → CHANGELOG entry required."
        outcome: ok
      - file: sdd/traces/_schema.yml
        section: "audience enum + derived CHANGELOG rule"
        read_type: verify
        extract: "FEATURES.md dual-page + llms bundle → audience includes user.* → CHANGELOG required; ID-228 recorded as a discovery_followup from the census."
        outcome: ok
  # --- Phase 2: read-after-write consistency (author + external-verify) -------
  # Phase-2 facts are NOT in-repo harvestable (BACKLOG framed them as
  # author+external-verify), so the projection is curated cells with a
  # registry/async key-set membership guard — a lighter guard than phase 1's
  # constant cross-check — PLUS the one genuine in-repo cross-check available:
  # S3's listings-cache-off default. No doc-graph schema bump (re-evaluated per
  # DGM-002/003, still not earned). Shape confirmed with the user before writing.
  - id: research
    name: Research / external verification
    steps:
      - file: docs-src/explanation/concurrency.md
        section: "(full)"
        read_type: gate
        extract: "Confirms the Phase-2 gap: the concurrency guide covers concurrent-use posture, TOCTOU, and move-atomicity but is SILENT on read-after-write consistency. External verification (vendor docs, recorded here rather than as URL steps): AWS states strong read-after-write for PUT (new+overwrite) and DELETE in all regions and a LIST after a successful PUT shows/omits the object; Azure Storage is strongly consistent incl. list; MS SharePoint/OneDrive writes each file synchronously into a primary AND secondary region before acking — so committed content is read-your-writes, not eventual, from one caller's view."
        outcome: ok
      - file: src/remote_store/backends/_s3_base.py
        section: "_normalise_client_options (use_listings_cache)"
        read_type: gate
        extract: "S3-027 defaults use_listings_cache=False → S3 listings are strong by default; only opt-in caching serves stale. The one in-repo constant the consistency footnote can drift-guard against."
        outcome: ok
      - file: src/remote_store/aio/backends/_graph/monitor.py
        section: "poll_monitor / GR-026"
        read_type: reference
        extract: "copy is always 202+monitor, move sometimes; poll_monitor awaits the terminal 'completed' state BEFORE returning — so read-after-copy/move holds at return. 'async' is blocking-latency, not an eventual-consistency hole."
        outcome: ok
      - file: docs-src/guides/backends/graph.md
        section: "Concurrency & consistency"
        read_type: reference
        extract: "Repo's own guide states 'Read-your-writes holds' for Graph on the same instance — so the BACKLOG shorthand 'Graph replication is eventual' overstates it (corroborated by the MS dual-region-synchronous-write doc noted above). The eventual aspect is cross-replica/async only."
        outcome: misleading
  - id: implement
    name: Implement (phase 2)
    steps:
      - file: src/remote_store/backends/_s3_base.py
        section: "_DEFAULT_USE_LISTINGS_CACHE"
        read_type: gate
        extract: "Promoted the inline `use_listings_cache=False` default to a named module constant (mirrors phase 1's TERMINAL_STATUSES promotion) so the FEATURES.md `*` footnote can be guarded live against it."
        outcome: ok
      - file: scripts/gen_features.py
        section: "project_consistency + _CONSISTENCY / _CONSISTENCY_ASYNC"
        read_type: gate
        extract: "Curated sync (registry-keyed) + async (graph-node-keyed) cells; key-sets drift-guarded against the registry and _async_backend_nodes; S3 listings-cache default cross-checked live. Registered 'consistency' in project_all."
        outcome: ok
      - file: FEATURES.md
        section: "## Backends (read-after-write consistency)"
        read_type: gate
        extract: "Added the consistency region + static intro (normalised-strong guarantee, not mutual exclusion; cross-links concurrency.md). Reaches llms-full.txt with no nav change (reference/FEATURES.md already in the llmstxt sections)."
        outcome: ok
  - id: verify
    name: Verify (phase 2)
    steps:
      - file: tests/scripts/test_gen_features.py
        section: "TestConsistency + region integrity"
        read_type: gate
        extract: "Shape + drift-guard tests (registry key-set, async key-set, S3 listings-cache default via monkeypatch); extended test_features_md_has_all_regions with the consistency region."
        outcome: ok
      - file: sdd/CLAUDE-REFERENCE.md
        section: "Ripple-check / backends"
        read_type: verify
        extract: "_s3_base constant extraction is a comment/constant change, not a docstring-summary change → graph.json byte-identical, no viz regen (verified via gen-graph --check). FEATURES.md user-facing → CHANGELOG phase-2 line added."
        outcome: ok
      - file: src/remote_store/backends/_s3_base.py
        section: "use_listings_cache DirCache behaviour"
        read_type: verify
        extract: "Empirically ran the matrix cells (not just type-checked): local/memory/S3-via-moto all show read-after-write, list-after-write, and read/list-after-delete are strong; and the S3 `*` footnote reproduces both halves — with the cache OFF (default) a cross-writer instance's write appears in the reader's fresh listing, with use_listings_cache=True the reader's listing stays blind to it (stale). Confirms the guarded footnote describes real behaviour."
        outcome: ok
  # --- Phase 3: per-operation cost model (author + external-verify) -----------
  # Backlog framed cost as author+external-verify like phase 2, but the read
  # dimension turned out to have a machine-harvestable signal after all: the
  # LAZY_READ capability already encodes streaming-vs-materialised. So the
  # read cell is cross-checked live against the graph (a phase-1-strength guard,
  # not phase-2's key-set-only guard); metadata/list stay curated with a registry
  # key-set membership guard. No doc-graph schema bump (LAZY_READ is already a
  # node — re-evaluated per DGM-002/003, still not earned). The cross-check
  # immediately earned its keep: AsyncMemoryBackend declares LAZY_READ (it yields
  # chunks) while its sync mirror MemoryBackend does not (buffers fully) — the
  # guard forces the two rows to state opposite read-cost classes instead of
  # silently converging on a copy-pasted "Streaming".
  - id: research
    name: Research / cost-fact census
    steps:
      - file: docs-src/explanation/performance.md
        section: "(full)"
        read_type: gate
        extract: "performance.md is MEASURED benchmark overhead (Docker/Toxiproxy latency, throughput-by-size), not the structural cost class. Phase 3 is the complementary structural view (does read stream or materialise; what a metadata/list costs per call), so the intro cross-links here rather than duplicating."
        outcome: ok
      - file: src/remote_store/_capabilities.py
        section: "LAZY_READ"
        read_type: gate
        extract: "LAZY_READ = read() fetches lazily on demand (constant memory); its absence means read() materialises. Already a graph capability node → the one machine-harvestable cost signal, usable as an ATOMIC_MOVE-style cross-check on the read cell."
        outcome: ok
      - file: src/remote_store/backends/_sqlalchemy.py
        section: "SQLBlobBackend docstring + SQLQueryBackend.read"
        read_type: reference
        extract: "sql-blob read() loads the full BLOB before returning a stream and write() buffers the whole body before the INSERT/UPDATE (no LAZY_READ); sql-query read() executes the SQL and serialises the entire result set into a BytesIO, while its metadata/list run over the in-memory path→query registry (cheap dict ops, not SQL). Grounds the `*` materialisation footnote and the sql-query metadata/list cells."
        outcome: ok
      - file: src/remote_store/aio/backends/_memory.py
        section: "AsyncMemoryBackend LAZY_READ note"
        read_type: reference
        extract: "Explicit docstring: async memory yields chunks incrementally (LAZY_READ) where the sync mirror buffers fully; the mirrors edge does NOT imply capability parity. Confirms the divergent read cells the cross-check enforces are real, not a mistake to reconcile away."
        outcome: ok
  - id: implement
    name: Implement (phase 3)
    steps:
      - file: scripts/gen_features.py
        section: "project_cost + _COST / _COST_ASYNC"
        read_type: gate
        extract: "Curated read/metadata/list cells (sync registry-keyed + async graph-node-keyed); read cell cross-checked live against LAZY_READ (cell startswith 'Streaming' iff declared) for both tables; metadata/list guarded by registry + async key-set membership. Registered 'cost' in project_all. http list cell reads '— (no LIST)' (http lacks the LIST capability) rather than guessing a cost."
        outcome: ok
      - file: FEATURES.md
        section: "## Backends (per-operation cost)"
        read_type: gate
        extract: "Added the cost region + static intro (structural-vs-measured framing, cross-links performance.md; weaves in the write-buffer + hierarchical-write ancestor-probe cost fragments as prose) and the `*` materialisation footnote. Reaches llms-full.txt with no nav change (reference/FEATURES.md already in the llmstxt sections)."
        outcome: ok
  - id: verify
    name: Verify (phase 3)
    steps:
      - file: tests/scripts/test_gen_features.py
        section: "TestCost + region integrity"
        read_type: gate
        extract: "Shape + drift-guard tests: header/rows, representative cells, LAZY_READ cross-check via monkeypatch (flip local's read cell off Streaming → raises), sync + async key-set guards; extended test_features_md_has_all_regions with the cost region. Full suite green (7031 passed / 593 skipped, Stage-1 no-Docker)."
        outcome: ok
      - file: sdd/CLAUDE-REFERENCE.md
        section: "Ripple-check / capabilities + versions"
        read_type: verify
        extract: "No source-constant promotion needed (LAZY_READ already a node, unlike phase 2's _s3_base constant); graph.json byte-identical (no schema change); FEATURES.md user-facing → CHANGELOG phase-3 line added. Phase 3 closes ID-227 → moved to BACKLOG-DONE.md."
        outcome: ok
