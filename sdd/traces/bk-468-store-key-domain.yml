id: BK-468
title: "No spec defines which strings a store accepts as a key (spec 054)"
trigger: >-
  The maintainer asked for a stand-alone spec of keys at the store level, ahead
  of RFC-0017 D3 step 2 and BK-456 stage three, which both build on it.
source_items:
  - BK-468
audience:
  - user.api
  - library.maintainer
decisions:
  - sdd/decisions/f26dd04d-9f53-5e2c-8e68-0cddadfe681d.jsonl
# The three clauses the code breaks today (spec 054 KEY-002, KEY-005, KEY-008).
discovery_followups:
  - BK-469
expected_ripples:
  - sdd/specs/004-path-model.md
  - sdd/specs/051-store-tree.md
  - sdd/specs/053-contract-kernel.md
  - sdd/specs/003-backend-adapter-contract.md
  - sdd/BACKLOG.md
  - sdd/BACKLOG-DONE.md
  - CHANGELOG.md
surprising_ripples:
  # `rg -n "PATH-00[2-8]|004-path-model|[Ss]pec 004"` outside dated records:
  # spec 001 STORE-002 restated the narrow root set; 018 GLOB-007 reads a
  # pattern "as spec 004 reads a path"; two code comments and a test docstring.
  - sdd/specs/001-store-api.md
  - sdd/specs/018-glob.md
  - src/remote_store/_glob.py
  - tests/test_store_tree.py
  - tests/test_path.py
  # check_spec_marks fails a declared ID with no mark (drift), so a clause the
  # code breaks needs an allowlist entry; satisfied clauses got new tests.
  - scripts/check_spec_marks.py
  - tests/test_store.py
  - tests/test_store_keys.py
orient:
  - items: [BK-456]
    verdict: constrains
    evidence: >-
      `hatch run backlog-show BK-456`: stage three is "a prune per file against
      SPEC-DESIGN.md"; the maintainer's scope keeps 003, 052 and 053 sections
      unpruned here, so spec 054 is what stage three links to. Audit 024 row
      "003 BE-029 vs PATH-008" (l.68, l.194): BE-029 says RemotePath normalises
      "./" to the root, PATH-008 refuses it; the store-level answer lands here,
      the BE-029 wording stays stage three's.
  - items: [BK-438, BK-436]
    verdict: constrains
    evidence: >-
      Both are about stored raw keys and a backend's name equality (BE-032 A.1,
      A.2; spec 051 § Name equality), not about which inputs a store accepts.
      Spec 054 states its own name equality as exact and leaves a coarser
      backend's decoding to them; it must not decide BK-438's folder-marker
      decoding or BK-436's measurement.
  - items: [BUG-334]
    verdict: constrains
    evidence: >-
      `hatch run backlog-show BUG-334`: Windows-refused names leak a raw OSError
      from LocalBackend.write, open decision "InvalidPath here, or at D3 step
      5". Spec 054's backend-refusal profile is the clause BUG-334's fix
      satisfies; no code fix and no bug item in this PR (maintainer's scope).
  - items: [BK-433]
    verdict: unrelated
    evidence: >-
      `hatch run backlog-show BK-433`: link policy and a links capability
      (BE-032 A.7). Which node a key reaches through a link is resolution, after
      the key is accepted.
  - items: [BK-465]
    verdict: constrains
    evidence: >-
      `hatch run backlog-show BK-465`: template Assumption IDs `<PREFIX>-A01`
      fail `check_spec_marks._SPEC_ID`; `BE-A-01` passes. Spec 054's Assumption
      IDs take the `KEY-A-01` form the grammar accepts.
  - items: [BUG-339, BK-345, BUG-260, ID-244, ID-247, ID-262, BK-450, BK-446, BK-434, BK-435]
    verdict: unrelated
    evidence: >-
      `hatch run backlog-find --spec BE-029`, `--spec BE-030`, `--spec BE-021`;
      `backlog-find --spec` for PATH-002 to PATH-008, PATH-015, TREE-007,
      TREE-009, BE-025, STORE-002 and STORE-011 found no item. Backend defects
      and test gaps on root and kernel clauses, and the Dafny refinement work;
      none decides which strings a store accepts.
phases:
  - id: orient
    name: Orient
    steps:
      - file: sdd/SPEC-DESIGN.md
        section: "(full)"
        read_type: gate
        extract: "Function kind: one invariant per section; profiles named and declared; Rule 6 skeleton"
        outcome: ok
      - file: sdd/adrs/0048-how-specs-are-designed.md
        section: "(full)"
        read_type: reference
        extract: "Cut by kind; variation declared, never implied"
        outcome: ok
      - file: sdd/specs/004-path-model.md
        section: "(full)"
        read_type: reference
        extract: "PATH-002 to PATH-008 are normalising steps with no order; every other string accepted"
        outcome: ok
      - file: sdd/specs/051-store-tree.md
        section: "Layering, Name equality, Terms"
        read_type: reference
        extract: "Σ open; names compare exactly; 004 maps inputs onto Keys"
        outcome: ok
      - file: sdd/specs/001-store-api.md
        section: "STORE-002, STORE-011"
        read_type: reference
        extract: "Store accepts \"\" and \".\" as the root; file-shaped calls refuse both"
        outcome: ok
      - file: sdd/specs/003-backend-adapter-contract.md
        section: "BE-025, BE-029"
        read_type: reference
        extract: >-
          BE-029: six slash-and-dot root spellings at the backend level; says
          RemotePath normalises "./" to the root, which it refuses (audit 024)
        outcome: misleading
      - file: sdd/specs/053-contract-kernel.md
        section: "BE-030, BE-032 A.1, A.2"
        read_type: reference
        extract: "Kernel refuses / -led and backslash keys; a stored a\\b is a Key outside the addressable subset"
        outcome: ok
      - file: sdd/rfcs/rfc-0021-key-resolution-model.md
        section: "D0, Open Questions"
        read_type: reference
        extract: "Input-to-Key is out of the RFC's scope; folder markers are BK-438"
        outcome: ok
      - file: sdd/adrs/0047-store-tree-key-resolution.md
        section: "(full)"
        read_type: reference
        extract: "BK-438 and BK-436 are open"
        outcome: ok
      - file: sdd/formal/RootPath.dfy
        section: "(full)"
        read_type: reference
        extract: "AddressesRoot is exactly the slash-and-dot spellings; backslash is not the root"
        outcome: ok
      - file: sdd/formal/StoreTree.dfy
        section: "§1"
        read_type: reference
        extract: "Name: non-empty, no '/'; Key a sequence of names"
        outcome: ok
      - file: src/remote_store/_path.py
        section: "RemotePath._normalize"
        read_type: reference
        extract: "NUL refused first, then \\ folded, then empty and . dropped, .. refused, empty refused"
        outcome: ok
      - file: sdd/backlog/bk-395-kernel-key-rule-addressing.md
        section: "(full)"
        read_type: reference
        extract: "The kernel's backslash refusal was decided against PATH-002's fold to avoid d\\f colliding with d/f"
        outcome: ok
      - file: scripts/check_spec_marks.py
        section: "compute_violations, allowlist"
        read_type: reference
        extract: "A declared ID with no mark is drift and fails the gate unless allowlisted"
        outcome: ok
  - id: build
    name: Build
    steps:
      - file: tmp/probe_keys.py
        section: "(full)"
        read_type: verify
        extract: >-
          `hatch run python tmp/probe_keys.py` at 7491289: Store.write of
          "\ud800" ok on Memory, UnicodeEncodeError on Local; 300 x "x" ok on
          Memory, OSError [Errno 36] on Local; "./", "/" and "\\" InvalidPath
          on both; tmp/probe_keys2.py: exists/is_folder/list_files of "./",
          "/" and "\\" InvalidPath, "" and "." the root, on both
        outcome: ok
      - file: tests/test_store_keys.py
        section: "(full)"
        read_type: verify
        extract: >-
          Rule 7 per section: KEY-001, KEY-003, KEY-004, KEY-006, KEY-007 hold
          today and carry new marks (KEY-006 asserted over inputs without
          surrogates, KEY-007 on Memory and Local only, unenforced for the
          other backends); KEY-005 marks the STORE-002 tests, which assert its
          file-shaped half for "", ".", "./", "/", "\\" and its folder-shaped
          half for "" only; KEY-002 and KEY-008 are broken, so allowlisted in
          check_spec_marks with BK-469 as owner
        outcome: ok

