id: BUG-224
title: "Flaky test (3.14) from an unawaited _wait_for_close coroutine"
trigger: >
  After the BK-303 and BK-300 merges, the `test (3.14)` CI matrix entry went
  red on roughly half of runs while 3.10-3.13 stayed green and a re-run of the
  same commit cleared it. The failure was a PytestUnraisableExceptionWarning
  wrapping `RuntimeWarning: coroutine '_wait_for_close' was never awaited`,
  attributed to a different async test each run (graph aio http; then a live-s3
  sync-adapter conformance test) — the signature of a GC-timing artifact under
  `pytest -n auto`, not a defect in any one test. Discovered while running
  /fix-pr on PR #849 (BK-300): the red was first mis-read as pre-existing, then
  traced to the BK-303 merge as the first failing commit, then confirmed flaky
  by a clean re-run.
source_items:
  - BUG-224
discovery_followups:
  - BUG-224
audience:
  - infra.ci
  - infra.test
expected_ripples:
  - sdd/backlogid.json
review_rounds: 0
phases:
  - id: reproduce
    name: Reproduce
    steps:
      - file: .github/workflows/ci.yml
        section: "test job (ALL_PYTHONS matrix); gate"
        read_type: gate
        extract: "test (3.14) is a full matrix entry with no continue-on-error; the gate job aggregates it, so a 3.14 red blocks merge. 3.10-3.13 pass."
        outcome: ok
      - file: tests/backends/graph/aio/test_http.py
        section: "TestGraphSend::test_debug_log_redacts_token"
        read_type: reference
        extract: "First-observed attribution target; uses httpx.AsyncClient under respx. The async azure replay tests (BK-303) pass clean locally on 3.13 in dev mode, so the coroutine source is not this test — the orphan is GC'd here non-deterministically."
        outcome: misleading
  - id: classify
    name: Classify
    steps:
      - file: pyproject.toml
        section: "[tool.pytest.ini_options] filterwarnings"
        read_type: gate
        extract: "filterwarnings = error turns the unraisableexception plugin's PytestUnraisableExceptionWarning into a hard failure; existing SQLAlchemy/OTel ignores set the precedent for narrowly-scoped exemptions of upstream-owned, benign warnings."
        outcome: ok
  - id: fix
    name: Fix
    steps:
      - file: pyproject.toml
        section: "filterwarnings (new _wait_for_close ignore)"
        read_type: reference
        extract: "Add an ignore scoped to the `_wait_for_close` qualname in the PytestUnraisableExceptionWarning message. Chosen over `-p no:unraisableexception` (BK-304 precedent) because the message-scoped filter keeps genuine unclosed-resource detection on every version and only neutralises this one stdlib transport coroutine."
        outcome: ok
  - id: verify
    name: Verify
    steps:
      - file: sdd/CLAUDE-REFERENCE.md
        section: "PR validation gates (pyproject touch -> hatch run all)"
        read_type: verify
        extract: "pyproject.toml is in CODE_PAT, so the mechanical gate is `hatch run all`; running it locally also proves the new filter entry parses and the `pytest.PytestUnraisableExceptionWarning` category resolves (a bad category would error at startup on every version). 3.14-specific suppression is confirmed by the test (3.14) matrix entry."
        outcome: ok
