id: BK-495
title: "Decisions that bind every operation have no home, so each design session would rediscover them"
trigger: >-
  Filed and shipped with BK-494 at the maintainer's request: before
  `/observe OP-01`, a bare skeleton for decisions that bind every operation
  (handle, lifetime, state; "session" disambiguated), definitions only, closing
  RFC-0026 Open Question 1 and BK-485's dossier gap.
source_items:
  - BK-495
audience:
  - contributor.process
  - library.maintainer
discovery_followups: []
surprising_ripples: []
co_shipped_items:
  - BK-494
decisions:
  - sdd/decisions/c886d81c-7d81-58f9-bc3d-f11dc7304e4a.jsonl
  - sdd/decisions/49c0aa22-502b-5f6c-af5e-2807aaa0ea6d.jsonl
orient:
  - items: [BK-480, BK-469, BK-489, ID-272]
    verdict: unrelated
    evidence: >-
      Oriented once with BK-494, whose trace has their verdicts for that item
      (sdd/traces/bk-494-observe-entries.yml). They bear on settings, the key
      layer's comparison, D10 or an RFC input, none on the skeleton's sections.
  - items: [BK-485]
    verdict: constrains
    evidence: >-
      BK-485's dossier gap names three shared decisions and RFC-0026 OQ1 eight
      more (six from research note 7, two from notes 2 and 5), so the
      skeleton's Lands elsewhere table homes each of them: 11 rows.
phases:
  - id: orient
    name: Read what the skeleton must home
    steps:
      - file: sdd/decisions/c886d81c-7d81-58f9-bc3d-f11dc7304e4a.jsonl
        section: "answered events of 2026-10-27, 13:38 and 13:51"
        read_type: gate
        extract: >-
          The maintainer's cut: two items. Before read(), only a bare skeleton
          (definitions of lifecycle, state, session), filled with or after each
          /observe session, so the ground is not biased and no architecture is
          decided; whether something belongs to the store, an extension or the
          glob way is decided after the sessions, not in them. Brought from
          branch bk-493-operation-catalogue, where the lines landed after
          BK-493 merged
        outcome: ok
      - file: sdd/rfcs/rfc-0026-operation-catalogue.md
        section: "Motivation, Open Questions"
        read_type: gate
        extract: "OQ1: which shared layer each item lands in is open; research note 7's list"
        outcome: ok
      - file: sdd/backlog/bk-485-spec-first-reset.md
        section: "Format RFC input"
        read_type: gate
        extract: "exists's D2, a timeout bound, a profile surface: three shared items with no home"
        outcome: ok
      - file: sdd/rfcs/rfc-0024-spec-first-reset.md
        section: "R1 (D5)"
        read_type: gate
        extract: "Key, error, lifecycle and consistency layers grow from read(); so the skeleton's table may name where, never decide"
        outcome: ok
      - file: sdd/specs/053-store-operations.md
        section: "Terms"
        read_type: reference
        extract: "Store and AsyncStore are handles; the Handle section cites them"
        outcome: ok
