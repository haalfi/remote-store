id: BK-495
title: "Decisions that bind every operation have no home, so each design session would rediscover them"
trigger: >-
  Filed and shipped with BK-494 at the maintainer's request: before
  `/observe OP-01`, a bare skeleton for decisions that bind every operation
  (handle, lifetime, state; "session" disambiguated), definitions only, closing
  RFC-0026 Open Question 1 and BK-485's dossier gap.
