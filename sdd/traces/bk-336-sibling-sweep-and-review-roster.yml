id: BK-336
title: "/fix-pr must find a finding's siblings, not just fix the lines it names"
trigger: >-
  PR #944 merged after five review rounds and 13 lens-passes over one day.
  Rounds 2-5 re-found one defect class in places the previous fix had not
  looked, rather than finding five distinct defects.
source_items:
  - BK-336
  - BK-338
  - BK-330
audience:
  - contributor.process
co_shipped_items:
  - BK-338
expected_ripples:
  - sdd/backlogid.json
surprising_ripples:
  - .claude/skills/orchestrate/SKILL.md
  - .claude/skills/pr/SKILL.md
review_rounds: 0
phases:
  - id: orient
    name: Orient
    steps:
      - file: sdd/BACKLOG.md
        section: "BK-336 (item)"
        read_type: gate
        extract: >-
          Root cause, the Step 2 home, and the four-row evidence table naming
          the sweep each finding class needed
        outcome: ok
      - file: .claude/skills/fix-pr/SKILL.md
        section: "Step 2: Triage"
        read_type: gate
        extract: >-
          Confirm the existing "Be critical" paragraph is the half-triage the
          item describes, and that nothing already sweeps for siblings
        outcome: ok
      - file: .claude/skills/rvw-pr/SKILL.md
        section: "(full)"
        read_type: gate
        extract: >-
          Locate the reviewer brief the replacement targets. Read retrospectively
          as the home of a "lens roster"; there is no roster in the file. The
          multi-lens practice was repeated invocation under themed context via
          the skill's own $ARGUMENTS context slot, so the fix had to forbid the
          practice rather than delete a list.
        outcome: misleading
  - id: design
    name: Decide the replacement's scope
    steps:
      - file: .claude/skills/orchestrate/SKILL.md
        section: "Step 6: Review"
        read_type: reference
        extract: >-
          The five-expert cross-review is the actual roster. Not anticipated by
          the ripple-check: the item named /fix-pr and /rvw-pr only, and this
          step is where "all 5 experts review" is written down.
        outcome: ok
      - file: sdd/adrs/0020-orchestrate-iterative-convergence.md
        section: "Decision (final paragraph)"
        read_type: gate
        extract: >-
          Whether replacing the roster needs an ADR amendment. It does not: the
          ADR delegates roster, round cap and step sequence to the skill as
          operational contract, and the iterative-convergence decision is
          untouched.
        outcome: ok
      - file: sdd/CLAUDE-REFERENCE.md
        section: "Ripple-check table / Pre-work index"
        read_type: gate
        extract: >-
          Which rows fire for a skill-prose change. "Backlog item touched"
          (trace + audience-derived CHANGELOG rule) and "Authority direction
          amended" (find live restating copies) fire; no row covers
          .claude/skills/** as a target set, which is BK-337's open subject.
        outcome: ok
  - id: implement
    name: Implement
    steps:
      - file: .claude/skills/fix-pr/SKILL.md
        section: "Step 2: Triage, Step 3: Fix, Step 6, Rules"
        read_type: reference
        extract: >-
          Sibling-sweep table keyed by finding class, claim-granularity rule for
          test vacuity, mutation-verification of blocking findings moved here
          from the reviewer, sweep results required in the report
        outcome: ok
      - file: .claude/skills/rvw-pr/SKILL.md
        section: "Budget, Step 4 comment rules"
        read_type: reference
        extract: >-
          One general pass with no persona, 15-minute budget phrased as a
          scoping assertion, one-claim-per-comment brevity rule
        outcome: ok
      - file: sdd/BACKLOG-DONE.md
        section: "Unreleased"
        read_type: reference
        extract: >-
          Land BK-336 and BK-338 with the rationale, including the two
          deliberate non-changes (no reviewer-side sweep; orchestrate Steps 3-4
          keep all 5 experts)
        outcome: ok
  - id: verify
    name: Verify
    steps:
      - file: sdd/BACKLOG.md
        section: "BK-336 (evidence table)"
        read_type: verify
        extract: >-
          Replay all four rows against the new Step 2 table and confirm it
          routes each to the technique the row names: tracker ID and
          DRIFT-RULES trigger to Grep-plus-paraphrases, test vacuity to
          mutation, header counter to re-reading the line
        outcome: ok
      - file: .claude/skills/
        section: "(full tree)"
        read_type: verify
        extract: >-
          Apply the new Step 2 sweep to this change itself. Three siblings the
          diff had missed: /pr's PR body needed the same brevity rule as
          /rvw-pr's comments; /rvw-pr's $ARGUMENTS context slot still licensed
          the themed brief the Budget section forbids; and deleting the
          documentation persona deleted the run-the-tool behaviour that found
          PR #944's only user-facing bug, which /orchestrate Step 6 now requires
          outright. /audit needed nothing — its report is already a fixed table.
          The third is the one inspection would not have surfaced: the sweep
          asked what the removed thing was doing, not where its name appeared.
        outcome: ok
      - file: sdd/traces/_schema.yml
        section: "audience (derived rule)"
        read_type: verify
        extract: >-
          contributor.process alone, introducing no user-facing framework or
          spec, so no CHANGELOG entry is required
        outcome: ok
      - file: sdd/CLAUDE-REFERENCE.md
        section: "Ripple-check table / Detailed checklist"
        read_type: verify
        extract: >-
          Confirm no dangling BK-336 reference survives in BACKLOG.md, and that
          the provenance anchor first written into orchestrate Step 6 was
          removed rather than left for ID-239's sweep to find
        outcome: ok
