id: BK-263
title: "Graph upload-session ResourceLocked leaks the pre-signed uploadUrl (credential)"
trigger: >-
  A 423 during a Graph upload-session chunk PUT raised ResourceLocked with the
  full pre-signed uploadUrl (credential in its query, GR-038) embedded verbatim
  in the message; a passing GR-045 test asserted the URL was present, while the
  sibling monitor path already query-stripped the identical credential class.
source_items:
  - BK-263
audience:
  - user.api
  - library.maintainer
  - infra.test
phases:
  - id: orient
    name: Orient
    steps:
      - file: sdd/audits/audit-016-graph-backend-review.md
        section: "H1"
        read_type: reference
        extract: "Credential leak diagnosis + the GR-045 vs GR-035/GR-026 spec contradiction"
      - file: sdd/BACKLOG.md
        section: "BK-263 (item)"
        read_type: gate
        extract: "Decide-first escalated spec conflict; options (a) redact + amend vs (b) error.context"
  - id: spec
    name: Resolve contradiction
    steps:
      - file: sdd/specs/044-graph-backend.md
        section: "GR-045, GR-035, GR-038"
        read_type: gate
        extract: "GR-035 (no token in messages) outranks GR-045 resume-from-message; amend GR-045"
      - file: sdd/adrs/0024-resource-locked-error.md
        section: "Bundled implementation"
        read_type: reference
        extract: "ADR-0024 already declares .context out of scope and makes no resume-from-message promise — no ADR change"
        outcome: ok
  - id: reproduce
    name: Reproduce
    steps:
      - file: tests/backends/graph/aio/test_write.py
        section: "test_423_mid_session_surfaces_resource_locked_without_abort"
        read_type: verify
        extract: "Flip assertion to require credential ABSENT; run to see it fail against leaking code"
  - id: implement
    name: Implement
    steps:
      - file: src/remote_store/aio/backends/_graph/monitor.py
        section: "_redact_url"
        read_type: reference
        extract: "Existing query-strip redaction to hoist into shared http helper"
      - file: src/remote_store/aio/backends/_graph/http.py
        section: "redact_presigned_url"
        read_type: reference
        extract: "Add shared redactor; both monitor and transfer call it"
      - file: src/remote_store/aio/backends/_graph/transfer.py
        section: "_resource_locked_mid_session"
        read_type: reference
        extract: "Redact session_url before embedding; reword to drop resume-from-message"
  - id: verify
    name: Verify
    steps:
      - file: sdd/CLAUDE-REFERENCE.md
        section: "Ripple-check table / Bug fix"
        read_type: verify
        extract: "BACKLOG→DONE, CHANGELOG stub, failing-test-before-fix, spec amendment shipped same PR"
