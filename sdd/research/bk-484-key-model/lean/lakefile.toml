name = "key_model"
defaultTargets = ["KeyConcept"]

# Spec 051's Lean definitions, by relative path from this folder.
[[require]]
name = "store_axioms"
path = "../../../formal/lean"

# Lean core only, no Mathlib. A warning fails the build, so a `sorry` cannot
# pass as a proof.
[[lean_lib]]
name = "KeyConcept"
roots = ["KeyConcept", "KeyStore"]
leanOptions = { warningAsError = true }
