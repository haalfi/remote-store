[[clause]]
id = "S01"
given = "a key whose item has content"
when = "the stream is opened"
then = "an Open stream at position 0"
decided_by = ["D18", "D9"]
axis = "AX-6"
path = "success"
trigger = ["O1"]
form = "stream"
api = "both"
state = "none"
scope = "portable"
kind = "lifetime"
status = "decided"
rule = ["N1"]
