# OP-01's stream lifecycle as classified behaviour clauses (BK-511 pilot).
# Record: observe/OP-01/freeze-1 (a7de4e31). One clause, one observable behaviour:
# given (pre-state), when (call or trigger), then (outcome), after every amendment.
#
# Facets and vocabularies: whole/SCHEMA.md (checked by check.py). Pilot-only facet:
#   rule        freeze-1/stream_rules.toml's rule ids it maps to (optional)
# A stream read's storage failure lists D96's stream-read rows as its trigger
# (E4 E6 E7 to E13 E15; E7 at a resume's reconnect).

