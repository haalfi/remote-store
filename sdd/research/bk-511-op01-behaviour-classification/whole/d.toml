# OP-01 group D: error categories and typing (AX-10), failure phases (AX-11),
# AX-6/AX-12/AX-14 remainders, a handle's start, non-promises, close-out text.
# Record: observe/OP-01/freeze-1 (a7de4e31). Schema: SCHEMA.md. Clause ids X01..
# Each category clause states the category as D34's table holds it after every
# amendment (D48, D53 to D56, D61, D62, D84, D86, D88, D124, D153), and its phases
# as D96's table holds it (D142, D153). Category names are working names until
# the error layer names them (D27's check), so OP-01/O9 is carried as the gap.

