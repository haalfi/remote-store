# OP-01 stream lifecycle as guarded rules, carried forward to freeze-1 (observe/OP-01/freeze-1, a7de4e31).
# Sources: D2, D6, D7, D15-D18, D20, D36 as amended by D50, D51, D52, D70, D80, D92-D95, D100,
# D117, D118, D132, D153-D155 (each read in the frozen record).
#
# Oracle state: state (Open|Exhausted|Failed|Closed), content (bytes), pos (int).
# Call inputs:  event, n (size; -1 for readline), inject (the fault that reached the backend).
# A rule: on, when, accept | raises | warns, advance, to, assumed, open (see the spike's copy).

[derive]
r = "len(content) - pos"
nl = "content.find(b'\\n', pos)"
take = "(nl + 1 - pos if nl >= 0 else r) if event == 'readline' else (r if n < 0 else min(n, r))"
badsize = "event == 'chunk' and n <= 0"
to_after = "'Exhausted' if pos + len(got) == len(content) else 'Open'"

[[rule]]
id = "N1"
src = ["D18"]
on = ["open"]
when = "state == 'New'"
to = "'Open' if content else 'Exhausted'"

# -- data reads (D93's list): read, read1, readinto, readline, chunks ----------

[[rule]]
id = "RF1"
src = ["D7", "D51", "D80", "D92", "D117"]
on = ["chunk"]
when = "badsize"
raises = "ValueError"
assumed = "F5 (part): raised at the chunks() call or at the first next() is still undecided; the call is assumed"

[[rule]]
id = "RF2"
src = ["D15", "D117"]
on = ["read", "read1", "readinto", "readline", "chunk"]
when = "state == 'Closed' and not badsize"
raises = "ValueError"

[[rule]]
id = "RF3"
src = ["D16", "D52", "D93", "D117"]
on = ["read", "read1", "readinto", "readline", "chunk"]
when = "state == 'Failed' and not badsize and inject != 'cancel'"
raises = "Unavailable"

[[rule]]
id = "RF4"
src = ["D6", "D18", "D132", "D155"]
on = ["read", "read1", "readinto", "readline", "chunk"]
when = "state in ('Open', 'Exhausted') and not badsize and take == 0 and inject not in ('fail', 'cancel')"
accept = "got == b''"
assumed = "F1 (part): D155 fixes read1(0) and an empty readinto as b''/0, not the end; read(0) itself is still D6's min(n, r) only"

[[rule]]
id = "RF5"
src = ["D20", "D50"]
on = ["read", "read1", "readinto", "readline", "chunk"]
when = "state != 'Closed' and not badsize and inject == 'cancel'"
raises = "Cancelled"
to = "'Closed'"

[[rule]]
id = "RF6"
src = ["D16", "D51"]
on = ["read", "read1", "readinto", "readline", "chunk"]
when = "state in ('Open', 'Exhausted') and not badsize and inject == 'fail'"
raises = "Unavailable"
to = "'Failed'"
assumed = "F10: at the end, a read that reaches the backend can still fail; D18 still defines Exhausted as 'at end'"

[[rule]]
id = "RF7"
src = ["D6", "D70"]
on = ["read", "readinto", "readline"]
when = "state == 'Open' and take > 0 and inject not in ('fail', 'cancel')"
accept = "got == content[pos:pos + take]"
advance = "len(got)"
to = "to_after"

[[rule]]
id = "RF8"
src = ["D7", "D2"]
on = ["chunk"]
when = "state == 'Open' and not badsize and take > 0 and inject not in ('fail', 'cancel')"
accept = "0 < len(got) <= n and got == content[pos:pos + len(got)]"
advance = "len(got)"
to = "to_after"

[[rule]]
id = "RF9"
src = ["D70", "D78", "D155"]
on = ["read1"]
when = "state == 'Open' and take > 0 and inject not in ('fail', 'cancel')"
accept = "0 < len(got) <= take and got == content[pos:pos + len(got)]"
advance = "len(got)"
to = "to_after"

# -- close -------------------------------------------------------------------------

[[rule]]
id = "K1"
src = ["D15", "D117"]
on = ["close"]
when = "state == 'Closed'"
accept = "got is None"

[[rule]]
id = "K2"
src = ["D36", "D50", "D94", "D118"]
on = ["close"]
when = "state != 'Closed' and inject == 'cancel'"
raises = "Cancelled"
to = "'Closed'"

[[rule]]
id = "K3"
src = ["D18", "D36"]
on = ["close"]
when = "state != 'Closed' and inject != 'cancel'"
accept = "got is None"
to = "'Closed'"

# -- collection ----------------------------------------------------------------------

[[rule]]
id = "G1"
src = ["D17"]
on = ["collect"]
when = "state == 'Closed'"

[[rule]]
id = "G2"
src = ["D17"]
on = ["collect"]
when = "state != 'Closed'"
warns = "ResourceWarning"
to = "'Closed'"
assumed = "F3: D17 warns for 'an open stream'; Exhausted and Failed still unstated"

# -- other stream calls (D70, D93, D101, D117, D153): no request, so no fault reaches them

[[rule]]
id = "Z1"
src = ["D70", "D93"]
on = ["seekable"]
when = "state != 'Closed'"
accept = "got is False"

[[rule]]
id = "Z2"
src = ["D117"]
on = ["seekable", "tell", "seek"]
when = "state == 'Closed'"
raises = "ValueError"

[[rule]]
id = "T1"
src = ["D70", "D93"]
on = ["tell"]
when = "state != 'Closed'"
accept = "got == pos"

[[rule]]
id = "S1"
src = ["D70", "D93", "D153"]
on = ["seek"]
when = "state != 'Closed'"
raises = "UnsupportedOperation"

[[rule]]
id = "H1"
src = ["D18"]
on = ["handle_end"]
open = "OP-01/O5"
