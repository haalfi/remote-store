# OP-01 stream lifecycle as typed rows (spike, step 2).
# Sources: OP-01 record D6, D7, D15-D18, D20, D36 (as read in this session).
#
# Row fields:
#   state    start state: Open | Exhausted | Failed | Closed | New (before open)
#   content  item bytes (ASCII); pos = bytes already consumed (Open only)
#   event    open | read | readinto | readline | chunks | close | collect | handle_end
#   inject   one-shot environment event for this call: fail | cancel | release_fail
#   expect   returns (str) | raises (category) | concat + max (chunks) | warns
#   next     state after the event
#   assumed  set when the prose does not fix the cell; the text says what was assumed
#   open     set when the cell is an open item; the row is listed, not checked

