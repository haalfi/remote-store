\* TLC config for MC.tla.
\* Model values p1, p2, m1, m2 are introduced via the `= <name>` idiom —
\* TLC treats each as an opaque distinct constant.

SPECIFICATION Spec

CONSTANTS
    Paths      <- MCPaths
    DataSizes  <- MCDataSizes
    MetaValues <- MCMetaValues
    MaxClock   <- MCMaxClock
    p1 = p1
    p2 = p2
    m1 = m1
    m2 = m2

CONSTRAINT
    StateConstraint

INVARIANTS
    TypeOK
    WriteHeadAgree
    HeadIsSidecar
    MetaGateHeld
