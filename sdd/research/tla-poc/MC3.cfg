\* TLC config for MC3.tla (Observer dispatch — I1, I2, I3a, I3b).

SPECIFICATION Spec

CONSTANTS
    Ops         <- MCOps
    HookClasses <- MCHookClasses
    ClassOf     <- MCClassOf
    Outcomes    <- MCOutcomes
    MaxCalls    <- MCMaxCalls
    op_read     = op_read
    op_write    = op_write
    op_delete   = op_delete
    read_hook   = read_hook
    write_hook  = write_hook
    delete_hook = delete_hook

CONSTRAINT
    StateConstraint

INVARIANTS
    TypeOK
    EventPerCompletedOp
    RoutingByOpClass
    ClassHookOutcomeIndependent
    ErrorHookFiresOnErrorOnly
    ErrorAlwaysReraise
    AfterHookExceptionIsolated
