[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "remote-store"
version = "0.20.0"
description = "Write file storage code once. Run it against local files, S3, SFTP, or Azure."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
  { name = "Harald Alferi" },
]
keywords = [
  "file-storage",
  "object-storage",
  "filesystem",
  "storage-abstraction",
  "api",
  "streaming",
  "atomic-writes",
  "s3",
  "azure-blob-storage",
  "sftp",
  "fsspec",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries",
  "Topic :: System :: Filesystems",
  "Typing :: Typed",
  "Operating System :: OS Independent",
]

dependencies = []

[project.urls]
Homepage = "https://remotestore.dev"
Documentation = "https://docs.remotestore.dev/"
Repository = "https://github.com/haalfi/remote-store"
Changelog = "https://github.com/haalfi/remote-store/blob/master/CHANGELOG.md"
Issues = "https://github.com/haalfi/remote-store/issues"

[project.optional-dependencies]
s3 = ["s3fs>=2024.2.0"]
s3-pyarrow = ["s3fs>=2024.2.0", "pyarrow>=14.0.0"]
sftp = ["paramiko>=2.2", "tenacity>=4.0"]
azure = ["azure-storage-file-datalake>=12.16.0", "azure-identity>=1.0.0"]
arrow = ["pyarrow>=12.0.0"]
otel = ["opentelemetry-api>=1.28.0"]
toml = ["tomli>=1.1.0; python_version < '3.11'"]
yaml = ["pyyaml>=5.1"]
pydantic = ["pydantic-settings>=2.0.0"]
dagster = ["dagster>=1.9"]
sql = ["sqlalchemy>=2.0"]
sql-query = ["sqlalchemy>=2.0", "pyarrow>=12.0.0"]
requests = ["requests>=2.25.0", "urllib3>=1.26.0"]
httpx = ["httpx>=0.24.0"]

bench = [
  "pytest-benchmark>=4.0",
  "boto3",
  "s3fs>=2024.2.0",
  "pyarrow>=14.0.0",
  "paramiko>=2.2",
  "tenacity>=4.0",
  "azure-storage-file-datalake>=12.16.0",
  "azure-identity>=1.0.0",
  "adlfs>=2024.2.0",
  "sshfs>=2023.1.0",
  "matplotlib>=3.8",
]

docs = [
  "mkdocs>=1.6,<2",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.27",
  "mkdocs-include-markdown-plugin>=7.0",
  "mkdocs-gen-files>=0.5",
  "mkdocs-literate-nav>=0.6",
  "mkdocs-section-index>=0.3",
  "mike>=2.0",
  "Pygments>=2.18,<2.21",  # 2.20 breaks pymdownx.highlight (filename=None)
  "s3fs>=2024.2.0",
]

dev = [
  "pytest",
  "pytest-cov",
  "mypy",
  "ruff",
  "jupyter",
  "s3fs>=2024.2.0",
  "pyarrow>=14.0.0",
  "moto[server,s3]",
  "paramiko>=2.2",
  "tenacity>=4.0",
  "types-paramiko",
  "types-requests>=2.31",
  "azure-storage-file-datalake>=12.16.0",
  "azure-identity>=1.0.0",
  "opentelemetry-api>=1.28.0",
  "opentelemetry-sdk>=1.28.0",
  "tomli>=1.1.0",
  "ruamel.yaml>=0.15",
  "pyyaml>=5.1",
  "pre-commit",
  "bump-my-version>=0.28",
  "twine",
  "python-dotenv",
  "polars>=0.20",
  "duckdb>=0.9",
  "dagster>=1.9",
  "pytest-httpserver>=1.0.0",
  "requests>=2.25.0",
  "httpx>=0.24.0",
  "sqlalchemy>=2.0",
]

[tool.hatch.envs.default]
installer = "uv"
dependencies = [
  "pytest",
  "pytest-cov",
  "mypy",
  "ruff",
  "s3fs>=2024.2.0",
  "moto[server,s3]",
  "paramiko>=2.2",
  "tenacity>=4.0",
  "pyarrow>=14.0.0",
  "types-paramiko",
  "types-requests>=2.31",
  "azure-storage-file-datalake>=12.16.0",
  "azure-identity>=1.0.0",
  "opentelemetry-api>=1.28.0",
  "opentelemetry-sdk>=1.28.0",
  "pytest-benchmark",
  "adlfs>=2024.2.0",
  "sshfs>=2023.1.0",
  "tomli>=1.1.0",
  "ruamel.yaml>=0.15",
  "pyyaml>=5.1",
  "pre-commit",
  "mkdocs>=1.6,<2",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.27",
  "mkdocs-include-markdown-plugin>=7.0",
  "mkdocs-gen-files>=0.5",
  "mkdocs-literate-nav>=0.6",
  "mkdocs-section-index>=0.3",
  "mike>=2.0",
  "Pygments>=2.18,<2.21",
  "polars>=0.20",
  "duckdb>=0.9",
  "dagster>=1.9",
  "pytest-httpserver>=1.0.0",
  "requests>=2.25.0",
  "httpx>=0.24.0",
  "matplotlib>=3.8",
  "sqlalchemy>=2.0",
  "pytest-gremlins>=1.5; python_version>='3.11'",
]

[tool.hatch.envs.default.scripts]
lint = "ruff check src/ tests/ examples/"
format = "ruff format src/ tests/ examples/"
format-check = "ruff format --check src/ tests/ examples/"
typecheck = "mypy src/"
test = "pytest"
test-cov = "pytest --cov=remote_store --cov-report=term-missing --cov-report=xml --cov-fail-under=95"
test-cov-branch = "pytest --cov=remote_store --cov-branch --cov-report=term-missing --cov-report=xml"
# Core examples only — cloud backend examples (examples/backends/) need
# real services and credentials, so they are excluded from `hatch run examples`.
examples = [
  "python examples/quickstart.py",
  "python examples/file_operations.py",
  "python examples/streaming_io.py",
  "python examples/atomic_writes.py",
  "python examples/configuration.py",
  "python examples/error_handling.py",
  "python examples/memory_backend.py",
  "python examples/store_child.py",
  "python examples/batch_operations.py",
  "python examples/glob_pattern_matching.py",
  "python examples/transfer_operations.py",
  "python examples/observe_hooks.py",
  "python examples/capabilities_and_errors.py",
  "python examples/path_model.py",
  "python examples/pyarrow_adapter.py",
  "python examples/snippets/homepage.py",
  "python examples/snippets/core_operations.py",
  "python examples/snippets/custom_backend_guide.py",
]
notebooks = "python tests/scripts/run_notebooks.py"
# End-to-end tests against Docker backends (docker compose -f benchmarks/infra/docker-compose.yml up -d)
e2e = "pytest tests/e2e/ -v -o addopts="
bench = 'pytest benchmarks/ -v --benchmark-sort=mean -m "not standard and not full"'
bench-standard = 'pytest benchmarks/ -v --benchmark-sort=mean -m "not full"'
bench-full = "pytest benchmarks/ -v --benchmark-sort=mean"
bench-save = 'pytest benchmarks/ -v --benchmark-sort=mean --benchmark-autosave -m "not standard and not full"'
bench-save-standard = 'pytest benchmarks/ -v --benchmark-sort=mean --benchmark-autosave -m "not full"'
bench-save-full = "pytest benchmarks/ -v --benchmark-sort=mean --benchmark-autosave"
bench-compare = "pytest benchmarks/ -v --benchmark-sort=mean --benchmark-compare"
bench-cloud = 'pytest benchmarks/ -v --infra cloud --benchmark-sort=mean -m "not standard and not full"'
bench-cloud-standard = 'pytest benchmarks/ -v --infra cloud --benchmark-sort=mean -m "not full"'
bench-report = "python benchmarks/report.py"
bench-report-compare = "python benchmarks/report.py --compare"
bench-report-json = "python benchmarks/report.py --json"
bench-report-comparative = "python benchmarks/report.py --comparative"
bench-report-comparative-md = "python benchmarks/report.py --comparative --markdown --output benchmarks/results/comparative.md"
bench-report-user = "python benchmarks/report.py --user"
bench-latency-matrix = "python benchmarks/run_latency_matrix.py"
bench-charts = "python -m benchmarks.charts"
check-test-quality = ["python scripts/check_test_assertions.py tests", "python scripts/check_mock_spec.py tests"]
# Mutation testing — scoped for Windows command-line length limits (~450 tests max).
# Each scope pairs source targets with the tests that exercise them.
# Run `hatch run mutate-<scope>` or append --gremlin-report=html for HTML output.
mutate-core-api = "pytest --gremlins --gremlin-targets=src/remote_store/_store.py,src/remote_store/_proxy.py,src/remote_store/_stream.py,src/remote_store/_glob.py,src/remote_store/_backend.py,src/remote_store/_types.py tests/test_store.py tests/test_store_child.py tests/test_proxy.py tests/test_depth_listing.py tests/test_folder_info_depth.py tests/test_open_atomic.py tests/test_ping.py tests/test_stream.py tests/test_glob.py"
mutate-core-infra = "pytest --gremlins --gremlin-targets=src/remote_store/_capabilities.py,src/remote_store/_errors.py,src/remote_store/_config.py,src/remote_store/_models.py,src/remote_store/_path.py,src/remote_store/_resolution.py,src/remote_store/_registry.py,src/remote_store/backends/_memory.py,src/remote_store/backends/_fileinfo.py tests/test_capabilities.py tests/test_errors.py tests/test_config.py tests/test_models.py tests/test_path.py tests/test_resolution.py tests/test_registry.py tests/test_memory_coverage.py"
mutate-ext-proxy = "pytest --gremlins --gremlin-targets=src/remote_store/ext/arrow.py,src/remote_store/ext/batch.py,src/remote_store/ext/cache.py,src/remote_store/ext/glob.py,src/remote_store/ext/integrity.py,src/remote_store/ext/observe.py,src/remote_store/ext/otel.py,src/remote_store/ext/partition.py,src/remote_store/ext/streams.py,src/remote_store/ext/transfer.py tests/test_arrow.py tests/test_batch.py tests/test_cache.py tests/test_observe.py tests/test_otel.py tests/test_partition.py tests/test_integrity.py tests/test_transfer.py tests/test_streams.py tests/test_glob.py"
mutate-ext-format = "pytest --gremlins --gremlin-targets=src/remote_store/ext/parquet.py,src/remote_store/ext/yaml.py,src/remote_store/ext/pydantic.py,src/remote_store/ext/dagster.py tests/test_ext_parquet.py tests/test_ext_yaml.py tests/test_ext_pydantic.py tests/test_dagster.py"
mutate-backends-local = "pytest --gremlins --gremlin-targets=src/remote_store/backends/_local.py,src/remote_store/backends/_http.py,src/remote_store/backends/_http_httpx.py,src/remote_store/backends/_http_requests.py,src/remote_store/backends/_sqlalchemy.py tests/backends/test_local.py tests/backends/test_http.py tests/test_backend_sqlblob.py tests/test_backend_sqlquery.py"
mutate-backends-cloud = "pytest --gremlins --gremlin-targets=src/remote_store/backends/_s3.py,src/remote_store/backends/_s3_base.py,src/remote_store/backends/_s3_pyarrow.py,src/remote_store/backends/_sftp.py,src/remote_store/backends/_azure.py tests/backends/test_s3.py tests/backends/test_s3_pyarrow.py tests/backends/test_sftp.py tests/backends/test_azure.py"
docs = "mkdocs serve"
docs-build = "mkdocs build --strict"
pre-commit-install = "pre-commit install"
all = ["lint", "format-check", "typecheck", "test-cov", "examples", "notebooks"]

[tool.hatch.build.targets.wheel]
packages = ["src/remote_store"]

[tool.mypy]
strict = true
namespace_packages = true
plugins = ["sqlalchemy.ext.mypy.plugin"]

# tomllib is stdlib from 3.11+; on 3.10 it doesn't exist and tomli is used instead.
[[tool.mypy.overrides]]
module = "tomllib"
ignore_missing_imports = true

# _config.py uses `import tomli as tomllib  # type: ignore[no-redef]` in a try/except
# fallback — the ignore is valid only on 3.11+ where tomllib exists. Suppress the
# "unused ignore" warning so both 3.10 and 3.11+ pass.
[[tool.mypy.overrides]]
module = "remote_store._config"
warn_unused_ignores = false

# ext/yaml.py imports pyyaml with `# type: ignore[import-untyped]` — pyyaml has no
# py.typed marker and no stubs. The ignore is needed but flagged as unused when
# pyyaml isn't installed and ruamel.yaml is used instead.
[[tool.mypy.overrides]]
module = "remote_store.ext.yaml"
warn_unused_ignores = false

# Dagster does not ship py.typed and has no third-party stubs on PyPI.
[[tool.mypy.overrides]]
module = "dagster.*"
ignore_missing_imports = true

# ext/dagster.py uses `# type: ignore[import-untyped]` on dagster imports.
[[tool.mypy.overrides]]
module = "remote_store.ext.dagster"
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Exclude e2e by default — they need Docker services running.
# Run them explicitly with: hatch run e2e
addopts = "--ignore=tests/e2e"
markers = [
  "spec(id): links test to a spec section ID",
  "integration: requires external services",
  "requires_docker: test needs Docker services (e.g. Azurite)",
  "standard: medium-tier benchmark (10MB payload, deep hierarchy, ~5 min/backend)",
  "full: heavy-tier benchmark (100MB payload, 10k listing, ~20-30 min/backend)",
  "os_sensitive: exercises OS-specific behaviour (paths, atomic writes, local filesystem); run on macOS and Windows CI",
]

[tool.pytest-gremlins]
cache = true
exclude = ["**/__init__.py", "**/__pycache__/*"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "TCH", "PT"]
ignore = ["UP045"]

[tool.ruff.lint.flake8-pytest-style]
# Note: ruff PT011 only resolves builtin/stdlib names; custom exception names
# below are documentation of intent, not enforced. See BK-126.
raises-require-match-for = [
    "ValueError", "TypeError", "KeyError", "RuntimeError",
    "NotFound", "AlreadyExists", "CapabilityNotSupported",
    "BackendUnavailable", "PermissionDenied",
]

[tool.ruff.lint.isort]
known-first-party = ["remote_store"]

# --- Version management ---
# Run: bump-my-version bump patch|minor|major
# Bumps version in all three locations atomically.

[tool.bumpversion]
current_version = "0.20.0"
commit = false
tag = false
tag_name = "v{new_version}"
message = "Bump version: {current_version} → {new_version}"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "src/remote_store/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'

[[tool.bumpversion.files]]
filename = "CITATION.cff"
search = "version: {current_version}"
replace = "version: {new_version}"
