[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "remote-store"
version = "0.24.1"
description = "Write file storage code once. Run it against local files, S3, SFTP, or Azure."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
  { name = "Harald Alferi" },
]
keywords = [
  "file-storage",
  "object-storage",
  "filesystem",
  "storage-abstraction",
  "api",
  "streaming",
  "atomic-writes",
  "s3",
  "azure-blob-storage",
  "sftp",
  "fsspec",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries",
  "Topic :: System :: Filesystems",
  "Typing :: Typed",
  "Operating System :: OS Independent",
]

dependencies = []

[project.urls]
Homepage = "https://remotestore.dev"
Documentation = "https://docs.remotestore.dev/"
Repository = "https://github.com/haalfi/remote-store"
Changelog = "https://github.com/haalfi/remote-store/blob/master/CHANGELOG.md"
Issues = "https://github.com/haalfi/remote-store/issues"

[project.optional-dependencies]
# -- Backend extras (pip install remote-store[s3], etc.) --
s3 = ["s3fs>=2024.2.0"]
s3-pyarrow = ["s3fs>=2024.2.0", "pyarrow>=14.0.0"]
sftp = ["paramiko>=2.2", "tenacity>=4.0"]
azure = ["azure-storage-file-datalake>=12.16.0", "azure-identity>=1.0.0"]
sql = ["sqlalchemy>=2.0"]
sql-query = ["sqlalchemy>=2.0", "pyarrow>=12.0.0,<25"]
requests = ["requests>=2.25.0", "urllib3>=1.26.0"]
httpx = ["httpx>=0.24.0"]
# -- Extension extras --
arrow = ["pyarrow>=12.0.0,<25"]
otel = ["opentelemetry-api>=1.28.0"]
toml = ["tomli>=1.1.0; python_version < '3.11'"]
yaml = ["pyyaml>=5.1"]
pydantic = ["pydantic-settings>=2.0.0"]
dagster = ["dagster>=1.9"]

# -- Benchmark suite (all backends + charting) --
bench = [
  "remote-store[s3-pyarrow,sftp,azure]",
  "pytest-benchmark>=4.0",
  "boto3",
  "adlfs>=2024.2.0",
  "sshfs>=2023.1.0",
  "matplotlib>=3.8",
]

# -- Documentation build --
docs = [
  "mkdocs>=1.6,<2",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.27",
  "mkdocs-gen-files>=0.5",
  "mkdocs-literate-nav>=0.6",
  "mkdocs-section-index>=0.3",
  "mike>=2.0",
  "Pygments>=2.18",
  "ruff>=0.4",  # mkdocstrings signature formatting
]

# -- Development (all user-facing extras + test/build tooling) --
dev = [
  "remote-store[s3-pyarrow,sftp,azure,otel,toml,yaml,pydantic,dagster,sql,sql-query,requests,httpx]",
  # Testing
  "pytest",
  "pytest-cov",
  "pytest-httpserver>=1.0.0",
  "pytest-asyncio>=0.23",
  "hypothesis>=6.0",
  "moto[server,s3]>=5.2.0",
  # Type checking & linting
  "mypy",
  "ruff",
  "types-paramiko",
  "types-requests>=2.31",
  # Dev tools
  "jupyter",
  "pre-commit",
  "bump-my-version>=0.28",
  "twine",
  "python-dotenv",
  # Not in user-facing extras but needed for tests/examples
  "opentelemetry-sdk>=1.28.0",
  "ruamel.yaml>=0.15",
  "tomli>=1.1.0",  # toml extra is marker-gated to <3.11; tests need tomli on all versions
  "polars>=0.20",
  "duckdb>=0.9",
  "griffe>=1.0",  # required by scripts/gen_graph.py (tested in tests/scripts/test_gen_graph.py)
]

[tool.hatch.envs.default]
installer = "uv"
path = ".venv"
features = ["dev", "docs", "bench"]
dependencies = [
  # Not in any optional-dependencies extra:
  "pytest-gremlins>=1.5; python_version>='3.11'",
]

[tool.hatch.envs.default.scripts]
lint = ["ruff check src/ tests/ examples/", "python scripts/check_test_assertions.py tests", "python scripts/check_mock_spec.py tests", "python scripts/check_test_placement.py tests", "python scripts/check_tla_no_emdash.py", "python scripts/check_docs_framework.py", "python scripts/gen_backlogid.py --check"]
format = "ruff format src/ tests/ examples/"
format-check = "ruff format --check src/ tests/ examples/"
typecheck = "mypy src/"
test = "pytest"
test-cov = "pytest --cov=remote_store --cov-report=term-missing --cov-report=xml --cov-fail-under=95"
test-cov-branch = "pytest --cov=remote_store --cov-branch --cov-report=term-missing --cov-report=xml"
# Auto-discovers examples in getting_started/, configuration/, errors/,
# advanced/, extensions/, plus snippets.  Skips backends/ (needs credentials)
# and integrations/ (needs optional deps like PyArrow/Dagster).
examples = "python tests/scripts/run_examples.py"
notebooks = "python tests/scripts/run_notebooks.py"
# End-to-end tests against Docker backends (docker compose -f benchmarks/infra/docker-compose.yml up -d)
e2e = "pytest tests/e2e/ -v -o addopts="
bench = 'pytest benchmarks/ -v --benchmark-sort=mean -m "not standard and not full"'
bench-standard = 'pytest benchmarks/ -v --benchmark-sort=mean -m "not full"'
bench-full = "pytest benchmarks/ -v --benchmark-sort=mean"
bench-save = 'pytest benchmarks/ -v --benchmark-sort=mean --benchmark-autosave -m "not standard and not full"'
bench-save-standard = 'pytest benchmarks/ -v --benchmark-sort=mean --benchmark-autosave -m "not full"'
bench-save-full = "pytest benchmarks/ -v --benchmark-sort=mean --benchmark-autosave"
bench-compare = "pytest benchmarks/ -v --benchmark-sort=mean --benchmark-compare"
bench-cloud = 'pytest benchmarks/ -v --infra cloud --benchmark-sort=mean -m "not standard and not full"'
bench-cloud-standard = 'pytest benchmarks/ -v --infra cloud --benchmark-sort=mean -m "not full"'
bench-report = "python benchmarks/report.py"
bench-report-compare = "python benchmarks/report.py --compare"
bench-report-json = "python benchmarks/report.py --json"
bench-report-comparative = "python benchmarks/report.py --comparative"
bench-report-comparative-md = "python benchmarks/report.py --comparative --markdown --output benchmarks/results/comparative.md"
bench-report-user = "python benchmarks/report.py --user"
bench-latency-matrix = "python benchmarks/run_latency_matrix.py"
bench-charts = "python -m benchmarks.charts"
gen-graph = "python scripts/gen_graph.py"
gen-graph-check = "python scripts/gen_graph.py --check"
gen-features = "python scripts/gen_features.py"
gen-features-check = "python scripts/gen_features.py --check"
gen-graph-viz = "python scripts/gen_graph_viz.py"
gen-graph-viz-check = "python scripts/gen_graph_viz.py --check"
gen-backlogid = "python scripts/gen_backlogid.py"
gen-backlogid-check = "python scripts/gen_backlogid.py --check"
gen-api-check = "python scripts/check_api_docs.py"
check-test-placement = "python scripts/check_test_placement.py tests"
check-test-quality = ["python scripts/check_test_assertions.py tests", "python scripts/check_mock_spec.py tests", "python scripts/check_test_placement.py tests"]
# Mutation testing — scoped for Windows command-line length limits (~450 tests max).
# Each scope pairs source targets with the tests that exercise them.
# Run `hatch run mutate-<scope>` or append --gremlin-report=html for HTML output.
mutate-core-api = "pytest --gremlins --gremlin-targets=src/remote_store/_store.py,src/remote_store/_proxy.py,src/remote_store/_stream.py,src/remote_store/_glob.py,src/remote_store/_backend.py,src/remote_store/_types.py tests/test_store.py tests/test_store_child.py tests/test_proxy.py tests/test_depth_listing.py tests/test_folder_info_depth.py tests/test_open_atomic.py tests/test_ping.py tests/test_stream.py tests/test_glob.py"
mutate-core-infra = "pytest --gremlins --gremlin-targets=src/remote_store/_capabilities.py,src/remote_store/_errors.py,src/remote_store/_config.py,src/remote_store/_models.py,src/remote_store/_path.py,src/remote_store/_resolution.py,src/remote_store/_registry.py,src/remote_store/backends/_memory.py,src/remote_store/backends/_fileinfo.py tests/test_capabilities.py tests/test_errors.py tests/test_config.py tests/test_models.py tests/test_path.py tests/test_resolution.py tests/test_registry.py tests/test_memory_coverage.py"
mutate-ext-proxy = "pytest --gremlins --gremlin-targets=src/remote_store/ext/arrow.py,src/remote_store/ext/batch.py,src/remote_store/ext/cache.py,src/remote_store/ext/glob.py,src/remote_store/ext/integrity.py,src/remote_store/ext/observe.py,src/remote_store/ext/otel.py,src/remote_store/ext/partition.py,src/remote_store/ext/streams.py,src/remote_store/ext/transfer.py tests/test_arrow.py tests/test_batch.py tests/test_cache.py tests/test_observe.py tests/test_otel.py tests/test_partition.py tests/test_integrity.py tests/test_transfer.py tests/test_streams.py tests/test_glob.py"
mutate-ext-format = "pytest --gremlins --gremlin-targets=src/remote_store/ext/parquet.py,src/remote_store/ext/yaml.py,src/remote_store/ext/pydantic.py,src/remote_store/ext/dagster.py tests/test_ext_parquet.py tests/test_ext_yaml.py tests/test_ext_pydantic.py tests/test_dagster.py"
mutate-backends-local = "pytest --gremlins --gremlin-targets=src/remote_store/backends/_local.py,src/remote_store/backends/_http.py,src/remote_store/backends/_http_httpx.py,src/remote_store/backends/_http_requests.py,src/remote_store/backends/_sqlalchemy.py tests/backends/local/ tests/backends/http/ tests/backends/sqlblob/ tests/backends/sqlquery/"
mutate-backends-cloud = "pytest --gremlins --gremlin-targets=src/remote_store/backends/_s3.py,src/remote_store/backends/_s3_base.py,src/remote_store/backends/_s3_pyarrow.py,src/remote_store/backends/_sftp.py,src/remote_store/backends/_azure.py tests/backends/test_s3.py tests/backends/test_s3_pyarrow.py tests/backends/test_s3_shared.py tests/backends/test_sftp.py tests/backends/test_azure.py"
check-links = "python scripts/docs/check_links.py --root ."
docs-check = "python scripts/check_docs_framework.py"
docs = "mkdocs serve"
docs-build = "mkdocs build --strict"
pre-commit-install = "pre-commit install"
# Requires Docker Desktop; not included in 'all' (CI uses setup-dafny-action natively)
verify-formal = "bash scripts/dafny_verify.sh"
all = ["lint", "format-check", "typecheck", "test-cov", "examples", "notebooks", "check-links", "docs-check", "docs-build"]

[tool.hatch.build.targets.wheel]
packages = ["src/remote_store"]

[tool.mypy]
strict = true
namespace_packages = true
plugins = ["sqlalchemy.ext.mypy.plugin"]

# tomllib is stdlib from 3.11+; on 3.10 it doesn't exist and tomli is used instead.
[[tool.mypy.overrides]]
module = "tomllib"
ignore_missing_imports = true

# _config.py uses `import tomli as tomllib  # type: ignore[no-redef]` in a try/except
# fallback — the ignore is valid only on 3.11+ where tomllib exists. Suppress the
# "unused ignore" warning so both 3.10 and 3.11+ pass.
[[tool.mypy.overrides]]
module = "remote_store._config"
warn_unused_ignores = false

# ext/yaml.py imports pyyaml with `# type: ignore[import-untyped]` — pyyaml has no
# py.typed marker and no stubs. The ignore is needed but flagged as unused when
# pyyaml isn't installed and ruamel.yaml is used instead.
[[tool.mypy.overrides]]
module = "remote_store.ext.yaml"
warn_unused_ignores = false

# Dagster does not ship py.typed and has no third-party stubs on PyPI.
[[tool.mypy.overrides]]
module = "dagster.*"
ignore_missing_imports = true

# ext/dagster.py uses `# type: ignore[import-untyped]` on dagster imports.
[[tool.mypy.overrides]]
module = "remote_store.ext.dagster"
warn_unused_ignores = false

# pyarrow 24.x ships partial type stubs that are still incomplete (re-evaluated
# under BK-168: 33 attr-defined / name-defined errors when stubs are honoured).
# Skip pyarrow stubs entirely; this restores the pre-24 behaviour where pa.* is
# Any. Re-evaluate when pyarrow ships complete stubs.
[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
follow_imports = "skip"

# The four modules below each carry `# type: ignore[import-untyped]` on their
# pyarrow import lines.  pyarrow ≤23 has no stubs (the ignore is active);
# pyarrow ≥24 ships stubs (the ignore becomes unused).  mypy's per-module
# override is the finest scope available — there is no line-level knob.
# Accepted tech debt: any *new* unused ignore in these modules would also be
# silenced.  Mitigated by the small surface area of ext.arrow/parquet and
# _s3_pyarrow, and by code-review discipline for _sqlalchemy.
[[tool.mypy.overrides]]
module = ["remote_store.ext.arrow", "remote_store.ext.parquet", "remote_store.backends._s3_pyarrow"]
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = "remote_store.backends._sqlalchemy"
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Exclude e2e by default — they need Docker services running.
# Run them explicitly with: hatch run e2e
# Exclude `live` tests by default — they need a real cloud account.
# Run them explicitly with: hatch run pytest -m live (env vars must be set;
# see e.g. docs-src/guides/backends/azure-hns-setup.md).
addopts = "--ignore=tests/e2e -m 'not live'"
filterwarnings = [
  "error",
  # SQLAlchemy's connection pool on SQLite may leave DBAPI connections for GC to
  # finalize, triggering ResourceWarning on Python 3.13+. Upstream pool behaviour.
  "ignore:unclosed database:ResourceWarning:sqlalchemy",
  "ignore:unclosed database:ResourceWarning:weakref",
]
asyncio_mode = "auto"
markers = [
  "spec(id): links test to a spec section ID",
  "integration: requires external services",
  "requires_docker: test needs Docker services (e.g. Azurite)",
  "standard: medium-tier benchmark (10MB payload, deep hierarchy, ~5 min/backend)",
  "full: heavy-tier benchmark (100MB payload, 10k listing, ~20-30 min/backend)",
  "os_sensitive: exercises OS-specific behaviour (paths, atomic writes, local filesystem); run on macOS and Windows CI",
  "pbt: property-based test using Hypothesis",
  "extended_conformance: extended conformance suite derived from Dafny postconditions",
  "live: requires a real cloud account; opt-in via gating env vars (excluded by default addopts)",
]

[tool.pytest-gremlins]
cache = true
exclude = ["**/__init__.py", "**/__pycache__/*"]

[tool.ruff]
line-length = 120
# Defense-in-depth for ad-hoc `ruff check .` / IDE integrations that scan the
# whole tree: excludes Dafny-generated Python output (oracle + runtime); see
# sdd/formal/README.md.  The canonical `hatch run lint` script targets only
# `src/ tests/ examples/`, so this exclude has no effect on CI lint.
extend-exclude = ["sdd/formal/*-py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "BLE", "SIM", "TCH", "PT"]
ignore = ["UP045"]

[tool.ruff.lint.flake8-pytest-style]
# Note: ruff PT011 only resolves builtin/stdlib names; custom exception names
# below are documentation of intent, not enforced. See BK-126.
raises-require-match-for = [
    "ValueError", "TypeError", "KeyError", "RuntimeError",
    "NotFound", "AlreadyExists", "CapabilityNotSupported",
    "BackendUnavailable", "PermissionDenied",
]

[tool.ruff.lint.isort]
known-first-party = ["remote_store"]

# --- Version management ---
# Run: bump-my-version bump patch|minor|major
# Bumps version in all three locations atomically.

[tool.bumpversion]
current_version = "0.24.1"
commit = false
tag = false
tag_name = "v{new_version}"
message = "Bump version: {current_version} → {new_version}"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "src/remote_store/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'

[[tool.bumpversion.files]]
filename = "CITATION.cff"
search = "version: {current_version}"
replace = "version: {new_version}"

[[tool.bumpversion.files]]
filename = "FEATURES.md"
search = "remote-store v{current_version}"
replace = "remote-store v{new_version}"
