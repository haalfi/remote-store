[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "remote-store"
version = "0.30.0"
description = "Write file storage code once. Run it against local files, S3, SFTP, Azure, or OneDrive."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
  { name = "Harald Alferi" },
]
keywords = [
  "file-storage",
  "object-storage",
  "filesystem",
  "storage-abstraction",
  "api",
  "streaming",
  "atomic-writes",
  "s3",
  "azure-blob-storage",
  "sftp",
  "fsspec",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries",
  "Topic :: System :: Filesystems",
  "Typing :: Typed",
  "Operating System :: OS Independent",
]

dependencies = []

[project.urls]
Homepage = "https://remotestore.dev"
Documentation = "https://docs.remotestore.dev/"
Repository = "https://github.com/haalfi/remote-store"
Changelog = "https://github.com/haalfi/remote-store/blob/master/CHANGELOG.md"
Issues = "https://github.com/haalfi/remote-store/issues"

[project.optional-dependencies]
# Each extra below declares a floor; a ceiling is the exception. Among the
# runtime extras the drift guard covers, the only ceiling is `graph` / `httpx`
# pinning `httpx<1.0` (BUG-225 / ID-229) — see the per-extra comment for the
# rationale; the pyarrow extras carry none, since BUG-232 verified the shared
# arrow/parquet/S3-PyArrow surface against pyarrow 25 and lifted the earlier
# `<25` cap. The developer/build aggregates the guard excludes (`dev`, `docs`,
# `bench`, `toml`, `mutate`) sit outside this convention and may pin build
# tooling directly — e.g. `docs` caps `mkdocs<2`. A scheduled drift guard
# (`.github/workflows/drift-guard.yml`, ID-182) re-resolves each extra
# weekly against the latest available transitive versions and diffs the
# result against `infra/drift-locks/<extra>.txt`. Refresh a baseline after
# a deliberate floor bump with `hatch run drift-check refresh-baseline <extra>`.
# -- Backend extras (pip install remote-store[s3], etc.) --
s3 = ["s3fs>=2024.2.0"]
s3-pyarrow = ["s3fs>=2024.2.0", "pyarrow>=14.0.0"]
# paramiko: floor at >=3.0 (BUG-204: channel_timeout API surface).
# Deliberately NO upper bound. paramiko 5 dropped ssh-rsa from defaults;
# we address that via SFTPUtils.enable_ssh_rsa_compat() and the diagnostic
# scan_host_algorithms() rather than capping the library for every consumer.
# Full rationale: sdd/research/research-bk-198-paramiko-ssh-rsa-empirical.md § 5.
sftp = ["paramiko>=3.0", "tenacity>=4.0"]
azure = ["azure-storage-file-datalake>=12.16.0", "azure-identity>=1.0.0"]
# graph (ID-127, ADR-0021): direct REST over httpx + msal for token
# acquisition; platformdirs resolves the MSAL token-cache path (loaded lazily
# by GraphAuth only). msal-extensions (BK-291) makes the token-cache write
# atomic and multi-process-safe via PersistedTokenCache + a cross-platform
# file lock; >=1.3 keeps portalocker an optional extra, not a hard dependency.
# httpx <1.0 (BUG-225): the experimental httpx 1.0.dev* line is a wholesale
# client-API rewrite (drops AsyncClient / TransportError / DecodingError — the
# surface this backend is built on), so an unbounded `>=` breaks the graph
# import at load. The PEP 440 exclusive bound excludes 1.0.dev*/rc*/GA while
# keeping all 0.2x; lifting it to a real 1.0 port is ID-229.
graph = ["httpx>=0.24.0,<1.0", "msal>=1.20.0", "msal-extensions>=1.3", "platformdirs>=3.0.0"]
sql = ["sqlalchemy>=2.0"]
sql-query = ["sqlalchemy>=2.0", "pyarrow>=12.0.0"]
requests = ["requests>=2.25.0", "urllib3>=1.26.0"]
# httpx <1.0 (BUG-225): same cap as the graph extra — the [httpx] HTTP adapter
# uses httpx.AsyncClient, which the 1.0.dev* rewrite removes. Lift via ID-229.
httpx = ["httpx>=0.24.0,<1.0"]
# -- Extension extras --
arrow = ["pyarrow>=12.0.0"]
otel = ["opentelemetry-api>=1.28.0"]
toml = ["tomli>=1.1.0; python_version < '3.11'"]
yaml = ["pyyaml>=5.1"]
pydantic = ["pydantic-settings>=2.0.0"]
dagster = ["dagster>=1.9"]

# -- Mutation testing (dev/CI tooling, not a user-facing feature) --
# Single source of truth for the pytest-gremlins pin: the hatch default env
# (via `features` below) and both .github/workflows/{mutation,ci}.yml install
# `.[mutate]` rather than re-pinning. Marker-gated because pytest-gremlins
# requires py>=3.11; an install on an older interpreter resolves to nothing.
# Excluded from the user-facing install-extras list (gen_features.py) and from
# the transitive-drift guard (drift_check.py), like the other dev/build extras.
mutate = ["pytest-gremlins>=1.5; python_version>='3.11'"]

# -- Benchmark suite (all backends + charting) --
bench = [
  "remote-store[s3-pyarrow,sftp,azure]",
  "pytest-benchmark>=4.0",
  "boto3",
  "adlfs>=2024.2.0",
  "sshfs>=2023.1.0",
  "matplotlib>=3.8",
]

# -- Documentation build --
docs = [
  "mkdocs>=1.6,<2",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.27",
  "mkdocs-gen-files>=0.5",
  "mkdocs-literate-nav>=0.6",
  "mkdocs-section-index>=0.3",
  "mkdocs-llmstxt>=0.5,<0.6",  # ID-220: llms.txt + Markdown twins; pinned, upstream maintenance-mode (ID-225)
  "mike>=2.0",
  "Pygments>=2.18",
  "ruff>=0.4",  # mkdocstrings signature formatting
]

# -- Development (all user-facing extras + test/build tooling) --
dev = [
  "remote-store[s3-pyarrow,sftp,azure,otel,toml,yaml,pydantic,dagster,sql,sql-query,requests,httpx,graph]",
  # Testing
  "pytest",
  "pytest-cov",
  "pytest-httpserver>=1.0.0",
  "pytest-asyncio>=0.23",
  "pytest-recording>=0.13",
  "respx>=0.20",  # ID-127: stub httpx.AsyncClient for Graph backend unit tests
  "pytest-xdist>=3.5",
  "pytest-split>=0.9",  # BK-319: CI shard balancing (`--splits/--group`) + `scripts/gen_split_durations.py`
  "pytest-randomly>=3.15",  # BK-277: randomised test order in the `test-isolation` proof lane
  "hypothesis>=6.0",
  "moto[server,s3]>=5.2.0",
  # vcrpy (pulled by pytest-recording) 8.1.1 references
  # `aiohttp.streams.AsyncStreamReaderMixin`, which exists only in aiohttp 3.13.x
  # (added in 3.13, removed in 3.14). aiobotocore allows aiohttp>=3.12,<4, so
  # without this cap a fresh resolve pulled aiohttp 3.14.0 and every test crashed
  # at collection on the vcr aiohttp-stub import (test-only; the published package
  # has no aiohttp constraint). Lift once vcrpy supports aiohttp 3.14.
  "aiohttp>=3.13,<3.14",
  # Type checking & linting
  "mypy",
  "ruff",
  "types-paramiko",
  "types-requests>=2.31",
  # Dev tools
  "jupyter",
  "pre-commit",
  "bump-my-version>=0.28",
  "twine",
  "python-dotenv",
  # Not in user-facing extras but needed for tests/examples
  "opentelemetry-sdk>=1.28.0",
  "ruamel.yaml>=0.15",
  "tomli>=1.1.0",  # toml extra is marker-gated to <3.11; tests need tomli on all versions
  "polars>=0.20",
  "duckdb>=0.9",
  "griffe>=1.0",  # required by scripts/gen_graph.py (tested in tests/scripts/test_gen_graph.py)
  "jsonschema>=4.18",  # required by scripts/check_traces.py (referencing-based $ref resolution landed in 4.18)
]

[tool.hatch.envs.default]
installer = "uv"
path = ".venv"
# `mutate` carries the pytest-gremlins pin (single source of truth); it is a
# real optional-dependencies extra rather than an env-only `dependencies` entry
# so the two mutation workflows can install the same pin via `.[mutate]`.
features = ["dev", "docs", "bench", "mutate"]

[tool.hatch.envs.default.overrides]
# BK-269: force the pip installer in CI. With `installer = "uv"` above, hatch's
# dependency sync silently drops the env `features` (the dev/docs/bench extras)
# on GitHub runners — the `lint` job came up without `griffe` (the same hatch +
# uv installer bug recorded in .github/workflows/mutation.yml). Local dev keeps
# uv (fast); GITHUB_ACTIONS is always "true" on runners, so this only flips the
# installer in CI.
env.GITHUB_ACTIONS.installer = { value = "pip", if = ["true"] }

[tool.hatch.envs.default.scripts]
# Fast artifact-drift checks (gen_graph, check_api_docs, gen_features,
# gen_graph_viz, gen_adr_digest, drift_check render-docs). Surfacing them ahead
# of `lint` in `hatch run all` catches drift in seconds rather than after the
# full lint/typecheck/test gauntlet. CI runs this same target via `uvx hatch run
# preflight` in the `lint` job (BK-269), so the script list is the single source.
preflight = ["python scripts/gen_graph.py --check", "python scripts/check_api_docs.py", "python scripts/check_docstring_parity.py", "python scripts/gen_features.py --check", "python scripts/gen_graph_viz.py --check", "python scripts/gen_adr_digest.py --check", "python scripts/drift_check.py render-docs --check"]
lint = ["ruff check src/ tests/ examples/ scripts/", "python scripts/check_test_assertions.py tests", "python scripts/check_mock_spec.py tests", "python scripts/check_test_placement.py tests", "python scripts/check_tla_no_emdash.py", "python scripts/check_formal_trace.py", "python scripts/check_capability_parity.py", "python scripts/check_spec_marks.py", "python scripts/check_docs_framework.py", "python scripts/gen_backlogid.py --check", "python scripts/check_rst_roles.py", "python scripts/check_infra_settings.py", "python scripts/check_no_tracker_refs.py", "python scripts/check_ci_inventory.py", "python scripts/check_traces.py", "python scripts/check_readthedocs_python.py", "python scripts/check_backend_order.py", "python scripts/check_ripple_parity.py", "python scripts/check_ci_full_matrix.py"]
format = "ruff format src/ tests/ examples/ scripts/"
format-check = "ruff format --check src/ tests/ examples/ scripts/"
typecheck = "mypy src/ examples/"
# Local test runs are resource-bounded, not `-n auto` (BK-277):
# `scripts/run_tests.py` caps xdist workers to leave the machine usable when
# several suites run at once (see its docstring; `RS_TEST_WORKERS=auto`
# restores per-CPU behaviour, `RS_TEST_WORKERS=<n>` forces a count). CI keeps
# `-n auto` — its workflows call pytest inline, not these `hatch` scripts, so
# this change is local-only. Two passes:
#   Pass 1: bounded-parallel for every backend EXCEPT sftp_docker. The
#           sftp_docker fixture is filtered out by registry.fixture_params
#           when PYTEST_XDIST_WORKER is set (atmoz/sftp's OpenSSH daemon
#           is unreliable under concurrent xdist worker connections).
#   Pass 2: serial single-process for sftp_docker conformance variants only.
# `-p no:benchmark` suppresses PytestBenchmarkWarning under xdist
# (filterwarnings=error would otherwise turn it into INTERNALERROR);
# bench-* scripts load the plugin explicitly. Order determinism is handled
# globally by `-p no:randomly` in [tool.pytest.ini_options] addopts (so CI's
# inline pytest is deterministic too); the `test-isolation` lane re-enables
# randomisation with `-p randomly`.
test = [
  "python scripts/run_tests.py -p no:benchmark",
  "pytest -p no:benchmark -k sftp_docker tests/backends/conformance/",
]
# Coverage variants. `test-cov` reports coverage with no floor — everyday
# local feedback. `test-cov-s1` is Stage-1 only (no Docker probe), no floor;
# wired into `hatch run all` so the pre-commit gate never requires Docker.
# `test-cov-strict` adds `--cov-fail-under=95` and lives in CI / the publish
# workflow; needs Azurite running locally (Stage-2 Azure-backend fixtures
# contribute the coverage that makes the 95% floor reachable).
test-cov = [
  "python scripts/run_tests.py -p no:benchmark --cov=remote_store --cov-report=",
  "pytest -p no:benchmark --cov=remote_store --cov-append --cov-report=term-missing --cov-report=xml -k sftp_docker tests/backends/conformance/",
]
test-cov-s1 = "python scripts/run_tests.py -p no:benchmark --stage=1 --cov=remote_store --cov-report=term-missing --cov-report=xml"
test-cov-strict = [
  "python scripts/run_tests.py -p no:benchmark --cov=remote_store --cov-report=",
  "pytest -p no:benchmark --cov=remote_store --cov-append --cov-report=term-missing --cov-report=xml --cov-fail-under=95 -k sftp_docker tests/backends/conformance/",
]
test-cov-branch = [
  "python scripts/run_tests.py -p no:benchmark --cov=remote_store --cov-branch --cov-report=",
  "pytest -p no:benchmark --cov=remote_store --cov-append --cov-branch --cov-report=term-missing --cov-report=xml -k sftp_docker tests/backends/conformance/",
]
# Isolation proof lane (BK-277): bounded-parallel + randomised order to flush
# hidden cross-test state — the explicit "prove no hidden state" run. `-p
# randomly` re-enables pytest-randomly (the global addopts `-p no:randomly` keeps
# every other run deterministic); the CLI flag wins because it is processed
# after addopts. Stage-1 so it needs no Docker; run it a few times. Each run
# prints its seed; reproduce a surfaced failure with `--randomly-seed=<n>`.
test-isolation = "python scripts/run_tests.py -p no:benchmark -p randomly --stage=1"
# Records HTTP cassettes from a live service; requires backend credentials.
record-azure = "python scripts/record_cassettes.py --backend azure"
# Records Graph cassettes from a live consumer drive; device-code sign-in on
# first run (the MSAL token cache makes later runs non-interactive).
record-graph = "python scripts/record_cassettes.py --backend graph"
# Auto-discovers examples in getting_started/, configuration/, errors/,
# advanced/, extensions/, plus snippets.  Skips backends/ (needs credentials)
# and integrations/ (needs optional deps like PyArrow/Dagster).
examples = "python tests/scripts/run_examples.py"
notebooks = "python tests/scripts/run_notebooks.py"
# End-to-end tests against Docker backends (docker compose -f infra/docker-compose.yml up -d)
e2e = "pytest tests/e2e/ -v -o addopts= -p no:randomly"
bench = 'pytest benchmarks/ -v --benchmark-sort=mean -m "not standard and not full"'
bench-standard = 'pytest benchmarks/ -v --benchmark-sort=mean -m "not full"'
bench-full = "pytest benchmarks/ -v --benchmark-sort=mean"
bench-save = 'pytest benchmarks/ -v --benchmark-sort=mean --benchmark-autosave -m "not standard and not full"'
bench-save-standard = 'pytest benchmarks/ -v --benchmark-sort=mean --benchmark-autosave -m "not full"'
bench-save-full = "pytest benchmarks/ -v --benchmark-sort=mean --benchmark-autosave"
bench-compare = "pytest benchmarks/ -v --benchmark-sort=mean --benchmark-compare"
bench-cloud = 'pytest benchmarks/ -v --infra cloud --benchmark-sort=mean -m "not standard and not full"'
bench-cloud-standard = 'pytest benchmarks/ -v --infra cloud --benchmark-sort=mean -m "not full"'
# In-process moto (S3 family only; measures client-library overhead, not real throughput)
bench-moto = 'pytest benchmarks/ -v --infra moto --benchmark-sort=mean -m "not standard and not full"'
bench-moto-standard = 'pytest benchmarks/ -v --infra moto --benchmark-sort=mean -m "not full"'
bench-report = "python benchmarks/report.py"
bench-report-compare = "python benchmarks/report.py --compare"
bench-report-json = "python benchmarks/report.py --json"
bench-report-comparative = "python benchmarks/report.py --comparative"
bench-report-comparative-md = "python benchmarks/report.py --comparative --markdown --output benchmarks/results/comparative.md"
bench-report-user = "python benchmarks/report.py --user"
# BK-309: gate a fresh run against the committed CI baseline. --min-abs floors
# out sub-500us ops (machine-noise dominated); --threshold flags a >2x blow-up.
bench-regression = "python benchmarks/report.py --regression --baseline benchmarks/baseline/local-baseline.json --threshold 2.0 --min-abs 0.0005 {args}"
bench-latency-matrix = "python benchmarks/run_latency_matrix.py"
bench-charts = "python -m benchmarks.charts"
bench-run-of-record = "python -m benchmarks.slim_run_of_record {args}"
gen-graph = "python scripts/gen_graph.py {args}"
gen-graph-check = "python scripts/gen_graph.py --check"
gen-features = "python scripts/gen_features.py {args}"
gen-features-check = "python scripts/gen_features.py --check"
gen-graph-viz = "python scripts/gen_graph_viz.py {args}"
gen-graph-viz-check = "python scripts/gen_graph_viz.py --check"
gen-backlogid = "python scripts/gen_backlogid.py {args}"
gen-backlogid-check = "python scripts/gen_backlogid.py --check"
gen-adr-digest = "python scripts/gen_adr_digest.py {args}"
gen-adr-digest-check = "python scripts/gen_adr_digest.py --check"
gen-api-check = "python scripts/check_api_docs.py"
check-docstring-parity = "python scripts/check_docstring_parity.py {args}"
# ID-182 drift-guard helpers. `drift-check extras|resolve|diff|refresh-baseline|render-docs`
# — see scripts/drift_check.py docstring. The scheduled workflow uses the same script.
drift-check = "python scripts/drift_check.py {args}"
drift-docs-check = "python scripts/drift_check.py render-docs --check"
check-test-placement = "python scripts/check_test_placement.py tests"
check-test-quality = ["python scripts/check_test_assertions.py tests", "python scripts/check_mock_spec.py tests", "python scripts/check_test_placement.py tests"]
# Mutation testing. Single shim that delegates to the manifest in
# `scripts/mutate_scopes.py`; the same manifest feeds the CI workflow.
# Usage: `hatch run mutate <scope>` (e.g. `hatch run mutate core-api`).
# `hatch run mutate --list-scopes` prints all scope names.
mutate = "python scripts/run_mutate.py {args}"
# Standalone entry point for the guide-prose tracker-ref gate, so the docs gate
# can invoke it on its own; the same check also runs inside the `lint` bundle.
check-no-tracker-refs = "python scripts/check_no_tracker_refs.py"
# Standalone entry point for the backend-enumeration order gate, for the same
# reason: a wrong-order backend list is a docs defect, so the docs gate invokes
# it directly rather than depending on the whole `lint` bundle having run.
check-backend-order = "python scripts/check_backend_order.py"
# Standalone entry point for the ripple-check parity gate, same reason as the two
# above: `sdd/CLAUDE-REFERENCE.md`-only edits skip the `lint` job (CODE_PAT), so
# the docs gate invokes it directly rather than depending on the whole `lint`
# bundle having run.
check-ripple-parity = "python scripts/check_ripple_parity.py"
check-links = "python scripts/docs/check_links.py --root ."
docs-check = "python scripts/check_docs_framework.py"
docs = "mkdocs serve"
docs-build = "mkdocs build --strict"
# The full set of checks that validate a docs/spec change, as one entry point CI
# invokes once. Composed by reference so each sub-target stays the single source.
docs-gate = ["docs-check", "check-no-tracker-refs", "check-backend-order", "check-ripple-parity", "check-links", "drift-docs-check", "docs-build"]
pre-commit-install = "pre-commit install"
# Requires Docker Desktop; not included in 'all' (CI uses setup-dafny-action natively)
verify-formal = "bash scripts/dafny_verify.sh"
all = ["preflight", "lint", "format-check", "typecheck", "test-cov-s1", "examples", "notebooks", "check-links", "docs-check", "docs-build"]

[tool.hatch.build.targets.wheel]
packages = ["src/remote_store"]
# Parked ID-202 PoC: keep it out of the wheel so it is never importable from an
# installed package (editable-src tests/benchmarks still see it).
exclude = ["src/remote_store/backends/_s3_boto3.py"]

[tool.mypy]
strict = true
namespace_packages = true
plugins = ["sqlalchemy.ext.mypy.plugin"]
# medallion_dagster/ is a self-contained dagster project — its modules use
# sibling-relative imports (`from assets.bronze import ...`, `from stores import ...`)
# that only resolve when dagster's launcher puts the directory on sys.path.
# mypy doesn't have that context, so skip the subtree.
exclude = ["^examples/medallion_dagster/"]

# tomllib is stdlib from 3.11+; on 3.10 it doesn't exist and tomli is used instead.
[[tool.mypy.overrides]]
module = "tomllib"
ignore_missing_imports = true

# _config.py uses `import tomli as tomllib  # type: ignore[no-redef]` in a try/except
# fallback — the ignore is valid only on 3.11+ where tomllib exists. Suppress the
# "unused ignore" warning so both 3.10 and 3.11+ pass.
[[tool.mypy.overrides]]
module = "remote_store._config"
warn_unused_ignores = false

# ext/yaml.py imports pyyaml with `# type: ignore[import-untyped]` — pyyaml has no
# py.typed marker and no stubs. The ignore is needed but flagged as unused when
# pyyaml isn't installed and ruamel.yaml is used instead.
[[tool.mypy.overrides]]
module = "remote_store.ext.yaml"
warn_unused_ignores = false

# Dagster does not ship py.typed and has no third-party stubs on PyPI.
[[tool.mypy.overrides]]
module = "dagster.*"
ignore_missing_imports = true

# msal (ID-127 Graph auth) does not ship py.typed and has no third-party stubs.
[[tool.mypy.overrides]]
module = "msal.*"
ignore_missing_imports = true

# msal-extensions (BK-291 token-cache persistence) likewise ships no py.typed.
[[tool.mypy.overrides]]
module = "msal_extensions.*"
ignore_missing_imports = true

# ext/dagster.py uses `# type: ignore[import-untyped]` on dagster imports.
# disallow_untyped_calls is relaxed because the compute-log-manager integration
# calls into dagster's partially-untyped internal classes (subscription manager,
# config primitives, the cloud-storage base ctor).
[[tool.mypy.overrides]]
module = "remote_store.ext.dagster"
warn_unused_ignores = false
disallow_untyped_calls = false

# pyarrow's typing posture drifts by major: 24.x shipped partial, still-incomplete
# stubs (re-evaluated under BK-168: 33 attr-defined / name-defined errors when
# honoured); 25.x dropped the `py.typed` marker and stubs again (BUG-232). We treat
# pa.* as Any across all of them: `follow_imports = "skip"` skips any partial stubs a
# future major re-adds, and `ignore_missing_imports = true` suppresses `import-untyped`
# at every pyarrow import site when the marker is absent (as in 25.x) — including the
# unguarded example scripts, which is why this is set on the module, not per import line.
# Caveat: `ignore_missing_imports` also masks `import-not-found` across the `pyarrow.*`
# namespace, so a mistyped submodule (e.g. `import pyarrow.parqet`) resolves to Any
# instead of erroring. Low risk — we import only the stable `pyarrow` / `pyarrow.parquet`
# / `pyarrow.fs` paths, and this override is scoped to pyarrow alone.
[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
follow_imports = "skip"
ignore_missing_imports = true

# The four modules below each carry `# type: ignore[import-untyped]` on their
# pyarrow import lines.  With `ignore_missing_imports` now set on the pyarrow
# override above, that error is suppressed centrally, so these per-line ignores
# are redundant on every pyarrow major — `warn_unused_ignores = false` keeps the
# now-unused ignores from erroring.  (Historically the ignore was active on
# pyarrow ≤23 / 25.x and unused on 24.x; the central suppression makes that moot.)
# mypy's per-module override is the finest scope available — there is no
# line-level knob.  Accepted tech debt: any *new* unused ignore in these modules
# would also be silenced.  Mitigated by the small surface area of
# ext.arrow/parquet and _s3_pyarrow, and by code-review discipline for _sqlalchemy.
[[tool.mypy.overrides]]
module = ["remote_store.ext.arrow", "remote_store.ext.parquet", "remote_store.backends._s3_pyarrow"]
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = "remote_store.backends._sqlalchemy"
warn_unused_ignores = false

# ID-202 PoC: `_s3_boto3` carries `# type: ignore[import-untyped]` on its
# boto3 / botocore import lines. Stub presence drifts by version — botocore
# ships `py.typed` (the ignore becomes unused) while `boto3` / `boto3.s3.transfer`
# remain untyped (the ignore is active). Same version-drift shape as the
# pyarrow block above; the per-module override is the finest scope available.
[[tool.mypy.overrides]]
module = "remote_store.backends._s3_boto3"
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Exclude e2e by default — they need Docker services running.
# Run them explicitly with: hatch run e2e
# Exclude `live` tests by default — they need a real cloud account.
# Run them explicitly with: hatch run pytest -m live (env vars must be set;
# see e.g. docs-src/guides/backends/azure-hns-setup.md).
# `-p no:randomly` keeps order deterministic for EVERY pytest invocation —
# including CI's inline `pytest` (which does not go through the hatch `test*`
# scripts), reproducible local runs, and ad-hoc runs (BK-277). The
# `test-isolation` lane re-enables randomisation with `-p randomly`, which
# overrides this opt-out because command-line `-p` args are processed after
# addopts. Without this global default, installing pytest-randomly would shuffle
# every run by default and surface order-dependence as CI flake.
addopts = "--ignore=tests/e2e -m 'not live' -p no:randomly"
filterwarnings = [
  "error",
  # SQLAlchemy's connection pool on SQLite may leave DBAPI connections for GC to
  # finalize, triggering ResourceWarning on Python 3.13+. Upstream pool behaviour.
  "ignore:unclosed database:ResourceWarning:sqlalchemy",
  "ignore:unclosed database:ResourceWarning:weakref",
  # OpenTelemetry's _importlib_metadata helper iterates entry_points via the
  # deprecated SelectableGroups.values() interface, raising a DeprecationWarning
  # at OTel context load time. Under pytest-xdist this is a Heisenbug: whether
  # the first OTel import on a worker happens before or after pytest installs
  # filterwarnings = error depends on test distribution. Surfaces in
  # tests/ext/test_otel.py, tests/ext/test_contract.py::TestExtensionContract,
  # and tests/test_examples.py::TestOtelTracing on Python 3.10 / 3.11.
  # Upstream issue: OTel uses the deprecated dict-iteration path; will resolve
  # when OTel updates _importlib_metadata to use .select().
  "ignore:SelectableGroups dict interface is deprecated:DeprecationWarning",
  # `_wait_for_close` is aiohttp's connector-close coroutine
  # (`aiohttp/connector.py`), reached via aiobotocore's `ClientSession`: the sync
  # S3 backend releases that session through s3fs's `weakref.finalize` at GC
  # (BK-306's by-design close — an explicit close was removed there because it
  # double-closed against the finalizer, the BK-304 unraisable class). So the
  # session *is* closed; the coroutine just runs at a GC point. Python 3.14's
  # stricter coroutine-finalization reporting routes that GC-time close through
  # pytest's unraisableexception plugin as a PytestUnraisableExceptionWarning,
  # which `filterwarnings = error` turns into a hard failure; 3.10-3.13 emit it
  # as a benign GC-time warning. Under `pytest -n auto` the attribution is
  # non-deterministic (it fails whichever async test GC runs in), so it flakes
  # the `test (3.14)` matrix entry only. The regex anchors on the stable
  # `<coroutine object _wait_for_close` repr with a `.*` lead-in, so it matches
  # regardless of the unraisable lead-in wording (`Exception ignored in:` vs
  # `Exception ignored while finalizing coroutine`) — robust to CPython/pytest
  # message drift, not a fragile exact-prefix transcription. Still scoped to the
  # `_wait_for_close` qualname, so genuine unclosed-resource leaks (any other
  # coroutine, every version) still fail; the match + the scoping are pinned by
  # tests/test_py314_unraisable_filter.py. BUG-224.
  "ignore:.*<coroutine object _wait_for_close:pytest.PytestUnraisableExceptionWarning",
  # sshfs (the fsspec SFTP filesystem) decodes stat mtimes with the
  # datetime.utcfromtimestamp() the stdlib deprecated in Python 3.12+. It surfaces
  # only through the benchmark suite's `sshfs` comparative target (test_delete /
  # test_list_files / test_exists_hit) under `filterwarnings = error` on the 3.13
  # runner. No remote_store code uses utcfromtimestamp, so this masks a
  # third-party deprecation, not a first-party one; message-scoped because the
  # raising module varies by the sshfs version pip resolves. BUG-230.
  "ignore:datetime.datetime.utcfromtimestamp:DeprecationWarning",
]
asyncio_mode = "auto"
markers = [
  "spec(id): links test to a spec section ID",
  "integration: requires external services",
  "requires_docker: test needs Docker services (e.g. Azurite)",
  "standard: medium-tier benchmark (10MB payload, deep hierarchy, ~5 min/backend)",
  "full: heavy-tier benchmark (100MB payload, 10k listing, ~20-30 min/backend)",
  "os_sensitive: exercises OS-specific behaviour (paths, atomic writes, local filesystem); run on macOS and Windows CI",
  "pbt: property-based test using Hypothesis",
  "extended_conformance: extended conformance suite derived from Dafny postconditions",
  "live: requires a real cloud account; opt-in via gating env vars (excluded by default addopts)",
  "concurrency: posture-gated concurrency conformance lane (BK-289); selectable/excludable in isolation",
  "large_payload: large/high-churn payload conformance tests; excluded from live cloud recording (BK-305)",
]

[tool.pytest-gremlins]
cache = true
exclude = ["**/__init__.py", "**/__pycache__/*"]

# Required for xdist: each worker writes its own `.coverage.<id>` partial that
# pytest-cov combines at session end. Also needed across the two-pass `test-cov*`
# split (--cov-append in pass 2 layers onto pass 1's combined data file).
# relative_files: the CI coverage-gate combines partial `.coverage` files
# produced on *different* runners (the sharded test-primary + test-primary-sftp
# jobs); storing source paths relative to the rootdir makes them line up during
# `coverage combine` regardless of each runner's absolute checkout path.
[tool.coverage.run]
parallel = true
relative_files = true

[tool.ruff]
line-length = 120
# Defense-in-depth for ad-hoc `ruff check .` / IDE integrations that scan the
# whole tree: excludes Dafny-generated Python output (oracle + runtime); see
# sdd/formal/README.md.  The canonical `hatch run lint` script targets only
# `src/ tests/ examples/`, so this exclude has no effect on CI lint.
extend-exclude = ["sdd/formal/*-py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "BLE", "SIM", "TCH", "PT"]
ignore = ["UP045"]

[tool.ruff.lint.flake8-pytest-style]
# Note: ruff PT011 only resolves builtin/stdlib names; custom exception names
# below are documentation of intent, not enforced. See BK-126.
raises-require-match-for = [
    "ValueError", "TypeError", "KeyError", "RuntimeError",
    "NotFound", "AlreadyExists", "CapabilityNotSupported",
    "BackendUnavailable", "PermissionDenied",
]

[tool.ruff.lint.isort]
known-first-party = ["remote_store"]

# --- Version management ---
# Run: bump-my-version bump patch|minor|major
# Bumps version in all four files listed below atomically.

[tool.bumpversion]
current_version = "0.30.0"
commit = false
tag = false
tag_name = "v{new_version}"
message = "Bump version: {current_version} → {new_version}"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "src/remote_store/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'

[[tool.bumpversion.files]]
filename = "CITATION.cff"
search = "version: {current_version}"
replace = "version: {new_version}"

[[tool.bumpversion.files]]
filename = "FEATURES.md"
search = "remote-store v{current_version}"
replace = "remote-store v{new_version}"
