# Docker Compose for remote-store backend benchmarking.
#
# Starts MinIO (S3-compatible), Azurite (Azure Blob emulator), an
# OpenSSH-based SFTP server, and Toxiproxy (latency simulation) so
# benchmarks can run against realistic network services instead of
# pure in-process mocks.
#
# Toxiproxy sits in front of all three network backends:
#   - Azurite:  port 10001 → azurite:10000
#   - MinIO:    port 19000 → minio:9000
#   - SFTP:     port 12222 → sftp:22
#
# Use ``--network-profile rtt50`` with pytest to add simulated network
# latency to all proxied backends (default: clean = passthrough).
# The Toxiproxy HTTP API is exposed on port 8474 for manual toxic
# management.
#
# Usage:
#   docker compose up -d
#   pytest benchmarks/ -v
#   pytest benchmarks/ -v --backend s3-latency --network-profile rtt50
#   docker compose down -v

services:
  minio:
    # Chainguard image — MinIO stopped publishing to Docker Hub Oct 2025.
    # -dev variant includes busybox (sh, wget) needed for CMD-SHELL healthcheck.
    # Free tier has no versioned tags; pin by digest when reproducibility matters.
    image: cgr.dev/chainguard/minio:latest-dev
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "127.0.0.1:9001:9001"   # console — localhost only
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    healthcheck:
      # Chainguard image has no `mc` binary; use HTTP liveness endpoint.
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:9000/minio/health/live 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0
    command: azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --skipApiVersionCheck
    ports:
      - "10000:10000"
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "10000"]
      interval: 5s
      timeout: 5s
      retries: 5

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    ports:
      - "10001:10001"           # proxied Azurite blob endpoint
      - "19000:19000"           # proxied MinIO S3 endpoint
      - "12222:12222"           # proxied SFTP endpoint
      - "127.0.0.1:8474:8474"  # Toxiproxy HTTP API — localhost only
    volumes:
      - ./toxiproxy.json:/config/toxiproxy.json:ro
    command: -config /config/toxiproxy.json -host 0.0.0.0
    depends_on:
      azurite:
        condition: service_healthy
      minio:
        condition: service_healthy
      sftp:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/toxiproxy-cli", "list"]
      interval: 5s
      timeout: 5s
      retries: 5

  sftp:
    # alpine-3.7 reached EOL ~Nov 2019; use latest Alpine for security patches.
    # atmoz/sftp only publishes `alpine` (floating); no per-version Alpine tags.
    image: atmoz/sftp:alpine
    ports:
      - "2222:22"
    command: benchuser:benchpass:::upload
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "22"]
      interval: 5s
      timeout: 5s
      retries: 5
