# Docker Compose for remote-store backend benchmarking.
#
# Starts MinIO (S3-compatible), Azurite (Azure Blob emulator), and an
# OpenSSH-based SFTP server so benchmarks can run against realistic
# network services instead of pure in-process mocks.
#
# Usage:
#   docker compose up -d
#   pytest benchmarks/ -v
#   docker compose down -v

services:
  minio:
    # Chainguard image — MinIO stopped publishing to Docker Hub Oct 2025.
    # -dev variant includes busybox (sh, wget) needed for CMD-SHELL healthcheck.
    # Free tier has no versioned tags; pin by digest when reproducibility matters.
    image: cgr.dev/chainguard/minio:latest-dev
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "127.0.0.1:9001:9001"   # console — localhost only
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    healthcheck:
      # Chainguard image has no `mc` binary; use HTTP liveness endpoint.
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:9000/minio/health/live 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0
    command: azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --skipApiVersionCheck
    ports:
      - "10000:10000"
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "10000"]
      interval: 5s
      timeout: 5s
      retries: 5

  sftp:
    # alpine-3.7 reached EOL ~Nov 2019; use latest Alpine for security patches.
    # atmoz/sftp only publishes `alpine` (floating); no per-version Alpine tags.
    image: atmoz/sftp:alpine
    ports:
      - "2222:22"
    command: benchuser:benchpass:::upload
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "22"]
      interval: 5s
      timeout: 5s
      retries: 5
