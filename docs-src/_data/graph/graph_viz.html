const NODE_CFG = {
  capability: {color:'#F59E0B',r:14,label:n=>n.value||n.id.split(':')[1]},
  class:      {color:'#3B82F6',r:13,label:n=>n.id.split('.').pop()},
  method:     {color:'#10B981',r:10,label:n=>n.id.split('.').pop()},
  package:    {color:'#A855F7',r:16,label:n=>n.id.split(':')[1]},
  requirement:{color:'#F43F5E',r:8, label:n=>{
    const p=n.id.split('.');return p[p.length-2]+'.gate';
  }},
  extra:      {color:'#94A3B8',r:11,label:n=>n.id.split(':')[1]},
};

const EDGE_CFG = {
  declares:{color:'#3B82F6',dash:'0',    width:1.5},
  enables: {color:'#10B981',dash:'4,3',  width:1.5},
  gates:   {color:'#F43F5E',dash:'0',    width:1.5},
  inherits:{color:'#A855F7',dash:'0',    width:2  },
  mirrors: {color:'#F59E0B',dash:'6,3',  width:2  },
  of:      {color:'#64748B',dash:'2,2',  width:1  },
};

const visibleNodeKinds = new Set(Object.keys(NODE_CFG));
const visibleEdgeKinds = new Set(Object.keys(EDGE_CFG));
let selectedId = null;

function buildLegend() {
  const nl = d3.select('#node-legend');
  Object.entries(NODE_CFG).forEach(([kind, cfg]) => {
    const row = nl.append('div').attr('class','legend-row');
    row.append('input').attr('type','checkbox').property('checked',true)
      .on('change', function(){
        this.checked?visibleNodeKinds.add(kind):visibleNodeKinds.delete(kind); update();
      });
    row.append('div').attr('class','dot').style('background',cfg.color);
    row.append('span').text(kind+' ('+GRAPH.nodes.filter(n=>n.kind===kind).length+')');
  });
  const el = d3.select('#edge-legend');
  Object.entries(EDGE_CFG).forEach(([kind, cfg]) => {
    const row = el.append('div').attr('class','legend-row');
    row.append('input').attr('type','checkbox').property('checked',true)
      .on('change', function(){
        this.checked?visibleEdgeKinds.add(kind):visibleEdgeKinds.delete(kind); update();
      });
    row.append('div').attr('class','line-sample')
      .style('background', cfg.dash==='0'
        ? cfg.color
        : `repeating-linear-gradient(90deg,${cfg.color} 0,${cfg.color} 4px,transparent 4px,transparent 7px)`)
      .style('height', cfg.width+'px');
    row.append('span').text(kind);
  });
}

function showDetail(node) {
  const el = document.getElementById('detail');
  if (!node) { el.innerHTML='<span class="placeholder">Click a node to inspect it</span>'; return; }
  const skip = new Set(['id','kind']);
  const rows = Object.entries(node)
    .filter(([k]) => !skip.has(k))
    .map(([k,v]) => `<div class="detail-row">${k}: <span>${v}</span></div>`)
    .join('');
  el.innerHTML = `<div class="detail-id">${node.id}</div>`
    + `<div class="detail-row">kind: <span>${node.kind}</span></div>${rows}`;
}

const svg = d3.select('#graph');
const defs = svg.append('defs');
Object.entries(EDGE_CFG).forEach(([kind, cfg]) => {
  defs.append('marker').attr('id','arrow-'+kind)
    .attr('viewBox','0 -5 10 10').attr('refX',22).attr('refY',0)
    .attr('markerWidth',5).attr('markerHeight',5).attr('orient','auto')
    .append('path').attr('d','M0,-5L10,0L0,5').attr('fill',cfg.color);
});

const g = svg.append('g');
const zoom = d3.zoom().scaleExtent([0.15,4]).on('zoom', e=>g.attr('transform',e.transform));
svg.call(zoom);
document.getElementById('btn-reset').onclick =
  () => svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity);
document.getElementById('btn-reheat').onclick = () => simulation.alpha(0.8).restart();

const nodeMap = new Map(GRAPH.nodes.map(n=>[n.id,{...n}]));
const links = GRAPH.edges
  .map(e=>({...e, source:nodeMap.get(e.src), target:nodeMap.get(e.dst)}))
  .filter(l=>l.source&&l.target);
const nodes = [...nodeMap.values()];

const simulation = d3.forceSimulation(nodes)
  .force('link', d3.forceLink(links).id(d=>d.id).distance(d=>{
    return {declares:90,enables:100,gates:80,inherits:80,mirrors:90,of:70}[d.kind]||90;
  }).strength(0.4))
  .force('charge', d3.forceManyBody().strength(-280))
  .force('collide', d3.forceCollide().radius(d=>(NODE_CFG[d.kind]?.r||10)+8))
  .force('center', d3.forceCenter(700,450));

let linkSel, nodeSel;

function update() {
  const activeNodes = nodes.filter(n=>visibleNodeKinds.has(n.kind));
  const activeIds = new Set(activeNodes.map(n=>n.id));
  const activeLinks = links.filter(
    l=>visibleEdgeKinds.has(l.kind)&&activeIds.has(l.source.id)&&activeIds.has(l.target.id));

  linkSel = g.selectAll('.link').data(activeLinks, d=>d.src+'>'+d.kind+'>'+d.dst)
    .join(enter=>enter.append('line').attr('class','link'), u=>u, exit=>exit.remove())
    .attr('stroke', d=>EDGE_CFG[d.kind]?.color||'#666')
    .attr('stroke-width', d=>EDGE_CFG[d.kind]?.width||1.5)
    .attr('stroke-dasharray', d=>EDGE_CFG[d.kind]?.dash||'0')
    .attr('marker-end', d=>`url(#arrow-${d.kind})`);

  nodeSel = g.selectAll('.node').data(activeNodes, d=>d.id)
    .join(
      enter => {
        const ng = enter.append('g').attr('class','node')
          .call(d3.drag()
            .on('start',(ev,d)=>{ if(!ev.active)simulation.alphaTarget(0.3).restart(); d.fx=d.x; d.fy=d.y; })
            .on('drag', (ev,d)=>{ d.fx=ev.x; d.fy=ev.y; })
            .on('end',  (ev,d)=>{ if(!ev.active)simulation.alphaTarget(0); d.fx=null; d.fy=null; }))
          .on('click',(ev,d)=>{
            ev.stopPropagation();
            selectedId = selectedId===d.id ? null : d.id;
            showDetail(selectedId ? d : null);
            highlightNeighbors();
          });
        ng.append('circle');
        ng.append('text').attr('dy','0.35em').attr('text-anchor','middle');
        ng.append('text').attr('class','async-badge').attr('text-anchor','middle');
        return ng;
      },
      u=>u,
      exit=>exit.remove()
    );

  nodeSel.select('circle')
    .attr('r', d=>NODE_CFG[d.kind]?.r||10)
    .attr('fill', d=>NODE_CFG[d.kind]?.color||'#888')
    .attr('stroke', d=>d3.color(NODE_CFG[d.kind]?.color||'#888').brighter(0.8));

  nodeSel.classed('abstract', d=>d.is_abstract===true);

  nodeSel.select('text:not(.async-badge)')
    .text(d=>NODE_CFG[d.kind]?.label(d)||d.id)
    .attr('dy', d=>(NODE_CFG[d.kind]?.r||10)+12);

  nodeSel.select('text.async-badge')
    .text(d=>d.is_async===true?'async':'')
    .attr('dy', d=>(NODE_CFG[d.kind]?.r||10)+22);

  nodeSel.classed('selected', d=>d.id===selectedId);

  simulation.nodes(activeNodes);
  simulation.force('link').links(activeLinks);
  simulation.alpha(0.4).restart();
}

function highlightNeighbors() {
  if (!selectedId) { nodeSel?.classed('faded',false); linkSel?.classed('faded',false); return; }
  const nb = new Set([selectedId]);
  linkSel?.each(d=>{
    if(d.source.id===selectedId||d.target.id===selectedId){
      nb.add(d.source.id); nb.add(d.target.id);
    }
  });
  nodeSel?.classed('faded', d=>!nb.has(d.id));
  linkSel?.classed('faded', d=>d.source.id!==selectedId&&d.target.id!==selectedId);
}

svg.on('click',()=>{ selectedId=null; showDetail(null); highlightNeighbors(); });

simulation.on('tick',()=>{
  linkSel?.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y)
    .attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);
  nodeSel?.attr('transform',d=>`translate(${d.x},${d.y})`);
});

buildLegend();
update();
</script>
