# Intentional design: trigger on pull_request_review (not pull_request) so the
# workflow only enables auto-merge after a human approval. The fetch-metadata
# action is deliberately omitted -- the human review is the gate, so update-type
# filtering would be redundant.
#
# BK-274 control: the `github-actions` ecosystem is excluded from auto-merge
# (the `!startsWith(... 'dependabot/github_actions/')` guard below). An action
# bump usually exercises nothing in the test suite, so a green check means the
# workflow parsed, not that the bumped action behaves -- approval there was a
# rubber-stamp path straight to master. Those PRs are merged manually after
# the per-ecosystem checklist in sdd/CI-OPERATIONS.md:
#   gh pr merge <N> --squash --delete-branch
# pip PRs keep approve-to-merge: their bumps are exercised by the test suite,
# so the approval has a real signal to act on.
#
# Things to be aware of:
# - Recovery for a missed PR: dismiss + re-approve (fires a new submitted event),
#   or run `gh pr merge <N> --auto --squash --delete-branch` locally.
# - `dismiss_stale_reviews: true` on master is currently cosmetic because
#   `required_approving_review_count: 0`. If that count is ever raised, rebases
#   will dismiss approvals and block already-enabled auto-merge.
# - Token model: triggered by the reviewer (not dependabot), so GITHUB_TOKEN has
#   full write perms; no PAT needed.
# - `github.event.pull_request.state` is the webhook payload snapshot at review
#   submission time, not queried live. `gh pr merge --auto` handles the merged
#   case correctly on its own, so the guard is best-effort, not authoritative.
name: Dependabot auto-merge
on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  dependabot:
    runs-on: ubuntu-latest
    if: >
      github.repository == 'haalfi/remote-store' &&
      github.event.pull_request.state == 'open' &&
      github.event.review.state == 'approved' &&
      github.event.review.user.login == 'haalfi' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      !startsWith(github.event.pull_request.head.ref, 'dependabot/github_actions/')
    steps:
      - name: Enable auto-merge for Dependabot PRs
        run: gh pr merge --auto --squash --delete-branch "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
