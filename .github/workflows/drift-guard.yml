name: Drift Guard

# ID-182: weekly scheduled check on BOTH ends of every declared dependency
# range, per `remote-store[<extra>]`.
#
#  - The `check` (newest) lane re-resolves each extra against the latest
#    available transitive versions, pre-releases included, diffs the result
#    against the committed baselines in `infra/drift-locks/`, and smokes it.
#  - The `floor` lane installs each extra at the FLOOR of every range it
#    declares (`uv pip install --resolution lowest-direct`, which takes the
#    floors from pyproject.toml rather than from a second copy of them) on the
#    oldest interpreter `requires-python` admits, and runs the same smoke.
#
# Both lanes install each extra ALONE and import its own declared packages
# before anything else joins the environment. That isolation is what makes an
# under-declared extra visible: the aggregates every other job installs cover
# for each other, so a missing dependency arrives from a neighbour.
#
# Findings from both lanes land on a single rolling GitHub issue.
#
# Explicit non-goals:
#  - This workflow NEVER edits pyproject.toml.
#  - This workflow NEVER auto-merges a pin / floor update.
#  - The point is early warning, not automated remediation.
#  - The floor lane is NOT a verification of the floors. It runs on ONE
#    interpreter — the oldest — so a floor that breaks only on a newer one is
#    invisible to it, and two of the five floor bugs found by hand were of
#    exactly that shape (the sqlalchemy and urllib3 floors — see the
#    `drift_check.py` docstring for the derivation and for why the other three
#    are not). It leaves transitive packages newest, so a red leg can
#    be a floor meeting a new transitive rather than a wrong floor. And it
#    reaches only as far as that extra's target in `scripts/drift_smoke_map.py`.
#    And it is STRICTER than a user's runtime in one direction: the smoke
#    inherits `filterwarnings = error`, so a floor that merely warns against
#    current transitives fails its leg. Deliberate — a deprecation at the floor
#    is a floor about to break — but a red leg is not always something a user
#    sees today.
#  - A floor leg is ADVISORY: it exits 0 whatever it finds, and the verdict is
#    on the issue. `infra/drift-locks/KNOWN-FINDINGS.md` is what separates a
#    floor finding somebody owns from a new one; an unregistered finding holds
#    the issue open, a registered one does not. A row past its `Review by` stops
#    silencing and the finding is reported as new again.
#
# THIRD THING THE REPORT JOB WATCHES, and it has no lane and no artefact:
# the PYTHON SUPPORT WINDOWS the dependency policy's Rule 8 publishes. Every
# supported interpreter's release date plus CPython's five-year security-support
# lifetime, differenced against today, rendered as a "Support windows" section
# on the same rolling issue.
#  - It fires on the CALENDAR rather than on anything a run uploaded, which is
#    why no diff can carry it and why the report job is its home. `preflight`
#    could not be: this needs no network, but a window closes whether or not
#    anybody ships.
#  - Weekly is the RESOLUTION the promise needs, not a habit. What can invalidate
#    the section is a date passing, a new CPython final release (each October) or
#    a classifier edit. Nothing is broken on the day a window closes, so seven
#    days of latency costs nothing; much longer and a release could ship past a
#    window nobody had looked at.
#  - ADVISORY, like the rest of this workflow. A closed window LICENSES a drop;
#    it never requires one. A gate reading Rule 8 as an obligation would invert
#    the rule, which promises a floor rather than a ceiling.
#  - `infra/drift-locks/PYTHON-SUPPORT.md` is its register, separate from
#    KNOWN-FINDINGS.md because the two are keyed differently. An interpreter past
#    its window with no unexpired row there holds the issue open.
#  - A crossing is true on EVERY run, so it FORCES AN UPDATE only on an
#    unnarrowed one (every lane, every extra). Otherwise the sharp edge below
#    would fire on every single-extra dispatch: an always-true signal would turn
#    a run that should leave the issue alone into one that rewrites its body.
#  - It does still stop a narrowed run CLOSING the issue. Withholding the update
#    while permitting the close would take the worse half of that trade, since a
#    rewritten body is recoverable and a closed issue is not. So a narrowed run
#    with an unowned crossing neither rewrites nor closes: it leaves the issue
#    as it found it, and the next scheduled run decides.
#
# FOURTH THING THE REPORT JOB WATCHES, also with no lane and no artefact:
# THE RECIPE CONDA-FORGE PUBLISHES. `scripts/drift_feedstock.py` fetches
# `conda-forge/remote-store-feedstock`'s `recipe/recipe.yaml` and compares it
# against the generated copy this repo committed at the tag its `context.version`
# names. `scripts/gen_conda_feedstock.py` produces that copy, and `hatch run
# lint` fails when it is stale, so the copy-out is mechanical and this watch
# asks the one question the copy-out cannot: is the published file still what
# was copied out?
#  - The TAG, not master. Comparing against master would report every legitimate
#    floor change between releases as drift — the feedstock is rightly carrying
#    the previous release's constraints until the next copy-out.
#  - `build.number` and `source.sha256` are EXCLUDED. conda-forge owns the
#    first; the second is fetched from PyPI after the tag is cut, so a tag
#    structurally carries the previous release's digest and the far copy is
#    legitimately ahead on it.
#  - ADVISORY, and more strongly so than the rest of this workflow: the file is
#    in a repository this project does not own, so no PR here can fix a
#    difference and a red X would assert something no contributor can act on.
#    The remedy is a PR against the feedstock, per sdd/CONDA-FORGE.md. This
#    workflow NEVER edits the feedstock and NEVER opens that PR.
#  - NOT KNOWING IS NOT AGREEMENT. A fetch that failed, or a version this repo
#    published no generated copy for, forces no update — but it does not let the
#    run close the issue either, because closing would report a comparison
#    nobody performed.
#  - A failure of OUR OWN is never reported as the other repo's. A tag that will
#    not resolve is an `error` that holds the issue open; only the feedstock's
#    availability is `unreachable`. Folding the two together would let a broken
#    watch look exactly like normal operation, forever.
#  - A difference nobody intends to revert is REGISTERED, in
#    infra/drift-locks/FEEDSTOCK-DIVERGENCE.md, keyed by YAML key path. This is
#    the one artefact pair here where a divergence can be imposed without our
#    consent (a conda-forge migrator; the maintainer-list flow), and
#    CONDA-FORGE.md Rule 1 forbids the in-repo remedy. Without a register such
#    an edit would hold THIS SHARED ISSUE open forever and retire the dependency
#    lanes' own "drift cleared" signal. A drift stops holding only when EVERY
#    differing key is registered and unexpired.
#
# One sharp edge on `workflow_dispatch`: the report job regenerates the WHOLE
# issue body from whatever reports the run produced, so a single-extra or
# single-lane dispatch rewrites the body to that slice and drops every other
# row. Use `dry_run: true` to see a body without writing one; for a real
# re-run that must preserve the issue, dispatch `extra: all` and `lane: all`.
#
# This is one of the scheduled/automated CI guards; the cross-guard inventory
# and the durable-TODO principle live in sdd/CI-OPERATIONS.md.
#
# Refreshing baselines: a lock is Python- AND OS-specific, so the route depends
# on the host AND on which of the two refresh scenarios you are in (accepting a
# drift finding vs shipping a deliberate floor bump — they do not share routes).
# The `candidate-baseline-<extra>` artifact uploaded below exists to serve the
# first of those from any host. infra/drift-locks/README.md § Refreshing is
# authoritative on all of it; commit the updated lock + regenerated docs page in
# the same PR as whatever motivated the refresh.
#
# The smoke as a refresh gate (ID-231): the extra is resolved ONCE per leg
# (`drift_check.py diff --emit-freeze`), and that single freeze is what the
# report is computed from, what the smoke pins against, and what is uploaded as
# the candidate baseline. The smoke installs both the extra and the test plugins
# under `-c <freeze>`, so a shared transitive dep cannot be moved off the
# candidate pin: a green smoke proves the committed pins were the ones tested.
# What `-c` does NOT do is force a plugin to fail loudly — pip is free to
# backtrack the plugin side onto an older release that fits, and at the floor it
# backtracks much further. The verdict's `phase` is what separates a plugin the
# resolver dragged backwards from a finding about the dependency.

on:
  schedule:
    - cron: "0 7 * * 1"  # Every Monday 07:00 UTC
  workflow_dispatch:
    inputs:
      extra:
        description: "Single extra to check (default: all)"
        required: false
        default: "all"
        type: string
      lane:
        description: "Which lane to run"
        required: false
        default: "all"
        type: choice
        options: [all, newest, floor]
      dry_run:
        description: "Render the issue body into the job summary and leave the issue untouched"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: write

# Single-writer guarantee on the rolling issue: a manual `workflow_dispatch`
# launched while the scheduled Monday run is still in its longest matrix leg
# would otherwise race the `report` job and last-writer-wins on `gh issue
# edit` / `close`. Queue dispatches behind a running schedule rather than
# cancelling, so the schedule's wider matrix always completes.
concurrency:
  group: drift-guard
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      extras: ${{ steps.set-extras.outputs.extras }}
      lane: ${{ steps.set-lane.outputs.lane }}
      lanes: ${{ steps.set-lane.outputs.lanes }}
      backend_extras: ${{ steps.set-lane.outputs.backend_extras }}
      min_python: ${{ steps.set-lane.outputs.min_python }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      # The oldest supported interpreter is derived here, from
      # `requires-python`, rather than written down a fourth time:
      # `check_conda_recipe_pins.py` already holds three spellings of the
      # minimum equal, and a hand-written fourth in this file would be the one
      # nothing compares.
      - id: set-lane
        env:
          # Same env-routing as the extras input below, and for the same
          # reason: `lane` reaches an `if:` on two jobs, so it is validated
          # against the closed set before it is echoed anywhere.
          INPUT_LANE: ${{ github.event.inputs.lane }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          lane="${INPUT_LANE:-all}"
          if [ "$EVENT_NAME" = "schedule" ]; then
            lane=all
          fi
          case "$lane" in
            all|newest|floor) ;;
            *) echo "::error::lane must be one of all|newest|floor, got '${lane}'"; exit 1 ;;
          esac
          echo "lane=${lane}" >> "$GITHUB_OUTPUT"
          # The report job's claim space is (extra, lane), so it needs the lanes
          # as well as the extras: an extra that reports on one lane and loses
          # the other is invisible to a per-extra check, and the body then calls
          # it clean in a lane nobody ran.
          if [ "$lane" = "all" ]; then lanes="newest,floor"; else lanes="$lane"; fi
          echo "lanes=${lanes}" >> "$GITHUB_OUTPUT"
          # The extras whose smoke needs docker services, derived from
          # `drift_smoke_map.backends_needed` rather than restated. Both lanes
          # gate their start-backends step on this, and the cost of a third
          # hand-copy is not a stale comment: an extra added to the mapping and
          # missed in a conditional installs and imports fine, then fails pytest
          # on connection-refused, which the action records as
          # `smoke: fail, phase: smoke` — landing under "Floor installs, then
          # breaks", whose prose tells a maintainer to raise the floor. The
          # `steps.backends.outcome != 'failure'` guard does not catch it: the
          # step never ran, so it never failed. DRIFT-RULES Rule 3.
          echo "backend_extras=$(python -c '
          import json, sys
          sys.path.insert(0, "scripts")
          from drift_check import list_extras
          from drift_smoke_map import backends_needed
          print(json.dumps([e for e in list_extras() if backends_needed(e)]))
          ')" >> "$GITHUB_OUTPUT"
          echo "min_python=$(python scripts/drift_check.py min-python)" >> "$GITHUB_OUTPUT"

      - id: set-extras
        env:
          # Route the user-supplied input through env, not direct template
          # interpolation (mutation.yml:35-42 pattern). Validation below
          # additionally ensures INPUT_EXTRA reaches `matrix.extra` (and
          # downstream shell interpolation in the check job) only after
          # matching against the known extras list — otherwise a crafted
          # workflow_dispatch input could break out of the shell context.
          INPUT_EXTRA: ${{ github.event.inputs.extra }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ] || [ -z "$INPUT_EXTRA" ] || [ "$INPUT_EXTRA" = "all" ]; then
            extras=$(python scripts/drift_check.py extras)
          else
            extras=$(python -c '
          import json, os, sys
          sys.path.insert(0, "scripts")
          from drift_check import list_extras
          chosen = os.environ["INPUT_EXTRA"]
          known = list_extras()
          if chosen not in known:
              sys.exit(f"::error::INPUT_EXTRA={chosen!r} is not in the known extras list: {known}")
          print(json.dumps([chosen]))
          ')
          fi
          echo "extras=${extras}" >> "$GITHUB_OUTPUT"

  check:
    needs: [setup]
    if: needs.setup.outputs.lane != 'floor'
    name: check-${{ matrix.extra }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        extra: ${{ fromJson(needs.setup.outputs.extras) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      # Start the docker-compose backends the smoke targets need. The list is
      # derived in `setup` from scripts/drift_smoke_map.py::backends_needed, so
      # this conditional is not a second copy of that mapping.
      - name: Start backends (if needed)
        id: backends
        if: contains(fromJson(needs.setup.outputs.backend_extras), matrix.extra)
        uses: ./.github/actions/start-backends
        with:
          minio: ${{ contains(fromJson('["s3","s3-pyarrow"]'), matrix.extra) }}
          azurite: ${{ matrix.extra == 'azure' }}
          sftp: ${{ matrix.extra == 'sftp' }}

      - name: Build legacy-sftp container (sftp only)
        id: legacy-sftp
        if: matrix.extra == 'sftp'
        run: |
          set -a
          . infra/.env
          set +a
          docker compose -f infra/docker-compose.yml up -d legacy-sftp
          for i in $(seq 1 30); do
            nc -z 127.0.0.1 "${LEGACY_SFTP_HOST_PORT}" && break || sleep 1
          done
          # Match the start-backends action's validation shape: fail loudly
          # if the port never came up, rather than letting the smoke fail
          # later with a confusing connection-refused error.
          nc -z 127.0.0.1 "${LEGACY_SFTP_HOST_PORT}" || { echo "::error::legacy-sftp failed to start on port ${LEGACY_SFTP_HOST_PORT}"; exit 1; }

      # Diff: writes a structured JSON report; never fails the job on drift,
      # so we collect every extra's report before the report job decides
      # whether to open / update / close the rolling issue.
      #
      # `--out` writes atomically (tempfile + rename) so a script-internal
      # failure leaves no truncated JSON for `drift_report.py` to crash on.
      # On unrecoverable error the script writes a synthetic `status:error`
      # report rather than failing the step, so one extra's PyPI flake does
      # not mask drift on the other thirteen.
      - name: Resolve and diff
        run: |
          mkdir -p drift-reports drift-candidates
          # One resolve per leg: `--emit-freeze` writes the resolved set the
          # smoke pins against and the candidate-baseline upload reuses, so all
          # three (report, smoke, baseline) describe the same resolution (ID-231).
          # The basename carries extra, lane and kind, for the artefact-rooting
          # reason the floor job's own resolve step spells out.
          python scripts/drift_check.py diff "${{ matrix.extra }}" \
            --out "drift-reports/${{ matrix.extra }}-newest-diff.json" \
            --emit-freeze "drift-candidates/${{ matrix.extra }}.txt"
          echo "=== diff report for ${{ matrix.extra }} ==="
          cat "drift-reports/${{ matrix.extra }}-newest-diff.json"

      # The smoke runs on every leg that produced a freeze, not only on drift.
      # The early return this replaces made the repo's ONLY isolated per-extra
      # install a side effect of version movement, so an extra whose versions
      # were stable was never installed alone at all — and an extra that is
      # missing a dependency only fails when nothing else supplies it.
      #
      # `error` is the one status with no freeze to pin against; the composite
      # action records that as `skipped`. `needs_refresh` DOES have one —
      # `--emit-freeze` writes whenever the resolve succeeded, before status is
      # considered — and a stub-baseline extra is precisely one that has never
      # been installed alone, so it is the last one to skip.
      # `always()`, so a failed RESOLVE still reaches the smoke (the composite
      # action records a missing constraints file as `skipped`) — but never a
      # failed BACKEND. A docker failure leaves the extra installing and
      # importing perfectly and pytest failing on connection-refused, which the
      # action records as `smoke: fail, phase: smoke`: on the floor lane that
      # lands in "Floor installs, then breaks", whose text tells a maintainer
      # the floor is too low and wants raising. Publishing an infrastructure
      # failure as a dependency finding is worse than publishing nothing.
      - name: Smoke the candidate resolution
        if: always() && steps.backends.outcome != 'failure' && steps.legacy-sftp.outcome != 'failure'
        uses: ./.github/actions/drift-smoke
        with:
          extra: ${{ matrix.extra }}
          constraints: drift-candidates/${{ matrix.extra }}.txt
          lane: newest

      - name: Upload smoke verdict
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: drift-smoke-${{ matrix.extra }}-newest
          path: drift-smokes/
          if-no-files-found: warn

      - name: Upload drift report and fresh resolution
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: drift-${{ matrix.extra }}
          path: drift-reports/
          if-no-files-found: warn

      # Upload the freeze the "Resolve and diff" step already emitted (the same
      # set the smoke pinned against) so a maintainer can download it and commit
      # it as the new baseline. No separate re-resolve — that third independent
      # resolution was the ID-231 gap. No PR is opened automatically (see the
      # non-goals comment at the top).
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: candidate-baseline-${{ matrix.extra }}
          path: drift-candidates/${{ matrix.extra }}.txt
          if-no-files-found: warn

  # The floor lane. A matrix job's id cannot be templated, so the id is `floor`
  # and the per-extra name comes from `name:`.
  floor:
    needs: [setup]
    if: needs.setup.outputs.lane != 'newest'
    name: floor-${{ matrix.extra }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        extra: ${{ fromJson(needs.setup.outputs.extras) }}
    steps:
      - uses: actions/checkout@v7

      # The OLDEST supported interpreter, derived in `setup` from
      # `requires-python`. A floor is a claim about the whole supported range,
      # and the oldest end is where a floor that is too low most often still
      # resolves — but see the non-goals above for what one interpreter cannot
      # see.
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ needs.setup.outputs.min_python }}

      # `drift_check.py` reads pyproject.toml, and `tomllib` is stdlib only
      # from 3.11. Every other job runs on the primary interpreter where the
      # question does not arise; this one runs on the minimum, which is exactly
      # the case the script's own docstring says needs `tomli`.
      - name: Install the script's own dependency on older interpreters
        run: python -m pip install --quiet "tomli; python_version < '3.11'"

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: false

      # Same derived list as the newest lane: the floor smoke runs the same
      # target, so it needs the same services.
      - name: Start backends (if needed)
        id: backends
        if: contains(fromJson(needs.setup.outputs.backend_extras), matrix.extra)
        uses: ./.github/actions/start-backends
        with:
          minio: ${{ contains(fromJson('["s3","s3-pyarrow"]'), matrix.extra) }}
          azurite: ${{ matrix.extra == 'azure' }}
          sftp: ${{ matrix.extra == 'sftp' }}

      - name: Build legacy-sftp container (sftp only)
        id: legacy-sftp
        if: matrix.extra == 'sftp'
        run: |
          set -a
          . infra/.env
          set +a
          docker compose -f infra/docker-compose.yml up -d legacy-sftp
          for i in $(seq 1 30); do
            nc -z 127.0.0.1 "${LEGACY_SFTP_HOST_PORT}" && break || sleep 1
          done
          nc -z 127.0.0.1 "${LEGACY_SFTP_HOST_PORT}" || { echo "::error::legacy-sftp failed to start on port ${LEGACY_SFTP_HOST_PORT}"; exit 1; }

      # One resolve per leg, same shape as the diff lane: the freeze the report
      # names is the freeze the smoke pins against. On failure the script writes
      # a synthetic `status: error` report rather than exiting non-zero — here
      # that is itself the finding, so it must reach the report job.
      - name: Resolve the declared floors
        run: |
          mkdir -p drift-floors drift-floor-freezes
          # The filename carries the extra, the lane AND the kind. An artefact
          # is rooted at the least common ancestor of its files, so a
          # single-file upload contributes that file at the artefact ROOT and
          # the directory name never reaches the report job. Two uploads whose
          # basenames match therefore collide under `merge-multiple` however
          # different their directories are — measured twice on this branch,
          # first across lanes and then between a floor resolve and its own
          # smoke verdict. Uniqueness has to live in the basename.
          python scripts/drift_check.py floor "${{ matrix.extra }}" \
            --out "drift-floors/${{ matrix.extra }}-floor-resolve.json" \
            --emit-freeze "drift-floor-freezes/${{ matrix.extra }}.txt"
          echo "=== floor report for ${{ matrix.extra }} ==="
          cat "drift-floors/${{ matrix.extra }}-floor-resolve.json"

      # `always()`, so a failed RESOLVE still reaches the smoke (the composite
      # action records a missing constraints file as `skipped`) — but never a
      # failed BACKEND. A docker failure leaves the extra installing and
      # importing perfectly and pytest failing on connection-refused, which the
      # action records as `smoke: fail, phase: smoke`: on the floor lane that
      # lands in "Floor installs, then breaks", whose text tells a maintainer
      # the floor is too low and wants raising. Publishing an infrastructure
      # failure as a dependency finding is worse than publishing nothing.
      - name: Smoke the floor resolution
        if: always() && steps.backends.outcome != 'failure' && steps.legacy-sftp.outcome != 'failure'
        uses: ./.github/actions/drift-smoke
        with:
          extra: ${{ matrix.extra }}
          constraints: drift-floor-freezes/${{ matrix.extra }}.txt
          lane: floor
          # Advisory: the finding belongs on the rolling issue, where it has an
          # owner and a rationale beside it, not in a red X that is filterable
          # and says nothing about which floor or why.
          fail-on-smoke: 'false'

      # Both artifact names keep the `drift-` prefix the report job's
      # `pattern: drift-*` download depends on. An artifact named anything else
      # is simply never downloaded, and the lane would report nothing at all —
      # silently, because an empty section renders as no section.
      - name: Upload floor report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: drift-floor-${{ matrix.extra }}
          path: drift-floors/
          if-no-files-found: warn

      - name: Upload smoke verdict
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: drift-smoke-${{ matrix.extra }}-floor
          path: drift-smokes/
          if-no-files-found: warn

  report:
    needs: [setup, check, floor]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      # `pattern: drift-*` reaches the diff reports, the floor reports and both
      # lanes' smoke verdicts, and keeps `candidate-baseline-*` out. What keeps
      # `merge-multiple` from collapsing two of them is the BASENAME —
      # `-newest-diff`, `-floor-resolve`, `-<lane>-smoke` — not the directory
      # each was written to: an artefact is rooted at the least common ancestor
      # of its files, so a single-file upload arrives with its directory
      # discarded. Measured twice on this branch, once across lanes and once
      # between a floor resolve and its own verdict.
      - uses: actions/download-artifact@v8
        with:
          path: drift-reports
          pattern: drift-*
          merge-multiple: true

      # The fourth thing, and like the third it has no lane and no artefact:
      # fetch what conda-forge publishes and compare it against the generated
      # copy this repo committed at the tag that version names.
      #
      # Written OUTSIDE drift-reports/ on purpose. That directory is rglobbed
      # by `_load_reports`, which places a file by its `extra` key; this report
      # has none, so it would be named unreadable and hold the issue open every
      # week under a reason that has nothing to do with the feedstock.
      #
      # No `if:`, and before BOTH report steps below, so the dry run previews
      # the same input the real run acts on — the "one function for both to
      # consult" rule `decide` states, applied to what they consult.
      #
      # The script never exits non-zero on a finding: a fetch failure, a missing
      # tag and a real difference are all statuses in its JSON.
      #
      # `continue-on-error` for the case that is left. Without it, this step
      # dying takes the whole report with it — the two steps below carry no
      # `always()`, so that week's diffs, floor results and smoke verdicts
      # would never reach the issue for a reason that has nothing to do with
      # them. That is the failure `_load_reports` was hardened against, one
      # input over. `drift_report.py` reads an absent or unreadable report as
      # an `error` status, which renders on the issue and holds it open, so
      # this is tolerated *loudly* rather than skipped.
      - name: Compare the published conda recipe
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/drift_feedstock.py --repo "${{ github.repository }}" --out feedstock-report.json

      # Compose the rolling-issue body from every report and verdict, then:
      #  - anything unresolved in either lane, or an interpreter past its support
      #    window with nobody named (on an unnarrowed run) -> create/update.
      #  - all clear and an open issue exists -> comment "cleared" and close.
      #  - all clear and no issue exists -> no-op.
      #  - all clear but this run did not cover both lanes, or an unowned
      #    crossing it may not act on -> LEAVE the issue exactly as it is. The
      #    calendar signal has no lane and no artefact, so it is not covered by
      #    "in either lane" above; see the header.
      # A floor finding already in infra/drift-locks/KNOWN-FINDINGS.md renders
      # but does not hold the issue open; see that file for why.
      - name: Update rolling drift issue
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python scripts/drift_report.py drift-reports \
            --repo "$REPO" \
            --run-url "$RUN_URL" \
            --expect-extras '${{ needs.setup.outputs.extras }}' \
            --expect-lanes '${{ needs.setup.outputs.lanes }}' \
            --feedstock-report feedstock-report.json \
            --feedstock-register infra/drift-locks/FEEDSTOCK-DIVERGENCE.md \
            --title "[drift-guard] Weekly transitive dependency drift"

      # How a branch sees what a run would write without writing it. The body
      # regenerates wholesale on every real run, so there is no way to preview
      # one against the live issue without overwriting it.
      #
      # Written to the STEP LOG as well as the job summary. The summary renders
      # nicely and is unreadable through the API, so a dry run whose whole
      # purpose is to be inspected has to reach the log too — this is how the
      # first three dispatches of this lane were triaged.
      - name: Render the issue body (dry run)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        # `shell: bash` for `-o pipefail`, which a workflow `run:` does NOT get
        # by default (it runs under `bash -e {0}`). Without it the pipeline
        # below takes `tee`'s exit status, a traceback from `drift_report.py`
        # leaves the step green with an empty summary, and the one step whose
        # entire purpose is to be read is the one that cannot fail.
        shell: bash
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python scripts/drift_report.py drift-reports \
            --repo "${{ github.repository }}" \
            --run-url "$RUN_URL" \
            --expect-extras '${{ needs.setup.outputs.extras }}' \
            --expect-lanes '${{ needs.setup.outputs.lanes }}' \
            --feedstock-report feedstock-report.json \
            --feedstock-register infra/drift-locks/FEEDSTOCK-DIVERGENCE.md \
            --title "[drift-guard] Weekly transitive dependency drift" \
            --dry-run | tee /tmp/drift-body.md
          {
            echo "## Rolling-issue body this run would write"
            echo
            cat /tmp/drift-body.md
          } >> "$GITHUB_STEP_SUMMARY"
