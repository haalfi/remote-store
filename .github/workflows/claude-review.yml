name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

jobs:
  review:
    if: "!github.event.pull_request.draft"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Review this PR. Focus on:
            - Correctness and potential bugs
            - Adherence to project conventions in CLAUDE.md
            - Error handling (backends must map exceptions to RemoteStoreError subtypes)
            - Test coverage for new/changed behavior
            - Spec compliance (check sdd/specs/ if relevant)
            Post specific, actionable review comments on the relevant lines.
          claude_args: "--max-turns 5"
