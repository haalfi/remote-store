name: Mutation Testing

# Weekly mutation testing across the scopes in scripts/mutate_scopes.py.
# Mutation has two distinct outcomes and this workflow treats them
# differently by design:
#  - Harness / implementation failure (the run itself broke): the mutate leg
#    is red AND the summary job opens or updates the rolling "[mutation]"
#    issue via scripts/mutation_report.py. The issue is the durable TODO;
#    a red X and the actor email alone are not.
#  - Surviving mutants (test-coverage gaps): advisory only. The mutation
#    runner never fails a run because mutants survived; survivor counts land
#    in the run-summary table and the per-scope HTML artifacts, and never
#    open the issue.
#
# Explicit non-goals:
#  - This workflow NEVER gates merges; it is a scheduled maintenance guard.
#  - It NEVER fails a run because mutants survived.
#
# This is one of the scheduled/automated CI guards; the cross-guard inventory
# and the durable-TODO principle live in sdd/CI-OPERATIONS.md. Triage with
# the /mutation skill.

on:
  schedule:
    - cron: "0 5 * * 6"  # Every Saturday at 05:00 UTC
  workflow_dispatch:
    inputs:
      scope:
        description: "Mutation scope name (or 'all'). See scripts/mutate_scopes.py for the list."
        required: false
        default: "all"
        type: string

permissions:
  contents: read
  issues: write

# Single-writer guarantee on the rolling issue (drift-guard.yml carries the
# same block for the same reason): a manual workflow_dispatch launched while
# the scheduled Saturday run is still in a long mutate leg would otherwise
# race the summary job and last-writer-wins on `gh issue edit` / `close`.
# Queue dispatches behind a running schedule rather than cancelling, so the
# schedule's full matrix always completes.
concurrency:
  group: mutation
  cancel-in-progress: false

env:
  UV_SYSTEM_PYTHON: 1
  UV_LINK_MODE: copy

jobs:
  # Read scope names + container needs from scripts/mutate_scopes.py so the
  # workflow stays generic. schedule = all; manual dispatch = filtered.
  setup:
    runs-on: ubuntu-latest
    outputs:
      scopes: ${{ steps.set-scopes.outputs.scopes }}
      minio-scopes: ${{ steps.set-scopes.outputs.minio-scopes }}
      azurite-scopes: ${{ steps.set-scopes.outputs.azurite-scopes }}
      sftp-scopes: ${{ steps.set-scopes.outputs.sftp-scopes }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - id: set-scopes
        env:
          # Route every workflow context value through the env, not direct
          # template interpolation in the shell body. ``INPUT_SCOPE`` is the
          # security-relevant one (user-supplied; ``"`` or ``\`` would break
          # the JSON); ``EVENT_NAME`` is not user-controlled but is passed
          # the same way for pattern consistency, so future additions don't
          # have to relearn which inputs need quoting.
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SCOPE: ${{ github.event.inputs.scope }}
        run: |
          # An explicitly cleared dispatch field means "all", matching both
          # drift-guard's setup and the summary job's FULL_RUN expression —
          # otherwise an empty scope would build a [""] matrix while FULL_RUN
          # still classified the run as full.
          if [ "$EVENT_NAME" = "schedule" ] || [ "$INPUT_SCOPE" = "all" ] || [ -z "$INPUT_SCOPE" ]; then
            scopes=$(python scripts/run_mutate.py --list-scopes)
          else
            scopes=$(python -c 'import json, os; print(json.dumps([os.environ["INPUT_SCOPE"]]))')
          fi
          {
            echo "scopes=${scopes}"
            echo "minio-scopes=$(python scripts/run_mutate.py --container-needs minio)"
            echo "azurite-scopes=$(python scripts/run_mutate.py --container-needs azurite)"
            echo "sftp-scopes=$(python scripts/run_mutate.py --container-needs sftp)"
          } >> "$GITHUB_OUTPUT"

  mutate:
    needs: [setup]
    name: mutate-${{ matrix.scope }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scope: ${{ fromJSON(needs.setup.outputs.scopes) }}
    steps:
      - uses: actions/checkout@v7

      # --- Backend service containers ---
      # Conditionally started based on the JSON arrays computed by setup
      # from scripts/mutate_scopes.py (one source of truth for which scopes
      # need which container). Host ports come from infra/.env (single
      # source of truth, also used by docker-compose and Python conftests).
      - name: Load infra settings
        run: |
          set -a
          . infra/.env
          set +a
          echo "MINIO_HOST_PORT=$MINIO_HOST_PORT" >> $GITHUB_ENV
          echo "MINIO_ACCESS_KEY=$MINIO_ACCESS_KEY" >> $GITHUB_ENV
          echo "MINIO_SECRET_KEY=$MINIO_SECRET_KEY" >> $GITHUB_ENV
          echo "AZURITE_HOST_PORT=$AZURITE_HOST_PORT" >> $GITHUB_ENV
          echo "SFTP_HOST_PORT=$SFTP_HOST_PORT" >> $GITHUB_ENV
          echo "SFTP_USER=$SFTP_USER" >> $GITHUB_ENV
          echo "SFTP_PASS=$SFTP_PASS" >> $GITHUB_ENV

      - name: Start MinIO
        if: contains(fromJSON(needs.setup.outputs.minio-scopes), matrix.scope)
        run: |
          . scripts/ci_service_images.sh
          img="$MINIO_IMAGE"
          bash scripts/ci_docker_pull.sh "$img"
          docker run -d --name minio-mut -p ${MINIO_HOST_PORT}:9000 \
            -e MINIO_ROOT_USER=${MINIO_ACCESS_KEY} -e MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY} \
            "$img" server /data
          for i in $(seq 1 30); do
            wget -qO /dev/null http://127.0.0.1:${MINIO_HOST_PORT}/minio/health/live && break || sleep 1
          done
          wget -qO /dev/null http://127.0.0.1:${MINIO_HOST_PORT}/minio/health/live || { echo "::error::MinIO failed to start"; exit 1; }

      - name: Start Azurite
        if: contains(fromJSON(needs.setup.outputs.azurite-scopes), matrix.scope)
        run: |
          . scripts/ci_service_images.sh
          img="$AZURITE_IMAGE"
          bash scripts/ci_docker_pull.sh "$img"
          docker run -d --name azurite-mut -p ${AZURITE_HOST_PORT}:10000 \
            "$img" \
            azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --skipApiVersionCheck
          for i in $(seq 1 30); do
            nc -z 127.0.0.1 ${AZURITE_HOST_PORT} && break || sleep 1
          done
          nc -z 127.0.0.1 ${AZURITE_HOST_PORT} || { echo "::error::Azurite failed to start"; exit 1; }

      - name: Start SFTP
        if: contains(fromJSON(needs.setup.outputs.sftp-scopes), matrix.scope)
        run: |
          . scripts/ci_service_images.sh
          img="$SFTP_IMAGE"
          bash scripts/ci_docker_pull.sh "$img"
          docker run -d --name sftp-mut -p ${SFTP_HOST_PORT}:22 \
            "$img" \
            "${SFTP_USER}:${SFTP_PASS}:::upload"
          for i in $(seq 1 30); do
            nc -z 127.0.0.1 ${SFTP_HOST_PORT} && break || sleep 1
          done
          nc -z 127.0.0.1 ${SFTP_HOST_PORT} || { echo "::error::SFTP failed to start"; exit 1; }

      # --- Python + deps ---
      # Install the dev extra directly via uv (same pattern every other CI
      # workflow uses — see .github/workflows/ci.yml). Going through
      # ``hatch run`` here would re-derive the environment via hatch's
      # features key; hatch 1.16.5 + uv installer silently leaves features
      # out of the venv, so the matrix shard ran ``python -m pytest`` against
      # a venv that did not have pytest. The mutate-specific dep
      # (``pytest-gremlins``) lives in the ``[mutate]`` extra — the single
      # source of truth for the pin — installed alongside ``[dev]``.
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: false
      - run: uv pip install -e ".[dev,mutate]"

      # --- Gremlins cache (content-hash based, survives across runs) ---
      - name: Restore gremlins cache
        uses: actions/cache@v5
        with:
          path: .gremlins_cache
          key: gremlins-${{ matrix.scope }}-${{ hashFiles('src/**/*.py') }}
          restore-keys: |
            gremlins-${{ matrix.scope }}-

      # --- Run mutation testing ---
      # Invoke the manifest-driven scope runner directly. Report flags
      # are injected via PYTEST_ADDOPTS (pytest picks them up automatically).
      # `json` (written to coverage/gremlins/gremlins.json) feeds the
      # outcome record below: job.status alone cannot see survivors, because
      # pytest-gremlins exits 0 on them. A non-zero exit here is therefore
      # always a harness/impl failure — the leg stays red by design.
      - name: Run mutate ${{ matrix.scope }}
        env:
          PYTEST_ADDOPTS: "--no-cov -W ignore::UserWarning:pytest_gremlins.plugin --gremlin-report=html,json --gremlins-html-dir=mutation-report"
        run: python scripts/run_mutate.py ${{ matrix.scope }}

      # --- Upload HTML report ---
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report-${{ matrix.scope }}
          path: mutation-report/
          retention-days: 30

      # --- Per-scope job summary ---
      - name: Write job summary
        if: always()
        run: |
          echo "## Mutation Testing: \`${{ matrix.scope }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f mutation-report/index.html ]; then
            echo "HTML report uploaded as artifact **mutation-report-${{ matrix.scope }}**." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No HTML report generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      # --- Record scope outcome for the summary job ---
      # job.status + the gremlins JSON report, combined into one outcome
      # JSON per scope. A missing/corrupt report records counts: null, which
      # reconcile classifies as a harness failure — and when the leg was
      # otherwise green, record exits non-zero so the leg goes red too
      # (the issue must never fire on an apparently green run).
      #
      # ORDERING CONSTRAINT: these two steps must stay the job's final steps.
      # job.status is a snapshot taken when Record runs, not the job's final
      # conclusion; a failure-capable step after the upload would leave a red
      # leg whose recorded outcome says success, and the issue would not fire.
      - name: Record outcome
        if: always()
        env:
          SCOPE: ${{ matrix.scope }}
        run: |
          python scripts/mutation_report.py record "$SCOPE" \
            --job-status "${{ job.status }}" \
            --gremlins-json coverage/gremlins/gremlins.json \
            --out "outcome/$SCOPE.json"

      - name: Upload outcome
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-outcome-${{ matrix.scope }}
          path: outcome/
          retention-days: 1

  summary:
    name: Mutation Summary
    needs: [setup, mutate]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - name: Download all outcomes
        uses: actions/download-artifact@v8
        with:
          pattern: mutation-outcome-*
          path: outcomes
          merge-multiple: true

      # Classify every scope from its outcome JSON, write the per-scope
      # verdict table to the run summary, then reconcile the rolling issue:
      #  - any harness/impl failure -> create the rolling issue, or update it
      #    (the mutate leg is already red; the issue is the durable TODO). A
      #    full run rewrites the body; a partial (single-scope) dispatch only
      #    comments, so it cannot erase failures of scopes it did not run.
      #  - surviving mutants alone -> advisory; no issue.
      #  - all clear on a full run -> comment "healthy" and close the issue.
      #    A partial dispatch never closes it.
      # ALL_SCOPES empty means setup died before listing scopes — reconcile
      # treats that as a harness failure too (the no-pytest setup break
      # surfaced exactly that way).
      - name: Reconcile rolling mutation issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ALL_SCOPES: ${{ needs.setup.outputs.scopes }}
          FULL_RUN: ${{ github.event_name == 'schedule' || github.event.inputs.scope == 'all' || github.event.inputs.scope == '' }}
        run: |
          python scripts/mutation_report.py reconcile outcomes \
            --repo "$REPO" \
            --run-url "$RUN_URL" \
            --title "[mutation] Weekly mutation run health" \
            --scopes "$ALL_SCOPES" \
            --full-run "$FULL_RUN"
