name: Mutation Testing

on:
  schedule:
    - cron: "0 5 * * 6"  # Every Saturday at 05:00 UTC
  workflow_dispatch:
    inputs:
      scope:
        description: "Mutation scope name (or 'all'). See scripts/mutate_scopes.py for the list."
        required: false
        default: "all"
        type: string

env:
  UV_SYSTEM_PYTHON: 1
  UV_LINK_MODE: copy
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # Read scope names + container needs from scripts/mutate_scopes.py so the
  # workflow stays generic. schedule = all; manual dispatch = filtered.
  setup:
    runs-on: ubuntu-latest
    outputs:
      scopes: ${{ steps.set-scopes.outputs.scopes }}
      minio-scopes: ${{ steps.set-scopes.outputs.minio-scopes }}
      azurite-scopes: ${{ steps.set-scopes.outputs.azurite-scopes }}
      sftp-scopes: ${{ steps.set-scopes.outputs.sftp-scopes }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - id: set-scopes
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.scope }}" = "all" ]; then
            scopes=$(python scripts/run_mutate.py --list-scopes)
          else
            scopes='["${{ github.event.inputs.scope }}"]'
          fi
          {
            echo "scopes=${scopes}"
            echo "minio-scopes=$(python scripts/run_mutate.py --container-needs minio)"
            echo "azurite-scopes=$(python scripts/run_mutate.py --container-needs azurite)"
            echo "sftp-scopes=$(python scripts/run_mutate.py --container-needs sftp)"
          } >> "$GITHUB_OUTPUT"

  mutate:
    needs: [setup]
    name: mutate-${{ matrix.scope }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scope: ${{ fromJSON(needs.setup.outputs.scopes) }}
    steps:
      - uses: actions/checkout@v6

      # --- Backend service containers ---
      # Conditionally started based on the JSON arrays computed by setup
      # from scripts/mutate_scopes.py (one source of truth for which scopes
      # need which container).
      - name: Start MinIO
        if: contains(fromJSON(needs.setup.outputs.minio-scopes), matrix.scope)
        run: |
          docker run -d --name minio-mut -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            cgr.dev/chainguard/minio:latest-dev@sha256:2d8f8a3f8da60885794dfd0749c9d49c985b0ee642f1c522e6aa93be59f34a84 server /data
          for i in $(seq 1 30); do
            wget -qO /dev/null http://127.0.0.1:9000/minio/health/live && break || sleep 1
          done
          wget -qO /dev/null http://127.0.0.1:9000/minio/health/live || { echo "::error::MinIO failed to start"; exit 1; }

      - name: Start Azurite
        if: contains(fromJSON(needs.setup.outputs.azurite-scopes), matrix.scope)
        run: |
          docker run -d --name azurite-mut -p 10000:10000 \
            mcr.microsoft.com/azure-storage/azurite:3.35.0 \
            azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --skipApiVersionCheck
          for i in $(seq 1 30); do
            nc -z 127.0.0.1 10000 && break || sleep 1
          done
          nc -z 127.0.0.1 10000 || { echo "::error::Azurite failed to start"; exit 1; }

      - name: Start SFTP
        if: contains(fromJSON(needs.setup.outputs.sftp-scopes), matrix.scope)
        run: |
          docker run -d --name sftp-mut -p 2222:22 \
            atmoz/sftp:alpine \
            benchuser:benchpass:::upload
          for i in $(seq 1 30); do
            nc -z 127.0.0.1 2222 && break || sleep 1
          done
          nc -z 127.0.0.1 2222 || { echo "::error::SFTP failed to start"; exit 1; }

      # --- Python + deps ---
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: false
      - run: uv pip install hatch

      # --- Gremlins cache (content-hash based, survives across runs) ---
      - name: Restore gremlins cache
        uses: actions/cache@v5
        with:
          path: .gremlins_cache
          key: gremlins-${{ matrix.scope }}-${{ hashFiles('src/**/*.py') }}
          restore-keys: |
            gremlins-${{ matrix.scope }}-

      # --- Run mutation testing ---
      # Hatch shim delegates to scripts/run_mutate.py which builds the
      # pytest command from the manifest. Report flags are injected via
      # PYTEST_ADDOPTS (pytest picks them up automatically).
      - name: Run mutate ${{ matrix.scope }}
        env:
          PYTEST_ADDOPTS: "--no-cov -W ignore::UserWarning:pytest_gremlins.plugin --gremlin-report=html --gremlins-html-dir=mutation-report"
        run: hatch run mutate ${{ matrix.scope }}

      # --- Upload HTML report ---
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report-${{ matrix.scope }}
          path: mutation-report/
          retention-days: 30

      # --- Record scope outcome for summary job ---
      - name: Record outcome
        if: always()
        run: |
          mkdir -p outcome
          echo "${{ job.status }}" > outcome/${{ matrix.scope }}

      - name: Upload outcome
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-outcome-${{ matrix.scope }}
          path: outcome/
          retention-days: 1

      # --- Per-scope job summary ---
      - name: Write job summary
        if: always()
        run: |
          echo "## Mutation Testing: \`${{ matrix.scope }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f mutation-report/index.html ]; then
            echo "HTML report uploaded as artifact **mutation-report-${{ matrix.scope }}**." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No HTML report generated." >> "$GITHUB_STEP_SUMMARY"
          fi

  summary:
    name: Mutation Summary
    needs: [setup, mutate]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download all outcomes
        uses: actions/download-artifact@v8
        with:
          pattern: mutation-outcome-*
          path: outcomes
          merge-multiple: true

      - name: Aggregate results
        env:
          ALL_SCOPES: ${{ needs.setup.outputs.scopes }}
        run: |
          echo "## Mutation Testing Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Scope | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|--------|" >> "$GITHUB_STEP_SUMMARY"
          for scope in $(echo "$ALL_SCOPES" | python -c "import json,sys; print(' '.join(json.load(sys.stdin)))"); do
            if [ -f "outcomes/${scope}" ]; then
              result=$(cat "outcomes/${scope}")
            else
              result="skipped"
            fi
            echo "| ${scope} | ${result} |" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Download individual HTML reports from the **Artifacts** section above." >> "$GITHUB_STEP_SUMMARY"
