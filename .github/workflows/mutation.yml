name: Mutation Testing

on:
  schedule:
    - cron: "0 5 * * 6"  # Every Saturday at 05:00 UTC
  workflow_dispatch:
    inputs:
      scope:
        description: "Mutation scope to run (blank = all)"
        required: false
        type: choice
        options:
          - ""
          - core-api
          - core-infra
          - ext-proxy
          - ext-format
          - backends-local
          - backends-cloud

env:
  UV_SYSTEM_PYTHON: 1
  UV_LINK_MODE: copy

jobs:
  # Compute which scopes to run. schedule = all; manual dispatch = filtered.
  setup:
    runs-on: ubuntu-latest
    outputs:
      scopes: ${{ steps.set-scopes.outputs.scopes }}
    steps:
      - id: set-scopes
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.scope }}" = "" ]; then
            echo 'scopes=["core-api","core-infra","ext-proxy","ext-format","backends-local","backends-cloud"]' >> "$GITHUB_OUTPUT"
          else
            echo 'scopes=["${{ github.event.inputs.scope }}"]' >> "$GITHUB_OUTPUT"
          fi

  mutate:
    needs: [setup]
    name: mutate-${{ matrix.scope }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scope: ${{ fromJSON(needs.setup.outputs.scopes) }}
        include:
          - scope: core-api
            targets: "src/remote_store/_store.py,src/remote_store/_proxy.py,src/remote_store/_stream.py,src/remote_store/_glob.py,src/remote_store/_backend.py,src/remote_store/_types.py"
            tests: "tests/test_store.py tests/test_store_child.py tests/test_proxy.py tests/test_depth_listing.py tests/test_folder_info_depth.py tests/test_open_atomic.py tests/test_ping.py tests/test_stream.py tests/test_glob.py"
          - scope: core-infra
            targets: "src/remote_store/_capabilities.py,src/remote_store/_errors.py,src/remote_store/_config.py,src/remote_store/_models.py,src/remote_store/_path.py,src/remote_store/_resolution.py,src/remote_store/_registry.py,src/remote_store/backends/_memory.py,src/remote_store/backends/_fileinfo.py"
            tests: "tests/test_capabilities.py tests/test_errors.py tests/test_config.py tests/test_models.py tests/test_path.py tests/test_resolution.py tests/test_registry.py tests/test_memory_coverage.py"
          - scope: ext-proxy
            targets: "src/remote_store/ext/arrow.py,src/remote_store/ext/batch.py,src/remote_store/ext/cache.py,src/remote_store/ext/glob.py,src/remote_store/ext/integrity.py,src/remote_store/ext/observe.py,src/remote_store/ext/otel.py,src/remote_store/ext/partition.py,src/remote_store/ext/streams.py,src/remote_store/ext/transfer.py"
            tests: "tests/test_arrow.py tests/test_batch.py tests/test_cache.py tests/test_observe.py tests/test_otel.py tests/test_partition.py tests/test_integrity.py tests/test_transfer.py tests/test_streams.py tests/test_glob.py"
          - scope: ext-format
            targets: "src/remote_store/ext/parquet.py,src/remote_store/ext/yaml.py,src/remote_store/ext/pydantic.py,src/remote_store/ext/dagster.py"
            tests: "tests/test_ext_parquet.py tests/test_ext_yaml.py tests/test_ext_pydantic.py tests/test_dagster.py"
          - scope: backends-local
            targets: "src/remote_store/backends/_local.py,src/remote_store/backends/_http.py,src/remote_store/backends/_http_httpx.py,src/remote_store/backends/_http_requests.py,src/remote_store/backends/_sqlalchemy.py"
            tests: "tests/backends/test_local.py tests/backends/test_http.py tests/test_backend_sqlblob.py tests/test_backend_sqlquery.py"
          - scope: backends-cloud
            targets: "src/remote_store/backends/_s3.py,src/remote_store/backends/_s3_base.py,src/remote_store/backends/_s3_pyarrow.py,src/remote_store/backends/_sftp.py,src/remote_store/backends/_azure.py"
            tests: "tests/backends/test_s3.py tests/backends/test_s3_pyarrow.py tests/backends/test_sftp.py tests/backends/test_azure.py"
    steps:
      - uses: actions/checkout@v6

      # --- Cloud-backend services (only for backends-cloud) ---
      - name: Start MinIO
        if: matrix.scope == 'backends-cloud'
        run: |
          docker run -d --name minio-mut -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            cgr.dev/chainguard/minio:latest-dev server /data
          for i in $(seq 1 30); do
            wget -qO /dev/null http://127.0.0.1:9000/minio/health/live && break || sleep 1
          done
          wget -qO /dev/null http://127.0.0.1:9000/minio/health/live || { echo "::error::MinIO failed to start"; exit 1; }

      - name: Start Azurite
        if: matrix.scope == 'backends-cloud'
        run: |
          docker run -d --name azurite-mut -p 10000:10000 \
            mcr.microsoft.com/azure-storage/azurite:3.35.0 \
            azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --skipApiVersionCheck
          for i in $(seq 1 30); do
            nc -z 127.0.0.1 10000 && break || sleep 1
          done
          nc -z 127.0.0.1 10000 || { echo "::error::Azurite failed to start"; exit 1; }

      - name: Start SFTP
        if: matrix.scope == 'backends-cloud'
        run: |
          docker run -d --name sftp-mut -p 2222:22 \
            atmoz/sftp:alpine \
            benchuser:benchpass:::upload
          for i in $(seq 1 30); do
            nc -z 127.0.0.1 2222 && break || sleep 1
          done
          nc -z 127.0.0.1 2222 || { echo "::error::SFTP failed to start"; exit 1; }

      # --- Python + deps ---
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: false
      - run: uv pip install -e ".[dev]"

      # --- Gremlins cache (content-hash based, survives across runs) ---
      - name: Restore gremlins cache
        uses: actions/cache@v4
        with:
          path: .gremlins_cache
          key: gremlins-${{ matrix.scope }}-${{ hashFiles('src/**/*.py') }}
          restore-keys: |
            gremlins-${{ matrix.scope }}-

      # --- Run mutation testing ---
      - name: Run mutate-${{ matrix.scope }}
        run: >-
          pytest --gremlins
          --gremlin-targets=${{ matrix.targets }}
          --gremlin-report=html
          --gremlins-html-dir=mutation-report
          ${{ matrix.tests }}

      # --- Upload HTML report ---
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report-${{ matrix.scope }}
          path: mutation-report/
          retention-days: 30

      # --- Record scope outcome for summary job ---
      - name: Record outcome
        if: always()
        run: |
          mkdir -p outcome
          echo "${{ job.status }}" > outcome/${{ matrix.scope }}

      - name: Upload outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-outcome-${{ matrix.scope }}
          path: outcome/
          retention-days: 1

      # --- Per-scope job summary ---
      - name: Write job summary
        if: always()
        run: |
          echo "## Mutation Testing: \`${{ matrix.scope }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f mutation-report/index.html ]; then
            echo "HTML report uploaded as artifact **mutation-report-${{ matrix.scope }}**." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No HTML report generated." >> "$GITHUB_STEP_SUMMARY"
          fi

  summary:
    name: Mutation Summary
    needs: [setup, mutate]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download all outcomes
        uses: actions/download-artifact@v4
        with:
          pattern: mutation-outcome-*
          path: outcomes
          merge-multiple: true

      - name: Aggregate results
        run: |
          echo "## Mutation Testing Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Scope | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|--------|" >> "$GITHUB_STEP_SUMMARY"
          for scope in core-api core-infra ext-proxy ext-format backends-local backends-cloud; do
            if [ -f "outcomes/${scope}" ]; then
              result=$(cat "outcomes/${scope}")
            else
              result="skipped"
            fi
            echo "| ${scope} | ${result} |" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Download individual HTML reports from the **Artifacts** section above." >> "$GITHUB_STEP_SUMMARY"
