name: Conda Recipe

on:
  push:
    branches: [master]
    paths: ['packaging/conda-forge/**']
  pull_request:
    branches: [master]
    paths: ['packaging/conda-forge/**']

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/rattler-build-action@v0.2.39
        with:
          recipe-path: packaging/conda-forge/recipe.yaml
          # `--variant-config` supplies `python_min`, which conda-forge provides
          # globally and the recipe therefore does not define. Without it this
          # render fails on an undefined variable; see variants.yaml.
          build-args: --render-only --variant-config packaging/conda-forge/variants.yaml
          upload-artifact: false
