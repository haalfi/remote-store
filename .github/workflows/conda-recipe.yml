name: Conda Recipe

on:
  push:
    branches: [master]
    paths: ['packaging/conda-forge/**']
  pull_request:
    branches: [master]
    paths: ['packaging/conda-forge/**']

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-rattler-build@v0.2
      - name: Validate recipe
        run: rattler-build build --recipe packaging/conda-forge/recipe.yaml --render-only
