name: CodeQL

# NOTE: To enforce CodeQL as a merge gate, add "CodeQL / Analyze (Python)"
# as a required status check in GitHub → Settings → Branches → branch
# protection rules for master. This cannot be configured in YAML.
#
# The pull_request trigger intentionally has NO paths filter so the
# "Analyze (Python)" status check is always posted — otherwise GitHub
# branch protection treats a skipped workflow as "pending" and blocks merge.

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'pyproject.toml'
      - '.github/workflows/codeql.yml'
      - '.github/codeql/**'
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 6 * * 1"  # Every Monday at 06:00 UTC — full sweep regardless of paths

jobs:
  analyze:
    name: Analyze (Python)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          config-file: .github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          upload: never
          output: sarif-results

      # The kernel's Protocol classes use `...` as method bodies, which
      # py/ineffectual-statement flags on every method. CodeQL config can only
      # exclude a rule everywhere or ignore a path for all rules, so drop that
      # one rule's results for those files here, before upload.
      - name: Drop placeholder-body results in kernel protocols
        shell: python
        run: |
          import fnmatch, json, pathlib
          rule = "py/ineffectual-statement"
          globs = ["src/remote_store/_kernel/*/driver.py", "src/remote_store/_kernel/*/_io.py"]
          path = pathlib.Path("sarif-results/python.sarif")
          sarif = json.loads(path.read_text(encoding="utf-8"))
          def keep(r):
              if r.get("ruleId", r.get("rule", {}).get("id")) != rule:
                  return True
              uri = r["locations"][0]["physicalLocation"]["artifactLocation"]["uri"]
              return not any(fnmatch.fnmatch(uri, g) for g in globs)
          for run in sarif["runs"]:
              before = len(run["results"])
              run["results"] = [r for r in run["results"] if keep(r)]
              print(f"dropped {before - len(run['results'])} {rule} results")
          path.write_text(json.dumps(sarif), encoding="utf-8")

      - name: Upload CodeQL results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: sarif-results/python.sarif
          # The category earlier analyses were stored under, so alerts keep
          # their history instead of reopening as new ones.
          category: .github/workflows/codeql.yml:analyze

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    # Only meaningful on PRs — compares dependency changes against known CVEs
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v7

      - name: Dependency Review
        uses: actions/dependency-review-action@v5
