name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  UV_SYSTEM_PYTHON: 1
  UV_LINK_MODE: copy

# A superseded PR-branch push (force-push or quick follow-up) must not keep
# occupying slots against the account's 20-job cap (ADR-0032) — the redesign's
# ~24-job fan-out makes that contention material. Cancel only for pull_request:
# a cancelled master push would lose coverage-gate's Codecov badge upload.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  setup:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docs: ${{ steps.filter.outputs.docs }}
      formal: ${{ steps.filter.outputs.formal }}
      tla: ${{ steps.filter.outputs.tla }}
      primary: ${{ steps.versions.outputs.primary }}
      test-matrix: ${{ steps.versions.outputs.test-matrix }}
      typecheck-matrix: ${{ steps.versions.outputs.typecheck-matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect changed files
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FILES=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}")
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ] || [ -z "${{ github.event.before }}" ]; then
            FILES=$(git ls-files)
          else
            FILES=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")
          fi
          # .python-version is the source this job reads for the primary
          # Python (below), so a lone bump must re-run the gating jobs that
          # exercise that interpreter — otherwise code=false skips them and
          # gate goes green without ever testing the new version.
          # .test_durations_pass1 drives pytest-split shard balancing and is
          # json.load-ed by every shard at collection; a lone refresh of it (or a
          # truncated write) must re-run the gate, else code=false skips every
          # shard and gate goes green having validated nothing (BK-319 review).
          CODE_PAT='^(src|tests|examples|scripts)/|^pyproject\.toml$|^\.python-version$|^\.test_durations_pass1$|^docs-src/reference/FEATURES\.md$|^docs-src/_data/graph/|^\.github/workflows/|^\.github/actions/'
          DOCS_PAT='^(docs-src|src)/|^mkdocs\.yml$|^README\.md$|^CHANGELOG\.md$|^sdd/|^scripts/(docs/|check_docs_framework\.py$)|^\.github/workflows/ci\.yml$'
          if echo "$FILES" | grep -qE "$CODE_PAT"; then echo "code=true" >> "$GITHUB_OUTPUT"
          else echo "code=false" >> "$GITHUB_OUTPUT"; fi
          if echo "$FILES" | grep -qE "$DOCS_PAT"; then echo "docs=true" >> "$GITHUB_OUTPUT"
          else echo "docs=false" >> "$GITHUB_OUTPUT"; fi
          # FORMAL_PAT gates the Dafny job. Exclude the TLA subtree so
          # TLA-only changes do not trigger Dafny — verify-formal and
          # verify-tla are independent filters.
          FORMAL_PAT='^sdd/(formal|specs)/|^\.github/workflows/ci\.yml$'
          if echo "$FILES" | grep -v '^sdd/formal/tla/' | grep -qE "$FORMAL_PAT"; then echo "formal=true" >> "$GITHUB_OUTPUT"
          else echo "formal=false" >> "$GITHUB_OUTPUT"; fi
          TLA_PAT='^sdd/formal/tla/|^scripts/tlc(_check\.sh|\.Dockerfile)$|^\.github/workflows/ci\.yml$'
          if echo "$FILES" | grep -qE "$TLA_PAT"; then echo "tla=true" >> "$GITHUB_OUTPUT"
          else echo "tla=false" >> "$GITHUB_OUTPUT"; fi
      - name: Resolve Python versions
        id: versions
        env:
          ALL_PYTHONS: '["3.10", "3.11", "3.12", "3.13", "3.14"]'
          MIN_PYTHON: "3.10"
        run: |
          # Primary Python: single-sourced in .python-version (local uv/pyenv
          # read it too). ALL_PYTHONS / MIN_PYTHON below bound the matrix.
          PRIMARY_PYTHON="$(cat .python-version)"
          # Must be one of ALL_PYTHONS, else `test-matrix = ALL - primary`
          # keeps it and the primary jobs run an unlisted slot.
          if ! jq -e --argjson a "$ALL_PYTHONS" --arg p "$PRIMARY_PYTHON" -n '$a | index($p) != null' > /dev/null; then
            echo "::error::.python-version ($PRIMARY_PYTHON) is not in ALL_PYTHONS ($ALL_PYTHONS)"
            exit 1
          fi
          echo "primary=$PRIMARY_PYTHON" >> "$GITHUB_OUTPUT"
          echo "test-matrix=$(jq -cn --argjson a "$ALL_PYTHONS" --arg p "$PRIMARY_PYTHON" '$a - [$p]')" >> "$GITHUB_OUTPUT"
          echo "typecheck-matrix=$(jq -cn --arg m "$MIN_PYTHON" --arg p "$PRIMARY_PYTHON" '[$m, $p]')" >> "$GITHUB_OUTPUT"

  lint:
    needs: [setup]
    if: needs.setup.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ needs.setup.outputs.primary }}
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: false
      # actionlint: static lint for GitHub Actions workflows. Catches
      # template-injection vectors, undefined env / matrix references,
      # outdated runner labels, and expression-syntax errors. Pinned
      # binary download (no third-party action wrapper).
      #
      # `-shellcheck=` disables actionlint's shellcheck integration:
      # ubuntu-latest runners ship shellcheck preinstalled, which would
      # otherwise surface style nits (SC2086, SC2129, ...) across the
      # pre-existing workflows that were not authored against shellcheck.
      # Re-enabling it is deferred — turn back on once the pre-existing
      # workflows pass shellcheck, or move to a per-file ignore list via
      # .github/actionlint.yaml so new workflows benefit immediately.
      - name: Install actionlint
        run: |
          # Pin both the binary version (1.7.7) AND the downloader script
          # to the matching tag — pulling the bootstrap from `main` would
          # execute whatever the latest commit there contains in the lint
          # job, defeating the purpose of pinning the binary.
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7 "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: actionlint -color -shellcheck=
      # Single source of truth for "lint": delegate to the hatch script lists
      # (preflight + lint + format-check in pyproject.toml) rather than
      # re-listing every command here, so adding a checker to a hatch target
      # propagates to CI automatically. `uvx` (= uv tool run) provides the hatch
      # CLI ephemerally; hatch builds the default env once on the first call and
      # reuses it across the three steps. BK-269 / audit-017 H1.
      - run: uvx hatch run preflight
      - run: uvx hatch run lint
      - run: uvx hatch run format-check

  typecheck:
    needs: [setup]
    if: needs.setup.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ${{ fromJSON(needs.setup.outputs.typecheck-matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: false
      - run: uv pip install -e ".[dev]"
      - run: mypy src/ examples/

  # BK-279: prime a shared service-image cache once per run. On a cache miss
  # (image refs in scripts/ci_service_images.sh changed, or the cache was
  # evicted) the block-prone images (Azurite/mcr.microsoft.com, SFTP/Docker Hub —
  # RS_CACHED_IMAGES) are pulled with backoff and `docker save`d to a tar that
  # actions/cache persists; on a hit nothing is pulled. Downstream backend jobs
  # `needs: prepare-images`, restore the same tar, and `docker load` it before
  # start-backends — so those two registries see ZERO upstream pulls and are
  # immune to the blocks that BK-278's per-job retry only partly absorbed. MinIO
  # is excluded (digest refs do not survive docker save/load; cgr.dev is reliable)
  # and start-backends still pulls it. The cache key hashes ci_service_images.sh,
  # the single source of the refs, so a ref bump busts the cache and re-primes it.
  prepare-images:
    needs: [setup]
    if: needs.setup.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Restore service-image cache
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: ci-images
          key: ci-images-v1-${{ hashFiles('scripts/ci_service_images.sh') }}
      - name: Pull and bundle service images
        id: bundle
        if: steps.cache.outputs.cache-hit != 'true'
        run: bash scripts/ci_save_images.sh ci-images
      # Save only when all three images bundled (bundle.complete == 'true'), so a
      # partial/empty tar from a registry block is never persisted under the key.
      - name: Save service-image cache
        if: steps.cache.outputs.cache-hit != 'true' && steps.bundle.outputs.complete == 'true'
        uses: actions/cache/save@v6
        with:
          path: ci-images
          key: ci-images-v1-${{ hashFiles('scripts/ci_service_images.sh') }}

  # BK-319 CI-time optimization. The old suite ran the FULL two-pass live-backend
  # suite on every interpreter (~8-9 min: the slowest leg ran pass-1 `-n auto`
  # ~326s then serial sftp_docker ~100s in sequence, x5 interpreters in parallel).
  # Measured findings that shaped this design:
  #   * Oversubscribing xdist (`-n 8/12`) did NOT help — the suite is CPU-bound.
  #   * Sharding the LIVE-backend suite is inefficient: each shard re-pays the
  #     per-test live-backend fixture setup (bucket create, container handshakes),
  #     so 2-way sharding the 3.10 leg summed to ~460s wall, worse than 326s.
  #   * The account is capped at 20 concurrent jobs, so fanning out more shards
  #     just forces a second scheduling wave.
  # So the per-PR gate no longer runs the live-backend suite on every interpreter.
  # Instead it splits work by TIER (see sdd stage model, tests/conftest.py):
  #   * `test` — the four non-primary interpreters run the repo-only STAGE 1
  #     suite (memory/local/moto/azure-replay/sftp-inproc): no Docker, sharded x2,
  #     exercising every Store/adapter code path so interpreter-specific breakage
  #     still blocks the PR.
  #   * `test-primary` / `test-primary-sftp` / `coverage-gate` — the primary
  #     interpreter runs the FULL live-Docker-backend Stage-2 suite (pass-1
  #     shard-split by pytest-split + serial sftp_docker) and asserts the 95%
  #     coverage floor over the combined partials.
  # The full live-backend suite on ALL interpreters still runs — moved to the
  # scheduled/on-master `ci-full.yml` backstop so it no longer gates each PR.
  # Refresh .test_durations_pass1 when shard balance drifts — the flow (when to
  # refresh, the command, the CODE_PAT gating) lives in
  # sdd/CI-OPERATIONS.md § `ci-full.yml` (Durations-refresh duty).
  test:
    needs: [setup]
    if: needs.setup.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      # BK-279: one leg's failure must not cancel its siblings — report each
      # interpreter/shard independently.
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.setup.outputs.test-matrix) }}
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          cache-suffix: ci-test-stage1-${{ matrix.python-version }}-${{ matrix.shard }}  # BK-230
      - run: uv pip install -e ".[dev]"
      # Stage 1 = repo-only tier (no Docker): the sftp_docker / live-s3 / live-azure
      # Stage-2 fixtures are excluded, so this needs no service containers and no
      # prepare-images. Split 2 ways with least_duration bin-packing over the
      # setup-inclusive .test_durations_pass1. The two ~45s TestCommittedCassettePIISweep
      # tests are interpreter-independent repo-hygiene scans — deselected here and
      # run once in the test-cassette-pii job so they don't dominate every shard.
      # tests/scripts/ runs once in tooling-tests; full live matrix in ci-full.yml.
      - run: >-
          pytest --stage=1 --splits 2 --group ${{ matrix.shard }}
          --splitting-algorithm least_duration --durations-path .test_durations_pass1
          --deselect tests/backends/fixtures/test_cassettes.py::TestCommittedCassettePIISweep
          -n auto -p no:benchmark --ignore=tests/scripts

  # Primary Python pass-1 shards WITH coverage. Each shard emits its partial
  # `.coverage` (parallel=true → unique data files); coverage-gate combines them
  # with the primary sftp partial and asserts the 95% floor.
  test-primary:
    needs: [setup, prepare-images]
    if: needs.setup.outputs.code == 'true'
    runs-on: ubuntu-latest
    # Fail-closed parity with ci-full.yml's test-full: this is the sole per-PR
    # carrier of the live-backend guarantee. RS_REQUIRE_MINIO=1 exits if MinIO is
    # unreachable, and the explicit --stage=2 below removes the docker-probe
    # auto-detect that could otherwise drop a loaded runner to Stage 1 and pass
    # green having skipped every live test (the 95% floor's moto overlap does not
    # reliably catch a MinIO-only skip).
    env:
      RS_REQUIRE_MINIO: "1"
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - name: Restore service-image cache
        uses: actions/cache/restore@v6
        with:
          path: ci-images
          key: ci-images-v1-${{ hashFiles('scripts/ci_service_images.sh') }}
      - run: bash scripts/ci_load_images.sh ci-images
      - uses: ./.github/actions/start-backends
        with:
          minio: 'true'
          azurite: 'true'
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ needs.setup.outputs.primary }}
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          cache-suffix: ci-test-primary-${{ matrix.shard }}  # BK-230
      - run: uv pip install -e ".[dev]"
      # The full live-backend Stage-2 pass-1, split 2 ways (least_duration over the
      # setup-inclusive durations). TestCommittedCassettePIISweep is deselected and
      # run once in test-cassette-pii (with coverage) so it doesn't tail a shard.
      - run: >-
          pytest --stage=2 --splits 2 --group ${{ matrix.shard }}
          --splitting-algorithm least_duration --durations-path .test_durations_pass1
          --deselect tests/backends/fixtures/test_cassettes.py::TestCommittedCassettePIISweep
          -n auto --cov=remote_store --cov-report= -p no:benchmark --ignore=tests/scripts
      # Normalise to a unique, non-dotfile name (upload-artifact skips dotfiles)
      # for coverage-gate. pytest-cov session-combines xdist workers into a
      # single `.coverage`; the `combine || true` is belt-and-braces in case any
      # parallel `.coverage.*` partials remain.
      - run: |
          coverage combine 2>/dev/null || true
          mv .coverage coverage.primary-${{ matrix.shard }}
      - uses: actions/upload-artifact@v7
        with:
          name: cov-primary-${{ matrix.shard }}
          include-hidden-files: true
          # Artifacts are immutable per run; overwrite lets a job re-run
          # (re-upload) succeed instead of 409-ing on the existing name.
          overwrite: true
          path: coverage.primary-${{ matrix.shard }}

  test-primary-sftp:
    needs: [setup, prepare-images]
    if: needs.setup.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Restore service-image cache
        uses: actions/cache/restore@v6
        with:
          path: ci-images
          key: ci-images-v1-${{ hashFiles('scripts/ci_service_images.sh') }}
      - run: bash scripts/ci_load_images.sh ci-images
      - uses: ./.github/actions/start-backends
        with:
          sftp: 'true'
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ needs.setup.outputs.primary }}
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          cache-suffix: ci-test-primary-sftp
      - run: uv pip install -e ".[dev]"
      - run: pytest -p no:benchmark --cov=remote_store --cov-report= --ignore=tests/scripts -k sftp_docker tests/backends/conformance/
      - run: |
          coverage combine 2>/dev/null || true
          mv .coverage coverage.primary-sftp
      - uses: actions/upload-artifact@v7
        with:
          name: cov-primary-sftp
          include-hidden-files: true
          overwrite: true
          path: coverage.primary-sftp

  # The two ~45s TestCommittedCassettePIISweep tests are interpreter-independent
  # repo-hygiene scans (do committed cassettes leak PII) deselected from every
  # test/test-primary shard so they don't dominate. Run once here on the primary,
  # WITH coverage, so the 95% floor over the combined partials is unchanged. Stage
  # 1 (repo-only): no Docker, no service containers.
  test-cassette-pii:
    needs: [setup]
    if: needs.setup.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ needs.setup.outputs.primary }}
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          cache-suffix: ci-test-cassette-pii
      - run: uv pip install -e ".[dev]"
      - run: pytest --stage=1 -p no:benchmark --cov=remote_store --cov-report= tests/backends/fixtures/test_cassettes.py::TestCommittedCassettePIISweep
      - run: |
          coverage combine 2>/dev/null || true
          mv .coverage coverage.primary-pii
      - uses: actions/upload-artifact@v7
        with:
          name: cov-primary-pii
          include-hidden-files: true
          overwrite: true
          path: coverage.primary-pii

  # The coverage gate: combine every primary-Python partial (pass-1 shards +
  # sftp_docker conformance) and assert the 95% floor over the full union —
  # identical coverage to the old single-job two-pass run, just gathered from
  # parallel shards. Also emits coverage.xml and feeds the Codecov badge.
  coverage-gate:
    needs: [setup, test-primary, test-primary-sftp, test-cassette-pii]
    if: needs.setup.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ needs.setup.outputs.primary }}
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: false
      - run: uv pip install coverage
      - uses: actions/download-artifact@v8
        with:
          pattern: cov-primary-*
          path: cov-parts
          merge-multiple: true
      # coverage combine consumes .coverage.* data files; relative_files=true
      # (pyproject) makes the src paths line up across the shard runners.
      - name: Combine partials
        run: |
          i=0
          for f in cov-parts/coverage.primary-*; do
            cp "$f" ".coverage.$i"
            i=$((i + 1))
          done
          coverage combine
          coverage report --show-missing --fail-under=95
          coverage xml
      - name: Upload coverage to Codecov
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml

  # tests/scripts/ exercises scripts/, not remote_store: pure-Python, no
  # backends, no coverage. Runs once on the primary Python in its own job,
  # off test-primary's critical path.
  tooling-tests:
    needs: [setup]
    if: needs.setup.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ needs.setup.outputs.primary }}
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: false
      # The [mutate] extra carries pytest-gremlins (not in [dev]). Install it so
      # tests/scripts/test_run_mutate.py's TestScopeCandidateDiscovery actually
      # runs (it importorskips the plugin): those tests are the only automated
      # gate that _scope_has_no_mutation_candidates still imports the right
      # pytest-gremlins internals and agrees with the plugin's own gremlin count
      # (BUG-215). Without the plugin they silently skip.
      - run: uv pip install -e ".[dev,mutate]"
      - run: pytest tests/scripts/ -q

  # BK-172 / BUG-232: verify that S3-PyArrow tests run (not skip) against MinIO
  # when pyarrow ≥ 24 is installed, and that the shared arrow/parquet/sqlalchemy
  # paths pass, on every pyarrow major the extras now allow an unbounded `>=` to
  # resolve. The main `test` matrix installs `[dev]` and lets pip pick pyarrow;
  # each leg here pins one major explicitly so a regression on a specific release
  # fails loudly. BUG-232 added the pyarrow-25 leg: before the `<25` cap was
  # lifted, `[dev]` (which lists `sql-query`) held CI at 24, so no job exercised
  # 25 — the standalone-extra install path users actually hit.
  pyarrow-major-check:
    # No prepare-images dep: this job starts only MinIO, which is excluded from
    # RS_CACHED_IMAGES (digest-pinned, doesn't round-trip docker save/load). The
    # cache holds only Azurite+SFTP, which this job never starts — so restoring it
    # would be pure overhead. start-backends pulls MinIO directly (cgr.dev reliable).
    needs: [setup]
    if: needs.setup.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pyarrow: ['>=24,<25', '>=25,<26']
    env:
      RS_REQUIRE_MINIO: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/start-backends
        with:
          minio: 'true'
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ needs.setup.outputs.primary }}
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: false
      - run: uv pip install -e ".[dev]"
      - name: Force pyarrow ${{ matrix.pyarrow }}
        run: uv pip install "pyarrow${{ matrix.pyarrow }}"
      - name: Assert pyarrow_ge_24() detects pyarrow ≥ 24
        run: python -c "from tests._helpers import pyarrow_ge_24; assert pyarrow_ge_24(), 'pyarrow_ge_24() returned False -- helper regressed'"
      - name: Verify S3-PyArrow routes to MinIO
        run: pytest tests/backends/s3/test_pyarrow.py -v
      - name: Verify pyarrow paths in ext.arrow, ext.parquet, sqlalchemy
        run: pytest tests/ext/test_arrow.py tests/ext/test_parquet.py tests/backends/sqlquery/test_config.py tests/backends/sqlblob/test_config.py -q

  test-cross-platform:
    needs: [setup]
    if: needs.setup.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ needs.setup.outputs.primary }}
      - uses: astral-sh/setup-uv@v9.0.0
      - run: uv pip install -e ".[dev]"
      - name: Run OS-sensitive tests
        run: pytest -m "os_sensitive" --ignore=tests/e2e

  notebooks:
    needs: [setup]
    if: needs.setup.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ needs.setup.outputs.primary }}
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: false
      - run: uv pip install -e ".[dev]"
      - run: python tests/scripts/run_notebooks.py

  examples:
    needs: [setup]
    if: needs.setup.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ needs.setup.outputs.primary }}
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: false
      - run: uv pip install -e ".[dev,arrow]"
      - run: python tests/scripts/run_examples.py
      # PyArrow's C++ atexit handlers can deadlock on Linux during interpreter
      # shutdown. The script completes but process exit hangs. Use timeout with
      # SIGKILL fallback; accept exit 124 (timeout) as success.
      - name: Run python examples/integrations/pyarrow_adapter.py
        run: |
          rc=0
          timeout --kill-after=5 30 python examples/integrations/pyarrow_adapter.py || rc=$?
          if [ $rc -ne 0 ] && [ $rc -ne 124 ]; then exit $rc; fi

  e2e:
    needs: [setup, prepare-images]
    if: needs.setup.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Restore service-image cache
        uses: actions/cache/restore@v6
        with:
          path: ci-images
          key: ci-images-v1-${{ hashFiles('scripts/ci_service_images.sh') }}
      - run: bash scripts/ci_load_images.sh ci-images
      - uses: ./.github/actions/start-backends
        with:
          minio: 'true'
          azurite: 'true'
          sftp: 'true'
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ needs.setup.outputs.primary }}
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          cache-suffix: ci-e2e  # BK-230
      - run: uv pip install -e ".[dev]"
      - run: pytest tests/e2e/ -v -o addopts= -p no:randomly

  docs:
    needs: [setup]
    if: needs.setup.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ needs.setup.outputs.primary }}
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: false
      # A docs-only PR skips the lint job (code==false), so the gate that validates
      # docs/spec prose runs here instead. Delegated to the docs-gate hatch target
      # so the pyproject script list stays the single source — see the lint job for
      # the uvx-hatch mechanism.
      - run: uvx hatch run docs-gate

  package:
    needs: [setup]
    if: needs.setup.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ needs.setup.outputs.primary }}
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: false
      - run: uv pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - run: uv pip install dist/*.whl
      - run: python -c "import remote_store; print(remote_store.__version__)"

  verify-formal:
    needs: [setup]
    if: needs.setup.outputs.formal == 'true'
    runs-on: ubuntu-latest
    # dafny-lang/setup-dafny-action@v1.9.1 is composite; its internal steps
    # pin actions/setup-dotnet@v4 and actions/setup-node@v4, both still on
    # Node 20. Force them onto Node 24 to silence the deprecation annotation
    # ahead of the June 2026 runner default and September 2026 removal.
    # BK-206's audit scoped third-party actions out, so the warning slipped
    # through; tracked under BK-230. Drop this once upstream bumps the
    # nested actions.
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: dafny-lang/setup-dafny-action@be023fc606339d46ed6b077dcb8614d0279ded31  # v1.9.1
        with:
          dafny-version: '4.11.0'
      - name: Verify formal specifications
        run: |
          dafny verify sdd/formal/BackendContract.dfy
          dafny verify sdd/formal/MemoryBackend.dfy
          dafny verify sdd/formal/DepthCounting.dfy
          dafny verify sdd/formal/ResourceSafety.dfy
      # Also runs in the lint job (CODE_PAT). Wired here too so a
      # BackendContract.dfy-only change (FORMAL_PAT, not CODE_PAT) still checks
      # Python ↔ Dafny capability parity. Stdlib-only; system python3 suffices.
      - name: Check Python-Dafny capability parity
        run: python3 scripts/check_capability_parity.py
      # Same pattern as above: these spec-drift gates otherwise live only in the
      # lint job (CODE_PAT), which a `sdd/specs/`-only change skips. FORMAL_PAT
      # matches `^sdd/specs/`, so wiring them here keeps a spec-only PR gated
      # without firing the whole code matrix. Stdlib-only; system python3 suffices.
      - name: Check spec-mark drift
        run: python3 scripts/check_spec_marks.py
      - name: Check formal-trace drift
        run: python3 scripts/check_formal_trace.py

  # INFORMATIONAL: TLA+ model checks for the live informal layer under
  # sdd/formal/tla/. Not in the gate below by design — see
  # sdd/formal/README.md § Authoring rules (3). The first revisit ticket
  # lives in sdd/BACKLOG.md (ID-150, due 2026-10-19). The historical
  # PoC modules under sdd/research/tla-poc/ are frozen and not run here.
  verify-tla:
    needs: [setup]
    if: needs.setup.outputs.tla == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check TLA+ files for em dashes
        run: python scripts/check_tla_no_emdash.py
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Download tla2tools.jar (pinned)
        env:
          TLA_VERSION: 1.7.4
          TLA_SHA256: 936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88
        run: |
          curl -fsSL -o tla2tools.jar \
            "https://github.com/tlaplus/tlaplus/releases/download/v${TLA_VERSION}/tla2tools.jar"
          echo "${TLA_SHA256}  tla2tools.jar" | sha256sum -c -
      - name: Run TLC on live TLA+ models
        run: |
          for cfg in MC3; do
            echo "==> TLC: sdd/formal/tla/${cfg}.tla"
            (cd sdd/formal/tla && \
              java -XX:+UseParallelGC -jar "$GITHUB_WORKSPACE/tla2tools.jar" \
                -config "${cfg}.cfg" \
                -metadir "${RUNNER_TEMP}/tlc-${cfg}" \
                "${cfg}.tla")
          done

  gate:
    needs: [setup, prepare-images, lint, typecheck, test, test-primary, test-primary-sftp, test-cassette-pii, coverage-gate, tooling-tests, pyarrow-major-check, test-cross-platform, notebooks, examples, e2e, docs, package, verify-formal]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        run: |
          # setup job must succeed — if it fails, path filters never ran
          # and all downstream jobs are auto-skipped, which would silently pass
          if [[ "${{ needs.setup.result }}" != "success" ]]; then
            echo "::error::setup job did not succeed: ${{ needs.setup.result }}"
            exit 1
          fi
          results=( \
            "${{ needs.prepare-images.result }}" \
            "${{ needs.lint.result }}" \
            "${{ needs.typecheck.result }}" \
            "${{ needs.test.result }}" \
            "${{ needs.test-primary.result }}" \
            "${{ needs.test-primary-sftp.result }}" \
            "${{ needs.test-cassette-pii.result }}" \
            "${{ needs.coverage-gate.result }}" \
            "${{ needs.tooling-tests.result }}" \
            "${{ needs.pyarrow-major-check.result }}" \
            "${{ needs.test-cross-platform.result }}" \
            "${{ needs.notebooks.result }}" \
            "${{ needs.examples.result }}" \
            "${{ needs.e2e.result }}" \
            "${{ needs.docs.result }}" \
            "${{ needs.package.result }}" \
            "${{ needs.verify-formal.result }}" \
          )
          for r in "${results[@]}"; do
            if [[ "$r" != "success" && "$r" != "skipped" ]]; then
              echo "::error::Job failed with result: $r"
              exit 1
            fi
          done
          echo "All jobs passed or were skipped."
