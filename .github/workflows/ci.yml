name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  UV_SYSTEM_PYTHON: 1
  UV_LINK_MODE: copy

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Detect changed files
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FILES=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}")
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ] || [ -z "${{ github.event.before }}" ]; then
            FILES=$(git ls-files)
          else
            FILES=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")
          fi
          CODE_PAT='^(src|tests|examples)/|^pyproject\.toml$|^\.github/workflows/ci\.yml$'
          DOCS_PAT='^(docs-src|src|guides)/|^mkdocs\.yml$|^README\.md$|^CHANGELOG\.md$|^sdd/(specs|adrs|rfcs)/|^\.github/workflows/ci\.yml$'
          if echo "$FILES" | grep -qE "$CODE_PAT"; then echo "code=true" >> "$GITHUB_OUTPUT"
          else echo "code=false" >> "$GITHUB_OUTPUT"; fi
          if echo "$FILES" | grep -qE "$DOCS_PAT"; then echo "docs=true" >> "$GITHUB_OUTPUT"
          else echo "docs=false" >> "$GITHUB_OUTPUT"; fi

  lint:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v7
      - run: uv pip install -e ".[dev]"
      - run: ruff check src/ tests/ examples/
      - run: ruff format --check src/ tests/ examples/
      - run: python scripts/check_test_assertions.py tests
      - run: python scripts/check_mock_spec.py tests

  typecheck:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v7
      - run: uv pip install -e ".[dev]"
      - run: mypy src/

  test:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - name: Start Azurite
        run: |
          docker run -d --name azurite -p 10000:10000 \
            mcr.microsoft.com/azure-storage/azurite:3.35.0 \
            azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --skipApiVersionCheck
          for i in $(seq 1 30); do
            nc -z 127.0.0.1 10000 && break || sleep 1
          done
          nc -z 127.0.0.1 10000 || { echo "::error::Azurite failed to start"; exit 1; }
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v7
      - run: uv pip install -e ".[dev]"
      # Full 95% threshold on 3.13 (primary). Other versions enforce a lower
      # floor (90%) because some dev deps may lack wheels on pre-release
      # Python, causing test skips that reduce coverage.
      - name: Run tests with coverage
        run: >-
          pytest --cov=remote_store --cov-report=term-missing
          ${{ matrix.python-version == '3.13' && '--cov-fail-under=95' || '--cov-fail-under=90' }}

  test-cross-platform:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v7
      - run: uv pip install -e ".[dev]"
      - name: Run OS-sensitive tests
        run: pytest -m "os_sensitive" --ignore=tests/e2e

  notebooks:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v7
      - run: uv pip install -e ".[dev]"
      - run: python tests/scripts/run_notebooks.py

  examples:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v7
      - run: uv pip install -e ".[dev,arrow]"
      - run: python examples/quickstart.py
      - run: python examples/file_operations.py
      - run: python examples/streaming_io.py
      - run: python examples/atomic_writes.py
      - run: python examples/configuration.py
      - run: python examples/error_handling.py
      - run: python examples/memory_backend.py
      - run: python examples/store_child.py
      - run: python examples/batch_operations.py
      - run: python examples/transfer_operations.py
      - run: python examples/observe_hooks.py
      - run: python examples/capabilities_and_errors.py
      - run: python examples/path_model.py
      # PyArrow's C++ atexit handlers can deadlock on Linux during interpreter
      # shutdown. The script completes but process exit hangs. Use timeout with
      # SIGKILL fallback; accept exit 124 (timeout) as success.
      - name: Run python examples/pyarrow_adapter.py
        run: |
          rc=0
          timeout --kill-after=5 30 python examples/pyarrow_adapter.py || rc=$?
          if [ $rc -ne 0 ] && [ $rc -ne 124 ]; then exit $rc; fi

  e2e:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Start MinIO
        run: |
          docker run -d --name minio-e2e -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            cgr.dev/chainguard/minio:latest-dev server /data
          for i in $(seq 1 30); do
            wget -qO /dev/null http://127.0.0.1:9000/minio/health/live && break || sleep 1
          done
          wget -qO /dev/null http://127.0.0.1:9000/minio/health/live || { echo "::error::MinIO failed to start"; exit 1; }
      - name: Start Azurite
        run: |
          docker run -d --name azurite-e2e -p 10000:10000 \
            mcr.microsoft.com/azure-storage/azurite:3.35.0 \
            azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --skipApiVersionCheck
          for i in $(seq 1 30); do
            nc -z 127.0.0.1 10000 && break || sleep 1
          done
          nc -z 127.0.0.1 10000 || { echo "::error::Azurite failed to start"; exit 1; }
      - name: Start SFTP
        run: |
          docker run -d --name sftp-e2e -p 2222:22 \
            atmoz/sftp:alpine \
            benchuser:benchpass:::upload
          for i in $(seq 1 30); do
            nc -z 127.0.0.1 2222 && break || sleep 1
          done
          nc -z 127.0.0.1 2222 || { echo "::error::SFTP failed to start"; exit 1; }
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v7
      - run: uv pip install -e ".[dev]"
      - run: pytest tests/e2e/ -v -o addopts=

  docs:
    needs: [changes]
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v7
      - run: uv pip install -e ".[docs]"
      - run: mkdocs build --strict

  package:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v7
      - run: uv pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - run: uv pip install dist/*.whl
      - run: python -c "import remote_store; print(remote_store.__version__)"

  gate:
    needs: [changes, lint, typecheck, test, test-cross-platform, notebooks, examples, e2e, docs, package]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        run: |
          # changes job must succeed — if it fails, path filters never ran
          # and all downstream jobs are auto-skipped, which would silently pass
          if [[ "${{ needs.changes.result }}" != "success" ]]; then
            echo "::error::changes job did not succeed: ${{ needs.changes.result }}"
            exit 1
          fi
          results=( \
            "${{ needs.lint.result }}" \
            "${{ needs.typecheck.result }}" \
            "${{ needs.test.result }}" \
            "${{ needs.test-cross-platform.result }}" \
            "${{ needs.notebooks.result }}" \
            "${{ needs.examples.result }}" \
            "${{ needs.e2e.result }}" \
            "${{ needs.docs.result }}" \
            "${{ needs.package.result }}" \
          )
          for r in "${results[@]}"; do
            if [[ "$r" != "success" && "$r" != "skipped" ]]; then
              echo "::error::Job failed with result: $r"
              exit 1
            fi
          done
          echo "All jobs passed or were skipped."
