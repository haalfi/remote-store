name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'tests/**'
              - 'examples/**'
              - 'pyproject.toml'
              - '.github/workflows/ci.yml'
            docs:
              - 'docs-src/**'
              - 'guides/**'
              - 'mkdocs.yml'
              - 'README.md'
              - 'CHANGELOG.md'
              - 'sdd/specs/**'
              - 'sdd/adrs/**'
              - 'sdd/rfcs/**'
              - '.github/workflows/ci.yml'

  lint:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: ruff check src/ tests/ examples/
      - run: ruff format --check src/ tests/ examples/

  typecheck:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: mypy src/

  test:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - name: Start Azurite
        run: |
          docker run -d --name azurite -p 10000:10000 \
            mcr.microsoft.com/azure-storage/azurite:3.35.0 \
            azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --skipApiVersionCheck
          for i in $(seq 1 30); do
            nc -z 127.0.0.1 10000 && break || sleep 1
          done
          nc -z 127.0.0.1 10000 || { echo "::error::Azurite failed to start"; exit 1; }
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest --cov=remote_store --cov-report=term-missing --cov-fail-under=95

  examples:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev,arrow]"
      - run: python examples/quickstart.py
      - run: python examples/file_operations.py
      - run: python examples/streaming_io.py
      - run: python examples/atomic_writes.py
      - run: python examples/configuration.py
      - run: python examples/error_handling.py
      - run: python examples/memory_backend.py
      - run: python examples/store_child.py
      - run: python examples/batch_operations.py
      - run: python examples/transfer_operations.py
      - run: python examples/observe_hooks.py
      # PyArrow's C++ atexit handlers can deadlock on Linux during interpreter
      # shutdown. The script completes but process exit hangs. Use timeout with
      # SIGKILL fallback; accept exit 124 (timeout) as success.
      - name: Run python examples/pyarrow_adapter.py
        run: |
          rc=0
          timeout --kill-after=5 30 python examples/pyarrow_adapter.py || rc=$?
          if [ $rc -ne 0 ] && [ $rc -ne 124 ]; then exit $rc; fi

  docs:
    needs: [changes]
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -e ".[docs]"
      - run: mkdocs build --strict

  package:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - run: pip install dist/*.whl
      - run: python -c "import remote_store; print(remote_store.__version__)"

  gate:
    needs: [lint, typecheck, test, examples, docs, package]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        run: |
          results=( \
            "${{ needs.lint.result }}" \
            "${{ needs.typecheck.result }}" \
            "${{ needs.test.result }}" \
            "${{ needs.examples.result }}" \
            "${{ needs.docs.result }}" \
            "${{ needs.package.result }}" \
          )
          for r in "${results[@]}"; do
            if [[ "$r" != "success" && "$r" != "skipped" ]]; then
              echo "::error::Job failed with result: $r"
              exit 1
            fi
          done
          echo "All jobs passed or were skipped."
