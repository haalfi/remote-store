name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  UV_SYSTEM_PYTHON: 1
  UV_LINK_MODE: copy

jobs:
  setup:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docs: ${{ steps.filter.outputs.docs }}
      formal: ${{ steps.filter.outputs.formal }}
      tla: ${{ steps.filter.outputs.tla }}
      primary: ${{ steps.versions.outputs.primary }}
      test-matrix: ${{ steps.versions.outputs.test-matrix }}
      typecheck-matrix: ${{ steps.versions.outputs.typecheck-matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Detect changed files
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FILES=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}")
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ] || [ -z "${{ github.event.before }}" ]; then
            FILES=$(git ls-files)
          else
            FILES=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")
          fi
          CODE_PAT='^(src|tests|examples|scripts)/|^pyproject\.toml$|^docs-src/reference/FEATURES\.md$|^docs-src/_data/graph/|^\.github/workflows/|^\.github/actions/'
          DOCS_PAT='^(docs-src|src)/|^mkdocs\.yml$|^README\.md$|^CHANGELOG\.md$|^sdd/|^scripts/(docs/|check_docs_framework\.py$)|^\.github/workflows/ci\.yml$'
          if echo "$FILES" | grep -qE "$CODE_PAT"; then echo "code=true" >> "$GITHUB_OUTPUT"
          else echo "code=false" >> "$GITHUB_OUTPUT"; fi
          if echo "$FILES" | grep -qE "$DOCS_PAT"; then echo "docs=true" >> "$GITHUB_OUTPUT"
          else echo "docs=false" >> "$GITHUB_OUTPUT"; fi
          # FORMAL_PAT gates the Dafny job. Exclude the TLA subtree so
          # TLA-only changes do not trigger Dafny — verify-formal and
          # verify-tla are independent filters.
          FORMAL_PAT='^sdd/(formal|specs)/|^\.github/workflows/ci\.yml$'
          if echo "$FILES" | grep -v '^sdd/formal/tla/' | grep -qE "$FORMAL_PAT"; then echo "formal=true" >> "$GITHUB_OUTPUT"
          else echo "formal=false" >> "$GITHUB_OUTPUT"; fi
          TLA_PAT='^sdd/formal/tla/|^scripts/tlc(_check\.sh|\.Dockerfile)$|^\.github/workflows/ci\.yml$'
          if echo "$FILES" | grep -qE "$TLA_PAT"; then echo "tla=true" >> "$GITHUB_OUTPUT"
          else echo "tla=false" >> "$GITHUB_OUTPUT"; fi
      - name: Resolve Python versions
        id: versions
        env:
          ALL_PYTHONS: '["3.10", "3.11", "3.12", "3.13", "3.14"]'
          PRIMARY_PYTHON: "3.13"
          MIN_PYTHON: "3.10"
        run: |
          echo "primary=$PRIMARY_PYTHON" >> "$GITHUB_OUTPUT"
          echo "test-matrix=$(jq -cn --argjson a "$ALL_PYTHONS" --arg p "$PRIMARY_PYTHON" '$a - [$p]')" >> "$GITHUB_OUTPUT"
          echo "typecheck-matrix=$(jq -cn --arg m "$MIN_PYTHON" --arg p "$PRIMARY_PYTHON" '[$m, $p]')" >> "$GITHUB_OUTPUT"

  lint:
    needs: [setup]
    if: needs.setup.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ needs.setup.outputs.primary }}
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: false
      - run: uv pip install -e ".[dev]"
      # actionlint: static lint for GitHub Actions workflows. Catches
      # template-injection vectors, undefined env / matrix references,
      # outdated runner labels, and expression-syntax errors. Pinned
      # binary download (no third-party action wrapper).
      #
      # `-shellcheck=` disables actionlint's shellcheck integration:
      # ubuntu-latest runners ship shellcheck preinstalled, which would
      # otherwise surface style nits (SC2086, SC2129, ...) across the
      # pre-existing workflows that were not authored against shellcheck.
      # Re-enabling it is deferred — turn back on once the pre-existing
      # workflows pass shellcheck, or move to a per-file ignore list via
      # .github/actionlint.yaml so new workflows benefit immediately.
      - name: Install actionlint
        run: |
          # Pin both the binary version (1.7.7) AND the downloader script
          # to the matching tag — pulling the bootstrap from `main` would
          # execute whatever the latest commit there contains in the lint
          # job, defeating the purpose of pinning the binary.
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7 "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: actionlint -color -shellcheck=
      - run: ruff check src/ tests/ examples/ scripts/
      - run: ruff format --check src/ tests/ examples/ scripts/
      - run: python scripts/check_test_assertions.py tests
      - run: python scripts/check_mock_spec.py tests
      - run: python scripts/check_test_placement.py tests
      - run: python scripts/check_tla_no_emdash.py
      - run: python scripts/check_formal_trace.py
      - run: python scripts/check_docs_framework.py
      - run: python scripts/check_rst_roles.py
      - run: python scripts/check_infra_settings.py
      - run: python scripts/gen_graph.py --check
      - run: python scripts/check_api_docs.py
      - run: python scripts/gen_features.py --check
      - run: python scripts/gen_graph_viz.py --check
      - run: python scripts/gen_backlogid.py --check

  typecheck:
    needs: [setup]
    if: needs.setup.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ${{ fromJSON(needs.setup.outputs.typecheck-matrix) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: false
      - run: uv pip install -e ".[dev]"
      - run: mypy src/ examples/

  test:
    needs: [setup]
    if: needs.setup.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ${{ fromJSON(needs.setup.outputs.test-matrix) }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/start-backends
        with:
          minio: 'true'
          azurite: 'true'
          sftp: 'true'
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          # BK-230: forward-defensive cache-suffix. The matrix excludes the
          # primary (line 63: ALL_PYTHONS - PRIMARY), so today no shard
          # collides with the test-primary and e2e save keys. Suffix is set
          # anyway so reintroducing 3.13 into the matrix later does not
          # silently revive the setup-uv-*-pruned-* reservation race.
          cache-suffix: ci-test-matrix
      - run: uv pip install -e ".[dev]"
      # tests/scripts/ holds contributor-tooling tests (script checkers, gen
      # scripts) that exercise scripts/, not remote_store. They gain nothing
      # from multi-version coverage and run once on the primary Python via
      # test-primary below. BK-207.
      #
      # ID-195 two-pass split: pass 1 runs all backends in parallel with xdist;
      # the sftp_docker fixture is filtered out under PYTEST_XDIST_WORKER
      # (see registry.fixture_params). Pass 2 runs the sftp_docker conformance
      # variants serially, since atmoz/sftp's OpenSSH daemon is unreliable
      # under concurrent connections from multiple workers.
      - run: pytest -n auto -p no:benchmark --ignore=tests/scripts
      - run: pytest -p no:benchmark --ignore=tests/scripts -k sftp_docker tests/backends/conformance/

  # Primary-Python job: coverage gate + contributor-tooling tests. Both run
  # once on the primary Python; sharing setup avoids a redundant runner.
  # BK-219 (coverage split), BK-207 (tooling-test rationale).
  test-primary:
    needs: [setup]
    if: needs.setup.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/start-backends
        with:
          minio: 'true'
          azurite: 'true'
          sftp: 'true'
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ needs.setup.outputs.primary }}
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          cache-suffix: ci-test-primary  # BK-230
      - run: uv pip install -e ".[dev]"
      # ID-195 two-pass split with --cov-append for pass 2. The 95% floor
      # is asserted on pass 2 after pass 1's `.coverage` data has been
      # combined in. tests/scripts/ deliberately runs without --cov: it
      # exercises scripts/, not remote_store, so it would only inflate
      # the denominator without contributing meaningful coverage.
      - run: pytest -n auto -p no:benchmark --cov=remote_store --cov-report= --ignore=tests/scripts
      - run: pytest -p no:benchmark --cov=remote_store --cov-append --cov-report=term-missing --cov-fail-under=95 -k sftp_docker tests/backends/conformance/
      - run: pytest tests/scripts/ -q

  # BK-172: verify that S3-PyArrow tests run (not skip) against MinIO when
  # pyarrow ≥ 24 is installed, and that other pyarrow-24 code paths still pass.
  # The main `test` matrix resolves pyarrow to whatever pip picks; this job
  # pins pyarrow 24 explicitly to confirm the MinIO routing works end-to-end.
  pyarrow24-check:
    needs: [setup]
    if: needs.setup.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      RS_REQUIRE_MINIO: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/start-backends
        with:
          minio: 'true'
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ needs.setup.outputs.primary }}
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: false
      - run: uv pip install -e ".[dev]"
      - name: Force pyarrow 24
        run: uv pip install "pyarrow>=24,<25"
      - name: Assert pyarrow_ge_24() detects pyarrow 24
        run: python -c "from tests._helpers import pyarrow_ge_24; assert pyarrow_ge_24(), 'pyarrow_ge_24() returned False -- helper regressed'"
      - name: Verify S3-PyArrow routes to MinIO on pyarrow 24
        run: pytest tests/backends/s3/test_pyarrow.py -v
      - name: Verify pyarrow-24 paths in ext.arrow, ext.parquet, sqlalchemy
        run: pytest tests/ext/test_arrow.py tests/ext/test_parquet.py tests/backends/sqlquery/test_config.py tests/backends/sqlblob/test_config.py -q

  test-cross-platform:
    needs: [setup]
    if: needs.setup.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ needs.setup.outputs.primary }}
      - uses: astral-sh/setup-uv@v8.1.0
      - run: uv pip install -e ".[dev]"
      - name: Run OS-sensitive tests
        run: pytest -m "os_sensitive" --ignore=tests/e2e

  notebooks:
    needs: [setup]
    if: needs.setup.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ needs.setup.outputs.primary }}
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: false
      - run: uv pip install -e ".[dev]"
      - run: python tests/scripts/run_notebooks.py

  examples:
    needs: [setup]
    if: needs.setup.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ needs.setup.outputs.primary }}
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: false
      - run: uv pip install -e ".[dev,arrow]"
      - run: python tests/scripts/run_examples.py
      # PyArrow's C++ atexit handlers can deadlock on Linux during interpreter
      # shutdown. The script completes but process exit hangs. Use timeout with
      # SIGKILL fallback; accept exit 124 (timeout) as success.
      - name: Run python examples/integrations/pyarrow_adapter.py
        run: |
          rc=0
          timeout --kill-after=5 30 python examples/integrations/pyarrow_adapter.py || rc=$?
          if [ $rc -ne 0 ] && [ $rc -ne 124 ]; then exit $rc; fi

  e2e:
    needs: [setup]
    if: needs.setup.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/start-backends
        with:
          minio: 'true'
          azurite: 'true'
          sftp: 'true'
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ needs.setup.outputs.primary }}
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          cache-suffix: ci-e2e  # BK-230
      - run: uv pip install -e ".[dev]"
      - run: pytest tests/e2e/ -v -o addopts=

  docs:
    needs: [setup]
    if: needs.setup.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ needs.setup.outputs.primary }}
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: false
      - run: uv pip install -e ".[docs]"
      - run: python scripts/check_docs_framework.py
      - run: mkdocs build --strict

  package:
    needs: [setup]
    if: needs.setup.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ needs.setup.outputs.primary }}
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: false
      - run: uv pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - run: uv pip install dist/*.whl
      - run: python -c "import remote_store; print(remote_store.__version__)"

  verify-formal:
    needs: [setup]
    if: needs.setup.outputs.formal == 'true'
    runs-on: ubuntu-latest
    # dafny-lang/setup-dafny-action@v1.9.1 is composite; its internal steps
    # pin actions/setup-dotnet@v4 and actions/setup-node@v4, both still on
    # Node 20. Force them onto Node 24 to silence the deprecation annotation
    # ahead of the June 2026 runner default and September 2026 removal.
    # BK-206's audit scoped third-party actions out, so the warning slipped
    # through; tracked under BK-230. Drop this once upstream bumps the
    # nested actions.
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v6
      - uses: dafny-lang/setup-dafny-action@be023fc606339d46ed6b077dcb8614d0279ded31  # v1.9.1
        with:
          dafny-version: '4.11.0'
      - name: Verify formal specifications
        run: |
          dafny verify sdd/formal/BackendContract.dfy
          dafny verify sdd/formal/MemoryBackend.dfy
          dafny verify sdd/formal/DepthCounting.dfy
          dafny verify sdd/formal/ResourceSafety.dfy

  # INFORMATIONAL: TLA+ model checks for the live informal layer under
  # sdd/formal/tla/. Not in the gate below by design — see
  # sdd/formal/README.md § Authoring rules (3). The first revisit ticket
  # lives in sdd/BACKLOG.md (ID-150, due 2026-10-19). The historical
  # PoC modules under sdd/research/tla-poc/ are frozen and not run here.
  verify-tla:
    needs: [setup]
    if: needs.setup.outputs.tla == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check TLA+ files for em dashes
        run: python scripts/check_tla_no_emdash.py
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Download tla2tools.jar (pinned)
        env:
          TLA_VERSION: 1.7.4
          TLA_SHA256: 936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88
        run: |
          curl -fsSL -o tla2tools.jar \
            "https://github.com/tlaplus/tlaplus/releases/download/v${TLA_VERSION}/tla2tools.jar"
          echo "${TLA_SHA256}  tla2tools.jar" | sha256sum -c -
      - name: Run TLC on live TLA+ models
        run: |
          for cfg in MC3; do
            echo "==> TLC: sdd/formal/tla/${cfg}.tla"
            (cd sdd/formal/tla && \
              java -XX:+UseParallelGC -jar "$GITHUB_WORKSPACE/tla2tools.jar" \
                -config "${cfg}.cfg" \
                -metadir "${RUNNER_TEMP}/tlc-${cfg}" \
                "${cfg}.tla")
          done

  gate:
    needs: [setup, lint, typecheck, test, test-primary, pyarrow24-check, test-cross-platform, notebooks, examples, e2e, docs, package, verify-formal]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        run: |
          # setup job must succeed — if it fails, path filters never ran
          # and all downstream jobs are auto-skipped, which would silently pass
          if [[ "${{ needs.setup.result }}" != "success" ]]; then
            echo "::error::setup job did not succeed: ${{ needs.setup.result }}"
            exit 1
          fi
          results=( \
            "${{ needs.lint.result }}" \
            "${{ needs.typecheck.result }}" \
            "${{ needs.test.result }}" \
            "${{ needs.test-primary.result }}" \
            "${{ needs.pyarrow24-check.result }}" \
            "${{ needs.test-cross-platform.result }}" \
            "${{ needs.notebooks.result }}" \
            "${{ needs.examples.result }}" \
            "${{ needs.e2e.result }}" \
            "${{ needs.docs.result }}" \
            "${{ needs.package.result }}" \
            "${{ needs.verify-formal.result }}" \
          )
          for r in "${results[@]}"; do
            if [[ "$r" != "success" && "$r" != "skipped" ]]; then
              echo "::error::Job failed with result: $r"
              exit 1
            fi
          done
          echo "All jobs passed or were skipped."
