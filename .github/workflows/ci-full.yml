# BK-319 backstop. The per-PR CI (ci.yml) runs the full live-Docker-backend
# Stage-2 suite only on the primary interpreter; the four non-primary
# interpreters run the repo-only Stage-1 tier there to keep PR wall-clock under
# 5 min on the 20-concurrent-job cap. This workflow restores the pre-optimization
# guarantee — the FULL two-pass live-backend suite on EVERY supported
# interpreter — off the per-PR critical path: nightly and on every push to
# master. So a regression that only manifests on a non-primary interpreter
# against a live backend is caught here (within minutes of merge, or overnight)
# rather than blocking an individual PR.
name: CI Full Matrix

on:
  schedule:
    # 03:00 UTC daily. Catches drift even on days with no merges.
    - cron: '0 3 * * *'
  push:
    branches: [master]
  workflow_dispatch:

env:
  UV_SYSTEM_PYTHON: 1
  UV_LINK_MODE: copy

jobs:
  # Prime the shared service-image cache once (mirrors ci.yml's prepare-images).
  prepare-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Restore service-image cache
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: ci-images
          key: ci-images-v1-${{ hashFiles('scripts/ci_service_images.sh') }}
      - name: Pull and bundle service images
        id: bundle
        if: steps.cache.outputs.cache-hit != 'true'
        run: bash scripts/ci_save_images.sh ci-images
      - name: Save service-image cache
        if: steps.cache.outputs.cache-hit != 'true' && steps.bundle.outputs.complete == 'true'
        uses: actions/cache/save@v6
        with:
          path: ci-images
          key: ci-images-v1-${{ hashFiles('scripts/ci_service_images.sh') }}

  # The full two-pass live-backend suite on EVERY supported interpreter. Keep the
  # matrix in sync with ci.yml's ALL_PYTHONS (setup job). This is the complete
  # pre-BK-319 gate, run as a backstop rather than per PR.
  test-full:
    needs: [prepare-images]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - name: Restore service-image cache
        uses: actions/cache/restore@v6
        with:
          path: ci-images
          key: ci-images-v1-${{ hashFiles('scripts/ci_service_images.sh') }}
      - run: bash scripts/ci_load_images.sh ci-images
      - uses: ./.github/actions/start-backends
        with:
          minio: 'true'
          azurite: 'true'
          sftp: 'true'
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          cache-suffix: ci-full-${{ matrix.python-version }}
      - run: uv pip install -e ".[dev]"
      # ID-195 two-pass split: pass 1 runs all backends in parallel with xdist
      # (sftp_docker excluded under PYTEST_XDIST_WORKER); pass 2 runs the
      # sftp_docker conformance serially.
      - run: pytest -n auto -p no:benchmark --ignore=tests/scripts
      - run: pytest -p no:benchmark --ignore=tests/scripts -k sftp_docker tests/backends/conformance/

  full-gate:
    needs: [prepare-images, test-full]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        run: |
          results=( \
            "${{ needs.prepare-images.result }}" \
            "${{ needs.test-full.result }}" \
          )
          for r in "${results[@]}"; do
            if [[ "$r" != "success" && "$r" != "skipped" ]]; then
              echo "::error::Full-matrix job failed with result: $r"
              exit 1
            fi
          done
          echo "Full live-backend matrix passed on all interpreters."
