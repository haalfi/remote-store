name: Benchmarks

# BK-309: the benchmark suite is otherwise never executed — every lane in
# ci.yml runs `-p no:benchmark` — so it silently rotted (BUG-228 sat broken and
# undetected). This workflow gives the suite a home: it runs on a schedule (and
# on demand) as a CORRECTNESS gate (the suite must execute green), and checks a
# fresh local-backend run against a committed baseline as a REGRESSION flag.
#
# Deliberately NOT wired into PR/push CI: benchmark timing on shared runners is
# noisy, and blocking merges on it would flake. The weekly run is the "we didn't
# check often" fix — now it's checked every week and on `workflow_dispatch`.

on:
  schedule:
    # Mondays 04:17 UTC (off the hour to avoid the cron rush).
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      tier:
        description: 'Speed tier to run (correctness gate job)'
        type: choice
        options: [quick, standard, full]
        default: quick
      run_of_record:
        description: 'Also produce the published run of record (clean + RTT matrix, charts, comparative.md)'
        type: boolean
        default: false

permissions:
  contents: read

env:
  UV_SYSTEM_PYTHON: 1
  UV_LINK_MODE: copy

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # BK-279: Azurite (mcr.microsoft.com) and SFTP (Docker Hub) pull from
      # block-prone registries; the shared image cache (populated by ci.yml's
      # prepare-images on weekday runs) lets us docker-load them instead of
      # pulling. Restore is best-effort — ci_load_images.sh is a no-op on a miss,
      # and start-backends then falls back to a retrying on-demand pull. A
      # pull-time block on azurite/sftp is infra noise, not a suite regression
      # (see sdd/CI-OPERATIONS.md).
      - name: Restore service-image cache
        uses: actions/cache/restore@v6
        with:
          path: ci-images
          key: ci-images-v1-${{ hashFiles('scripts/ci_service_images.sh') }}
      - run: bash scripts/ci_load_images.sh ci-images

      - uses: ./.github/actions/start-backends
        with:
          minio: 'true'
          azurite: 'true'
          sftp: 'true'

      - uses: actions/setup-python@v6
        with:
          # Single-source the primary interpreter, same as ci.yml's setup job.
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: false
      # [bench] carries pytest-benchmark; [dev] carries the backend extras.
      - run: uv pip install -e ".[dev,bench]"

      - name: Resolve tier marker
        id: tier
        env:
          TIER: ${{ github.event.inputs.tier || 'quick' }}
        run: |
          case "$TIER" in
            quick)    echo "mark=not standard and not full" >> "$GITHUB_OUTPUT" ;;
            standard) echo "mark=not full" >> "$GITHUB_OUTPUT" ;;
            full)     echo "mark=" >> "$GITHUB_OUTPUT" ;;
          esac

      # Correctness gate: any benchmark that errors or leaks (BUG-228) fails the
      # job. --benchmark-json captures means for the regression step + artifact.
      - name: Run benchmark suite
        env:
          MARK: ${{ steps.tier.outputs.mark }}
        run: |
          if [ -n "$MARK" ]; then
            pytest benchmarks/ --benchmark-sort=mean --benchmark-json=bench.json -m "$MARK"
          else
            pytest benchmarks/ --benchmark-sort=mean --benchmark-json=bench.json
          fi

      # Regression flag: compare the fresh run to the committed baseline. Only
      # the local backend has a committed baseline, so only local ops are gated
      # (Docker cells have no baseline counterpart and are skipped). --min-abs
      # floors out sub-500us ops where machine variance dominates; --threshold
      # fails only on a >2x blow-up (catches gross/algorithmic regressions).
      - name: Regression check (local baseline)
        run: |
          python benchmarks/report.py --regression \
            --file bench.json \
            --baseline benchmarks/baseline/local-baseline.json \
            --threshold 2.0 --min-abs 0.0005 | tee -a "$GITHUB_STEP_SUMMARY"

      # Human-readable reports for the artifact (never fail the job on these).
      - name: Generate reports
        if: always()
        run: |
          python benchmarks/report.py --file bench.json > bench-summary.txt || true
          python benchmarks/report.py --file bench.json --user > bench-magnitude.txt || true
          python benchmarks/report.py --file bench.json --comparative > bench-comparative.txt || true

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: |
            bench.json
            bench-summary.txt
            bench-magnitude.txt
            bench-comparative.txt
          retention-days: 90

  # ID-230: the reproducible "run of record" that feeds the published overhead
  # story (benchmarks/results/comparative.md + the five docs charts). This is
  # NOT the weekly correctness/regression gate above — it is opt-in via the
  # `run_of_record` dispatch input, because loading the full latency matrix onto
  # every Monday run is CI cost for no gate value (the gate is `benchmark`).
  #
  # It brings up the FULL compose stack (Toxiproxy wired in front of the network
  # backends via infra/docker-compose.yml + infra/toxiproxy.json) rather than the
  # start-backends action, which has no Toxiproxy. It emits a `run-of-record`
  # artifact (slimmed source JSON + regenerated comparative.md + 5 SVGs) that a
  # maintainer downloads and COMMITS — CI is never given push rights to docs.
  run-of-record:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_of_record }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Best-effort restore of the BK-279 image cache (Azurite/SFTP): docker
      # compose then finds them present and only pulls MinIO (cgr.dev, reliable)
      # and Toxiproxy (ghcr.io). A pull-time block on those is infra noise —
      # re-run the dispatch — not a benchmark result.
      - name: Restore service-image cache
        uses: actions/cache/restore@v6
        with:
          path: ci-images
          key: ci-images-v1-${{ hashFiles('scripts/ci_service_images.sh') }}
      - run: bash scripts/ci_load_images.sh ci-images

      - name: Start backends + Toxiproxy (compose)
        run: docker compose -f infra/docker-compose.yml up -d --wait minio azurite sftp toxiproxy

      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: false
      - run: uv pip install -e ".[dev,bench]"

      # Clean profile at the `standard` tier on the comparative backends — feeds
      # comparative.md + overhead.svg + throughput.svg (needs the 10MB point) +
      # s3-comparison.svg.
      # --bench-timeout=300: the standard tier's 10MB writes on the emulated
      # Docker SFTP backend run ~9s/round (~50s over pytest-benchmark's rounds),
      # which flirts with the default 60s per-test watchdog and can trip a
      # late-firing KeyboardInterrupt that aborts the session after the
      # benchmarks have already passed. 300s clears them with wide margin.
      #
      # -k "not (10MB and (s3fs or sshfs))": the s3fs/sshfs comparison targets
      # are not plotted at 10MB by any run-of-record output — throughput charts
      # plot remote_store + the raw SDK only, and comparative.md's fsspec cells
      # are 1MB — so drop those unused cells to keep the standard-tier run lean.
      # adlfs stays in: BUG-233 fixed its 10MB raw-bytes write (the aiohttp >1 MiB
      # ResourceWarning is now suppressed in AdlfsTarget.write), so this run also
      # exercises the fix. The 10MB remote_store + raw-SDK points the throughput
      # chart needs are kept.
      - name: Benchmark — clean profile (standard tier)
        run: |
          pytest benchmarks/ --benchmark-sort=mean --benchmark-json=clean-raw.json \
            --backend local,s3,s3-pyarrow,sftp,azure -m "not full" --bench-timeout=300 \
            -k "not (10MB and (s3fs or sshfs))"

      # RTT matrix on the -latency backend variants. The overhead-vs-rtt and
      # overhead-decomposition charts read ONLY the OVERHEAD_OPS, so restrict the
      # matrix to those five ops via
      # -k (write/read 1MB, exists, list, delete — `not folder` drops the pedantic
      # test_delete_folder_recursive). Running the full quick tier three times
      # under simulated latency is slow, and the pedantic copy/move/streaming
      # RS-only tests can exceed the watchdog and trip a late KeyboardInterrupt
      # (which pytest-benchmark promotes to a fatal "fixture not used" error).
      # --bench-timeout=300 matches the clean run's headroom. The -latency names
      # are load-bearing — charts.py looks up _LATENCY_VARIANT for non-clean
      # profiles (guard 2 in slim_run_of_record.py).
      - name: Benchmark — RTT matrix (rtt20/rtt50/rtt100)
        run: |
          for p in rtt20 rtt50 rtt100; do
            pytest benchmarks/ --benchmark-sort=mean --benchmark-json="$p-raw.json" \
              --backend s3-latency,sftp-latency,azure-latency --network-profile "$p" \
              --pool-size=20 --bench-timeout=300 -m "not standard and not full" \
              -k "test_write_bytes or test_read_bytes or test_exists_hit or test_list_files or (test_delete and not folder)"
          done

      # Slim to the committed shape (keeps the top-level network_profile) and
      # assert the three chart invariants — a bad run fails HERE, loudly, instead
      # of shipping a blank/placeholder SVG.
      - name: Slim + guard the run of record
        run: python -m benchmarks.slim_run_of_record clean-raw.json rtt20-raw.json rtt50-raw.json rtt100-raw.json

      # Regenerate the published artifacts from the slimmed set. --file …/clean.json
      # is required: without it bench-charts builds the single-file charts from
      # files[-1] (an rtt file) and blanks them (guard 3 / the documented trap).
      - name: Regenerate comparative.md + charts
        run: |
          python -m benchmarks.report --comparative --markdown \
            --file benchmarks/results/run-of-record/clean.json \
            --output benchmarks/results/comparative.md
          python -m benchmarks.charts \
            --dir benchmarks/results/run-of-record \
            --file benchmarks/results/run-of-record/clean.json \
            --output-dir docs-src/img/benchmarks
          python -m benchmarks.slim_run_of_record --check-only

      - name: Upload run-of-record artifact
        uses: actions/upload-artifact@v7
        with:
          name: run-of-record
          path: |
            benchmarks/results/run-of-record/clean.json
            benchmarks/results/run-of-record/rtt20.json
            benchmarks/results/run-of-record/rtt50.json
            benchmarks/results/run-of-record/rtt100.json
            benchmarks/results/comparative.md
            docs-src/img/benchmarks/overhead.svg
            docs-src/img/benchmarks/overhead-vs-rtt.svg
            docs-src/img/benchmarks/overhead-decomposition.svg
            docs-src/img/benchmarks/throughput.svg
            docs-src/img/benchmarks/s3-comparison.svg
          retention-days: 90
