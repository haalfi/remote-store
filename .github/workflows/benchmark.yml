name: Benchmarks

# BK-309: the benchmark suite is otherwise never executed — every lane in
# ci.yml runs `-p no:benchmark` — so it silently rotted (BUG-228 sat broken and
# undetected). This workflow gives the suite a home: it runs on a schedule (and
# on demand) as a CORRECTNESS gate (the suite must execute green), and checks a
# fresh local-backend run against a committed baseline as a REGRESSION flag.
#
# Deliberately NOT wired into PR/push CI: benchmark timing on shared runners is
# noisy, and blocking merges on it would flake. The weekly run is the "we didn't
# check often" fix — now it's checked every week and on `workflow_dispatch`.

on:
  schedule:
    # Mondays 04:17 UTC (off the hour to avoid the cron rush).
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      tier:
        description: 'Speed tier to run'
        type: choice
        options: [quick, standard, full]
        default: quick

permissions:
  contents: read

env:
  UV_SYSTEM_PYTHON: 1
  UV_LINK_MODE: copy

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # BK-279: Azurite (mcr.microsoft.com) and SFTP (Docker Hub) pull from
      # block-prone registries; the shared image cache (populated by ci.yml's
      # prepare-images on weekday runs) lets us docker-load them instead of
      # pulling. Restore is best-effort — ci_load_images.sh is a no-op on a miss,
      # and start-backends then falls back to a retrying on-demand pull. A
      # pull-time block on azurite/sftp is infra noise, not a suite regression
      # (see sdd/CI-OPERATIONS.md).
      - name: Restore service-image cache
        uses: actions/cache/restore@v6
        with:
          path: ci-images
          key: ci-images-v1-${{ hashFiles('scripts/ci_service_images.sh') }}
      - run: bash scripts/ci_load_images.sh ci-images

      - uses: ./.github/actions/start-backends
        with:
          minio: 'true'
          azurite: 'true'
          sftp: 'true'

      - uses: actions/setup-python@v6
        with:
          # Single-source the primary interpreter, same as ci.yml's setup job.
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: false
      # [bench] carries pytest-benchmark; [dev] carries the backend extras.
      - run: uv pip install -e ".[dev,bench]"

      - name: Resolve tier marker
        id: tier
        env:
          TIER: ${{ github.event.inputs.tier || 'quick' }}
        run: |
          case "$TIER" in
            quick)    echo "mark=not standard and not full" >> "$GITHUB_OUTPUT" ;;
            standard) echo "mark=not full" >> "$GITHUB_OUTPUT" ;;
            full)     echo "mark=" >> "$GITHUB_OUTPUT" ;;
          esac

      # Correctness gate: any benchmark that errors or leaks (BUG-228) fails the
      # job. --benchmark-json captures means for the regression step + artifact.
      - name: Run benchmark suite
        env:
          MARK: ${{ steps.tier.outputs.mark }}
        run: |
          if [ -n "$MARK" ]; then
            pytest benchmarks/ --benchmark-sort=mean --benchmark-json=bench.json -m "$MARK"
          else
            pytest benchmarks/ --benchmark-sort=mean --benchmark-json=bench.json
          fi

      # Regression flag: compare the fresh run to the committed baseline. Only
      # the local backend has a committed baseline, so only local ops are gated
      # (Docker cells have no baseline counterpart and are skipped). --min-abs
      # floors out sub-500us ops where machine variance dominates; --threshold
      # fails only on a >2x blow-up (catches gross/algorithmic regressions).
      - name: Regression check (local baseline)
        run: |
          python benchmarks/report.py --regression \
            --file bench.json \
            --baseline benchmarks/baseline/local-baseline.json \
            --threshold 2.0 --min-abs 0.0005 | tee -a "$GITHUB_STEP_SUMMARY"

      # Human-readable reports for the artifact (never fail the job on these).
      - name: Generate reports
        if: always()
        run: |
          python benchmarks/report.py --file bench.json > bench-summary.txt || true
          python benchmarks/report.py --file bench.json --user > bench-verdicts.txt || true
          python benchmarks/report.py --file bench.json --comparative > bench-comparative.txt || true

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: |
            bench.json
            bench-summary.txt
            bench-verdicts.txt
            bench-comparative.txt
          retention-days: 90
