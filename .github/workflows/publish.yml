name: Publish

on:
  release:
    types: [published]

env:
  UV_SYSTEM_PYTHON: 1
  UV_LINK_MODE: copy

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v8.2.0
      - run: uv pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  # Publish the release coverage badge to Codecov. Runs after PyPI publish so
  # the badge always reflects the shipped version. Azurite provides the Azure
  # backend needed for full coverage (e2e tests are excluded from regular CI).
  coverage:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Load infra settings
        run: |
          set -a
          . infra/.env
          set +a
          echo "AZURITE_HOST_PORT=$AZURITE_HOST_PORT" >> $GITHUB_ENV
      - name: Start Azurite
        run: |
          img=mcr.microsoft.com/azure-storage/azurite:3.35.0
          bash scripts/ci_docker_pull.sh "$img"
          docker run -d --name azurite -p ${AZURITE_HOST_PORT}:10000 \
            "$img" \
            azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --skipApiVersionCheck
          for i in $(seq 1 30); do
            nc -z 127.0.0.1 ${AZURITE_HOST_PORT} && break || sleep 1
          done
          nc -z 127.0.0.1 ${AZURITE_HOST_PORT} || { echo "::error::Azurite failed to start"; exit 1; }
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v8.2.0
      - run: uv pip install -e ".[dev]"
      - name: Run tests with coverage
        # Deliberate single-pass (not the two-pass `hatch run test-cov-strict`
        # used in CI): this badge job only starts Azurite, so the second
        # sftp_docker pass would skip-then-skip on the absent atmoz/sftp
        # daemon. The single invocation still reaches the 95% floor via
        # Azure-backend coverage. `[tool.coverage.run] parallel = true` is
        # inert here because there is no `-n auto`.
        # `--ignore=tests/scripts`: exercises scripts/, not remote_store —
        # would only inflate the denominator without contributing coverage.
        run: pytest --cov=remote_store --cov-report=xml --cov-fail-under=95 --ignore=tests/scripts
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
