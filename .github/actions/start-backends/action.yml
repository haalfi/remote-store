name: Start Backend Services
description: Start MinIO, Azurite, and/or SFTP containers for CI jobs

inputs:
  minio:
    description: Start MinIO (S3-compatible object store)
    required: false
    default: 'false'
  azurite:
    description: Start Azurite (Azure Blob Storage emulator)
    required: false
    default: 'false'
  sftp:
    description: Start SFTP server
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Start MinIO
      if: inputs.minio == 'true'
      shell: bash
      run: |
        docker run -d --name minio -p 9000:9000 \
          -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
          cgr.dev/chainguard/minio:latest-dev@sha256:2d8f8a3f8da60885794dfd0749c9d49c985b0ee642f1c522e6aa93be59f34a84 server /data
        for i in $(seq 1 30); do
          wget -qO /dev/null http://127.0.0.1:9000/minio/health/live && break || sleep 1
        done
        wget -qO /dev/null http://127.0.0.1:9000/minio/health/live || { echo "::error::MinIO failed to start"; exit 1; }

    - name: Start Azurite
      if: inputs.azurite == 'true'
      shell: bash
      run: |
        docker run -d --name azurite -p 10000:10000 \
          mcr.microsoft.com/azure-storage/azurite:3.35.0 \
          azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --skipApiVersionCheck
        for i in $(seq 1 30); do
          nc -z 127.0.0.1 10000 && break || sleep 1
        done
        nc -z 127.0.0.1 10000 || { echo "::error::Azurite failed to start"; exit 1; }

    - name: Start SFTP
      if: inputs.sftp == 'true'
      shell: bash
      run: |
        docker run -d --name sftp -p 2222:22 \
          atmoz/sftp:alpine \
          benchuser:benchpass:::upload
        for i in $(seq 1 30); do
          nc -z 127.0.0.1 2222 && break || sleep 1
        done
        nc -z 127.0.0.1 2222 || { echo "::error::SFTP failed to start"; exit 1; }
