name: Start Backend Services
description: Start MinIO, Azurite, and/or SFTP containers for CI jobs

inputs:
  minio:
    description: Start MinIO (S3-compatible object store)
    required: false
    default: 'false'
  azurite:
    description: Start Azurite (Azure Blob Storage emulator)
    required: false
    default: 'false'
  sftp:
    description: Start SFTP server
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Load infra settings
      shell: bash
      run: |
        set -a
        . infra/.env
        set +a
        {
          echo "MINIO_HOST_PORT=$MINIO_HOST_PORT"
          echo "MINIO_ACCESS_KEY=$MINIO_ACCESS_KEY"
          echo "MINIO_SECRET_KEY=$MINIO_SECRET_KEY"
          echo "AZURITE_HOST_PORT=$AZURITE_HOST_PORT"
          echo "SFTP_HOST_PORT=$SFTP_HOST_PORT"
          echo "SFTP_USER=$SFTP_USER"
          echo "SFTP_PASS=$SFTP_PASS"
        } >> "$GITHUB_ENV"

    - name: Start MinIO
      if: inputs.minio == 'true'
      shell: bash
      run: |
        . scripts/ci_service_images.sh
        img="$MINIO_IMAGE"
        docker image inspect "$img" >/dev/null 2>&1 || bash scripts/ci_docker_pull.sh "$img"
        docker run -d --name minio -p "${MINIO_HOST_PORT}:9000" \
          -e "MINIO_ROOT_USER=${MINIO_ACCESS_KEY}" -e "MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY}" \
          "$img" server /data
        for _ in $(seq 1 30); do
          if wget -qO /dev/null "http://127.0.0.1:${MINIO_HOST_PORT}/minio/health/live"; then break; fi
          sleep 1
        done
        wget -qO /dev/null "http://127.0.0.1:${MINIO_HOST_PORT}/minio/health/live" || { echo "::error::MinIO failed to start"; exit 1; }

    - name: Start Azurite
      if: inputs.azurite == 'true'
      shell: bash
      run: |
        . scripts/ci_service_images.sh
        img="$AZURITE_IMAGE"
        docker image inspect "$img" >/dev/null 2>&1 || bash scripts/ci_docker_pull.sh "$img"
        docker run -d --name azurite -p "${AZURITE_HOST_PORT}:10000" \
          "$img" \
          azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --skipApiVersionCheck
        for _ in $(seq 1 30); do
          if nc -z 127.0.0.1 "${AZURITE_HOST_PORT}"; then break; fi
          sleep 1
        done
        nc -z 127.0.0.1 "${AZURITE_HOST_PORT}" || { echo "::error::Azurite failed to start"; exit 1; }

    - name: Start SFTP
      if: inputs.sftp == 'true'
      shell: bash
      run: |
        . scripts/ci_service_images.sh
        img="$SFTP_IMAGE"
        docker image inspect "$img" >/dev/null 2>&1 || bash scripts/ci_docker_pull.sh "$img"
        docker run -d --name sftp -p "${SFTP_HOST_PORT}:22" \
          "$img" \
          "${SFTP_USER}:${SFTP_PASS}:::upload"
        for _ in $(seq 1 30); do
          if nc -z 127.0.0.1 "${SFTP_HOST_PORT}"; then break; fi
          sleep 1
        done
        nc -z 127.0.0.1 "${SFTP_HOST_PORT}" || { echo "::error::SFTP failed to start"; exit 1; }
