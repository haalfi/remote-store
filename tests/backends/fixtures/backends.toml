# Per-backend-family declarative facts (spec 048 / TEST-004).
#
# This is the single source of truth for facts that apply to every fixture
# of a given backend family. Per-fixture overrides live in fixtures.toml
# and merge on top of these defaults.
#
# Closed enums:
#   transport: http | ssh | fs | memory | sql
#
# Per-backend defaults that fixtures may override:
#   flat_namespace      — true when the backend has no real directory entries
#   self_op_supported   — true when move(p,p)/copy(p,p) is a safe no-op

[backend.azure]
sources       = ["src/remote_store/backends/_azure.py", "src/remote_store/backends/_azure_common.py"]
async_sources = ["src/remote_store/aio/backends/_azure.py"]
transport     = "http"
# Default to HNS-shape (real-live ADLS Gen2) so the conservative
# Stage 3 fixture inherits correctly; the Azurite emulator overrides
# to flat_namespace=true at the per-fixture level (BK-185).
flat_namespace    = false
# BUG-201 fix landed on both sync and async branches; per-fixture overrides
# in fixtures.toml flip this to true for each live/replay Azure fixture.
# Family default stays false so any future Azure backend variant starts
# conservative until self-op is explicitly verified.
self_op_supported = false

[backend.s3]
sources   = ["src/remote_store/backends/_s3.py", "src/remote_store/backends/_s3_base.py"]
transport = "http"
flat_namespace    = true
self_op_supported = true

[backend.s3_pyarrow]
sources   = ["src/remote_store/backends/_s3_pyarrow.py"]
transport = "http"
flat_namespace    = true
self_op_supported = true

# ID-202 PoC: boto3-direct S3 lane (no s3fs/pyarrow). Same flat-NS / self-op
# shape as the other S3 families; the boto3 data path is the only divergence.
[backend.s3_boto3]
sources   = ["src/remote_store/backends/_s3_boto3.py"]
transport = "http"
flat_namespace    = true
self_op_supported = true

[backend.sftp]
sources   = ["src/remote_store/backends/_sftp.py"]
transport = "ssh"
flat_namespace    = false
self_op_supported = true

[backend.sqlblob]
sources   = ["src/remote_store/backends/_sqlalchemy.py"]
transport = "sql"
flat_namespace    = true
self_op_supported = true

[backend.http]
sources   = [
    "src/remote_store/backends/_http.py",
    "src/remote_store/backends/_http_httpx.py",
    "src/remote_store/backends/_http_requests.py",
]
transport = "http"
flat_namespace    = true
self_op_supported = false

[backend.local]
sources   = ["src/remote_store/backends/_local.py"]
transport = "fs"
flat_namespace    = false
self_op_supported = true

[backend.memory]
sources       = ["src/remote_store/backends/_memory.py", "src/remote_store/backends/_memory_tree.py"]
async_sources = ["src/remote_store/aio/backends/_memory.py"]
transport     = "memory"
flat_namespace    = false
self_op_supported = true

[backend.dafny]
sources   = ["tests/backends/dafny/_helpers.py"]
transport = "memory"
flat_namespace    = false
self_op_supported = true

# ID-127: Microsoft Graph — async-native only (no sync twin). Hierarchical
# (real folders), so flat_namespace=false; self-copy/move short-circuits after
# a single existence GET (GR-044), so self_op_supported=true.
[backend.graph]
sources       = []
async_sources = [
    "src/remote_store/aio/backends/_graph/backend.py",
    "src/remote_store/aio/backends/_graph/http.py",
    "src/remote_store/aio/backends/_graph/auth.py",
    "src/remote_store/aio/backends/_graph/utils.py",
]
transport     = "http"
flat_namespace    = false
self_op_supported = true
