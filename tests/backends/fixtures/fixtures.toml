# ---------------------------------------------------------------------------
# Stage 3 fixtures: live cloud accounts (opt-in; cost gating)
# ---------------------------------------------------------------------------

[fixture.azure_live]
backend   = "azure"
stage     = 3
kind      = "real-live"
container = "none"
is_async  = false
live_opt_in_env = "RS_TEST_LIVE_HNS"
live_creds_env  = ["AZURE_STORAGE_CONNECTION_STRING"]
