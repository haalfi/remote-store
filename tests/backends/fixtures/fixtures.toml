# Per-fixture declarative facts (spec 048 / TEST-004).
#
# Each [fixture.<name>] block names a Python module in
# tests/backends/fixtures/<name>.py and supplies the static fields that
# fixture's BackendFixture record needs. Runtime callables (factory,
# cleanup, aclose, marks) stay in Python; everything declarative lives
# here.
#
# Closed enums:
#   stage:     1 | 2 | 3
#   kind:      pure | mocked | real-local | real-live | replay
#   container: minio | azurite | sftp | none
#
# Per-fixture overrides (flat_namespace, self_op_supported) merge on top
# of [backend.<x>] defaults from backends.toml. Omit to inherit.

# ---------------------------------------------------------------------------
# Stage 1 fixtures: in-process, always available
# ---------------------------------------------------------------------------

[fixture.memory]
backend   = "memory"
stage     = 1
kind      = "real-local"
container = "none"
is_async  = false

