# ID-211 strict variant: same backend, opt-in pre-check on.  Exercises the
# write-under-file-ancestor conformance gate against a flat-NS backend.
# strict_only=true keeps it out of the default conformance enumeration
# (only the file-ancestor tests opt in via include_strict_only=True).
[fixture.sqlblob_strict]
backend   = "sqlblob"
stage     = 1
kind      = "real-local"
container = "none"
is_async  = false
rejects_write_under_file_ancestor = true
strict_only = true

