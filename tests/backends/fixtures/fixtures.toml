container = "sftp"
is_async  = false

[fixture.s3_pyarrow_minio]
backend   = "s3_pyarrow"
stage     = 2
kind      = "real-local"
container = "minio"
is_async  = false

# ID-211 review follow-up: Stage-2 strict variant against real MinIO.
# Complements the Stage-1 s3_pyarrow_moto_strict so the S3-PyArrow opt-in
# path is exercised against a real S3-compatible HTTP endpoint, not only
# in-process moto. strict_only=true keeps it out of the default
# conformance enumeration.
[fixture.s3_pyarrow_minio_strict]
backend   = "s3_pyarrow"
stage     = 2
kind      = "real-local"
container = "minio"
is_async  = false
rejects_write_under_file_ancestor = true
strict_only = true

# ---------------------------------------------------------------------------
# Stage 3 fixtures: live cloud accounts (opt-in; cost gating)
# ---------------------------------------------------------------------------

[fixture.azure_live]
backend   = "azure"
stage     = 3
kind      = "real-live"
container = "none"
is_async  = false
live_opt_in_env = "RS_TEST_LIVE_HNS"
live_creds_env  = ["AZURE_STORAGE_CONNECTION_STRING"]
# BUG-201: AzureBackend short-circuits src==dst; live fixtures are green.
self_op_supported = true

[fixture.azure_live_async]
backend   = "azure"
stage     = 3
kind      = "real-live"
container = "none"
is_async  = true
live_opt_in_env = "RS_TEST_LIVE_HNS"
live_creds_env  = ["AZURE_STORAGE_CONNECTION_STRING"]
# BUG-201: AsyncAzureBackend short-circuits src==dst; async fixtures are green.
self_op_supported = true

[fixture.s3_live]
backend   = "s3"
stage     = 3
kind      = "real-live"
container = "none"
is_async  = false
live_opt_in_env = "RS_TEST_LIVE_S3"
live_creds_env  = ["AWS_ACCESS_KEY_ID", "AWS_SECRET_ACCESS_KEY", "AWS_DEFAULT_REGION"]
# Inherits flat_namespace=true, self_op_supported=true from [backend.s3].
# Per-call bucket creation (rs-conformance-<uuid>) makes RS_TEST_LIVE_S3_BUCKET redundant.

