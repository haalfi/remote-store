# ---------------------------------------------------------------------------
# Stage 2 fixtures: real local containers
# ---------------------------------------------------------------------------

[fixture.azurite]
backend   = "azure"
stage     = 2
kind      = "real-local"
container = "azurite"
is_async  = false
# OVERRIDE: emulator is flat-namespace (no HNS); BK-185.
flat_namespace = true
# BUG-201: sync AzureBackend.move/copy src==dst short-circuit is backend-wide
# (not HNS-gated); Azurite handles it the same as the real Azure flat namespace.
self_op_supported = true

# ID-211 strict variant of azurite: opt-in pre-check on the flat-NS emulator.
# strict_only=true keeps it out of the default conformance enumeration.
[fixture.azurite_strict]
backend   = "azure"
stage     = 2
kind      = "real-local"
container = "azurite"
is_async  = false
flat_namespace = true
self_op_supported = true
rejects_write_under_file_ancestor = true
strict_only = true

# ID-211 review follow-up: async sibling of azurite_strict. The sync side has
# four strict variants exercising the gate; this is the async coverage so
# AsyncAzureBackend._maybe_check_no_file_ancestor / _acheck_no_file_ancestor /
# the get_blob_properties closure run end-to-end against a real (emulated)
# Azure target rather than only the stub-callable unit tests in test_flat_ns.py.
# No non-strict azurite_async baseline is registered: the broader async Azurite
# emulator surface is out of scope for ID-211.
[fixture.azurite_async_strict]
backend   = "azure"
stage     = 2
kind      = "real-local"
container = "azurite"
is_async  = true
flat_namespace = true
self_op_supported = true
rejects_write_under_file_ancestor = true
strict_only = true

