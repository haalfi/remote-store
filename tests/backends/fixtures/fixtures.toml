# ---------------------------------------------------------------------------
# Stage 2 fixtures: real local containers
# ---------------------------------------------------------------------------

[fixture.azurite]
backend   = "azure"
stage     = 2
kind      = "real-local"
container = "azurite"
is_async  = false
# OVERRIDE: emulator is flat-namespace (no HNS); BK-185.
flat_namespace = true
# BUG-201: sync AzureBackend.move/copy src==dst short-circuit is backend-wide
# (not HNS-gated); Azurite handles it the same as the real Azure flat namespace.
self_op_supported = true
# Azurite stages block blobs above the 1 MiB single-put default, so the
# large/streamed WriteResult↔FileInfo consistency test runs here.
large_write_distinct = true

# ID-211 strict variant of azurite: opt-in pre-check on the flat-NS emulator.
# strict_only=true keeps it out of the default conformance enumeration.
[fixture.azurite_strict]
backend   = "azure"
stage     = 2
kind      = "real-local"
container = "azurite"
is_async  = false
flat_namespace = true
self_op_supported = true
rejects_write_under_file_ancestor = true
strict_only = true

# BUG-217: non-strict async sibling of azurite, mirroring the sync azurite
# baseline. Gives the async Azurite staged-write path offline conformance
# coverage (the large WriteResult↔FileInfo consistency test in particular);
# before this, the only async Azure fixture running that test was the live
# azure_live_async, skipped unless RS_TEST_LIVE_HNS=1.
[fixture.azurite_async]
backend   = "azure"
stage     = 2
kind      = "real-local"
container = "azurite"
is_async  = true
flat_namespace = true
self_op_supported = true
# Azurite stages block blobs above the 1 MiB single-put default, so the
# large/streamed WriteResult↔FileInfo consistency test runs here.
large_write_distinct = true

# ID-211 review follow-up: strict async sibling of azurite_strict. The sync side
# has four strict variants exercising the gate; this is the async coverage so
# AsyncAzureBackend._maybe_check_no_file_ancestor / _acheck_no_file_ancestor /
# the get_blob_properties closure run end-to-end against a real (emulated)
# Azure target rather than only the stub-callable unit tests in test_flat_ns.py.
[fixture.azurite_async_strict]
backend   = "azure"
stage     = 2
kind      = "real-local"
container = "azurite"
is_async  = true
flat_namespace = true
self_op_supported = true
rejects_write_under_file_ancestor = true
strict_only = true

