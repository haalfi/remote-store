repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.19.1
    hooks:
      - id: mypy
        additional_dependencies: [s3fs, paramiko, tenacity, types-paramiko, types-requests, pyarrow, azure-storage-file-datalake, azure-identity, opentelemetry-api, sqlalchemy, httpx, tomli]
        args: [--config-file=pyproject.toml]
        files: ^src/
        stages: [pre-push]
  - repo: local
    hooks:
      - id: no-unicode-in-print
        name: no non-ASCII in print() calls
        language: pygrep
        entry: 'print\(.*[^\x00-\x7f]'
        types: [python]
        files: ^(src/|examples/)
      - id: no-rst-roles
        name: no RST inline roles in src/
        language: pygrep
        entry: ':\w+:`(?!`)'
        types: [python]
        files: ^src/
