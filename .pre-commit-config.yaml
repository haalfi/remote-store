repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: no-unicode-in-print
        name: no non-ASCII in print() calls
        language: pygrep
        entry: 'print\(.*[^\x00-\x7f]'
        types: [python]
        files: ^(src/|examples/)
      - id: no-rst-roles
        name: no RST inline roles in src/ tests/ scripts/
        language: pygrep
        entry: ':\w+:`(?!`)'
        types: [python]
        files: ^(src|tests|scripts|examples)/
      - id: backlogid-check
        name: backlog ID index in sync
        language: python
        entry: python scripts/gen_backlogid.py --check
        pass_filenames: false
        always_run: true
