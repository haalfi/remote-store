// ---- Config ---------------------------------------------------------------
const NODE_CFG = {
  capability:  {color:'#F59E0B',r:14, label:n=>n.value||n.id.split(':')[1]},
  class:       {color:'#3B82F6',r:13, label:n=>n.id.split('.').pop()},
  method:      {color:'#10B981',r:10, label:n=>n.id.split('.').pop()},
  package:     {color:'#A855F7',r:15, label:n=>n.id.split(':')[1]},
  requirement: {color:'#F43F5E',r:8,  label:n=>{
    const p=n.id.split('.');return p[p.length-2]+'.'+p[p.length-1];
  }},
  extra:       {color:'#94A3B8',r:11, label:n=>n.id.split(':')[1]},
};

// declares + contains hidden by default: they dominate numerically and
// collapse the centre.  Toggle them on to see the full capability surface
// and the package/class/method containment tree.
const EDGE_CFG = {
  inherits:{color:'#A855F7',dash:'0',  width:2,   defaultOn:true},
  mirrors: {color:'#F59E0B',dash:'6,3',width:2,   defaultOn:true},
  enables: {color:'#10B981',dash:'4,3',width:1.5, defaultOn:true},
  gates:   {color:'#F43F5E',dash:'0',  width:1.5, defaultOn:true},
  of:      {color:'#64748B',dash:'2,2',width:1,   defaultOn:true},
  declares:{color:'#3B82F6',dash:'0',  width:1,   defaultOn:false},
  contains:{color:'#22D3EE',dash:'1,3',width:1,   defaultOn:false},
};

// ---- State ----------------------------------------------------------------
const visibleNodeKinds = new Set(Object.keys(NODE_CFG));
const visibleEdgeKinds = new Set(
  Object.entries(EDGE_CFG).filter(([,v])=>v.defaultOn).map(([k])=>k)
);
let selectedId = null;

// ---- Graph data -----------------------------------------------------------
const nodeMap = new Map(GRAPH.nodes.map(n=>[n.id,{...n}]));
const nodes   = [...nodeMap.values()];
const links   = GRAPH.edges
  .map(e=>({...e, source:nodeMap.get(e.src), target:nodeMap.get(e.dst)}))
  .filter(l=>l.source&&l.target);

// ---- Soft positional bias (keeps force organic but guided) ----------------
// x-target by kind: extras/classes left, caps centre, reqs right, mtds far right
const X_BIAS = {
  package:     0.08,
  extra:       0.18,
  class:       0.30,
  capability:  0.52,
  requirement: 0.68,
  method:      0.84,
};
const Y_BIAS = {
  package: 0.12,
};

// ---- SVG ------------------------------------------------------------------
const svg = d3.select('#graph');

// ---- Simulation -----------------------------------------------------------
// forceX/forceY call .x()/.y() synchronously during initialize() -- svg must
// be declared first.  clientWidth is 0 at init time anyway; use design constants.
const W0 = 1200, H0 = 800;
const simulation = d3.forceSimulation(nodes)
  .force('link', d3.forceLink(links).id(d=>d.id)
    .distance(d=>d.kind==='declares'?170:d.kind==='inherits'?65:100)
    .strength(d=>d.kind==='declares'?0.04:d.kind==='of'?0.5:0.4))
  .force('charge', d3.forceManyBody().strength(-620))
  .force('collide', d3.forceCollide().radius(d=>(NODE_CFG[d.kind]?.r||10)+14))
  .force('xbias', d3.forceX(d=>(X_BIAS[d.kind]??0.5)*W0).strength(0.07))
  .force('ybias', d3.forceY(d=>(Y_BIAS[d.kind]??0.5)*H0).strength(0.04));

const defs = svg.append('defs');
Object.entries(EDGE_CFG).forEach(([kind,cfg])=>{
  defs.append('marker').attr('id','arrow-'+kind)
    .attr('viewBox','0 -5 10 10').attr('refX',22).attr('refY',0)
    .attr('markerWidth',5).attr('markerHeight',5).attr('orient','auto')
    .append('path').attr('d','M0,-5L10,0L0,5').attr('fill',cfg.color);
});
const g = svg.append('g');
const zoom = d3.zoom().scaleExtent([0.1,4])
  .on('zoom', e=>g.attr('transform',e.transform));
svg.call(zoom);
document.getElementById('btn-reset').onclick =
  ()=>svg.transition().duration(500).call(zoom.transform,d3.zoomIdentity);
document.getElementById('btn-reheat').onclick =
  ()=>simulation.alpha(0.7).restart();

// ---- Legend ---------------------------------------------------------------
function buildLegend(){
  const nl=d3.select('#node-legend');
  Object.entries(NODE_CFG).forEach(([kind,cfg])=>{
    const row=nl.append('div').attr('class','legend-row');
    row.append('input').attr('type','checkbox').property('checked',true)
      .on('change',function(){
        this.checked?visibleNodeKinds.add(kind):visibleNodeKinds.delete(kind);
        update();
      });
    row.append('div').attr('class','dot').style('background',cfg.color);
    row.append('span').text(
      kind+' ('+GRAPH.nodes.filter(n=>n.kind===kind).length+')');
  });

  const el=d3.select('#edge-legend');
  Object.entries(EDGE_CFG).forEach(([kind,cfg])=>{
    const on=cfg.defaultOn;
    const row=el.append('div').attr('class','legend-row'+(on?'':' dim'));
    row.append('input').attr('type','checkbox').property('checked',on)
      .on('change',function(){
        this.checked?visibleEdgeKinds.add(kind):visibleEdgeKinds.delete(kind);
        update();
      });
    row.append('div').attr('class','line-sample')
      .style('background', cfg.dash==='0'
        ? cfg.color
        : `repeating-linear-gradient(90deg,${cfg.color} 0,${cfg.color} 4px,`
          +`transparent 4px,transparent 7px)`)
      .style('height',cfg.width+'px');
    row.append('span').text(
      kind
      +(on?'':' — off')
      +' ('+GRAPH.edges.filter(e=>e.kind===kind).length+')');
  });
}

// ---- Detail ---------------------------------------------------------------
function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function showDetail(node){
  const el=document.getElementById('detail');
  if(!node){el.innerHTML='<span class="placeholder">Click a node to inspect it</span>';return;}
  const skip=new Set(['id','kind']);
  const rows=Object.entries(node)
    .filter(([k])=>!skip.has(k))
    .map(([k,v])=>`<div class="detail-row">${esc(k)}: <span>${esc(v)}</span></div>`)
    .join('');
  el.innerHTML=`<div class="detail-id">${esc(node.id)}</div>`
    +`<div class="detail-row">kind: <span>${esc(node.kind)}</span></div>${rows}`;
}

// ---- Rendering ------------------------------------------------------------
let linkSel, nodeSel;

function update(){
  const activeNodes=nodes.filter(n=>visibleNodeKinds.has(n.kind));
  const activeIds=new Set(activeNodes.map(n=>n.id));
  const activeLinks=links.filter(
    l=>visibleEdgeKinds.has(l.kind)
    &&activeIds.has(l.source.id)&&activeIds.has(l.target.id));

  linkSel=g.selectAll('.link')
    .data(activeLinks,d=>d.src+'|'+d.kind+'|'+d.dst)
    .join(
      enter=>enter.append('line').attr('class','link'),
      u=>u, exit=>exit.remove())
    .attr('stroke',d=>EDGE_CFG[d.kind]?.color||'#666')
    .attr('stroke-width',d=>EDGE_CFG[d.kind]?.width||1.2)
    .attr('stroke-dasharray',d=>EDGE_CFG[d.kind]?.dash||'0')
    .attr('marker-end',d=>`url(#arrow-${d.kind})`);

  nodeSel=g.selectAll('.node').data(activeNodes,d=>d.id)
    .join(
      enter=>{
        const ng=enter.append('g').attr('class','node')
          .call(d3.drag()
            .on('start',(ev,d)=>{
              if(!ev.active)simulation.alphaTarget(0.3).restart();
              d.fx=d.x;d.fy=d.y;
            })
            .on('drag',(ev,d)=>{d.fx=ev.x;d.fy=ev.y;})
            .on('end',(ev,d)=>{
              if(!ev.active)simulation.alphaTarget(0);
              d.fx=null;d.fy=null;
            }))
          .on('click',(ev,d)=>{
            ev.stopPropagation();
            selectedId=selectedId===d.id?null:d.id;
            showDetail(selectedId?d:null);
            highlightNeighbors();
          });
        ng.append('circle');
        ng.append('text').attr('dy','0.35em').attr('text-anchor','middle');
        ng.append('text').attr('class','async-badge').attr('text-anchor','middle');
        return ng;
      },
      u=>u, exit=>exit.remove());

  nodeSel.select('circle')
    .attr('r',d=>NODE_CFG[d.kind]?.r||10)
    .attr('fill',d=>NODE_CFG[d.kind]?.color||'#888')
    .attr('stroke',d=>d3.color(NODE_CFG[d.kind]?.color||'#888').brighter(0.8));
  nodeSel.classed('abstract',d=>d.is_abstract===true);
  nodeSel.select('text:not(.async-badge)')
    .text(d=>NODE_CFG[d.kind]?.label(d)||d.id)
    .attr('dy',d=>(NODE_CFG[d.kind]?.r||10)+12);
  nodeSel.select('text.async-badge')
    .text(d=>d.is_async===true?'async':'')
    .attr('dy',d=>(NODE_CFG[d.kind]?.r||10)+21);
  nodeSel.classed('selected',d=>d.id===selectedId);

  simulation.nodes(activeNodes);
  simulation.force('link').links(activeLinks);
  simulation.alpha(0.4).restart();
}

simulation.on('tick',()=>{
  linkSel?.each(function(d){
    const sx=d.source.x,sy=d.source.y,tx=d.target.x,ty=d.target.y;
    const dx=tx-sx,dy=ty-sy,dist=Math.sqrt(dx*dx+dy*dy);
    const r=(NODE_CFG[d.target.kind]?.r||10)+3;
    const f=dist>r?(dist-r)/dist:0;
    d3.select(this)
      .attr('x1',sx).attr('y1',sy)
      .attr('x2',sx+dx*f).attr('y2',sy+dy*f);
  });
  nodeSel?.attr('transform',d=>`translate(${d.x},${d.y})`);
});

function highlightNeighbors(){
  if(!selectedId){
    nodeSel?.classed('faded',false);
    linkSel?.classed('faded',false);
    return;
  }
  const nb=new Set([selectedId]);
  linkSel?.each(d=>{
    if(d.source.id===selectedId||d.target.id===selectedId){
      nb.add(d.source.id);nb.add(d.target.id);
    }
  });
  nodeSel?.classed('faded',d=>!nb.has(d.id));
  linkSel?.classed('faded',
    d=>d.source.id!==selectedId&&d.target.id!==selectedId);
}
svg.on('click',()=>{selectedId=null;showDetail(null);highlightNeighbors();});

buildLegend();
update();

// Reparent RTD's EthicalAds injection into the sidebar so it does not
// float over the canvas.  RTD appends a div[data-ea-publisher] to <body>;
// we move it into #sidebar and strip the 'raised' float class.
(function(){
  var sb=document.getElementById('sidebar');
  var obs;
  function adopt(n){
    if(n.nodeType!==1||!n.dataset||!n.dataset.eaPublisher)return;
    n.classList.remove('raised');
    n.style.marginTop='';
    sb.appendChild(n);
    if(obs)obs.disconnect();
  }
  obs=new MutationObserver(function(ms){
    ms.forEach(function(m){m.addedNodes.forEach(adopt);});
  });
  obs.observe(document.body,{childList:true});
  document.querySelectorAll('body>[data-ea-publisher]').forEach(adopt);
})();
</script>
</body>
</html>
