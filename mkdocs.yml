site_name: remote-store
site_url: https://docs.remotestore.dev/
site_description: Write file storage code once. Run it against local files, S3, SFTP, or Azure.
repo_url: https://github.com/haalfi/remote-store
repo_name: haalfi/remote-store

# Documentation framework — before editing, read:
#   sdd/AUTHORING.md      (placement: where files belong)
#   sdd/DOCUMENTATION.md  (structure: what shape pages take)
#   sdd/CONTENT-RULES.md  (longevity: writing that stays accurate)
docs_dir: docs-src

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/logo.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.instant
    - navigation.tabs
    - navigation.top
    - navigation.tabs.sticky
    - search.suggest
    - search.highlight
    - toc.follow
    - navigation.footer

# BK-171: rewrite on-disk repo paths in docs-src/ links to docs-site URLs.
hooks:
  - scripts/mkdocs_hooks.py

plugins:
  - search
  - mike:
      version_selector: true
  - gen-files:
      scripts:
        - scripts/gen_pages.py
  - literate-nav:
      nav_file: SUMMARY.md
  - section-index
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            docstring_section_style: list
            merge_init_into_class: true
            members_order: source
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            show_if_no_docstring: false
            heading_level: 2
            separate_signature: true
            signature_crossrefs: true
            show_signature_annotations: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.snippets:
      base_path: ["."]
      dedent_subsections: true
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
  - attr_list
  - md_in_html

extra:
  version:
    provider: mike

extra_css:
  - css/custom.css

validation:
  links:
    not_found: warn
