site_name: remote-store
site_url: https://docs.remotestore.dev/
site_description: Write file storage code once. Run it against local files, S3, SFTP, Azure, or OneDrive.
repo_url: https://github.com/haalfi/remote-store
repo_name: haalfi/remote-store

# Documentation framework — before editing, read:
#   sdd/AUTHORING.md      (placement: where files belong)
#   sdd/DOCUMENTATION.md  (structure: what shape pages take)
#   sdd/CONTENT-RULES.md  (longevity: writing that stays accurate)
docs_dir: docs-src

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/logo.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.instant
    - navigation.tabs
    - navigation.top
    - navigation.tabs.sticky
    - search.suggest
    - search.highlight
    - toc.follow
    - navigation.footer

# BK-171: rewrite on-disk repo paths in docs-src/ links to docs-site URLs.
hooks:
  - scripts/mkdocs_hooks.py

plugins:
  - search
  # ID-220: generate per-page Markdown twins + a concatenated llms-full.txt from
  # the *rendered* site, so twins capture the gen-files/mkdocstrings API reference
  # and the BK-171 link rewrites a raw-source bundler would miss. This plugin owns
  # the generated /llms.txt and supersedes the ID-161 hand-curated docs-src/llms.txt
  # (a short intro lives in markdown_description below; the full prose stays in the
  # docs pages it links). base_url pins the twin/link prefix to the /stable alias
  # the docs site serves.
  # mkdocs-llmstxt is in upstream maintenance mode (author moved to Zensical) —
  # interim tooling with a known sunset at the Material->Zensical migration (ID-225).
  # See sdd/research/research-llms-full-txt-tooling.md.
  - llmstxt:
      base_url: https://docs.remotestore.dev/stable/
      full_output: llms-full.txt
      # Kept deliberately short: a stable, high-level positioning blurb, not a
      # copy of the docs. The full prose, code examples, and usage patterns live
      # in the pages this indexes (and in llms-full.txt), so there is no
      # duplicated doc content here to drift out of sync.
      markdown_description: |-
        Unified file-storage API for Python. Write storage code once and switch
        between Local, S3 (optionally via PyArrow), Azure (Blob & ADLS Gen2), SFTP,
        SQL databases, or Microsoft Graph (OneDrive/SharePoint) via configuration.

        A `Store` scopes every operation to a root path, so paths are relative and
        `store.child(prefix)` narrows the root. Backends implement storage-specific
        behavior; extensions (`remote_store.ext`) add optional capabilities; a native
        async API (`remote_store.aio`) mirrors the sync interface. Backends declare
        capabilities, so code checks support explicitly with `store.supports(...)`.
        The pages below carry the full detail and examples.

        ## Source

        - [GitHub repository](https://github.com/haalfi/remote-store): source tree, issues, and discussions.
        - [README](https://raw.githubusercontent.com/haalfi/remote-store/master/README.md): project overview and quick start (raw Markdown).
        - [FEATURES](https://raw.githubusercontent.com/haalfi/remote-store/master/FEATURES.md): authoritative backend, extension, capability, and install-extras list (raw Markdown).
        - [PyPI](https://pypi.org/project/remote-store/): releases and `pip install remote-store[...]` extras.
      # NB: the plugin expands these with fnmatch, where `*` spans `/`, so each
      # `<dir>/*.md` is recursive — `guides/*.md` also pulls guides/backends/*,
      # `reference/api/*.md` also pulls reference/api/{aio,backends,extensions}/*.
      # (A `**` glob would be *narrower* under fnmatch: it requires an
      # intermediate directory and would drop the top-level pages. Don't "fix" it.)
      sections:
        Tutorial:
          - tutorial/*.md
        Guides:
          - guides/*.md
        Reference:
          - reference/api/*.md
          - reference/capabilities-matrix.md
          - reference/migration.md
          - reference/tested-versions.md
          - reference/FEATURES.md
        # Explanation is listed page-by-page (not globbed) on purpose: an
        # `explanation/*.md` fnmatch glob would also pull in the internal
        # explanation/design/ subtree (specs, ADRs, RFCs, audits, research),
        # which is contributor-facing, not part of the user docs bundle. Like
        # the Reference list above, the section-landing index stub is omitted.
        Explanation:
          - explanation/architecture.md
          - explanation/concurrency.md
          - explanation/graph-ir.md
          - explanation/performance.md
          - explanation/security-model.md
  - mike:
      version_selector: true
  - gen-files:
      scripts:
        - scripts/gen_pages.py
  - literate-nav:
      nav_file: SUMMARY.md
  - section-index
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            docstring_section_style: list
            merge_init_into_class: true
            members_order: source
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            show_if_no_docstring: false
            heading_level: 2
            separate_signature: true
            signature_crossrefs: true
            show_signature_annotations: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.snippets:
      base_path: ["."]
      dedent_subsections: true
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
  - attr_list
  - md_in_html

extra:
  version:
    provider: mike

extra_css:
  - css/custom.css

validation:
  links:
    not_found: warn
