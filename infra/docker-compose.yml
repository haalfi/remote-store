# Docker Compose for the remote-store test + benchmark backends.
#
# Starts MinIO (S3-compatible), Azurite (Azure Blob emulator), an
# OpenSSH-based SFTP server, and Toxiproxy (latency simulation). The
# stack is primarily consumed by the test suite (sftp_docker / azurite
# conformance fixtures, all tests/e2e/* modules) and secondarily by
# benchmarks/.
#
# Host-side ports and credentials come from infra/.env, which docker
# compose auto-loads as the project-directory env file. Override one for
# a single invocation with: MINIO_HOST_PORT=12345 docker compose ...
#
# Toxiproxy sits in front of all three network backends:
#   - Azurite:  proxied port -> azurite:10000
#   - MinIO:    proxied port -> minio:9000
#   - SFTP:     proxied port -> sftp:22
#
# Use ``--network-profile rtt50`` with pytest to add simulated network
# latency to all proxied backends (default: clean = passthrough). The
# Toxiproxy HTTP API is exposed on TOXIPROXY_API_PORT for manual toxic
# management.
#
# Usage:
#   docker compose -f infra/docker-compose.yml up -d
#   pytest tests/e2e/ -v
#   docker compose -f infra/docker-compose.yml down -v

services:
  minio:
    # Chainguard image — MinIO stopped publishing to Docker Hub Oct 2025.
    # -dev variant includes busybox (sh, wget) needed for CMD-SHELL healthcheck.
    # Free tier has no versioned tags; pin by digest when reproducibility matters.
    image: cgr.dev/chainguard/minio:latest-dev
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_HOST_PORT}:9000"
      - "${MINIO_HOST}:${MINIO_CONSOLE_HOST_PORT}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    healthcheck:
      # Chainguard image has no `mc` binary; use HTTP liveness endpoint.
      # Runs inside the container, so the upstream port (9000) is correct.
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:9000/minio/health/live 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0
    command: azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --skipApiVersionCheck
    ports:
      - "${AZURITE_HOST_PORT}:10000"
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "10000"]
      interval: 5s
      timeout: 5s
      retries: 5

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    ports:
      - "${TOXIPROXY_AZURITE_PORT}:10001"   # proxied Azurite blob endpoint
      - "${TOXIPROXY_MINIO_PORT}:19000"     # proxied MinIO S3 endpoint
      - "${TOXIPROXY_SFTP_PORT}:12222"      # proxied SFTP endpoint
      - "${TOXIPROXY_HOST}:${TOXIPROXY_API_PORT}:8474"  # API — localhost only
    volumes:
      - ./toxiproxy.json:/config/toxiproxy.json:ro
    command: -config /config/toxiproxy.json -host 0.0.0.0
    depends_on:
      azurite:
        condition: service_healthy
      minio:
        condition: service_healthy
      sftp:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/toxiproxy-cli", "list"]
      interval: 5s
      timeout: 5s
      retries: 5

  sftp:
    # alpine-3.7 reached EOL ~Nov 2019; use latest Alpine for security patches.
    # atmoz/sftp only publishes `alpine` (floating); no per-version Alpine tags.
    image: atmoz/sftp:alpine
    ports:
      - "${SFTP_HOST_PORT}:22"
    command: ${SFTP_USER}:${SFTP_PASS}:::upload
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "22"]
      interval: 5s
      timeout: 5s
      retries: 5

  legacy-sftp:
    # ssh-rsa-only legacy SSH server. Drives
    # tests/e2e/test_sftp_legacy_recovery.py — the durable verification of
    # SFTPUtils.enable_ssh_rsa_compat()'s recovery semantics.
    build:
      context: ./legacy-sftp
    ports:
      - "${LEGACY_SFTP_HOST_PORT}:22"
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "22"]
      interval: 5s
      timeout: 5s
      retries: 5
